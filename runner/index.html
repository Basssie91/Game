<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Neon Runner · Bas Arcade</title>
  <meta name="description" content="Ren, spring en duik door een neonwereld die steeds sneller gaat.">
  <meta name="theme-color" content="#0b0c10">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%2316181d%22/%3E%3Cpath%20d%3D%22M4%2058%20L28%2022%20M60%2058%20L36%2022%20M22%2058%20L30%2022%20M42%2058%20L34%2022%22%20stroke%3D%22%233fe0ff%22%20stroke-width%3D%222.4%22%20stroke-linecap%3D%22round%22/%3E%3Cpath%20d%3D%22M26%2022%20H38%22%20stroke%3D%22%233fe0ff%22%20stroke-width%3D%222%22/%3E%3Crect%20x%3D%2225%22%20y%3D%2234%22%20width%3D%2214%22%20height%3D%2214%22%20rx%3D%222%22%20fill%3D%22%23ffffff%22/%3E%3Crect%20x%3D%2240%22%20y%3D%2227%22%20width%3D%227%22%20height%3D%225%22%20rx%3D%221%22%20fill%3D%22%23e8282f%22/%3E%3Ccircle%20cx%3D%2213%22%20cy%3D%2212%22%20r%3D%221.5%22%20fill%3D%22%23fff%22/%3E%3Ccircle%20cx%3D%2250%22%20cy%3D%229%22%20r%3D%221%22%20fill%3D%22%23fff%22/%3E%3C/svg%3E">
  <style>
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #0b0c10; color: #fff; overflow: hidden;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-user-select: none; user-select: none; }
body { display: flex; align-items: center; justify-content: center; }
canvas { display: block; touch-action: none; box-shadow: 0 0 0 1px rgba(255,255,255,0.08); }
.terug, .geluid { position: fixed; top: 12px; z-index: 5; color: #fff; text-decoration: none; background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.22); padding: 8px 12px; border-radius: 10px; font: 600 14px system-ui, sans-serif; cursor: pointer; }
.terug { left: 12px; } .geluid { right: 12px; }
.terug:hover, .geluid:hover { background: rgba(255,255,255,0.2); }
</style>
</head>
<body>
  <a class="terug" href="../">← Games</a>
  <button class="geluid" type="button" aria-label="Geluid aan/uit">🔊</button>
  <canvas id="c"></canvas>
  
  <script>
'use strict';
// ================= Gedeeld voor alle games: opslag, geluid, scherm, knoppen =================
const Arcade = (() => {
  const load = (k, d) => { try { const v = localStorage.getItem('arcade_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } };
  const save = (k, v) => { try { localStorage.setItem('arcade_' + k, JSON.stringify(v)); } catch (e) { /* uit */ } };
  let audio = null;
  let muted = load('muted', false);

  function initAudio() {
    if (audio) { if (audio.state === 'suspended') audio.resume(); return; }
    try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audio = null; }
  }
  addEventListener('pointerdown', initAudio);
  addEventListener('keydown', initAudio);

  function beep(freq, dur, type = 'square', vol = 0.05, slide = 0, delay = 0) {
    if (muted || !audio) return;
    try {
      const t = audio.currentTime + delay;
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, t);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g);
      g.connect(audio.destination);
      o.start(t);
      o.stop(t + dur);
    } catch (e) { /* negeren */ }
  }

  // Geluidsknop
  const sndBtn = document.querySelector('.geluid');
  const showSnd = () => { if (sndBtn) sndBtn.textContent = muted ? '🔇' : '🔊'; };
  showSnd();
  if (sndBtn) sndBtn.addEventListener('click', (e) => { e.stopPropagation(); muted = !muted; save('muted', muted); showSnd(); sndBtn.blur(); });
  addEventListener('keydown', (e) => { if (e.code === 'KeyM') { muted = !muted; save('muted', muted); showSnd(); } });

  // Canvas met vaste spelgrootte (W×H) die netjes in het venster past
  function canvas(id, W, H) {
    const c = document.getElementById(id);
    const ctx = c.getContext('2d');
    const view = { W, H, scale: 1 };
    const fit = () => {
      const s = Math.min(innerWidth / W, innerHeight / H);
      const dpr = Math.min(2, devicePixelRatio || 1);
      c.style.width = Math.floor(W * s) + 'px';
      c.style.height = Math.floor(H * s) + 'px';
      c.width = Math.floor(W * s * dpr);
      c.height = Math.floor(H * s * dpr);
      view.scale = s * dpr;
      ctx.setTransform(view.scale, 0, 0, view.scale, 0, 0);
    };
    fit();
    addEventListener('resize', fit);
    view.begin = () => ctx.setTransform(view.scale, 0, 0, view.scale, 0, 0);
    view.toGame = (e) => {
      const r = c.getBoundingClientRect();
      return { x: ((e.clientX - r.left) / r.width) * W, y: ((e.clientY - r.top) / r.height) * H };
    };
    return { c, ctx, view };
  }

  // Vegen (swipe) op touchscreens: geeft 'links', 'rechts', 'op' of 'neer'
  function onSwipe(el, fn, onTap) {
    let sx = 0, sy = 0, st = 0, active = false;
    el.addEventListener('pointerdown', (e) => { sx = e.clientX; sy = e.clientY; st = performance.now(); active = true; });
    el.addEventListener('pointerup', (e) => {
      if (!active) return;
      active = false;
      const dx = e.clientX - sx, dy = e.clientY - sy;
      if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) { if (onTap) onTap(e); return; }
      if (Math.abs(dx) > Math.abs(dy)) fn(dx > 0 ? 'rechts' : 'links');
      else fn(dy > 0 ? 'neer' : 'op');
    });
  }

  // Tekenhulpjes in dezelfde stijl
  function rr(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function text(ctx, t, x, y, size, color = '#fff', align = 'center', weight = '700', mono = false) {
    ctx.font = `${weight} ${size}px ${mono ? 'ui-monospace, Consolas, monospace' : 'system-ui, -apple-system, "Segoe UI", sans-serif'}`;
    ctx.fillStyle = color;
    ctx.textAlign = align;
    ctx.textBaseline = 'middle';
    ctx.fillText(t, x, y);
  }
  // Standaard scherm voor start / pauze / game over
  function overlay(ctx, W, H, title, lines = [], hint = '') {
    ctx.fillStyle = 'rgba(10, 11, 14, 0.72)';
    ctx.fillRect(0, 0, W, H);
    const pw = Math.min(W - 40, 380), ph = 130 + lines.length * 30 + (hint ? 40 : 0);
    const x = (W - pw) / 2, y = (H - ph) / 2;
    ctx.fillStyle = 'rgba(24, 26, 31, 0.95)';
    rr(ctx, x, y, pw, ph, 16);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    text(ctx, title, W / 2, y + 50, 32, '#fff', 'center', '900');
    lines.forEach((l, i) => {
      const s = typeof l === 'string' ? { t: l } : l;
      text(ctx, s.t, W / 2, y + 100 + i * 30, s.size || 18, s.color || '#c9ced6', 'center', s.weight || '600', s.mono);
    });
    if (hint && Math.floor(performance.now() / 500) % 2 === 0) text(ctx, hint, W / 2, y + ph - 34, 15, '#ffffff', 'center', '700');
  }

  return {
    load, save, beep,
    get muted() { return muted; },
    best: (game) => load('best_' + game, 0),
    // Slaat een nieuwe topscore op; geeft true terug als het een record is
    record: (game, score, lowerIsBetter = false) => {
      const b = load('best_' + game, 0);
      if (!b || (lowerIsBetter ? score < b : score > b)) { save('best_' + game, score); return true; }
      return false;
    },
    canvas, onSwipe, rr, text, overlay,
    touch: matchMedia('(hover: none) and (pointer: coarse)').matches,
  };
})();

// ================= NEON RUNNER =================
const W = 480, H = 720;
const { c, ctx, view } = Arcade.canvas('c', W, H);
const GAME = 'runner';
const rand = (a, b) => a + Math.random() * (b - a);
const HOR = 250;          // horizon op het scherm
const F = 300, ZC = 2;    // perspectief
const CAM_H = 2.4;        // camerahoogte
const LANE = 1.0;         // breedte van een baan

const proj = (x, y, z) => { const k = F / (z + ZC); return { x: W / 2 + x * k, y: HOR + (CAM_H - y) * k, k }; };

let state = 'menu'; // menu | play | pause | over
let pl, obs, coins, speed, dist, coinCount, spawnZ, gridOff, newRecord, overT, flash, shake, parts, puList;
let best = Arcade.best(GAME);
parts = []; flash = 0; shake = 0;

function start() {
  pl = { lane: 0, x: 0, y: 0, vy: 0, slide: 0, shield: 0, magnet: 0, inv: 0 };
  obs = []; coins = []; parts = []; puList = [];
  speed = 16; dist = 0; coinCount = 0; spawnZ = 30; gridOff = 0; flash = 0; shake = 0; newRecord = false;
  state = 'play';
  Arcade.beep(330, 0.2, 'triangle', 0.05, 400);
}

// ----- Besturing -----
function act(a) {
  if (state === 'menu' || (state === 'over' && overT <= 0)) { start(); return; }
  if (state === 'pause') { state = 'play'; return; }
  if (state !== 'play') return;
  if (a === 'links' && pl.lane > -1) { pl.lane--; Arcade.beep(520, 0.05, 'triangle', 0.03); }
  if (a === 'rechts' && pl.lane < 1) { pl.lane++; Arcade.beep(520, 0.05, 'triangle', 0.03); }
  if (a === 'op' && pl.y <= 0.001) { pl.vy = 9.5; pl.slide = 0; Arcade.beep(440, 0.12, 'square', 0.03, 300); }
  if (a === 'neer') { if (pl.y > 0.01) pl.vy = -16; pl.slide = 0.65; Arcade.beep(260, 0.1, 'square', 0.03, -100); }
}
addEventListener('keydown', (e) => {
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'].includes(e.code)) e.preventDefault();
  if (e.repeat) return;
  const map = { ArrowLeft: 'links', KeyA: 'links', ArrowRight: 'rechts', KeyD: 'rechts', ArrowUp: 'op', KeyW: 'op', Space: 'op', ArrowDown: 'neer', KeyS: 'neer' };
  if (e.code === 'KeyP' || e.code === 'Escape') { if (state === 'play') state = 'pause'; else if (state === 'pause') state = 'play'; return; }
  if (e.code === 'Enter') { act('start'); return; }
  if (map[e.code]) act(map[e.code]);
});
addEventListener('blur', () => { if (state === 'play') state = 'pause'; });
Arcade.onSwipe(c, act, () => { if (state !== 'play') act('tik'); else act('op'); });

// ----- Obstakels maken -----
// blok = muur (andere baan kiezen), laag = springen, hoog = bukken
function spawnRow(z) {
  const lanes = [-1, 0, 1];
  const freeLane = lanes[Math.floor(Math.random() * 3)];
  const level = Math.min(1, dist / 1500);
  for (const l of lanes) {
    if (l === freeLane) continue;
    const r = Math.random();
    if (r < 0.35 + level * 0.25) {
      const t = Math.random();
      const type = t < 0.4 ? 'blok' : t < 0.7 ? 'laag' : 'hoog';
      obs.push({ lane: l, z, type });
    }
  }
  // Munten in de vrije baan (soms in een boogje)
  if (Math.random() < 0.7) {
    const arc = Math.random() < 0.3;
    for (let i = 0; i < 5; i++) coins.push({ lane: freeLane, z: z + i * 1.4, y: arc ? Math.sin((i / 4) * Math.PI) * 1.4 + 0.4 : 0.4 });
  }
  if (Math.random() < 0.05) puList.push({ lane: freeLane, z: z + 3, type: Math.random() < 0.5 ? 'schild' : 'magneet' });
}

function crash() {
  if (pl.inv > 0) return;
  if (pl.shield > 0) { pl.shield = 0; pl.inv = 1; flash = 0.2; Arcade.beep(500, 0.2, 'triangle', 0.05, -200); return; }
  state = 'over';
  overT = 1;
  shake = 12;
  flash = 0.4;
  const sc = score();
  newRecord = Arcade.record(GAME, sc);
  best = Arcade.best(GAME);
  for (let i = 0; i < 40; i++) parts.push({ x: W / 2 + pl.x * 150, y: 560, vx: rand(-260, 260), vy: rand(-320, 60), life: rand(0.4, 1), color: i % 2 ? '#3fe0ff' : '#ffffff' });
  Arcade.beep(120, 0.6, 'sawtooth', 0.08, -70);
}
const score = () => Math.floor(dist) + coinCount * 10;

// ----- Update -----
function update(dt) {
  for (const q of parts) { q.x += q.vx * dt; q.y += q.vy * dt; q.vy += 600 * dt; q.life -= dt; }
  parts = parts.filter((q) => q.life > 0);
  flash = Math.max(0, flash - dt);
  shake = Math.max(0, shake - dt * 30);
  if (state === 'over') overT -= dt;
  if (state === 'menu') { gridOff = (gridOff + dt * 12) % 2; return; }
  if (state !== 'play') return;

  speed = Math.min(52, speed + dt * 0.45);
  const dz = speed * dt;
  dist += dz;
  gridOff = (gridOff + dz) % 2;

  // Speler
  pl.x += (pl.lane * LANE - pl.x) * Math.min(1, 14 * dt);
  pl.vy -= 30 * dt;
  pl.y = Math.max(0, pl.y + pl.vy * dt);
  if (pl.y === 0) pl.vy = 0;
  pl.slide = Math.max(0, pl.slide - dt);
  pl.shield = Math.max(0, pl.shield - dt);
  pl.magnet = Math.max(0, pl.magnet - dt);
  pl.inv = Math.max(0, pl.inv - dt);

  // Alles komt naar je toe
  for (const o of obs) o.z -= dz;
  for (const m of coins) m.z -= dz;
  for (const u of puList) u.z -= dz;
  spawnZ -= dz;
  while (spawnZ < 60) {
    spawnRow(spawnZ + 0);
    spawnZ += Math.max(7, 13 - speed * 0.12) * rand(0.9, 1.3);
  }

  const near = (l) => Math.abs(pl.x - l * LANE) < 0.45;
  for (const o of obs) {
    if (o.hit || o.z > 0.6 || o.z < -0.6 || !near(o.lane)) continue;
    const ok = (o.type === 'laag' && pl.y > 0.75) || (o.type === 'hoog' && pl.slide > 0 && pl.y < 0.3);
    if (!ok) { o.hit = true; crash(); }
  }
  for (const m of coins) {
    if (m.got) continue;
    if (pl.magnet > 0 && m.z < 8 && m.z > -0.5) { m.lane += (pl.x - m.lane) * Math.min(1, 10 * dt); m.y += (pl.y + 0.4 - m.y) * Math.min(1, 10 * dt); }
    if (Math.abs(m.z) < 0.6 && Math.abs(pl.x - m.lane) < 0.45 && Math.abs(pl.y + 0.4 - m.y) < 0.8) {
      m.got = true; coinCount++;
      Arcade.beep(1200 + (coinCount % 5) * 120, 0.06, 'square', 0.025);
    }
  }
  for (const u of puList) {
    if (!u.got && Math.abs(u.z) < 0.6 && near(u.lane)) {
      u.got = true;
      if (u.type === 'schild') pl.shield = 10; else pl.magnet = 8;
      Arcade.beep(700, 0.25, 'triangle', 0.06, 600);
    }
  }
  obs = obs.filter((o) => o.z > -3);
  coins = coins.filter((m) => m.z > -3 && !m.got);
  puList = puList.filter((u) => u.z > -3 && !u.got);
}

// ----- Tekenen -----
const SKY = ['#06070b', '#0b1324'];
const skyline = Array.from({ length: 40 }, (_, i) => ({ x: i * 14 - 40, h: rand(15, 80), w: rand(10, 22) }));
function box(x, z, w, h, y0, color, glow) {
  // Kubus met voor- en bovenkant
  const a = proj(x - w / 2, y0, z), b = proj(x + w / 2, y0 + h, z);
  const a2 = proj(x - w / 2, y0 + h, z + 0.6), b2 = proj(x + w / 2, y0 + h, z + 0.6);
  ctx.fillStyle = 'rgba(10,12,18,0.9)';
  ctx.beginPath(); ctx.moveTo(a.x, b.y); ctx.lineTo(b.x, b.y); ctx.lineTo(b2.x, b2.y); ctx.lineTo(a2.x, a2.y); ctx.closePath(); ctx.fill();
  ctx.save();
  ctx.shadowColor = glow; ctx.shadowBlur = 14;
  ctx.strokeStyle = color; ctx.lineWidth = Math.max(1.5, a.k * 0.02);
  ctx.fillStyle = 'rgba(15,18,28,0.95)';
  ctx.fillRect(a.x, b.y, b.x - a.x, a.y - b.y);
  ctx.strokeRect(a.x, b.y, b.x - a.x, a.y - b.y);
  ctx.beginPath(); ctx.moveTo(a.x, b.y); ctx.lineTo(a2.x, a2.y); ctx.lineTo(b2.x, b2.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  ctx.restore();
}
function draw() {
  view.begin();
  const g = ctx.createLinearGradient(0, 0, 0, HOR);
  g.addColorStop(0, SKY[0]); g.addColorStop(1, SKY[1]);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, HOR);
  ctx.save();
  if (shake) ctx.translate(rand(-shake, shake), rand(-shake, shake));
  // Neonzon
  ctx.save();
  ctx.beginPath(); ctx.arc(W / 2, HOR, 90, Math.PI, 0); ctx.closePath(); ctx.clip();
  const sg = ctx.createLinearGradient(0, HOR - 90, 0, HOR);
  sg.addColorStop(0, '#ffffff'); sg.addColorStop(1, '#e8282f');
  ctx.fillStyle = sg; ctx.fillRect(W / 2 - 90, HOR - 90, 180, 90);
  ctx.fillStyle = SKY[1];
  for (let i = 0; i < 6; i++) { const y = HOR - 8 - i * 12; ctx.fillRect(W / 2 - 90, y, 180, 2 + i * 0.6); }
  ctx.restore();
  // Skyline
  ctx.fillStyle = '#05060a';
  for (const s of skyline) ctx.fillRect(s.x, HOR - s.h, s.w, s.h);
  // Vloer
  ctx.fillStyle = '#05060a'; ctx.fillRect(0, HOR, W, H - HOR);
  ctx.save();
  ctx.strokeStyle = 'rgba(63, 224, 255, 0.35)'; ctx.lineWidth = 1;
  for (let i = 0; i < 32; i++) {
    const z = i * 2 - gridOff;
    if (z < -1.5) continue;
    const p = proj(0, 0, z);
    ctx.globalAlpha = Math.max(0, 1 - z / 64);
    ctx.beginPath(); ctx.moveTo(0, p.y); ctx.lineTo(W, p.y); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  for (let x = -8; x <= 8; x++) {
    const a = proj(x - 0.5, 0, -1.8), b = proj(x - 0.5, 0, 70);
    ctx.strokeStyle = Math.abs(x - 0.5) <= 1.6 ? 'rgba(63,224,255,0.9)' : 'rgba(63,224,255,0.25)';
    ctx.lineWidth = Math.abs(x - 0.5) <= 1.6 ? 2 : 1;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  }
  ctx.restore();

  if (state !== 'menu') {
    // Van ver naar dichtbij tekenen
    const items = [];
    for (const o of obs) items.push({ z: o.z, d: () => {
      if (o.type === 'blok') box(o.lane * LANE, o.z, 0.85, 1.6, 0, '#e8282f', '#e8282f');
      else if (o.type === 'laag') box(o.lane * LANE, o.z, 0.9, 0.45, 0, '#ffffff', '#3fe0ff');
      else { // hoge balk met twee paaltjes
        const l = o.lane * LANE;
        box(l - 0.42, o.z, 0.06, 1.0, 0, '#3fe0ff', '#3fe0ff');
        box(l + 0.42, o.z, 0.06, 1.0, 0, '#3fe0ff', '#3fe0ff');
        box(l, o.z, 0.92, 0.22, 1.0, '#3fe0ff', '#3fe0ff');
      }
    } });
    for (const m of coins) items.push({ z: m.z, d: () => {
      const p = proj(m.lane, m.y, m.z), r = Math.max(1.5, 0.13 * p.k);
      ctx.save(); ctx.shadowColor = '#ffffff'; ctx.shadowBlur = 10; ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.ellipse(p.x, p.y, r * Math.abs(Math.cos(performance.now() / 200 + m.z)) + 1, r, 0, 0, 6.28); ctx.fill(); ctx.restore();
    } });
    for (const u of puList) items.push({ z: u.z, d: () => {
      const p = proj(u.lane, 0.6, u.z), r = Math.max(2, 0.22 * p.k);
      ctx.save(); ctx.shadowColor = u.type === 'schild' ? '#3fe0ff' : '#e8282f'; ctx.shadowBlur = 16;
      ctx.fillStyle = u.type === 'schild' ? '#3fe0ff' : '#e8282f';
      ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, 6.28); ctx.fill(); ctx.restore();
      Arcade.text(ctx, u.type === 'schild' ? 'S' : 'M', p.x, p.y + 1, r * 1.1, '#05060a', 'center', '900');
    } });
    items.sort((a, b) => b.z - a.z);
    const playerItem = { z: 0.01, d: drawPlayer };
    let drawn = false;
    for (const it of items) { if (!drawn && it.z < 0.01) { playerItem.d(); drawn = true; } it.d(); }
    if (!drawn) playerItem.d();
  }
  for (const q of parts) { ctx.globalAlpha = Math.max(0, q.life); ctx.fillStyle = q.color; ctx.fillRect(q.x, q.y, 4, 4); }
  ctx.globalAlpha = 1;
  ctx.restore();
  if (flash) { ctx.fillStyle = `rgba(232,40,47,${flash})`; ctx.fillRect(0, 0, W, H); }

  if (state === 'menu') {
    Arcade.text(ctx, 'NEON', W / 2, 70, 60, '#ffffff', 'center', '900');
    Arcade.text(ctx, 'RUNNER', W / 2, 124, 48, '#3fe0ff', 'center', '900');
    const lines = Arcade.touch
      ? ['Veeg ←/→ om van baan te wisselen', 'Veeg omhoog (of tik) = springen', 'Veeg omlaag = bukken']
      : ['←/→ = van baan wisselen', '↑ of Spatie = springen', '↓ = bukken'];
    ctx.fillStyle = 'rgba(5,6,10,0.75)'; Arcade.rr(ctx, 60, 330, W - 120, 210, 16); ctx.fill();
    lines.forEach((l, i) => Arcade.text(ctx, l, W / 2, 365 + i * 30, 16, '#ffffff', 'center', '600'));
    Arcade.text(ctx, 'Rood = ontwijken · Wit laag = springen · Blauwe balk = bukken', W / 2, 465, 12, '#c9ced6', 'center', '500');
    if (best) Arcade.text(ctx, `Record: ${best}`, W / 2, 505, 17, '#3fe0ff', 'center', '800');
    if (Math.floor(performance.now() / 500) % 2 === 0) Arcade.text(ctx, Arcade.touch ? 'Tik om te starten' : 'Druk op Enter om te starten', W / 2, 620, 20, '#ffffff', 'center', '800');
    return;
  }
  Arcade.text(ctx, String(score()), W / 2, 74, 30, '#ffffff', 'center', '900', true);
  Arcade.text(ctx, `● ${coinCount}`, W / 2, 104, 14, '#c9ced6', 'center', '700');
  Arcade.text(ctx, `${Math.round(speed * 4)} km/u`, 14, H - 20, 13, '#3fe0ff', 'left', '700');
  if (pl.shield > 0) Arcade.text(ctx, `Schild ${Math.ceil(pl.shield)}s`, W - 14, H - 20, 13, '#3fe0ff', 'right', '800');
  if (pl.magnet > 0) Arcade.text(ctx, `Magneet ${Math.ceil(pl.magnet)}s`, W - 14, H - 40, 13, '#e8282f', 'right', '800');
  if (state === 'pause') Arcade.overlay(ctx, W, H, 'PAUZE', ['Druk op P of tik om verder te gaan']);
  if (state === 'over') Arcade.overlay(ctx, W, H, 'GECRASHT!', [{ t: String(score()), size: 34, color: '#fff', weight: '900', mono: true }, newRecord ? { t: '🏆 Nieuw record!', color: '#3fe0ff' } : `Record: ${best}`, `${Math.floor(dist)} m · ${coinCount} munten`],
    overT <= 0 ? (Arcade.touch ? 'Tik om opnieuw te rennen' : 'Enter = opnieuw') : '');
}
function drawPlayer() {
  if (state === 'over') return;
  if (pl.inv > 0 && Math.floor(pl.inv * 12) % 2 === 0) return;
  const h = pl.slide > 0 ? 0.45 : 0.9, w = 0.5;
  const base = proj(pl.x, 0, 0);
  // schaduw
  ctx.fillStyle = 'rgba(63,224,255,0.25)';
  ctx.beginPath(); ctx.ellipse(base.x, base.y, w * base.k * 0.6, 8, 0, 0, 6.28); ctx.fill();
  const a = proj(pl.x - w / 2, pl.y, 0), b = proj(pl.x + w / 2, pl.y + h, 0);
  ctx.save();
  ctx.shadowColor = '#ffffff'; ctx.shadowBlur = 20;
  ctx.fillStyle = '#ffffff';
  Arcade.rr(ctx, a.x, b.y, b.x - a.x, a.y - b.y, 12); ctx.fill();
  ctx.restore();
  ctx.fillStyle = '#05060a';
  const ey = b.y + (a.y - b.y) * 0.3;
  ctx.fillRect(a.x + (b.x - a.x) * 0.25, ey, (b.x - a.x) * 0.5, 8);
  ctx.fillStyle = '#3fe0ff';
  ctx.fillRect(a.x + (b.x - a.x) * 0.3, ey + 2, (b.x - a.x) * 0.4, 4);
  if (pl.shield > 0) { ctx.strokeStyle = 'rgba(63,224,255,0.8)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.ellipse((a.x + b.x) / 2, (a.y + b.y) / 2, (b.x - a.x) * 0.9, (a.y - b.y) * 0.75, 0, 0, 6.28); ctx.stroke(); }
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.033, (now - last) / 1000);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

  </script>
