  <script>
'use strict';
// ================= Game Arcade: instellingen + muziek (gedeeld door alle pagina's) =================
const ArcadeCore = (() => {
  const KEY = 'arcade_settings';
  const DEF = { music: 0.5, sfx: 0.8, quality: 'normaal', muted: false };
  let S = { ...DEF };
  try { Object.assign(S, JSON.parse(localStorage.getItem(KEY)) || {}); } catch (e) { /* standaard */ }
  const listeners = [];
  const save = () => {
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* */ }
    listeners.forEach((f) => f(S));
  };
  const set = (k, v) => { S[k] = v; save(); };
  const sfx = () => (S.muted ? 0 : S.sfx);
  const musicVol = () => (S.muted ? 0 : S.music);
  // Hoeveel pixels we tekenen: lager = soepeler op trage apparaten
  const dprCap = () => ({ hoog: 2, normaal: 1.5, laag: 1 })[S.quality] || 1.5;

  // ---------- Muziek: kleine sequencer met drums, bas, akkoorden en melodie ----------
  const SCALE = [0, 2, 3, 5, 7, 8, 10]; // mineur
  function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
  // Elke game een eigen nummer
  const SONGS = {
    menu:     { bpm: 92,  root: 57, prog: [[0, 3, 7], [-4, 0, 3], [3, 7, 10], [-2, 2, 5]], kick: 'x.......x.......', snare: '....x.......x...', hat: '..x...x...x...x.', bass: 'x.....x.x.......', arp: true,  lead: 'triangle', seed: 3, density: 0.35, pad: 'triangle' },
    race:     { bpm: 128, root: 52, prog: [[0, 3, 7], [-4, 0, 3], [-2, 2, 5], [-5, -1, 2]], kick: 'x...x...x...x...', snare: '....x.......x...', hat: 'x.x.x.x.x.x.x.xo', bass: 'x.xox.xox.xox.xo', arp: true,  lead: 'sawtooth', seed: 11, density: 0.45, pad: 'sawtooth' },
    meteoren: { bpm: 140, root: 50, prog: [[0, 3, 7], [1, 5, 8], [-2, 2, 5], [0, 3, 7]], kick: 'x..x..x.x..x..x.', snare: '....x.......x..x', hat: 'xxxxxxxxxxxxxxxx', bass: 'xxoxxxoxxxoxxxox', arp: false, lead: 'square', seed: 21, density: 0.55, pad: 'sawtooth' },
    runner:   { bpm: 124, root: 54, prog: [[0, 3, 7], [-4, 0, 3], [3, 7, 10], [-2, 2, 5]], kick: 'x...x...x...x...', snare: '....x.......x...', hat: '..o...o...o...o.', bass: 'x.x.x.x.x.x.x.x.', arp: true,  lead: 'sawtooth', seed: 31, density: 0.4, pad: 'sawtooth' },
    snake:    { bpm: 112, root: 60, prog: [[0, 3, 7], [5, 8, 12], [3, 7, 10], [-2, 2, 5]], kick: 'x.....x.x.......', snare: '....x.......x...', hat: 'x.x.x.x.x.x.x.x.', bass: 'x...o...x...o...', arp: false, lead: 'square', seed: 41, density: 0.6, pad: null },
    2048:     { bpm: 84,  root: 55, prog: [[0, 3, 7, 10], [-4, 0, 3, 7], [3, 7, 10, 14], [-2, 2, 5, 9]], kick: 'x.........x.....', snare: '....x.......x...', hat: '..x...x...x..xx.', bass: 'x.......x..x....', arp: false, lead: 'triangle', seed: 51, density: 0.25, pad: 'triangle' },
    blokken:  { bpm: 120, root: 57, prog: [[0, 3, 7], [-2, 2, 5], [-4, 0, 3], [-5, -1, 2]], kick: 'x...x...x...x...', snare: '....x.......x...', hat: 'x.x.x.x.x.x.x.x.', bass: 'x.o.x.o.x.o.x.o.', arp: false, lead: 'square', seed: 61, density: 0.65, pad: null },
    overval:  { bpm: 132, root: 50, prog: [[0, 3, 7], [0, 3, 7], [1, 5, 8], [-2, 2, 5]], kick: 'x..x..x...x..x..', snare: '....x.......x...', hat: 'x.xxx.xxx.xxx.xx', bass: 'x..x..x.x..x..xo', arp: false, lead: 'sawtooth', seed: 81, density: 0.35, pad: 'sawtooth' },
    td:       { bpm: 108, root: 55, prog: [[0, 3, 7], [-4, 0, 3], [-2, 2, 5], [3, 7, 10]], kick: 'x.......x.x.....', snare: '....x.......x...', hat: 'x.x.x.x.x.x.x.x.', bass: 'x...x.o.x...x.o.', arp: true, lead: 'triangle', seed: 91, density: 0.4, pad: 'triangle' },
    mijnen:   { bpm: 80,  root: 57, prog: [[0, 4, 7], [-3, 0, 4], [-7, -3, 0], [-5, -1, 2]], kick: 'x.........x.....', snare: '................', hat: '........x.......', bass: 'x.......x.......', arp: true,  lead: 'sine', seed: 81, density: 0.25, pad: 'triangle' },
    sudoku:   { bpm: 72,  root: 60, prog: [[0, 4, 7], [5, 9, 12], [-3, 0, 4], [-5, -1, 2]], kick: 'x...............', snare: '................', hat: '................', bass: 'x.......x.......', arp: true,  lead: 'sine', seed: 91, density: 0.2, pad: 'triangle' },
    memory:   { bpm: 88,  root: 62, prog: [[0, 4, 7], [-5, -1, 2], [-3, 0, 4], [-7, -3, 0]], kick: 'x.......x.......', snare: '................', hat: '....x.......x...', bass: 'x...x...x...x...', arp: true,  lead: 'triangle', seed: 101, density: 0.3, pad: 'triangle' },
    vier:     { bpm: 84,  root: 55, prog: [[0, 3, 7], [-4, 0, 3], [-2, 2, 5], [-5, -2, 2]], kick: 'x.......x.......', snare: '............x...', hat: '..x.......x.....', bass: 'x.....x.........', arp: false, lead: 'triangle', seed: 111, density: 0.28, pad: 'triangle' },
    moto:     { bpm: 132, root: 50, prog: [[0, 3, 7], [-2, 2, 5], [-4, 0, 3], [-5, -1, 2]], kick: 'x...x...x...x...', snare: '....x.......x...', hat: 'x.xox.xox.xox.xo', bass: 'x.x.xox.x.x.xox.', arp: true,  lead: 'sawtooth', seed: 151, density: 0.42, pad: 'sawtooth' },
    tycoon:   { bpm: 96,  root: 57, prog: [[0, 4, 7], [-3, 0, 4], [5, 9, 12], [-5, -1, 2]], kick: 'x.......x.......', snare: '....x.......x...', hat: '..x...x...x...x.', bass: 'x..x..x.x..x..x.', arp: true,  lead: 'triangle', seed: 131, density: 0.32, pad: 'triangle' },
    patience: { bpm: 70,  root: 58, prog: [[0, 4, 7, 11], [-3, 0, 4, 7], [5, 9, 12, 16], [-5, -1, 2, 5]], kick: 'x...............', snare: '................', hat: '................', bass: 'x.......x.......', arp: true,  lead: 'sine', seed: 121, density: 0.18, pad: 'triangle' },
    stack:    { bpm: 100, root: 59, prog: [[0, 3, 7], [3, 7, 10], [-4, 0, 3], [-2, 2, 5]], kick: 'x.......x.......', snare: '........x.......', hat: 'x...x...x...x...', bass: 'x.....x.........', arp: true,  lead: 'triangle', seed: 71, density: 0.3, pad: 'triangle' },
  };
  // Melodie maken uit de toonladder (altijd hetzelfde per nummer)
  function makeMelody(song) {
    const R = rng(song.seed);
    const motif = [];
    for (let i = 0; i < 32; i++) {
      if (R() > song.density || i % 2 === 1 && R() < 0.5) { motif.push(null); continue; }
      const deg = Math.floor(R() * 7) + (R() < 0.3 ? 7 : 0);
      const len = R() < 0.25 ? 3 : R() < 0.5 ? 2 : 1;
      motif.push({ deg, len });
    }
    const mel = [];
    for (let bar = 0; bar < 8; bar++) {
      for (let i = 0; i < 16; i++) {
        let m = motif[(bar % 2) * 16 + i];
        if (m && bar >= 4 && bar % 2 === 1 && i > 8) m = { deg: m.deg + 2, len: m.len }; // kleine variatie
        mel.push(m);
      }
    }
    return mel;
  }
  for (const k in SONGS) SONGS[k].mel = makeMelody(SONGS[k]);

  let ac = null, master = null, delayIn = null, reverbIn = null, duck = null, noise = null, timer = null;
  let song = null, wanted = null, step = 0, nextT = 0;
  const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);
  // Galm: zelf gemaakte impulsrespons (geen bestanden nodig)
  function makeReverb(sec = 2.2) {
    const len = Math.floor(ac.sampleRate * sec), buf = ac.createBuffer(2, len, ac.sampleRate);
    for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3.2); }
    const cv = ac.createConvolver(); cv.buffer = buf; return cv;
  }
  function initAudio() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    try {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      master = ac.createGain();
      master.gain.value = musicVol() * 0.5;
      const comp = ac.createDynamicsCompressor();
      comp.threshold.value = -16; comp.ratio.value = 3.5; comp.attack.value = 0.004; comp.release.value = 0.2;
      const warm = ac.createBiquadFilter(); warm.type = 'highshelf'; warm.frequency.value = 6000; warm.gain.value = -4;
      master.connect(warm); warm.connect(comp); comp.connect(ac.destination);
      // 'duck' zakt even weg op elke kick (pompend effect zoals in echte dance-muziek)
      duck = ac.createGain(); duck.connect(master);
      // Echo voor melodie
      delayIn = ac.createGain(); delayIn.gain.value = 0.2;
      const d = ac.createDelay(); d.delayTime.value = 0.3;
      const fb = ac.createGain(); fb.gain.value = 0.32;
      const dlp = ac.createBiquadFilter(); dlp.type = 'lowpass'; dlp.frequency.value = 2400;
      delayIn.connect(d); d.connect(dlp); dlp.connect(fb); fb.connect(d); dlp.connect(duck);
      reverbIn = ac.createGain(); reverbIn.gain.value = 0.28;
      const rv = makeReverb(); reverbIn.connect(rv); rv.connect(duck);
      noise = ac.createBuffer(1, Math.floor(ac.sampleRate * 0.5), ac.sampleRate);
      const data = noise.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
    } catch (e) { ac = null; }
  }
  function env(g, t, a, peak, dur) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  }
  function out(node, pan = 0) {
    if (pan && ac.createStereoPanner) { const p = ac.createStereoPanner(); p.pan.value = pan; node.connect(p); return p; }
    return node;
  }
  function kick(t) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(160, t);
    o.frequency.exponentialRampToValueAtTime(45, t + 0.12);
    env(g, t, 0.002, 0.95, 0.28);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.3);
    noiseHit(t, 3000, 0.12, 0.012, 0, master);            // tikje voor de aanslag
    duck.gain.cancelScheduledValues(t);
    duck.gain.setValueAtTime(0.45, t); duck.gain.linearRampToValueAtTime(1, t + 0.22);
  }
  function noiseHit(t, hp, peak, dur, pan = 0, dest = null, type = 'highpass', q = 0.7) {
    const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = noise;
    f.type = type; f.frequency.value = hp; f.Q.value = q;
    env(g, t, 0.002, peak, dur);
    s.connect(f); f.connect(g); out(g, pan).connect(dest || master);
    s.start(t, Math.random() * 0.3); s.stop(t + dur + 0.02);
    return g;
  }
  function snare(t) {
    const g = noiseHit(t, 1800, 0.32, 0.18, 0, master, 'bandpass', 0.6);
    g.connect(reverbIn);
    const o = ac.createOscillator(), g2 = ac.createGain();
    o.type = 'triangle'; o.frequency.setValueAtTime(220, t); o.frequency.exponentialRampToValueAtTime(140, t + 0.08);
    env(g2, t, 0.002, 0.22, 0.1); o.connect(g2); g2.connect(master); o.start(t); o.stop(t + 0.12);
  }
  // Toon met twee licht ontstemde oscillatoren en een filter dat 'opengaat'
  function tone(t, midi, dur, type, vol, cutoff, echo, attack = 0.006, opt = {}) {
    const f = ac.createBiquadFilter(), g = ac.createGain();
    f.type = 'lowpass'; f.Q.value = opt.q || 0.8;
    f.frequency.setValueAtTime(cutoff * (opt.sweep ? 0.25 : 1), t);
    if (opt.sweep) f.frequency.exponentialRampToValueAtTime(cutoff, t + Math.min(dur, 0.08)), f.frequency.exponentialRampToValueAtTime(cutoff * 0.35, t + dur);
    const n = opt.unison ? 2 : 1;
    for (let k = 0; k < n; k++) {
      const o = ac.createOscillator();
      o.type = type; o.frequency.value = mtof(midi); o.detune.value = n > 1 ? (k ? 9 : -9) : 0;
      if (opt.vib) { const l = ac.createOscillator(), lg = ac.createGain(); l.frequency.value = 5.5; lg.gain.value = 7; l.connect(lg); lg.connect(o.detune); l.start(t + 0.12); l.stop(t + dur + 0.05); }
      o.connect(f); o.start(t); o.stop(t + dur + 0.05);
    }
    env(g, t, attack, vol / n, dur);
    f.connect(g);
    const dst = out(g, opt.pan || 0);
    dst.connect(opt.dry ? master : duck);
    if (echo) dst.connect(delayIn);
    if (opt.verb) dst.connect(reverbIn);
  }
  function playStep(s, t) {
    const sp = 60 / song.bpm / 4;
    const i = s % 16, barN = Math.floor(s / 16), bar = barN % 4, chord = song.prog[bar];
    const intro = barN < 2 && song.introDone !== true;
    const fill = barN % 8 === 7 && i >= 12;                       // drumroffel aan het eind van elke 8 maten
    if (!intro) {
      if (song.kick[i] === 'x') kick(t);
      if (song.snare[i] === 'x' || (fill && i % 2 === 0)) snare(t);
      if (song.hat[i] === 'x') noiseHit(t, 8000, 0.06 + (i % 4 === 2 ? 0.03 : 0), 0.03, i % 2 ? 0.25 : -0.25);
      if (song.hat[i] === 'o') noiseHit(t, 7000, 0.08, 0.16, 0.2);
      if (barN % 8 === 0 && i === 0 && song.introDone) noiseHit(t, 5000, 0.12, 1.4, 0, reverbIn);  // bekken
    }
    const b = song.bass[i];
    if (b !== '.') tone(t, song.root - 12 + chord[0] + (b === 'o' ? 12 : 0), sp * 0.9, 'sawtooth', 0.2, 900, false, 0.004, { sweep: true, unison: true, q: 4 });
    if (song.pad && i === 0) for (const n of chord) tone(t, song.root + n, sp * 16 * 0.98, song.pad, 0.045, intro ? 700 : 1500, false, 0.35, { unison: true, verb: true, pan: (n % 3 - 1) * 0.3 });
    if (song.arp && i % 2 === 0) tone(t, song.root + 12 + chord[(i / 2) % chord.length] + (barN % 2 && i >= 8 ? 12 : 0), sp * 0.7, 'square', 0.022, 2400, true, 0.003, { pan: ((i / 2) % 2 ? 0.35 : -0.35) });
    const m = song.mel[s % song.mel.length];
    if (m && !intro) {
      const deg = m.deg;
      const note = song.root + 12 + SCALE[deg % 7] + 12 * Math.floor(deg / 7);
      tone(t, note, sp * m.len * 0.95, song.lead, 0.055, song.lead === 'sawtooth' ? 2600 : 3800, true, 0.008, { vib: m.len > 1, verb: true, unison: song.lead === 'sawtooth' });
    }
  }
  function tick() {
    if (!ac || !song) return;
    const sp = 60 / song.bpm / 4;
    if (nextT < ac.currentTime) nextT = ac.currentTime + 0.05;
    while (nextT < ac.currentTime + 0.15) {
      playStep(step, nextT);
      nextT += sp;
      step++;
      if (step >= 128) { step = 0; song.introDone = true; }
    }
  }
  function startIfWanted() {
    if (!wanted) return;
    initAudio();
    if (!ac) return;
    if (song !== SONGS[wanted]) { song = SONGS[wanted]; step = 0; nextT = ac.currentTime + 0.1; }
    if (!timer) timer = setInterval(tick, 25);
  }
  // Muziek mag pas starten na een klik of toetsaanslag (regel van browsers)
  addEventListener('pointerdown', startIfWanted);
  addEventListener('keydown', startIfWanted);
  document.addEventListener('visibilitychange', () => {
    if (!ac) return;
    if (document.hidden) ac.suspend(); else ac.resume();
  });
  listeners.push(() => { if (master) master.gain.setTargetAtTime(musicVol() * 0.5, ac.currentTime, 0.1); });

  const music = { play(name) { wanted = name; if (ac) startIfWanted(); }, status: () => ({ running: !!timer, song: wanted, step, audio: ac ? ac.state : 'geen' }) };

  // ---------- Instellingenpaneel ----------
  const CSS = `
  .ac-gear { position: fixed; top: 12px; right: 12px; z-index: 50; width: 42px; height: 42px; border-radius: 12px; cursor: pointer;
    background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.22); color: #fff; display: flex; align-items: center; justify-content: center; padding: 0; }
  .ac-gear:hover { background: rgba(255,255,255,0.2); }
  .ac-gear svg { width: 22px; height: 22px; transition: transform 0.4s ease; }
  .ac-gear:hover svg { transform: rotate(60deg); }
  .ac-ov { position: fixed; inset: 0; z-index: 60; background: rgba(5,6,9,0.6); display: none; align-items: center; justify-content: center; padding: 16px;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-user-select: none; user-select: none; }
  .ac-ov.open { display: flex; }
  .ac-card { width: min(380px, 100%); background: #16181d; border: 1px solid rgba(255,255,255,0.14); border-radius: 18px; padding: 20px 22px; color: #fff;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
  .ac-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .ac-head b { font-size: 20px; font-weight: 900; }
  .ac-x { background: rgba(255,255,255,0.1); border: 0; color: #fff; width: 34px; height: 34px; border-radius: 10px; cursor: pointer; font-size: 16px; }
  .ac-row { margin: 14px 0; }
  .ac-lab { display: flex; justify-content: space-between; font-size: 14px; font-weight: 700; margin-bottom: 8px; color: #e6e9ee; }
  .ac-lab span { color: #9aa1ab; font-family: ui-monospace, Consolas, monospace; }
  .ac-card input[type=range] { width: 100%; accent-color: #e8282f; height: 22px; }
  .ac-seg { display: flex; gap: 6px; background: #0e0f13; padding: 4px; border-radius: 12px; }
  .ac-seg button { flex: 1; border: 0; background: transparent; color: #c9ced6; padding: 9px 0; border-radius: 9px; font-weight: 800; font-size: 13px; cursor: pointer; }

      slope(len, dy) { curve(len, (t) => dy * (1 - Math.cos(Math.PI * t)) / 2); return B; },
      hill(len, h) { curve(len, (t) => -h * (1 - Math.cos(2 * Math.PI * t)) / 2); return B; },
      valley(len, h) { curve(len, (t) => h * (1 - Math.cos(2 * Math.PI * t)) / 2); return B; },
      bumps(n, w, h) { for (let i = 0; i < n; i++) B.hill(w, h); return B; },
      // schans: loopt steeds steiler op
      kicker(len, h) { curve(len, (t) => -h * t * t, Math.max(4, Math.round(len / 14))); return B; },
      // kuil met spijkers; je moet erover springen. landDy = hoeveel lager de landing ligt
      pit(w, depth = 420, landDy = 0) {
        const x0 = x, y0 = y;
        add(x0 + 2, y0 + depth);
        const n = Math.max(3, Math.round(w / 34));
        for (let i = 0; i < n; i++) {
          add(x0 + 2 + (w - 4) * (i + 0.5) / n, y0 + depth - 26, { d: true });
          add(x0 + 2 + (w - 4) * (i + 1) / n, y0 + depth, { d: true });
        }
        add(x0 + w, y0 + landDy);
        zones.push({ x0: x0 + 4, x1: x0 + w - 4, y: y0 + Math.min(depth - 90, Math.max(landDy, 0) + 120) });
        return B;
      },
      // looping: rond tegen de klok in (op het scherm), met een kleine verschuiving zodat in- en uitgang niet botsen
      // afgrond: steil naar beneden; je vliegt eroverheen en landt op de helling erna
      cliff(h) { add(x + 3, y + h); return B; },
      boost(len = 220) { add(x + len, y, { boost: true }); return B; },
      loop(R = 130) {
        B.boost(220);   // turbostrook vlak voor de looping
        const x0 = x, y0 = y, n = 76, shift = 60;
        for (let i = 1; i <= n; i++) {
          const t = i / n, th = Math.PI / 2 - t * Math.PI * 2;
          const cx = x0 + shift * t;
          add(cx + R * Math.cos(th), y0 - R + R * Math.sin(th), { nf: true, loop: true });
        }
        P[P.length - 1].loop = false;
        return B;
      },
      barrel(dx = 0, up = 0) { objs.push({ type: 'barrel', x: x + dx, y: y - 22 - up, r: 20 }); return B; },
      checkpoint() { cps.push({ x: x, y: y }); return B; },
      tree(dx) { deco.push({ type: 'tree', x: x + dx, y }); return B; },
      sign(dx, t) { deco.push({ type: 'sign', x: x + dx, y, t }); return B; },
      finish() { const fx = x + 120; B.flat(900); return { P, objs, cps, deco, zones, finishX: fx }; },
    };
    B.flat(420);
    return B;
  }

  // ---------- levels ----------
  // Elk level bestaat uit stukken; tussen de stukken staat een checkpoint.
  const SEC = {
    A: (b) => b.flat(300).hill(600, 70).flat(150).hill(500, 50).flat(200).slope(500, -140).flat(250).slope(500, 140).flat(200),
    B: (b) => b.flat(400).kicker(220, 55).flat(500).hill(500, 60).flat(200),
    C: (b) => b.flat(300).bumps(4, 300, 42).flat(300),
    D: (b) => b.flat(450).kicker(200, 60).pit(240, 380, 40).flat(400),
    E: (b) => b.flat(600).loop().flat(400),
    G: (b) => b.flat(450).kicker(200, 70).barrel(170).flat(550),
    H: (b) => b.flat(450).kicker(220, 75).barrel(150).barrel(205).flat(600),
    I: (b) => b.flat(300).valley(700, 170).hill(600, 150).flat(300),
    J: (b) => b.flat(300).slope(400, -250).flat(150).slope(400, 250).flat(250),
    K: (b) => b.flat(700).loop().flat(120).loop().flat(400),
    M: (b) => b.flat(300).slope(600, -300).flat(200).kicker(200, 50).flat(400).slope(500, 300).flat(200),
    // grote sprongen: hier maak je je salto's
    P: (b) => b.flat(400).boost(240).kicker(260, 115).pit(540, 460, 70).slope(650, 240).flat(350),
    Q: (b) => b.flat(450).boost(260).kicker(300, 165).pit(720, 520, 110).slope(750, 320).flat(350),
    R: (b) => b.flat(450).kicker(150, 40).cliff(420).slope(850, 280).flat(350),
    T: (b) => b.flat(600).loop().flat(200).boost(240).kicker(270, 125).pit(580, 470, 80).slope(650, 240).flat(350),
  };
  const seq = (list) => (b) => { list.split('').forEach((k, i) => { if (i) b.checkpoint(); SEC[k](b); }); return b.finish(); };
  const LEVELS = [
    { name: 'Opwarmen', parts: 'APBRC' },
    { name: 'Hobbels', parts: 'CPDQA' },
    { name: 'Eerste looping', parts: 'EPBTR' },
    { name: 'Grote sprong', parts: 'QRPQ' },
    { name: 'Tonnen', parts: 'GPHRGQ' },
    { name: 'Achtbaan', parts: 'IEPITR' },
    { name: 'Steile wanden', parts: 'JQMRJP' },
    { name: 'Dubbele looping', parts: 'KPEQKR' },
    { name: 'Gevarenzone', parts: 'DHQGRHPG' },
    { name: 'Finale', parts: 'QEHKRGJTQP' },
  ];
  // sterrentijden (3 sterren, 2 sterren), gemeten met een computer-coureur.
  // Voor 3 sterren moet je bij (bijna) elke grote sprong een salto maken.
  const STARS = [[14.5, 17], [13.5, 16], [12.5, 16], [11, 14], [12.5, 16], [17.5, 21], [15.5, 19], [14, 19], [15, 19], [22.5, 29]];
  LEVELS.forEach((l, i) => { l.build = seq(l.parts); l.stars = STARS[i]; });

  function makeLevel(i) {
    const lv = LEVELS[i].build(builder());
    lv.name = LEVELS[i].name;
    const P = lv.P;
    // segmenten met normaal (rijkant = links van de rijrichting)
    const S = [];
    for (let k = 1; k < P.length; k++) {
      const a = P[k - 1], b = P[k], dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy) || 1;
      S.push({ ax: a.x, ay: a.y, bx: b.x, by: b.y, dx: dx / len, dy: dy / len, nx: dy / len, ny: -dx / len, len, d: b.d, nf: b.nf, loop: b.loop, boost: b.boost });
    }
    lv.S = S;
    lv.startX = 160;
    return lv;
  }

  // dichtstbijzijnde punt op een segment
  function closest(s, px, py) {
    let t = ((px - s.ax) * s.dx + (py - s.ay) * s.dy);
    t = Math.max(0, Math.min(s.len, t));
    return { x: s.ax + s.dx * t, y: s.ay + s.dy * t };
  }
  function segIndexAt(lv, x) {   // eerste niet-looping-segment op deze x (voor start/checkpoints)
    for (let i = 0; i < lv.S.length; i++) { const s = lv.S[i]; if (!s.loop && x >= Math.min(s.ax, s.bx) && x <= Math.max(s.ax, s.bx) && Math.abs(s.dx) > 0.2) return i; }
    return 0;
  }
  function groundAt(lv, i, x) { const s = lv.S[i]; const t = (x - s.ax) / ((s.bx - s.ax) || 1); return { y: s.ay + (s.by - s.ay) * t, a: Math.atan2(s.by - s.ay, s.bx - s.ax) }; }

  function spawn(lv, x) {
    const si = segIndexAt(lv, x), g = groundAt(lv, si, x);
    const ca = Math.cos(g.a), sa = Math.sin(g.a);
    return { x: x - sa * -(AY + WR + 2) + 0, y: g.y - (AY + WR + 2) * ca, a: g.a, vx: 0, vy: 0, w: 0, si, gr: [false, false], rt: [Math.cos(g.a), Math.sin(g.a)], air: 0, flipAcc: 0, spin: 0, dead: false, deadWhy: '' };
  }

  // lokaal punt van de motor -> wereld
  function world(b, lx, ly) { const c = Math.cos(b.a), s = Math.sin(b.a); return { x: b.x + c * lx - s * ly, y: b.y + s * lx + c * ly }; }

  // één natuurkunde-stapje. inp = { gas, brake, lean (-1 achterover .. 1 voorover) }
  function step(lv, b, inp, dt, opts = {}) {
    const S = lv.S;
    let ca = Math.cos(b.a), sa = Math.sin(b.a);
    const grounded = b.gr[0] || b.gr[1];
    if (!b.dead) {
      if (b.gr[0]) {
        // aandrijving langs de grond onder het achterwiel
        let tx = b.rt[0], ty = b.rt[1];
        if (tx * ca + ty * sa < 0) { tx = -tx; ty = -ty; }
        const vf = b.vx * tx + b.vy * ty;
        const maxv = MAXV * (opts.turbo ? 1.45 : 1);
        if (inp.gas && vf < maxv) { const add = Math.min(ACC * (opts.turbo ? 1.6 : 1) * dt, maxv - vf); b.vx += tx * add; b.vy += ty * add; }
        if (inp.brake) { const target = -REV; if (vf > target) { const sub = Math.min(BRAKE * dt, vf - target); b.vx -= tx * sub; b.vy -= ty * sub; } }
      }
      const lean = inp.lean || 0;
      b.w += lean * (grounded ? 11 : 22) * dt;
      if (inp.gas && b.gr[0] && !b.gr[1]) b.w -= 1.2 * dt;   // wheelie bij gas op het achterwiel
    }
    b.w = Math.max(-9.5, Math.min(9.5, b.w));
    b.w *= 1 - (grounded ? 1.2 : 0.25) * dt;
    b.vy += G * dt;
    b.x += b.vx * dt; b.y += b.vy * dt; b.a += b.w * dt;

    // welk stuk baan is het dichtst bij?
    let best = b.si, bd = Infinity;
    const lo = Math.max(0, b.si - WIN), hi = Math.min(S.length - 1, b.si + WIN);
    for (let i = lo; i <= hi; i++) { const q = closest(S[i], b.x, b.y); const d = (q.x - b.x) ** 2 + (q.y - b.y) ** 2; if (d < bd) { bd = d; best = i; } }
    b.si = best;
    const lo2 = Math.max(0, b.si - WIN), hi2 = Math.min(S.length - 1, b.si + WIN);

    // wielen
    ca = Math.cos(b.a); sa = Math.sin(b.a);
    b.gr[0] = b.gr[1] = false;
    for (let wi = 0; wi < 2; wi++) {
      const lx = wi ? AX : -AX;
      for (let it = 0; it < 2; it++) {
        const P = world(b, lx, AY);
        let hit = null, hd = WR;
        for (let i = lo2; i <= hi2; i++) {
          const s = S[i], q = closest(s, P.x, P.y), vx = P.x - q.x, vy = P.y - q.y, d = Math.hypot(vx, vy);
          if (d >= hd || d < 1e-6) continue;
          if (vx * s.nx + vy * s.ny < -2) continue;  // achterkant van de baan: negeren
          hd = d; hit = { s, nx: vx / d, ny: vy / d, pen: WR - d };
        }
        if (!hit) break;
        if (hit.s.d && !opts.god) { kill(b, 'spikes'); }
        if (hit.s.boost && !b.dead) {   // turbostrook: meteen hard vooruit
          const vf = b.vx * hit.s.dx + b.vy * hit.s.dy;
          if (vf < BOOSTV) { b.vx += hit.s.dx * (BOOSTV - vf); b.vy += hit.s.dy * (BOOSTV - vf); b.boosted = 0.6; }
        }
        b.gr[wi] = true;
        if (wi === 0) { b.rt[0] = -hit.ny; b.rt[1] = hit.nx; }
        b.x += hit.nx * hit.pen; b.y += hit.ny * hit.pen;
        const rx = P.x - b.x, ry = P.y - b.y;
        const vpx = b.vx - b.w * ry, vpy = b.vy + b.w * rx;
        const vn = vpx * hit.nx + vpy * hit.ny;
        if (vn < 0) {
          const rn = rx * hit.ny - ry * hit.nx, k = 1 + (rn * rn) / INERTIA;
          const j = -(1.08) * vn / k;
          b.vx += j * hit.nx; b.vy += j * hit.ny; b.w += (rn * j) / INERTIA;
        }
        if (inp.brake && !b.dead) { // rem = ook grip langs de baan
          const tx = -hit.ny, ty = hit.nx, vt = (b.vx - b.w * ry) * tx + (b.vy + b.w * rx) * ty;
          const jt = -vt * Math.min(1, 3 * dt);
          b.vx += jt * tx; b.vy += jt * ty;
        }
      }
    }
    // salto's tellen: pas als je echt (even stabiel) geland bent, niet bij een tikje tegen een rand
    b.flipAcc += b.w * dt;
    if (b.gr[0] || b.gr[1]) {
      b.gt = (b.gt || 0) + dt;
      if (b.gt > 0.12) {
        if (b.air > 0.35 && !b.dead) {
          const flips = Math.floor((Math.abs(b.flipAcc) + 0.9) / (Math.PI * 2));
          if (flips > 0) b.landFlips = (b.landFlips || 0) + flips;
          b.justLanded = true;
        }
        b.air = 0; b.flipAcc = 0;
      }
    } else { b.gt = 0; b.air += dt; }

    // helm of romp tegen de grond = crash
    if (!b.dead && !opts.god) {
      for (const part of [HEAD, BODY]) {
        const P = world(b, part.x, part.y);
        for (let i = lo2; i <= hi2; i++) {
          const s = S[i], q = closest(s, P.x, P.y), vx = P.x - q.x, vy = P.y - q.y, d = Math.hypot(vx, vy);
          if (d < part.r && vx * s.nx + vy * s.ny > -2) { kill(b, part === HEAD ? 'head' : 'body'); break; }
        }
        if (b.dead) break;
      }
    }
    // tonnen
    for (const o of lv.objs) {
      if (o.gone || o.type !== 'barrel') continue;
      if (Math.abs(o.x - b.x) > 140) continue;
      for (const pt of [world(b, -AX, AY), world(b, AX, AY), world(b, HEAD.x, HEAD.y), world(b, BODY.x, BODY.y)]) {
        if (Math.hypot(pt.x - o.x, pt.y - o.y) < o.r + 12) { o.gone = true; o.boom = true; if (!opts.god) kill(b, 'barrel'); else b.vy -= 300; break; }
      }
    }
    // wielen draaien (voor het tekenen)
    b.spin += ((b.vx * ca + b.vy * sa) / WR) * dt;
    // in een kuil gevallen
    if (!b.dead && !opts.god) for (const z of lv.zones) if (b.x > z.x0 && b.x < z.x1 && b.y > z.y) { kill(b, 'fall'); break; }
    if (b.y > 4000 && !b.dead) kill(b, 'fall');
  }
  function kill(b, why) { if (!b.dead) { b.dead = true; b.deadWhy = why; } }

  return { G, WR, AX, AY, HEAD, BODY, SUB, LEVELS, makeLevel, spawn, step, world, segIndexAt, groundAt };
})();
// ================= MOTO STUNT · spel, tekenen en menu =================
const W = 1280, H = 720;
// 3D-wereld op canvas #c (volledig scherm), daarboven een doorzichtige laag voor tijd, menu's en knoppen
const hudEl = document.createElement('canvas'); hudEl.id = 'hud'; document.body.appendChild(hudEl);
const tint = document.createElement('div'); tint.id = 'tint'; document.body.appendChild(tint);
const { c, ctx, view } = Arcade.canvas('hud', W, H);
const GAME = 'moto';
const ui = Arcade.ui(ctx);
const RED = '#e8282f';
const NLV = MOTO.LEVELS.length;

// ---------- opslag ----------
let bests = Arcade.load('moto_bests', {});          // { level: beste tijd }
const starsFor = (i, t) => (t == null ? 0 : t <= MOTO.LEVELS[i].stars[0] ? 3 : t <= MOTO.LEVELS[i].stars[1] ? 2 : 1);
const totalStars = () => MOTO.LEVELS.reduce((s, _, i) => s + starsFor(i, bests[i]), 0);
const unlocked = (i) => i === 0 || bests[i - 1] != null || Arcade.load('moto_unlockall', false);
function saveBests() {
  Arcade.save('moto_bests', bests);
  const tot = totalStars();
  if (tot > 0) Arcade.save('best_moto', Math.max(tot, Arcade.load('best_moto', 0) || 0));
}

// ---------- spelstatus ----------
let state = 'menu';            // menu | play | pause | done
let li = 0, lv = null, bike = null, cp = null, t = 0, started = false, crashT = 0, doneT = 0;
let flips = 0, result = null, rider = null, camX = 0, camY = 0, zoom = 1, menuScroll = 0;
const pops = [];               // zwevende teksten (scherm)
const parts = [];              // deeltjes (wereld)
const CHEAT = { god: false, turbo: false };
const keys = {};
const touchBtns = {};          // actieve touch-knoppen

function startLevel(i) {
  li = i; lv = MOTO.makeLevel(i);
  bike = MOTO.spawn(lv, lv.startX);
  cp = null; t = 0; started = false; crashT = 0; flips = 0; result = null; rider = null;
  parts.length = 0; pops.length = 0;
  camX = bike.x; camY = bike.y;
  state = 'play';
  for (const k in keys) keys[k] = false;
}
function respawn() {
  const x = cp ? cp.x + 40 : lv.startX;
  bike = MOTO.spawn(lv, x);
  rider = null; crashT = 0;
  lv.objs.forEach((o) => { if (o.x > x) { o.gone = false; o.boom = false; } });
}

// ---------- invoer ----------
function input() {
  const tb = touchBtns;
  const gas = keys.ArrowUp || keys.KeyW || tb.gas;
  const brake = keys.ArrowDown || keys.KeyS || tb.brake;
  const back = keys.ArrowLeft || keys.KeyA || tb.back;
  const fwd = keys.ArrowRight || keys.KeyD || tb.fwd;
  return { gas: !!gas, brake: !!brake, lean: (fwd ? 1 : 0) - (back ? 1 : 0) };
}
addEventListener('keydown', (e) => {
  if (e.target && e.target.tagName === 'INPUT') return;
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  keys[e.code] = true;
  if (state === 'play') {
    if (e.code === 'KeyR') startLevel(li);
    if (e.code === 'Escape' || e.code === 'KeyP') state = 'pause';
    if (e.code === 'Enter' && bike.dead) respawn();
  } else if (state === 'pause') {
    if (e.code === 'Escape' || e.code === 'KeyP' || e.code === 'Enter') state = 'play';
    if (e.code === 'KeyR') startLevel(li);
  } else if (state === 'done' && doneT > 0.6) {
    if (e.code === 'Enter') { if (li + 1 < NLV && unlocked(li + 1)) startLevel(li + 1); else state = 'menu'; }
    if (e.code === 'KeyR') startLevel(li);
    if (e.code === 'Escape') state = 'menu';
  } else if (state === 'menu') {
    if (e.code === 'Enter') { let i = 0; for (let k = 0; k < NLV; k++) if (unlocked(k)) i = k; for (let k = 0; k < NLV; k++) if (unlocked(k) && bests[k] == null) { i = k; break; } startLevel(i); }
  }
});
addEventListener('keyup', (e) => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; for (const k in touchBtns) touchBtns[k] = false; });

// touch: knoppen onderin; meerdere vingers tegelijk
const TB = () => {
  const s = 118, m = 24, y = H - s - m;
  return { back: [m, y, s, s], fwd: [m + s + 16, y, s, s], brake: [W - m - s * 2 - 16, y, s, s], gas: [W - m - s, y, s, s] };
};
const pointers = new Map();
function zoneAt(q) { const z = TB(); for (const k in z) { const [x, y, w, h] = z[k]; if (q.x >= x - 10 && q.x <= x + w + 10 && q.y >= y - 10 && q.y <= y + h + 10) return k; } return null; }
function syncTouch() { for (const k of ['back', 'fwd', 'brake', 'gas']) touchBtns[k] = false; for (const z of pointers.values()) if (z) touchBtns[z] = true; }
c.addEventListener('pointerdown', (e) => {
  const q = view.toGame(e);
  if (state === 'play' && e.pointerType !== 'mouse') {
    // pauzeknop
    if (q.x > W - 140 && q.x < W - 66 && q.y < 70) { state = 'pause'; return; }
    pointers.set(e.pointerId, zoneAt(q)); syncTouch();
    if (bike && bike.dead && crashT > 0.4) respawn();
    return;
  }
  if (state === 'play' && q.x > W - 140 && q.x < W - 66 && q.y < 70) { state = 'pause'; return; }
  ui.hit(q);
});
c.addEventListener('pointermove', (e) => {
  const q = view.toGame(e); ui.hover(q);
  if (pointers.has(e.pointerId)) { pointers.set(e.pointerId, zoneAt(q)); syncTouch(); }
});
const up = (e) => { pointers.delete(e.pointerId); syncTouch(); };
c.addEventListener('pointerup', up); c.addEventListener('pointercancel', up);
c.addEventListener('wheel', (e) => { if (state === 'menu') menuScroll = Math.max(0, Math.min(1, menuScroll + Math.sign(e.deltaY) * 0.5)); }, { passive: true });

// ---------- motorgeluid ----------
let actx = null, eng = null;
function engine(on, speed, gas) {
  if (!actx) {
    if (!on) return;
    try {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      const o1 = actx.createOscillator(), o2 = actx.createOscillator(), f = actx.createBiquadFilter(), g = actx.createGain();
      o1.type = 'sawtooth'; o2.type = 'square'; o2.detune.value = 7;
      f.type = 'lowpass'; f.frequency.value = 700; f.Q.value = 3;
      g.gain.value = 0;
      o1.connect(f); o2.connect(f); f.connect(g); g.connect(actx.destination);
      o1.start(); o2.start();
      eng = { o1, o2, f, g };
    } catch (e) { return; }
  }
  if (actx.state === 'suspended') actx.resume();
  const vol = on && !Arcade.muted ? (gas ? 0.045 : 0.025) : 0;
  const hz = 42 + Math.min(1, speed / 1100) * 95 + (gas ? 12 : 0);
  const now = actx.currentTime;
  eng.g.gain.setTargetAtTime(vol, now, 0.06);
  eng.o1.frequency.setTargetAtTime(hz, now, 0.05);
  eng.o2.frequency.setTargetAtTime(hz * 0.5, now, 0.05);
  eng.f.frequency.setTargetAtTime(500 + hz * 6, now, 0.05);
}

// ---------- effecten ----------
function burst(x, y, n, cols, spd = 300, life = 0.7, size = 5, grav = 900) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = spd * (0.25 + Math.random() * 0.75);
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - spd * 0.3, life: life * (0.5 + Math.random() * 0.5), max: life, c: cols[i % cols.length], s: size * (0.5 + Math.random()), g: grav });
  }
  if (parts.length > 700) parts.splice(0, parts.length - 700);
}

// ---------- spel bijwerken ----------
function update(dt) {
  for (let i = pops.length - 1; i >= 0; i--) { pops[i].life -= dt; if (pops[i].life <= 0) pops.splice(i, 1); }
  for (let i = parts.length - 1; i >= 0; i--) { const p = parts[i]; p.life -= dt; if (p.life <= 0) { parts.splice(i, 1); continue; } p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; }
  if (state === 'done') doneT += dt;
  if (state !== 'play') { engine(false, 0, false); return; }

  const inp = input();
  if (!started && (inp.gas || inp.lean || inp.brake)) started = true;
  if (started && !bike.dead && state === 'play') t += dt;

  const sub = MOTO.SUB, h = dt / sub;
  for (let k = 0; k < sub; k++) MOTO.step(lv, bike, bike.dead ? { gas: false, brake: false, lean: 0 } : inp, h, CHEAT);

  // stof bij het rijden
  if (!bike.dead && bike.gr[0] && inp.gas && Math.random() < 0.6) {
    const p = MOTO.world(bike, -MOTO.AX, MOTO.AY + MOTO.WR);
    parts.push({ x: p.x, y: p.y, vx: -bike.vx * 0.15 + (Math.random() - 0.5) * 60, vy: -40 - Math.random() * 60, life: 0.5, max: 0.5, c: 'rgba(150,145,138,0.6)', s: 6 + Math.random() * 6, g: -30, dust: true });
  }
  if (bike.boosted > 0) { bike.boosted -= dt; const p = MOTO.world(bike, -MOTO.AX - 10, 0); burst(p.x, p.y, 2, ['#ff6b70', '#ffb3b5', '#fff'], 120, 0.35, 5, 0); }
  if (bike.boostSnd !== bike.boosted > 0 && bike.boosted > 0.5) { Arcade.noise(0.4, 0.06, 4000, 800, 'bandpass'); }
  bike.boostSnd = bike.boosted > 0;

  // flips
  if (bike.landFlips) {
    const n = bike.landFlips; bike.landFlips = 0;
    flips += n; t = Math.max(0, t - n * 0.5);
    pop(n > 1 ? `${n}x SALTO!  −${(n * 0.5).toFixed(1).replace('.', ',')} sec` : 'SALTO!  −0,5 sec', '#ffffff', 46);
    Arcade.beep(660, 0.08, 'square', 0.05); Arcade.beep(990, 0.12, 'square', 0.05, 0, 0.08);
  }
  // landing-stof
  if (bike.justLanded && !bike.dead) {
    bike.justLanded = false;
    const p = MOTO.world(bike, 0, MOTO.AY + MOTO.WR);
    for (let i = 0; i < 10; i++) parts.push({ x: p.x + (Math.random() - 0.5) * 70, y: p.y, vx: (Math.random() - 0.5) * 200, vy: -60 - Math.random() * 80, life: 0.6, max: 0.6, c: 'rgba(150,145,138,0.55)', s: 8 + Math.random() * 8, g: 60, dust: true });
    Arcade.noise(0.12, 0.05, 900, 200);
  }
  // checkpoints
  for (const q of lv.cps) if (!bike.dead && bike.x > q.x && (!cp || q.x > cp.x)) {
    cp = q; q.hit = true; pop('CHECKPOINT', '#ffffff', 34);
    Arcade.beep(523, 0.08, 'triangle', 0.06); Arcade.beep(784, 0.14, 'triangle', 0.06, 0, 0.08);
  }
  // tonnen ontploffen
  for (const o of lv.objs) if (o.boom) {
    o.boom = false;
    burst(o.x, o.y, 46, ['#ff4d55', '#ffb020', '#ffe08a', '#ffffff', '#555'], 620, 0.9, 7, 700);
    Arcade.noise(0.6, 0.18, 2500, 80); Arcade.beep(70, 0.5, 'sawtooth', 0.08, -40);
    o.ring = 0.001;
  }
  for (const o of lv.objs) if (o.ring) { o.ring += dt * 2.2; if (o.ring > 1) o.ring = 0; }

  // crash
  if (bike.dead) {
    if (crashT === 0) {
      const hp = MOTO.world(bike, MOTO.HEAD.x, MOTO.HEAD.y);
      rider = { x: hp.x, y: hp.y + 25, vx: bike.vx * 0.6 + (Math.random() - 0.5) * 200, vy: Math.min(bike.vy, 0) - 380, r: bike.a, w: (Math.random() < 0.5 ? -1 : 1) * 9 };
      if (bike.deadWhy !== 'barrel') Arcade.noise(0.35, 0.14, 1800, 120);
      burst(hp.x, hp.y, 14, ['#ffffff', '#bfc4cb', RED], 260, 0.6, 5);
      pop('CRASH!', RED, 64);
    }
    crashT += dt;
    if (rider) { rider.vy += 1400 * dt; rider.x += rider.vx * dt; rider.y += rider.vy * dt; rider.r += rider.w * dt; }
    if (crashT > 1.25) respawn();

  const sp = Math.hypot(bike.vx, bike.vy);
  engine(!bike.dead, sp, inp.gas);

  // camera: iets vooruit kijken
  const tx = bike.x + Math.max(-150, Math.min(260, bike.vx * 0.22)), ty = bike.y - 40 + Math.max(-60, Math.min(120, bike.vy * 0.12));
  camX += (tx - camX) * Math.min(1, dt * 5); camY += (ty - camY) * Math.min(1, dt * 4);
  const zt = (Arcade.touch && innerHeight > innerWidth ? 0.72 : 1.0) - Math.min(0.17, sp / 6000);

}

      r.userData.torso.rotation.z += ((-lean * 0.45) - r.userData.torso.rotation.z) * 0.2;
    } else bikeG.visible = false;
    if (rider) { rag.visible = true; rag.position.set(rider.x * SC, -rider.y * SC, 0.1); rag.rotation.z = -rider.r; } else rag.visible = false;
    // tonnen + vlaggen
    for (const m of barrelMeshes) m.visible = !m.userData.o.gone;
    for (const g of flagMeshes) {
      const { q, flag } = g.userData;
      flag.material = q.hit ? M.flagWhite : M.flagRed;
      const pos = flag.geometry.attributes.position;
      for (let i = 0; i < pos.count; i++) { const x = pos.getX(i) + 0.3; pos.setZ(i, Math.sin(now / 160 + x * 7 + q.x) * 0.05 * x); }
      pos.needsUpdate = true;
    }
    chevTex.offset.y = -(now / 1000) * 2;
    // deeltjes
    let n = 0;
    for (const p of parts) {
      if (n >= MAXP) break;
      pPos[n * 3] = p.x * SC; pPos[n * 3 + 1] = -p.y * SC; pPos[n * 3 + 2] = p.z != null ? p.z : (Math.random() - 0.5) * 0.4;
      if (p.z == null) p.z = pPos[n * 3 + 2];
      tmpC.set(p.c.startsWith('rgba') ? '#9a958e' : p.c); const k = Math.max(0, p.life / p.max);
      pCol[n * 3] = tmpC.r * (0.4 + 0.6 * k) + (1 - k) * 0.4; pCol[n * 3 + 1] = tmpC.g * (0.4 + 0.6 * k) + (1 - k) * 0.4; pCol[n * 3 + 2] = tmpC.b * (0.4 + 0.6 * k) + (1 - k) * 0.4;
      n++;
    }
    pGeo.setDrawRange(0, n); pGeo.attributes.position.needsUpdate = true; pGeo.attributes.color.needsUpdate = true;
    // camera: schuin van voren-links, zodat je diepte ziet
    const tx = camX * SC, ty = -camY * SC;
    const dist = 7.2 / Math.max(0.4, zoom);
    camPos.set(tx - dist * 0.2, ty + dist * 0.2 + 0.4, dist);
    if (menu) camPos.set(tx - 3, ty + 2.2, 9.5);
    camera.position.lerp(camPos, menu ? 1 : 0.25);
    look.set(tx + 0.6, ty - 0.1, 0);
    camera.lookAt(look);
    // zon volgt de camera
    sun.position.set(tx - 5, ty + 12, 9); sun.target.position.set(tx + 1, ty, 0);
    renderer.render(scene, camera);
  }
  return { render, build };
})();
