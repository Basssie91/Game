(() => {
  try {
    const RAW = Storage.prototype.setItem, RM = Storage.prototype.removeItem, KEY = 'arcade_mtimes';
    const re = /^(arcade_|tt2_)/, skip = /^tt2_ghost|^arcade_settings$|^arcade_mtimes$|^arcade_recent$/;
    let mt; try { mt = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { mt = {}; }
    let tm = 0;
    const flush = () => { if (tm) clearTimeout(tm); tm = 0; try { RAW.call(localStorage, KEY, JSON.stringify(mt)); } catch (e) { /* vol */ } };
    const touch = (k, t) => { if (!re.test(k) || skip.test(k)) return; mt[k] = t || Date.now(); if (!tm) tm = setTimeout(flush, 250); };
    Storage.prototype.setItem = function (k, v) {
      if (this !== localStorage) return RAW.call(this, k, v);
      const old = this.getItem(k); RAW.call(this, k, v);
      if (old !== String(v)) touch(k);
    };
    Storage.prototype.removeItem = function (k) { if (this === localStorage && this.getItem(k) != null) touch(k); RM.call(this, k); };
    addEventListener('pagehide', flush);
    // voor auth.js: tijden lezen en (na overnemen uit de cloud) de tijd van de cloud zetten
    window.ArcadeTimes = { all: () => mt, set: (k, t) => { mt[k] = t; flush(); }, merge: (o) => { for (const k in o || {}) if (!(mt[k] >= o[k])) mt[k] = o[k]; flush(); } };

  // Melodie maken uit de toonladder (altijd hetzelfde per nummer)
  function makeMelody(song) {
    const R = rng(song.seed);
    const motif = [];
    for (let i = 0; i < 32; i++) {
      if (R() > song.density || i % 2 === 1 && R() < 0.5) { motif.push(null); continue; }
      const deg = Math.floor(R() * 7) + (R() < 0.3 ? 7 : 0);
      const len = R() < 0.25 ? 3 : R() < 0.5 ? 2 : 1;
      motif.push({ deg, len });
    }
    const mel = [];
    for (let bar = 0; bar < 8; bar++) {
      for (let i = 0; i < 16; i++) {
        let m = motif[(bar % 2) * 16 + i];
        if (m && bar >= 4 && bar % 2 === 1 && i > 8) m = { deg: m.deg + 2, len: m.len }; // kleine variatie
        mel.push(m);
      }
    }
    return mel;
  }

addEventListener('keydown', (e) => {

  keys[e.code] = true;
  if (state === 'play') {
    if (e.code === 'KeyR') startLevel(li);
    if (e.code === 'Escape' || e.code === 'KeyP') state = 'pause';
    if (e.code === 'Enter' && bike.dead) respawn();
  } else if (state === 'pause') {
    if (e.code === 'Escape' || e.code === 'KeyP' || e.code === 'Enter') state = 'play';
    if (e.code === 'KeyR') startLevel(li);
  } else if (state === 'done' && doneT > 0.6) {
    if (e.code === 'Enter') { if (li + 1 < NLV && unlocked(li + 1)) startLevel(li + 1); else state = 'menu'; }
    if (e.code === 'KeyR') startLevel(li);
    if (e.code === 'Escape') state = 'menu';
  } else if (state === 'menu') {
    if (e.code === 'Enter') { let i = 0; for (let k = 0; k < NLV; k++) if (unlocked(k)) i = k; for (let k = 0; k < NLV; k++) if (unlocked(k) && bests[k] == null) { i = k; break; } startLevel(i); }

addEventListener('keyup', (e) => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; for (const k in touchBtns) touchBtns[k] = false; });

// touch: knoppen onderin; meerdere vingers tegelijk
const TB = () => {
  const s = 118, m = 24, y = H - s - m;
  return { back: [m, y, s, s], fwd: [m + s + 16, y, s, s], brake: [W - m - s * 2 - 16, y, s, s], gas: [W - m - s, y, s, s] };
};
const pointers = new Map();
function zoneAt(q) { const z = TB(); for (const k in z) { const [x, y, w, h] = z[k]; if (q.x >= x - 10 && q.x <= x + w + 10 && q.y >= y - 10 && q.y <= y + h + 10) return k; } return null; }

const up = (e) => { pointers.delete(e.pointerId); syncTouch(); };
c.addEventListener('pointerup', up); c.addEventListener('pointercancel', up);
c.addEventListener('wheel', (e) => { if (state === 'menu') menuScroll = Math.max(0, Math.min(1, menuScroll + Math.sign(e.deltaY) * 0.5)); }, { passive: true });

// ---------- motorgeluid ----------
let actx = null, eng = null;
function engine(on, speed, gas) {
  if (!actx) {
    if (!on) return;
    try {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      const o1 = actx.createOscillator(), o2 = actx.createOscillator(), f = actx.createBiquadFilter(), g = actx.createGain();
      o1.type = 'sawtooth'; o2.type = 'square'; o2.detune.value = 7;
      f.type = 'lowpass'; f.frequency.value = 700; f.Q.value = 3;
      g.gain.value = 0;
      o1.connect(f); o2.connect(f); f.connect(g); g.connect(actx.destination);
      o1.start(); o2.start();
      eng = { o1, o2, f, g };
    } catch (e) { return; }
  }
  if (actx.state === 'suspended') actx.resume();
  const vol = on && !Arcade.muted ? (gas ? 0.045 : 0.025) : 0;
  const hz = 42 + Math.min(1, speed / 1100) * 95 + (gas ? 12 : 0);
  const now = actx.currentTime;
  eng.g.gain.setTargetAtTime(vol, now, 0.06);
  eng.o1.frequency.setTargetAtTime(hz, now, 0.05);
  eng.o2.frequency.setTargetAtTime(hz * 0.5, now, 0.05);
  eng.f.frequency.setTargetAtTime(500 + hz * 6, now, 0.05);
}

// ---------- effecten ----------
function burst(x, y, n, cols, spd = 300, life = 0.7, size = 5, grav = 900, z = 0) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = spd * (0.25 + Math.random() * 0.75);
    parts.push({ x, y, z, vx: Math.cos(a) * v, vy: Math.sin(a) * v - spd * 0.3, life: life * (0.5 + Math.random() * 0.5), max: life, c: cols[i % cols.length], s: size * (0.5 + Math.random()), g: grav });
  }
  if (parts.length > 700) parts.splice(0, parts.length - 700);
}
function pop(text, color = '#fff', size = 40) { pops.push({ text, color, size, life: 1.3 }); }

// ---------- spel bijwerken ----------
function update(dt) {
  for (let i = pops.length - 1; i >= 0; i--) { pops[i].life -= dt; if (pops[i].life <= 0) pops.splice(i, 1); }
  for (let i = parts.length - 1; i >= 0; i--) { const p = parts[i]; p.life -= dt; if (p.life <= 0) { parts.splice(i, 1); continue; } p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; }
  if (state === 'done') doneT += dt;
  if (state !== 'play') { engine(false, 0, false); return; }

  const inp = input();
  if (!started && (inp.gas || inp.lean || inp.brake)) started = true;
  if (started && !bike.dead && state === 'play') t += dt;

  const sub = 6, h = dt / sub;
  for (let k = 0; k < sub; k++) MOTO.step(lv, bike, bike.dead ? { gas: false, brake: false, lean: 0 } : inp, h, CHEAT);

  // stof bij het rijden
  if (!bike.dead && bike.ground && inp.gas && Math.random() < 0.7) {
    const p = MOTO.world(bike, -MOTO.AX, MOTO.HC);
    parts.push({ x: p.x, y: p.y, z: bike.z, vx: -bike.v * 0.12 * Math.cos(bike.a) + (Math.random() - 0.5) * 60, vy: -40 - Math.random() * 60, life: 0.55, max: 0.55, c: '#d8c9a8', s: 6 + Math.random() * 6, g: -30, dust: true });
  }
  if (bike.boosted > 0) { bike.boosted -= dt; const p = MOTO.world(bike, -MOTO.AX - 10, 0); burst(p.x, p.y, 2, ['#ffd23a', '#ff8a3d', '#fff'], 120, 0.35, 5, 0, bike.z); }
  if (bike.boostSnd !== bike.boosted > 0 && bike.boosted > 0.5) { Arcade.noise(0.4, 0.06, 4000, 800, 'bandpass'); }
  bike.boostSnd = bike.boosted > 0;

  // flips
  if (bike.landFlips) {
    const n = bike.landFlips; bike.landFlips = 0;
    flips += n; t = Math.max(0, t - n * 0.5);
    pop(n > 1 ? `${n}x SALTO!  −${(n * 0.5).toFixed(1).replace('.', ',')} sec` : 'SALTO!  −0,5 sec', '#ffffff', 46);
    Arcade.beep(660, 0.08, 'square', 0.05); Arcade.beep(990, 0.12, 'square', 0.05, 0, 0.08);
  }
  // landing-stof
  if (bike.justLanded && !bike.dead) {
    bike.justLanded = false;
    const p = MOTO.world(bike, 0, MOTO.HC);
    for (let i = 0; i < 14; i++) parts.push({ x: p.x + (Math.random() - 0.5) * 80, y: p.y, z: bike.z, vx: (Math.random() - 0.5) * 240, vy: -60 - Math.random() * 100, life: 0.6, max: 0.6, c: '#d8c9a8', s: 8 + Math.random() * 8, g: 60, dust: true });
    if (bike.landHard > 0.3) burst(p.x, p.y, 10, ['#ffd23a', '#ffffff'], 300, 0.35, 4, 600, bike.z);
    Arcade.noise(0.12, 0.05 + (bike.landHard || 0) * 0.05, 900, 200);
  }
  // checkpoints
  for (const q of lv.cps) if (!bike.dead && bike.ground && bike.s > q.s && (!cp || q.s > cp.s)) {
    cp = q; q.hit = true; pop('CHECKPOINT', '#ffffff', 34);
    Arcade.beep(523, 0.08, 'triangle', 0.06); Arcade.beep(784, 0.14, 'triangle', 0.06, 0, 0.08);
  }
  // tonnen ontploffen
  for (const o of lv.objs) if (o.boom) {
    o.boom = false;
    burst(o.x, o.y - o.r, 46, ['#ff4d55', '#ffb020', '#ffe08a', '#ffffff', '#555'], 620, 0.9, 7, 700, o.z || 0);
    Arcade.noise(0.6, 0.18, 2500, 80); Arcade.beep(70, 0.5, 'sawtooth', 0.08, -40);
    o.ring = 0.001;
  }
  for (const o of lv.objs) if (o.ring) { o.ring += dt * 2.2; if (o.ring > 1) o.ring = 0; }

  // crash

    if (crashT === 0) {

      const vx = bike.ground ? bike.v * Math.cos(bike.a) : bike.vx, vy = bike.ground ? bike.v * Math.sin(bike.a) : bike.vy;
      rider = { x: hp.x, y: hp.y + 25, z: bike.z, vx: vx * 0.6 + (Math.random() - 0.5) * 200, vy: Math.min(vy, 0) - 380, r: bike.a, w: (Math.random() < 0.5 ? -1 : 1) * 9 };
      if (bike.deadWhy !== 'barrel') Arcade.noise(0.35, 0.14, 1800, 120);
      burst(hp.x, hp.y, 14, ['#ffffff', '#bfc4cb', RED], 260, 0.6, 5, 900, bike.z);
      pop('CRASH!', RED, 64);
    }
    crashT += dt;
    if (rider) { rider.vy += 1400 * dt; rider.x += rider.vx * dt; rider.y += rider.vy * dt; rider.r += rider.w * dt; }
    if (crashT > 0.9) respawn();
  }
  // finish
  if (!bike.dead && bike.s >= lv.finishS && bike.ground) finishLevel();

  const sp = bike.ground ? Math.abs(bike.v) : Math.hypot(bike.vx, bike.vy);
  engine(!bike.dead, sp, inp.gas);

  // camera: iets vooruit kijken, uitzoomen bij snelheid en sprongen
  const vxx = bike.ground ? bike.v * Math.cos(bike.a) : bike.vx, vyy = bike.ground ? bike.v * Math.sin(bike.a) : bike.vy;
  const tx = bike.x + Math.max(-150, Math.min(280, vxx * 0.24)), ty = bike.y - 30 + Math.max(-60, Math.min(140, vyy * 0.12));

  zoom += (zt - zoom) * Math.min(1, dt * 1.5);
}

function finishLevel() {
  state = 'done'; doneT = 0;
  const prev = bests[li];
  const rec = prev == null || t < prev;
  const prevStars = starsFor(li, prev);
  if (rec) { bests[li] = Math.round(t * 100) / 100; saveBests(); }
  result = { t, stars: starsFor(li, t), rec, prev, flips, newStars: starsFor(li, bests[li]) - prevStars, world: null };
  // snelste tijd van iedereen (uit de ranglijst)

    ArcadeBoard.load(true).then((pl) => {

const fmt = (s) => { s = Math.max(0, s); const m = Math.floor(s / 60), r = s - m * 60; return `${m}:${r < 10 ? '0' : ''}${r.toFixed(2)}`; };

      pos.push(X + nx * u0, Y + ny * u0, p.z + z0, X + nx * u1, Y + ny * u1, p.z + z1);
      uv.push(0, v, 1, v);
      if (k > i0) { const b = (k - i0) * 2; idx.push(b - 2, b - 1, b + 1, b - 2, b + 1, b); }
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
    g.setIndex(idx); g.computeVertexNormals();
    const m = new THREE.Mesh(g, mat); m.receiveShadow = true; m.castShadow = true;
    levelGroup.add(m); return m;
  }
  // richting van de normaal in een punt (gemiddelde van de stukken ernaast)
  function normalAng(lv, k) {
    const A = lv.A, a0 = A[Math.max(0, k - 1)], a1 = A[Math.min(lv.n - 1, k)];
    let d = a1 - a0; while (d > Math.PI) d -= Math.PI * 2; while (d < -Math.PI) d += Math.PI * 2;
    return a0 + d / 2;
  }
  // stukken van de baan met dezelfde soort (bv. alle schansen)
  function runs(lv, test) {
    const out = []; let st = -1;
    for (let k = 0; k < lv.n - 1; k++) { const on = test(lv.P[k + 1], k); if (on && st < 0) st = k; if (!on && st >= 0) { out.push([st, k]); st = -1; } }
    if (st >= 0) out.push([st, lv.n - 1]);
    return out;
  }
  function tube(pts, r, mat) {
    if (pts.length < 2) return;
    const curve = new THREE.CatmullRomCurve3(pts);
    const g = new THREE.TubeGeometry(curve, Math.min(900, pts.length * 2), r, 6, false);
    const m = new THREE.Mesh(g, mat); m.castShadow = true; levelGroup.add(m);
  }
  function build(lv) {
    if (levelGroup) { scene.remove(levelGroup); levelGroup.traverse((o) => { if (o.geometry) o.geometry.dispose(); }); }
    levelGroup = new THREE.Group(); scene.add(levelGroup);
    barrelMeshes = []; flagMeshes = []; clouds = [];
    const Pp = lv.P;
    let maxY = -Infinity, minX = Infinity, maxX = -Infinity;
    for (const p of Pp) { maxY = Math.max(maxY, p.y); minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x); }
    const floorY = -(maxY + 160) * SC;          // grasveld onder de baan
    const TH = 0.26;                            // dikte van de baan

    // wegdek (alles), met onderkant en zijkanten
    const all = [[0, lv.n - 1]];
    for (const [a, b] of all) {
      strip(lv, a, b, -RW, RW, 0, M.road, 2);
      strip(lv, a, b, -RW, RW, -TH, M.deck, 2);
      strip(lv, a, b, RW, RW, 0, M.deck, 2, -TH);
      strip(lv, a, b, -RW, -RW, 0, M.deck, 2, -TH);
    }
    // loopings: glanzend staal aan de buitenkant
    for (const [a, b] of runs(lv, (p) => p.loop)) strip(lv, a, b + 1, -RW - 0.02, RW + 0.02, -TH - 0.01, M.loopDeck, 2);
    // schansen geel-zwart, turbostroken met pijlen
    for (const [a, b] of runs(lv, (p) => p.kick)) strip(lv, a, b + 1, -RW + 0.02, RW - 0.02, 0.012, M.kick, 1.3);
    for (const [a, b] of runs(lv, (p) => p.boost)) strip(lv, a, b + 1, -RW * 0.6, RW * 0.6, 0.02, M.chev, 0.9);
    // kuilbodem met spijkers
    for (let k = 0; k < lv.n - 1; k++) {
      const p = Pp[k + 1];
      if (!p.spike) continue;
      for (let z = -RW + 0.18; z <= RW - 0.1; z += 0.34) {
        const c = new THREE.Mesh(new THREE.ConeGeometry(0.1, 0.34, 8), M.spike);
        c.position.set(p.x * SC, -p.y * SC + 0.15, p.z + z); c.castShadow = true; levelGroup.add(c);
      }
    }
    // vangrails: paaltjes + twee buizen aan elke kant (niet langs de wanden van kuilen)
    const railRuns = runs(lv, (p, k) => !p.pit && !Pp[k].pit);
    for (const [a, b] of railRuns) {
      const loopy = Pp.slice(a, b + 1).some((p) => p.loop);
      for (const side of [-1, 1]) {
        let seg = [];
        const flush = () => { if (seg.length > 1) { const red = seg[seg.length - 1][2]; tube(seg.map((q) => q[0]), 0.035, red ? M.railRed : M.rail); tube(seg.map((q) => q[1]), 0.025, red ? M.railRed : M.rail); } seg = []; };
        for (let k = a; k <= b; k++) {
          const p = Pp[k], an = normalAng(lv, k), nx = Math.sin(an), ny = Math.cos(an);
          const X = p.x * SC, Y = -p.y * SC, Z = p.z + side * (RW + 0.04);
          const item = [new THREE.Vector3(X + nx * 0.42, Y + ny * 0.42, Z), new THREE.Vector3(X + nx * 0.22, Y + ny * 0.22, Z), p.loop];
          if (seg.length && seg[seg.length - 1][2] !== p.loop) { const lastP = seg[seg.length - 1]; flush(); seg.push([lastP[0], lastP[1], p.loop]); }
          seg.push(item);
          if (seg.length >= 300) { const lastP = seg[seg.length - 1]; flush(); seg.push(lastP); }
          if (k % 5 === 0) {
            const post = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.44, 0.05), M.post);
            post.position.set(X + nx * 0.2, Y + ny * 0.2, Z); post.rotation.z = -an; post.castShadow = true; levelGroup.add(post);
          }
        }
        flush();
      }
      void loopy;
    }
    // pilaren onder de baan
    for (let k = 4; k < lv.n - 1; k += 22) {
      const p = Pp[k];
      if (p.loop || p.pit || Pp[k + 1].pit) continue;
      const Y = -p.y * SC - TH, h = Y - floorY;
      if (h < 0.4) continue;
      for (const z of [-RW * 0.6, RW * 0.6]) {
        const m = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.12, h, 10), M.pillar);
        m.position.set(p.x * SC, floorY + h / 2, p.z + z); m.castShadow = true; m.receiveShadow = true; levelGroup.add(m);
      }
    }
    // loopings: stalen poten naar de grond aan beide kanten
    for (const [a, b] of runs(lv, (p) => p.loop)) {
      let lo = a, hi = a;
      for (let k = a; k <= b; k++) { if (Pp[k].x < Pp[lo].x) lo = k; if (Pp[k].x > Pp[hi].x) hi = k; }
      for (const k of [lo, hi]) {
        const p = Pp[k], Y = -p.y * SC, h = Y - floorY;
        for (const side of [-1, 1]) {
          const m = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.11, h, 10), M.railRed);
          m.position.set(p.x * SC, floorY + h / 2, p.z + side * (RW + 0.25)); m.castShadow = true; levelGroup.add(m);
        }
      }
    }

    // grasveld, heuvels, bergen, bomen, huisjes, wolken
    const span = (maxX - minX) * SC + 120, midX = (minX + maxX) / 2 * SC;
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(span + 300, 260), M.grass);
    ground.rotation.x = -Math.PI / 2; ground.position.set(midX, floorY, -100); ground.receiveShadow = true; levelGroup.add(ground);
    const x0 = minX * SC - 60;
    for (let k = 0; k < span / 9 + 8; k++) {
      const r = 9 + rnd(k) * 14, m = new THREE.Mesh(new THREE.SphereGeometry(r, 9, 6), k % 3 ? M.hill : M.hill2);
      m.scale.set(1.6, 0.45 + rnd(k + 3) * 0.25, 1); m.position.set(x0 + k * 9 + rnd(k + 7) * 6, floorY - 1, -38 - rnd(k + 11) * 30); m.receiveShadow = true; levelGroup.add(m);
    }
    for (let k = 0; k < span / 28 + 6; k++) {
      const h = 14 + rnd(k * 5) * 12, r = 30 + rnd(k * 7) * 16, z = -150 - rnd(k * 3) * 40, x = x0 + k * 28 + rnd(k) * 10;
      const m = new THREE.Mesh(new THREE.ConeGeometry(r, h, 7), M.mount); m.position.set(x, floorY + h / 2 - 2, z); levelGroup.add(m);
      const cap = new THREE.Mesh(new THREE.ConeGeometry(r * 0.32, h * 0.32, 7), M.snow); cap.position.set(x, floorY + h - 2 - h * 0.16 + 0.05, z); levelGroup.add(cap);
    }
    const nT = Math.min(900, Math.floor(span * 1.4));
    const trees = new THREE.InstancedMesh(new THREE.ConeGeometry(0.9, 2.6, 7), M.tree, nT);
    const trees2 = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(1.1, 0), M.tree2, nT);
    const trunks = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.12, 0.16, 1, 6), M.trunk, nT * 2);
    const mtx = new THREE.Matrix4(), q4 = new THREE.Quaternion(), sc3 = new THREE.Vector3(), p3 = new THREE.Vector3();
    let nt = 0, nt2 = 0, ntr = 0;
    for (let k = 0; k < nT * 2; k++) {
      const x = x0 + rnd(k * 1.7) * (span + 120), z = -5 - Math.pow(rnd(k * 2.3), 1.4) * 32, s = 0.7 + rnd(k * 3.1) * 0.8;
      if (k % 2 && nt < nT) { p3.set(x, floorY + 1 + 1.3 * s, z); sc3.set(s, s, s); mtx.compose(p3, q4, sc3); trees.setMatrixAt(nt++, mtx); }
      else if (nt2 < nT) { p3.set(x, floorY + 1 + 1.0 * s, z); sc3.set(s, s * 1.15, s); mtx.compose(p3, q4, sc3); trees2.setMatrixAt(nt2++, mtx); }
      p3.set(x, floorY + 0.5, z); sc3.set(s, 1, s); mtx.compose(p3, q4, sc3); trunks.setMatrixAt(ntr++, mtx);
    }
    trees.count = nt; trees2.count = nt2; trunks.count = ntr;
    for (const m of [trees, trees2, trunks]) { m.castShadow = true; m.receiveShadow = true; levelGroup.add(m); }
    // huisjes in de verte
    for (let k = 0; k < span / 16 + 4; k++) {
      const x = x0 + k * 16 + rnd(k * 9) * 8, z = -40 - rnd(k * 4) * 25, w = 2 + rnd(k) * 2, h = 1.6 + rnd(k * 2) * 1.6;
      const hs = new THREE.Mesh(new THREE.BoxGeometry(w, h, 2.2), M.wallH[k % 3]); hs.position.set(x, floorY + h / 2, z); hs.castShadow = true; levelGroup.add(hs);
      const rf = new THREE.Mesh(new THREE.ConeGeometry(w * 0.8, 1.2, 4), M.roof); rf.rotation.y = Math.PI / 4; rf.scale.set(1, 1, 0.8); rf.position.set(x, floorY + h + 0.6, z); levelGroup.add(rf);
    }
    // wolken
    for (let k = 0; k < span / 45 + 3; k++) {
      const g = new THREE.Group();
      for (let j = 0; j < 4; j++) { const s = new THREE.Mesh(new THREE.IcosahedronGeometry(3 + rnd(k * 7 + j) * 3, 1), M.cloud); s.scale.y = 0.6; s.position.set(j * 4 - 6, rnd(k + j) * 1.5, rnd(k * 3 + j) * 2); g.add(s); }
      g.position.set(x0 + k * 45 + rnd(k) * 20, 40 + rnd(k * 5) * 18, -150 - rnd(k * 2) * 60);
      g.userData.speed = 0.3 + rnd(k) * 0.4; levelGroup.add(g); clouds.push(g);
    }

    // tonnen
    for (const o of lv.objs) {
      if (o.type !== 'barrel') continue;
      const m = new THREE.Group();
      const c = cyl(o.r * SC, o.r * 2.2 * SC, M.barrel, 20); m.add(c);
      const lid = cyl(o.r * SC * 1.02, 0.02, M.dark, 20); lid.position.y = o.r * 1.1 * SC; m.add(lid);
      m.position.set(o.x * SC, -(o.y - o.r * 1.1) * SC, o.z || 0); levelGroup.add(m); m.userData.o = o; barrelMeshes.push(m);
    }
    // checkpoints: poortje met vlag
    for (const q of lv.cps) {
      const p = Pp[q.i];
      const g = new THREE.Group(); g.position.set(p.x * SC, -p.y * SC, p.z);
      for (const z of [-RW - 0.2, RW + 0.2]) { const pole = cyl(0.04, 2.2, M.dark, 8); pole.position.set(0, 1.1, z); g.add(pole); }
      const flag = new THREE.Mesh(new THREE.PlaneGeometry(0.01, RW * 2 + 0.4, 1, 10), M.flagRed);
      const banner = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.32, RW * 2 + 0.4), M.flagRed); banner.position.set(0, 2.05, 0); banner.castShadow = true; g.add(banner);
      g.userData = { q, flag: banner }; flagMeshes.push(g); levelGroup.add(g); void flag;
    }
    // finish-poort
    {
      const p = Pp[lv.finishI];
      const g = new THREE.Group(); g.position.set(p.x * SC, -p.y * SC, p.z);
      for (const z of [-RW - 0.2, RW + 0.2]) { const pp = box(0.16, 2.8, 0.16, M.dark, 0, 1.4, z); g.add(pp); }
      const beam = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.46, RW * 2 + 0.6), M.check); beam.position.set(0, 2.8, 0); beam.castShadow = true; g.add(beam);
      const line = new THREE.Mesh(new THREE.PlaneGeometry(0.34, RW * 2), M.check); line.rotation.x = -Math.PI / 2; line.position.set(0, 0.015, 0); g.add(line);
      levelGroup.add(g);
    }
    built = lv;
  }

  // ---------- elke frame ----------
  const look = new THREE.Vector3();
  let lastNow = 0;
  function render(o) {
    const { lv, bike, rider, parts, camX, camY, camZ, zoom, menu, inp, now } = o;
    if (lv && built !== lv) build(lv);
    const dt = lastNow ? Math.min(0.05, (now - lastNow) / 1000) : 0; lastNow = now;
    if (bike) {
      bikeG.visible = true;
      bikeG.position.set(bike.x * SC, -bike.y * SC, bike.z || 0);
      bikeG.rotation.z = -bike.a;
      bikeG.userData.wr.rotation.z = -bike.spin; bikeG.userData.wf.rotation.z = -bike.spin;
      const r = bikeG.userData.rider; r.visible = !bike.dead;
      const lean = inp ? inp.lean : 0;
      r.userData.torso.rotation.z += ((-lean * 0.45) - r.userData.torso.rotation.z) * 0.2;
    } else bikeG.visible = false;
    if (rider) { rag.visible = true; rag.position.set(rider.x * SC, -rider.y * SC, (rider.z || 0) + 0.1); rag.rotation.z = -rider.r; } else rag.visible = false;
    for (const m of barrelMeshes) m.visible = !m.userData.o.gone;
    for (const g of flagMeshes) { const { q, flag } = g.userData; flag.material = q.hit ? M.flagWhite : M.flagRed; }
    for (const c of clouds) c.position.x += c.userData.speed * dt;
    chevTex.offset.y = -(now / 1000) * 2.2;
    // deeltjes
    let n = 0;
    for (const p of parts) {
      if (n >= MAXP) break;
      pPos[n * 3] = p.x * SC; pPos[n * 3 + 1] = -p.y * SC; pPos[n * 3 + 2] = (p.z || 0) + (p.dust ? 0.3 : 0);
      tmpC.set(p.c); pCol[n * 3] = tmpC.r; pCol[n * 3 + 1] = tmpC.g; pCol[n * 3 + 2] = tmpC.b; n++;
    }
    pGeo.setDrawRange(0, n); pGeo.attributes.position.needsUpdate = true; pGeo.attributes.color.needsUpdate = true;
    // camera: van opzij en iets van boven
    const dist = (menu ? 12 : 9.2) / zoom;
    const tx = camX * SC, ty = -camY * SC, tz = camZ || 0;
    camera.position.set(tx - dist * 0.06, ty + dist * 0.2 + 0.6, tz + dist);
    look.set(tx + 0.3, ty + 0.3, tz);
    camera.lookAt(look);
    sun.position.set(tx - 6, ty + 14, tz + 10); sun.target.position.set(tx, ty, tz); sun.target.updateMatrixWorld();
    renderer.render(scene, camera);
  }
  return { render };
})();
