// ================= Gedeeld voor alle games: opslag, geluid, scherm, knoppen =================

    const lp = audio.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 5200;
    const comp = audio.createDynamicsCompressor(); comp.threshold.value = -12; comp.ratio.value = 4;
    lp.connect(comp); comp.connect(audio.destination);

    noiseBuf = audio.createBuffer(1, audio.sampleRate, audio.sampleRate);

    return sfxBus;
  }
  function beep(freq, dur, type = 'square', vol = 0.05, slide = 0, delay = 0) {
    const level = ArcadeCore.sfx();
    if (!level || !audio) return;
    vol *= level * 1.25 * (type === 'square' || type === 'sawtooth' ? 0.8 : 1.1);
    try {
      const t = audio.currentTime + delay;
      const o = audio.createOscillator(), o2 = audio.createOscillator(), g = audio.createGain();

      o.frequency.setValueAtTime(freq, t); o2.frequency.setValueAtTime(freq, t); o2.detune.value = 7;
      if (slide) { o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur); o2.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur); }

  // Effecten: deeltjes, schudden, zwevende tekst (zelfde stijl in elke game)
  function makeFx() {
    const parts = [], texts = [], rings = [];

    return {
      burst(x, y, n = 14, color = '#fff', speed = 180, life = 0.6, size = 3, grav = 200) {
        const max = ArcadeCore.settings.quality === 'laag' ? 0.5 : 1;
        for (let i = 0; i < n * max; i++) {
          const a = Math.random() * Math.PI * 2, v = speed * (0.3 + Math.random() * 0.7);
          parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: life * (0.6 + Math.random() * 0.4), max: life, color: Array.isArray(color) ? color[i % color.length] : color, size: size * (0.6 + Math.random() * 0.8), grav });
        }

      ring(x, y, color = '#fff', r = 40, life = 0.4) { rings.push({ x, y, color, r, life, max: life }); },
      text(x, y, t, color = '#fff', size = 18) { texts.push({ x, y, t, color, size, life: 0.9 }); },
      shake(a = 6, t = 0.25) { shakeA = Math.max(shakeA, a); shakeT = Math.max(shakeT, t); },

      update(dt) {

        for (let i = rings.length - 1; i >= 0; i--) { const q = rings[i]; q.life -= dt; if (q.life <= 0) rings.splice(i, 1); }

      get count() { return parts.length; },
    };
  }

  // Canvas met vaste spelgrootte (W×H) die netjes in het venster past
  function canvas(id, W, H) {
    const c = document.getElementById(id);
    const ctx = c.getContext('2d');
    const view = { W, H, scale: 1 };
    const fit = () => {
      const s = Math.min(innerWidth / W, innerHeight / H);
      const dpr = Math.min(ArcadeCore.dprCap(), devicePixelRatio || 1);
      c.style.width = Math.floor(W * s) + 'px';
      c.style.height = Math.floor(H * s) + 'px';
      c.width = Math.floor(W * s * dpr);
      c.height = Math.floor(H * s * dpr);
      view.scale = s * dpr;
      ctx.setTransform(view.scale, 0, 0, view.scale, 0, 0);
    };
    fit();
    addEventListener('resize', fit);
    ArcadeCore.onChange(fit);
    view.begin = () => ctx.setTransform(view.scale, 0, 0, view.scale, 0, 0);
    view.toGame = (e) => {
      const r = c.getBoundingClientRect();
      return { x: ((e.clientX - r.left) / r.width) * W, y: ((e.clientY - r.top) / r.height) * H };
    };
    return { c, ctx, view };
  }

  // Vegen (swipe) op touchscreens: geeft 'links', 'rechts', 'op' of 'neer'
  function onSwipe(el, fn, onTap) {
    let sx = 0, sy = 0, st = 0, active = false;
    el.addEventListener('pointerdown', (e) => { sx = e.clientX; sy = e.clientY; st = performance.now(); active = true; });
    el.addEventListener('pointerup', (e) => {
      if (!active) return;
      active = false;
      const dx = e.clientX - sx, dy = e.clientY - sy;
      if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) { if (onTap) onTap(e); return; }
      if (Math.abs(dx) > Math.abs(dy)) fn(dx > 0 ? 'rechts' : 'links');
      else fn(dy > 0 ? 'neer' : 'op');
    });
  }

  // Tekenhulpjes in dezelfde stijl
  function rr(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function text(ctx, t, x, y, size, color = '#fff', align = 'center', weight = '700', mono = false) {
    ctx.font = `${weight} ${size}px ${mono ? 'ui-monospace, Consolas, monospace' : 'system-ui, -apple-system, "Segoe UI", sans-serif'}`;
    ctx.fillStyle = color;
    ctx.textAlign = align;
    ctx.textBaseline = 'middle';
    ctx.fillText(t, x, y);
  }
  // Knoppen op het canvas (zelfde stijl overal). btn() elke frame opnieuw tekenen; hit() bij klikken.
  function ui(ctx) {
    let list = [], hover = null;
    return {
      clear() { list = []; },
      btn(label, x, y, w, h, fn, primary = false, active = false, size = 0) {
        const on = hover && hover.x >= x && hover.x <= x + w && hover.y >= y && hover.y <= y + h;
        const g = ctx.createLinearGradient(0, y, 0, y + h);
        if (primary || active) { g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#dfe2e6'); }
        else { g.addColorStop(0, on ? '#30343c' : '#262930'); g.addColorStop(1, on ? '#24272d' : '#1b1d22'); }
        ctx.fillStyle = g; rr(ctx, x, y, w, h, Math.min(10, h / 3)); ctx.fill();
        ctx.strokeStyle = primary || active ? 'rgba(255,255,255,0.6)' : on ? 'rgba(255,255,255,0.3)' : 'rgba(255,255,255,0.1)';
        ctx.lineWidth = 1; ctx.stroke();
        text(ctx, label, x + w / 2, y + h / 2 + 1, size || Math.min(16, h * 0.4), primary || active ? '#111214' : '#ffffff', 'center', '800');
        list.push({ x, y, w, h, fn });
      },
      hit(q) { for (let i = list.length - 1; i >= 0; i--) { const b = list[i]; if (q.x >= b.x && q.x <= b.x + b.w && q.y >= b.y && q.y <= b.y + b.h) { b.fn(); return true; } } return false; },
      hover(q) { hover = q; },
    };
  }
  const fmtTime = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
  // Standaard scherm voor start / pauze / game over
  function overlay(ctx, W, H, title, lines = [], hint = '') {
    const g = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.max(W, H) * 0.7);
    g.addColorStop(0, 'rgba(10, 11, 14, 0.55)'); g.addColorStop(1, 'rgba(4, 5, 7, 0.85)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    const pw = Math.min(W - 40, 400), ph = 130 + lines.length * 30 + (hint ? 40 : 0);
    const x = (W - pw) / 2, y = (H - ph) / 2;
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.6)'; ctx.shadowBlur = 40; ctx.shadowOffsetY = 12;
    const cg = ctx.createLinearGradient(0, y, 0, y + ph);
    cg.addColorStop(0, 'rgba(32, 35, 42, 0.97)'); cg.addColorStop(1, 'rgba(18, 20, 24, 0.97)');
    ctx.fillStyle = cg;
    rr(ctx, x, y, pw, ph, 18);
    ctx.fill();
    ctx.restore();
    ctx.strokeStyle = 'rgba(255,255,255,0.14)';
    ctx.lineWidth = 1.5;
    rr(ctx, x, y, pw, ph, 18);
    ctx.stroke();
    ctx.fillStyle = '#e8282f';
    rr(ctx, W / 2 - 24, y + 78, 48, 3, 1.5); ctx.fill();
    text(ctx, title, W / 2, y + 48, 32, '#fff', 'center', '900');
    lines.forEach((l, i) => {
      const s = typeof l === 'string' ? { t: l } : l;
      text(ctx, s.t, W / 2, y + 108 + i * 30, s.size || 18, s.color || '#c9ced6', 'center', s.weight || '600', s.mono);
    });
    if (hint) { ctx.globalAlpha = 0.55 + 0.45 * Math.abs(Math.sin(performance.now() / 450)); text(ctx, hint, W / 2, y + ph - 30, 15, '#ffffff', 'center', '700'); ctx.globalAlpha = 1; }
  }
  // Achtergrond met diepte: zacht licht in het midden + vignet
  function backdrop(ctx, W, H, top = '#15171c', bottom = '#0a0b0e') {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, top); g.addColorStop(1, bottom);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    const v = ctx.createRadialGradient(W / 2, H * 0.45, Math.min(W, H) * 0.2, W / 2, H / 2, Math.max(W, H) * 0.75);
    v.addColorStop(0, 'rgba(255,255,255,0.035)'); v.addColorStop(1, 'rgba(0,0,0,0.35)');
    ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  }

  return {
    load, save, beep, noise, makeFx, backdrop, ui, fmtTime,
    get muted() { return !ArcadeCore.sfx(); },
    best: (game) => load('best_' + game, 0),
    // Slaat een nieuwe topscore op; geeft true terug als het een record is
    record: (game, score, lowerIsBetter = false) => {
      const b = load('best_' + game, 0);
      if (!b || (lowerIsBetter ? score < b : score > b)) { save('best_' + game, score); return true; }
      return false;
    },
    canvas, onSwipe, rr, text, overlay,
    touch: matchMedia('(hover: none) and (pointer: coarse)').matches,
  };
})();

const STARSHOP = [
  { id: 'start', naam: 'Startkapitaal', emoji: '💰', base: 1, max: 10, desc: (l) => `Begin met €${fmt(startMoney(l))}` },

function startMoney(l) { return l ? 500 * Math.pow(8, l - 1) : 0; }

const SUFFIX = ['', 'K', 'mln', 'mld', 'bln', 'bld', 'trln', 'trld', 'qa', 'qi', 'sx', 'sp', 'oc', 'no', 'dc'];
function fmt(n) {
  if (!isFinite(n)) return '∞';
  if (n < 0) return '-' + fmt(-n);
  if (n < 1000) return n < 10 && n % 1 ? n.toFixed(1).replace('.', ',') : String(Math.floor(n));
  let k = Math.floor(Math.log10(n) / 3);
  if (k >= SUFFIX.length) return n.toExponential(2);
  const v = n / Math.pow(1000, k);
  return (v < 10 ? v.toFixed(2) : v < 100 ? v.toFixed(1) : Math.floor(v).toString()).replace('.', ',') + (k === 1 ? 'K' : ' ' + SUFFIX[k]);
}
function fmtDur(s) {
  s = Math.floor(s);
  if (s < 60) return s + ' sec';
  if (s < 3600) return Math.floor(s / 60) + ' min';
  return Math.floor(s / 3600) + ' u ' + Math.floor((s % 3600) / 60) + ' min';
}
// ================= PC TYCOON · spelregels (werkt ook zonder scherm, voor tests) =================
function freshState(keep) {
  const k = keep || {};
  const S = {
    v: 1, money: 0, runEarned: 0, lifeEarned: k.lifeEarned || 0, xp: 0, level: 1,
    stations: [{ t: 0, b: false }], loc: 0, up: {}, staff: {}, res: {},
    stars: k.stars || 0, starsTotal: k.starsTotal || 0, starUp: k.starUp || {}, ach: k.ach || {},
    stats: k.stats || { served: 0, clicks: 0, golden: 0, prestiges: 0, play: 0, lost: 0, repairs: 0, events: 0, tours: 0, bestRate: 0 },
    clean: 100, savedAt: Date.now(), rate: 0, qty: 1, seen: {},
  };
  S.money = startMoney(S.starUp.start || 0);
  for (let i = 0; i < (S.starUp.plek || 0) * 2; i++) S.stations.push({ t: 1, b: false });
  if ((S.starUp.plek || 0) * 2 + 1 > LOCS[0].plekken) S.loc = Math.min(LOCS.length - 1, LOCS.findIndex((l) => l.plekken >= S.stations.length));
  return S;
}
let S = freshState();
// Runtime (wordt niet opgeslagen)
let R = newRuntime();
function newRuntime() { return { seats: [], queue: [], arriveAcc: 0, techAcc: 0, autoAcc: 0, eventT: 70, tourT: 90, goldT: 50, gold: null, ev: null, boostT: 0, boostX: 1, log: [], earnWin: 0, earnT: 0, popups: [], sounds: [] }; }

// ----- Afgeleide waarden -----
let M = null;
function lvlOf(id) { return S.up[id] || 0; }
function staffN(id) { return S.staff[id] || 0; }
function calcMults() {
  // binnen één soort tellen bonussen bij elkaar op (anders groeit alles veel te hard)
  const add = { price: 0, speed: 0, arrive: 0, click: 0, income: 0, xp: 0 };
  const m = { extra: 0, queue: 3, rep: 0, brk: 1, clean: 1, tour: 0, offline: 0.25, gold: 1, power: 0, events: 0 };
  const apply = (stat, v, l = 1) => {
    if (stat in add) add[stat] += v * l;
    else if (stat === 'brk' || stat === 'clean') m[stat] *= Math.pow(1 - v, l);
    else m[stat] += v * l;
  };
  for (const u of UPGRADES) { const l = lvlOf(u.id); if (l) apply(u.stat, u.v, l); }
  for (const r of RESEARCH) if (S.res[r.id]) apply(r.stat, r.v);
  add.income += 0.04 * staffN('kassa') + 0.03 * staffN('coach') + 0.02 * staffN('streamer') + 0.05 * staffN('wetenschap');
  m.extra += 0.05 * staffN('barista');
  add.arrive += 0.04 * staffN('market') + 0.05 * staffN('streamer');
  add.speed += 0.03 * staffN('ingenieur');
  m.rep += 3 * staffN('guard');
  m.offline += 0.05 * staffN('manager') + 0.2 * (S.starUp.off || 0);
  add.xp += 0.3 * (S.starUp.xp || 0);
  m.gold *= 1 + 0.2 * (S.starUp.geluk || 0);
  for (const k in add) m[k] = 1 + add[k];
  // sterren en prestaties werken op alles
  m.income *= (1 + 0.1 * S.starsTotal) * (1 + 0.25 * (S.starUp.boost || 0)) * (1 + 0.02 * Object.keys(S.ach).length);
  m.discount = Math.pow(0.95, S.starUp.korting || 0);
  M = m;
  return m;
}
function rep() { return Math.max(0, Math.min(100, 40 + M.rep + (S.clean - 50) * 0.4)); }
function maxQueue() { return Math.floor(M.queue); }
function nStations() { return S.stations.length; }
function stationCost(n = nStations()) { return Math.floor(15 * Math.pow(1.25, n - 1) * M.discount); }
function upCost(u, l = lvlOf(u.id)) { return Math.floor(u.cost * Math.pow(u.g, l) * M.discount); }
function staffCost(s, n = staffN(s.id)) { return Math.floor(s.cost * Math.pow(s.g, n) * M.discount); }
function tierCost(t) { return Math.floor(TIERS[t].cost * M.discount); }
function locCost(i) { return Math.floor(LOCS[i].cost * M.discount); }
function resCost(r) { return Math.floor(r.cost * M.discount); }
function xpNeed(l = S.level) { return Math.floor(8 * Math.pow(l, 1.5) * Math.pow(1.085, l)); }
function unlockedCustomers() { return KLANTEN.filter((k) => S.level >= k.lvl); }
function evMult(kind) { return R.ev && R.ev.eff[kind] != null ? R.ev.eff[kind] : 1; }
function sessionPay(t, k) { return TIERS[t].prijs * k.mult * M.price * (1 + M.extra) * M.income * evMult('price') * R.boostX; }
function baseRate() { return R.earnT > 5 ? R.earnWin / R.earnT / R.boostX / evMult('price') : 0; }
function sessionDur(t) { return TIERS[t].tijd / (M.speed * evMult('speed')); }
function arriveRate() { return (0.45 + 0.2 * nStations()) * M.arrive * (0.4 + rep() / 100 * 1.2) * evMult('arrive'); }
// geschat inkomen per seconde (voor offline, toernooien)
function incomeRate() { return S.rate || baseRate(); }

// ----- Geld -----
function earn(x, fromSession) {
  if (!(x > 0)) return;
  S.money += x; S.runEarned += x; S.lifeEarned += x;
  if (fromSession) R.earnWin += x;   // alleen gewone verdiensten tellen voor 'per seconde' (anders blijft het zichzelf opblazen)
}
function addXp(x) {
  S.xp += x;
  while (S.xp >= xpNeed()) { S.xp -= xpNeed(); S.level++; onLevelUp(); }
}
function pay(cost) { if (S.money < cost) return false; S.money -= cost; return true; }
let onLevelUp = () => {};
let onNotify = () => {};

// ----- Kopen -----
function maxBuy(costFn, cur, limit) {
  let n = 0, total = 0;
  while (n < limit) { const c = costFn(cur + n); if (total + c > S.money) break; total += c; n++; }
  return { n, total };
}
function qtyCount(costFn, cur, limit) {
  const want = S.qty === 'max' ? limit : Math.min(S.qty, limit);
  if (S.qty === 'max') return maxBuy(costFn, cur, want);
  let total = 0; for (let i = 0; i < want; i++) total += costFn(cur + i);
  return { n: want, total };
}
function buyStations() {
  const limit = LOCS[S.loc].plekken - nStations();
  const q = qtyCount((n) => stationCost(n + 1), nStations(), limit);
  if (!q.n || !pay(q.total)) return false;
  for (let i = 0; i < q.n; i++) S.stations.push({ t: 0, b: false });
  calcMults(); return true;
}
function upgradeTier(t, all) {
  // zet pc's van niveau t-1 naar t (één of zoveel als je kunt betalen)
  if (S.level < TIERS[t].lvl) return false;
  let done = 0;
  const list = S.stations.filter((s) => s.t === t - 1);
  for (const s of list) { if (!pay(tierCost(t))) break; s.t = t; done++; if (!all) break; }
  return done > 0;
}
function upgradeAllCheapest() { // alles zo veel mogelijk een stapje hoger, goedkoopste eerst
  let any = false;
  for (;;) {
    let best = null;
    for (const s of S.stations) { const nt = s.t + 1; if (nt < TIERS.length && S.level >= TIERS[nt].lvl && (!best || TIERS[nt].cost < TIERS[best.t + 1].cost)) best = s; }
    if (!best || !pay(tierCost(best.t + 1))) break;
    best.t++; any = true;
  }
  return any;
}
function buyUpgrade(u) {
  if (S.level < u.lvl) return false;
  const q = qtyCount((l) => upCost(u, l), lvlOf(u.id), u.max - lvlOf(u.id));
  if (!q.n || !pay(q.total)) return false;
  S.up[u.id] = lvlOf(u.id) + q.n; calcMults(); return true;
}
function hire(s) {
  if (S.level < s.lvl) return false;
  const q = qtyCount((n) => staffCost(s, n), staffN(s.id), s.max - staffN(s.id));
  if (!q.n || !pay(q.total)) return false;
  S.staff[s.id] = staffN(s.id) + q.n; calcMults(); return true;
}
function buyResearch(r) {
  if (S.res[r.id] || S.level < r.lvl || !pay(resCost(r))) return false;
  S.res[r.id] = 1; calcMults(); return true;
}
function moveLoc(i) {
  if (i !== S.loc + 1 || S.level < LOCS[i].lvl || !pay(locCost(i))) return false;
  S.loc = i; calcMults();
  R.seats = []; R.queue.forEach((c) => (c.state = 'queue'));
  return true;
}
function clickStation(i) {
  const st = S.stations[i];
  if (!st) return null;
  if (st.b) { st.b = false; S.stats.repairs++; return { kind: 'repair' }; }
  const seat = R.seats[i];
  if (!seat) return null;
  S.stats.clicks++;
  const tip = sessionPay(st.t, seat.k) * 0.25 * M.click / R.boostX;
  seat.t += 0.6;
  earn(tip);
  return { kind: 'tip', amount: tip };
}
function cleanUp() { S.clean = Math.min(100, S.clean + 12); }

// ----- Prestige -----
const PRESTIGE_LVL = 35;
function starsFor(earned = S.runEarned) { return S.level < PRESTIGE_LVL ? 0 : Math.max(1, Math.floor(3 * Math.pow(earned / 1e12, 0.35))); }
function prestige() {
  const gain = starsFor();
  if (!gain) return false;
  const keep = { lifeEarned: S.lifeEarned, stars: S.stars + gain, starsTotal: S.starsTotal + gain, starUp: S.starUp, ach: S.ach, stats: S.stats };
  keep.stats.prestiges++;
  S = freshState(keep); R = newRuntime(); calcMults();
  return gain;
}
function starCost(it) { const l = S.starUp[it.id] || 0; return Math.ceil(it.base * Math.pow(l + 1, 1.5)); }
function buyStar(it) {
  const l = S.starUp[it.id] || 0, c = starCost(it);
  if (l >= it.max || S.stars < c) return false;
  S.stars -= c; S.starUp[it.id] = l + 1; calcMults(); return true;
}

// ----- Gebeurtenissen -----
const EVENTS = [
  { id: 'lan', naam: 'LAN-party!', emoji: '🎉', dur: 40, eff: { arrive: 2.5 }, good: true, desc: 'Klanten ×2,5' },
  { id: 'release', naam: 'Nieuwe game uit!', emoji: '🆕', dur: 60, eff: { arrive: 1.6, price: 1.3 }, good: true, desc: 'Meer klanten en ze betalen meer' },
  { id: 'influencer', naam: 'Een influencer is op bezoek', emoji: '🤳', dur: 25, eff: { price: 3 }, good: true, desc: 'Opbrengst ×3' },
  { id: 'storing', naam: 'Stroomstoring!', emoji: '🔌', dur: 12, eff: { speed: 0.05 }, good: false, desc: 'Bijna alles ligt stil' },
  { id: 'hitte', naam: 'Hittegolf', emoji: '🥵', dur: 45, eff: { speed: 0.75 }, good: false, desc: 'Alles gaat trager (airco helpt)' },
  { id: 'inspectie', naam: 'Hygiëne-inspectie', emoji: '🕵️', dur: 0, eff: {}, good: null, desc: '' },
  { id: 'virus', naam: 'Computervirus!', emoji: '🦠', dur: 0, eff: {}, good: false, desc: "Een paar pc's gaan kapot" },
];
function startEvent() {
  const luck = (S.starUp.geluk || 0) * 0.04 + (M.events ? 0.15 : 0);
  let pool = EVENTS.filter((e) => S.level >= 3 && (e.id !== 'virus' || S.level >= 6) && (e.id !== 'inspectie' || S.level >= 5));
  if (!pool.length) return;
  let e;
  for (let tries = 0; tries < 4; tries++) { e = pool[Math.floor(Math.random() * pool.length)]; if (e.good !== false || Math.random() > 0.35 + luck) break; }
  S.stats.events++;
  if (e.id === 'storing' && M.power) return onNotify('🔋 Stroomstoring, maar je noodstroom houdt alles draaiend!', 'good');
  if (e.id === 'hitte' && lvlOf('airco') >= 3) return onNotify('🥵 Hittegolf, maar je airco houdt het koel!', 'good');
  if (e.id === 'inspectie') {
    if (S.clean >= 60) { const b = Math.max(50, incomeRate() * 30); earn(b); onNotify(`🕵️ Inspectie: alles schoon! Bonus €${fmt(b)}`, 'good'); }
    else { const f = Math.min(S.money * 0.1, incomeRate() * 30); S.money -= f; onNotify(`🕵️ Inspectie: te vies! Boete €${fmt(f)}. Maak schoon!`, 'bad'); }
    return;
  }
  if (e.id === 'virus') {
    if (Math.random() < staffN('guard') * 0.12) return onNotify('💂 Je beveiliging hield een computervirus tegen!', 'good');
    const n = Math.min(nStations(), 1 + Math.floor(nStations() / 8));
    for (let i = 0; i < n; i++) S.stations[Math.floor(Math.random() * nStations())].b = true;
    return onNotify(`🦠 Computervirus! ${n} pc's kapot. Klik ze om te repareren.`, 'bad');
  }
  R.ev = { ...e, left: e.dur };
  onNotify(`${e.emoji} ${e.naam} — ${e.desc}`, e.good ? 'good' : 'bad');
}

// ----- De simulatie (één stap) -----
let onPay = () => {}, onArrive = () => {}, onLeave = () => {};
function tick(dt) {
  if (!M) calcMults();
  S.stats.play += dt;
  R.earnT += dt;
  if (R.earnT > 20) { const r = baseRate(); S.rate = S.rate ? S.rate * 0.7 + r * 0.3 : r; S.stats.bestRate = Math.max(S.stats.bestRate, S.rate); R.earnWin = 0; R.earnT = 0; }
  if (R.ev) { R.ev.left -= dt; if (R.ev.left <= 0) R.ev = null; }
  if (R.boostT > 0) { R.boostT -= dt; if (R.boostT <= 0) R.boostX = 1; }
  // klanten komen binnen
  R.arriveAcc += arriveRate() * dt;
  const types = unlockedCustomers();
  while (R.arriveAcc >= 1) {
    R.arriveAcc -= 1;
    if (R.queue.length >= maxQueue()) { S.stats.lost++; continue; }
    // nieuwere klantsoorten komen iets vaker (die betalen meer)
    let tot = 0; const w = types.map((k, i) => (tot += 1 + i * 0.6));
    const r = Math.random() * tot, k = types[w.findIndex((x) => x >= r)];
    const c = { k, id: Math.random() };
    R.queue.push(c); onArrive(c);
  }
  // vrije plekken vullen (beste pc eerst)
  if (R.queue.length) {
    const free = [];
    for (let i = 0; i < nStations(); i++) if (!R.seats[i] && !S.stations[i].b) free.push(i);
    free.sort((a, b) => S.stations[b].t - S.stations[a].t);
    while (R.queue.length && free.length) {
      const i = free.shift(), c = R.queue.shift();
      R.seats[i] = { k: c.k, c, t: 0, dur: sessionDur(S.stations[i].t) };
      c.seat = i;
    }
  }
  // sessies
  let busy = 0;
  for (let i = 0; i < nStations(); i++) {
    const s = R.seats[i];
    if (!s) continue;
    busy++;
    s.t += dt;
    if (s.t >= s.dur) {
      const st = S.stations[i];
      const amount = sessionPay(st.t, s.k);
      earn(amount, true);
      S.stats.served++;
      addXp((1 + st.t * 0.6) * M.xp);
      R.seats[i] = null;
      if (Math.random() < 0.016 * (1 + st.t * 0.08) * M.brk * (1 - 0.03 * Math.min(10, staffN('tech')))) st.b = true;
      onPay(i, amount, s.c);
      onLeave(s.c);
    }
  }
  // hygiëne
  S.clean = Math.max(0, Math.min(100, S.clean - 0.035 * Math.sqrt(busy) * M.clean * dt + 0.07 * staffN('schoon') * dt));
  // technici repareren
  if (staffN('tech')) {
    R.techAcc += dt * staffN('tech') / 4;
    while (R.techAcc >= 1) { R.techAcc -= 1; const b = S.stations.find((s) => s.b); if (!b) { R.techAcc = 0; break; } b.b = false; S.stats.repairs++; }
  }
  // klikrobot (sterrenwinkel)
  if (S.starUp.auto) {
    R.autoAcc += dt * S.starUp.auto;
    while (R.autoAcc >= 1) { R.autoAcc -= 1; const busyIdx = R.seats.map((x, i) => (x ? i : -1)).filter((i) => i >= 0); if (busyIdx.length) clickStation(busyIdx[Math.floor(Math.random() * busyIdx.length)]); }
  }
  // toernooien
  if (M.tour > 0) { R.tourT -= dt; if (R.tourT <= 0) { R.tourT = 90; const p = Math.max(100, incomeRate() * 8 * M.tour); earn(p); S.stats.tours++; onNotify(`🏆 Toernooi gewonnen! Prijzengeld €${fmt(p)}`, 'good'); } }
  // gebeurtenissen
  R.eventT -= dt;
  if (R.eventT <= 0) { R.eventT = (80 + Math.random() * 90) * (M.events ? 0.7 : 1); if (!R.ev) startEvent(); }
  // gouden klant
  R.goldT -= dt * M.gold;
  if (R.goldT <= 0) { R.goldT = 70 + Math.random() * 90; if (S.level >= 2) R.gold = { t: 0, life: 13, x: 0 }; }
  if (R.gold) { R.gold.t += dt; if (R.gold.t > R.gold.life) R.gold = null; }
}
function catchGold() {
  if (!R.gold) return null;
  R.gold = null; S.stats.golden++;
  if (Math.random() < 0.5) { const b = Math.max(100, incomeRate() * 90); earn(b); return `🌟 Gouden klant! +€${fmt(b)}`; }
  R.boostX = 7; R.boostT = 30; return '🌟 Gouden klant! Alles ×7 voor 30 seconden';
}

// ----- Offline verdienen -----
function offlineEarnings(seconds) {
  const s = Math.min(seconds, 8 * 3600 + 3600 * staffN('manager'));
  const earned = (S.rate || 0) * s * Math.min(1.5, M.offline);
  return { s, earned };
}

function drawWalkers(dt) {

  const gp = goldPos();
  if (gp && Math.hypot(q.x - gp.x, q.y - gp.y) < 30) { const m = catchGold(); burst(gp.x, gp.y, 30, ['#ffd23f', '#fff']); flashT = 0.3; toast(m, 'gold'); Sound.gold(); return; }
  for (let i = 0; i < L.cap; i++) {

    if (q.x < p.x || q.x > p.x + CELL_W || q.y < p.y || q.y > p.y + CELL_H) continue;

  const nxt = all.filter((a) => a[0] > S.level).sort((a, b) => a[0] - b[0]);
  if (!nxt.length) return '';
  const l = nxt[0][0], names = nxt.filter((a) => a[0] === l).map((a) => a[1]);
  return `· level ${l}: ${names.slice(0, 2).join(', ')}${names.length > 2 ? ` +${names.length - 2}` : ''}`;

let last = performance.now(), uiT = 0, saveT = 0, achT = 0;
