    td:       { bpm: 108, root: 55, prog: [[0, 3, 7], [-4, 0, 3], [-2, 2, 5], [3, 7, 10]], kick: 'x.......x.x.....', snare: '....x.......x...', hat: 'x.x.x.x.x.x.x.x.', bass: 'x...x.o.x...x.o.', arp: true, lead: 'triangle', seed: 91, density: 0.4, pad: 'triangle' },

    sudoku:   { bpm: 72,  root: 60, prog: [[0, 4, 7], [5, 9, 12], [-3, 0, 4], [-5, -1, 2]], kick: 'x...............', snare: '................', hat: '................', bass: 'x.......x.......', arp: true,  lead: 'sine', seed: 91, density: 0.2, pad: 'triangle' },

  };
  // Melodie maken uit de toonladder (altijd hetzelfde per nummer)
  function makeMelody(song) {
    const R = rng(song.seed);
    const motif = [];
    for (let i = 0; i < 32; i++) {
      if (R() > song.density || i % 2 === 1 && R() < 0.5) { motif.push(null); continue; }
      const deg = Math.floor(R() * 7) + (R() < 0.3 ? 7 : 0);
      const len = R() < 0.25 ? 3 : R() < 0.5 ? 2 : 1;
      motif.push({ deg, len });
    }
    const mel = [];
    for (let bar = 0; bar < 8; bar++) {
      for (let i = 0; i < 16; i++) {
        let m = motif[(bar % 2) * 16 + i];
        if (m && bar >= 4 && bar % 2 === 1 && i > 8) m = { deg: m.deg + 2, len: m.len }; // kleine variatie
        mel.push(m);
      }
    }
    return mel;
  }
  for (const k in SONGS) SONGS[k].mel = makeMelody(SONGS[k]);

  let ac = null, master = null, delayIn = null, reverbIn = null, duck = null, noise = null, timer = null;
  let song = null, wanted = null, step = 0, nextT = 0;
  const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);
  // Galm: zelf gemaakte impulsrespons (geen bestanden nodig)
  function makeReverb(sec = 2.2) {
    const len = Math.floor(ac.sampleRate * sec), buf = ac.createBuffer(2, len, ac.sampleRate);
    for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3.2); }
    const cv = ac.createConvolver(); cv.buffer = buf; return cv;
  }
  function initAudio() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    try {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      master = ac.createGain();
      master.gain.value = musicVol() * 0.5;
      const comp = ac.createDynamicsCompressor();
      comp.threshold.value = -16; comp.ratio.value = 3.5; comp.attack.value = 0.004; comp.release.value = 0.2;
      const warm = ac.createBiquadFilter(); warm.type = 'highshelf'; warm.frequency.value = 6000; warm.gain.value = -4;
      master.connect(warm); warm.connect(comp); comp.connect(ac.destination);
      // 'duck' zakt even weg op elke kick (pompend effect zoals in echte dance-muziek)
      duck = ac.createGain(); duck.connect(master);
      // Echo voor melodie
      delayIn = ac.createGain(); delayIn.gain.value = 0.2;
      const d = ac.createDelay(); d.delayTime.value = 0.3;
      const fb = ac.createGain(); fb.gain.value = 0.32;
      const dlp = ac.createBiquadFilter(); dlp.type = 'lowpass'; dlp.frequency.value = 2400;
      delayIn.connect(d); d.connect(dlp); dlp.connect(fb); fb.connect(d); dlp.connect(duck);
      reverbIn = ac.createGain(); reverbIn.gain.value = 0.28;
      const rv = makeReverb(); reverbIn.connect(rv); rv.connect(duck);
      noise = ac.createBuffer(1, Math.floor(ac.sampleRate * 0.5), ac.sampleRate);
      const data = noise.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
    } catch (e) { ac = null; }
  }
  function env(g, t, a, peak, dur) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  }
  function out(node, pan = 0) {
    if (pan && ac.createStereoPanner) { const p = ac.createStereoPanner(); p.pan.value = pan; node.connect(p); return p; }
    return node;
  }
  function kick(t) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(160, t);
    o.frequency.exponentialRampToValueAtTime(45, t + 0.12);
    env(g, t, 0.002, 0.95, 0.28);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.3);
    noiseHit(t, 3000, 0.12, 0.012, 0, master);            // tikje voor de aanslag
    duck.gain.cancelScheduledValues(t);
    duck.gain.setValueAtTime(0.45, t); duck.gain.linearRampToValueAtTime(1, t + 0.22);
  }
  function noiseHit(t, hp, peak, dur, pan = 0, dest = null, type = 'highpass', q = 0.7) {

    s.buffer = noise;
    f.type = type; f.frequency.value = hp; f.Q.value = q;
    env(g, t, 0.002, peak, dur);
    s.connect(f); f.connect(g); out(g, pan).connect(dest || master);
    s.start(t, Math.random() * 0.3); s.stop(t + dur + 0.02);
    return g;

    const o = ac.createOscillator(), g2 = ac.createGain();
    o.type = 'triangle'; o.frequency.setValueAtTime(220, t); o.frequency.exponentialRampToValueAtTime(140, t + 0.08);

    f.connect(g);

// ================= Gedeeld voor alle games: opslag, geluid, scherm, knoppen =================

      o.frequency.setValueAtTime(freq, t); o2.frequency.setValueAtTime(freq, t); o2.detune.value = 7;
      if (slide) { o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur); o2.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur); }
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + 0.005);

  // Effecten: deeltjes, schudden, zwevende tekst (zelfde stijl in elke game)
  function makeFx() {

    return {
      burst(x, y, n = 14, color = '#fff', speed = 180, life = 0.6, size = 3, grav = 200) {

        for (let i = 0; i < n * max; i++) {
          const a = Math.random() * Math.PI * 2, v = speed * (0.3 + Math.random() * 0.7);
          parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: life * (0.6 + Math.random() * 0.4), max: life, color: Array.isArray(color) ? color[i % color.length] : color, size: size * (0.6 + Math.random() * 0.8), grav });
        }

      text(x, y, t, color = '#fff', size = 18) { texts.push({ x, y, t, color, size, life: 0.9 }); },

  // Canvas met vaste spelgrootte (W×H) die netjes in het venster past
  function canvas(id, W, H) {
    const c = document.getElementById(id);

    const view = { W, H, scale: 1 };
    const fit = () => {
      const s = Math.min(innerWidth / W, innerHeight / H);
      const dpr = Math.min(ArcadeCore.dprCap(), devicePixelRatio || 1);
      c.style.width = Math.floor(W * s) + 'px';
      c.style.height = Math.floor(H * s) + 'px';
      c.width = Math.floor(W * s * dpr);
      c.height = Math.floor(H * s * dpr);
      view.scale = s * dpr;
      ctx.setTransform(view.scale, 0, 0, view.scale, 0, 0);
    };
    fit();
    addEventListener('resize', fit);
    ArcadeCore.onChange(fit);
    view.begin = () => ctx.setTransform(view.scale, 0, 0, view.scale, 0, 0);
    view.toGame = (e) => {
      const r = c.getBoundingClientRect();
      return { x: ((e.clientX - r.left) / r.width) * W, y: ((e.clientY - r.top) / r.height) * H };
    };
    return { c, ctx, view };
  }

  // Vegen (swipe) op touchscreens: geeft 'links', 'rechts', 'op' of 'neer'

    ctx.arcTo(x + w, y + h, x, y + h, r);

  // Knoppen op het canvas (zelfde stijl overal). btn() elke frame opnieuw tekenen; hit() bij klikken.

  const h = (i) => Math.hypot((i % nx) - tx, Math.floor(i / nx) - tz);
  const goal = tz * nx + tx;
  let found = false, guard = 0;
  while (open.length && guard++ < 6000) {
    let bi = 0, bf = Infinity;
    for (let k = 0; k < open.length; k++) { const f = g[open[k]] + h(open[k]); if (f < bf) { bf = f; bi = k; } }
    const cur = open.splice(bi, 1)[0];
    if (cur === goal) { found = true; break; }
    closed[cur] = 1;
    const cx = cur % nx, cz = Math.floor(cur / nx);
    for (let dz = -1; dz <= 1; dz++) for (let dx = -1; dx <= 1; dx++) {
      if (!dx && !dz) continue;
      const x = cx + dx, z = cz + dz;
      if (!freeCell(x, z) || (dx && dz && (!freeCell(cx + dx, cz) || !freeCell(cx, cz + dz)))) continue;
      const j = z * nx + x;
      if (closed[j]) continue;
      const ng = g[cur] + (dx && dz ? 1.414 : 1);
      if (ng < g[j]) { g[j] = ng; came[j] = cur; if (!open.includes(j)) open.push(j); }
    }
  }
  if (!found) return [{ x: bx, z: bz }];
  const pts = [];
  for (let i = goal; i !== -1 && i !== sz * nx + sx; i = came[i]) pts.unshift({ x: NAV.x0 + ((i % nx) + 0.5) * NAV.cs, z: NAV.z0 + (Math.floor(i / nx) + 0.5) * NAV.cs });
  pts.push({ x: bx, z: bz });
  // overbodige punten weghalen (rechte lijnen)
  const out = []; let from = { x: ax, z: az };
  for (let i = 0; i < pts.length; i++) {
    let j = pts.length - 1;
    while (j > i && !lineFree(from.x, from.z, pts[j].x, pts[j].z)) j--;
    out.push(pts[j]); from = pts[j]; i = j;
  }
  return out;
}

function pushOut(o, r) {
  for (const b of OBST) {
    const cx = clamp(o.x, b.x0, b.x1), cz = clamp(o.z, b.z0, b.z1), dx = o.x - cx, dz = o.z - cz, d = Math.hypot(dx, dz);
    if (d < r) {
      if (d > 1e-4) { o.x += (dx / d) * (r - d); o.z += (dz / d) * (r - d); }
      else { const l = o.x - b.x0, rr2 = b.x1 - o.x, t = o.z - b.z0, bt = b.z1 - o.z, m = Math.min(l, rr2, t, bt); if (m === l) o.x = b.x0 - r; else if (m === rr2) o.x = b.x1 + r; else if (m === t) o.z = b.z0 - r; else o.z = b.z1 + r; }
    }
  }
}

// ----- Speler -----
let joy = { x: 0, z: 0 };
const keys = {};
function updatePlayer(dt) {
  let ix = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0) + joy.x;
  let iy = (keys.KeyS || keys.ArrowDown ? 1 : 0) - (keys.KeyW || keys.ArrowUp ? 1 : 0) + joy.z;
  const l = Math.hypot(ix, iy);
  if (l > 1) { ix /= l; iy /= l; }
  // schermrichting omzetten naar de schuine wereld
  const f = new THREE.Vector2(-CAM_OFF.x, -CAM_OFF.z).normalize(), r = new THREE.Vector2(-f.y, f.x);
  const mx = r.x * ix - f.x * iy, mz = r.y * ix - f.y * iy;
  const sp = playerSpeed() * Math.min(1, Math.hypot(ix, iy));
  PL.moving = sp;
  if (sp > 0.05) {
    PL.x += mx * sp * dt; PL.z += mz * sp * dt;
    let da = Math.atan2(mx, mz) - PL.ang; da = Math.atan2(Math.sin(da), Math.cos(da)); PL.ang += da * Math.min(1, dt * 14);
  }
  pushOut(PL, 0.32);
  PL.x = clamp(PL.x, 0.4, LV.W - 0.4); PL.z = clamp(PL.z, 0.4, LV.D + 4);
  PL.g.position.set(PL.x, 0, PL.z); PL.g.rotation.y = PL.ang;
  animChar(PL.g, sp, dt, PL.stack.length > 0);
  restack(PL.g, PL.stack);
  // dingen oppakken en neerzetten
  PL.xferT -= dt;
  if (PL.xferT <= 0) {
    for (const id in E.producers) {
      const p = E.producers[id];
      if (Math.hypot(PL.x - p.pick.x, PL.z - p.pick.z) < 1.25 && p.n > 0 && PL.stack.length < playerCap()) { p.n--; PL.stack.push(id); PL.xferT = 0.11; Sfx.pick(PL.stack.length); return; }
    }
    for (const id in E.shelves) {
      const s = E.shelves[id];
      const near = Math.abs(PL.x - s.x) < 1.6 && Math.abs(PL.z - s.z) < 1.5;
      const idx = PL.stack.lastIndexOf(id);
      if (near && idx >= 0 && s.n < s.max) { PL.stack.splice(idx, 1); s.n++; PL.xferT = 0.11; SV.stats.items++; Sfx.drop(s.n); return; }
    }
    if (PL.stack.length && Math.hypot(PL.x - E.trash.x, PL.z - E.trash.z) < 1.3) { PL.stack.pop(); PL.xferT = 0.08; Sfx.trash(); return; }
  }
  // geld oppakken
  for (const r of E.regs) if (r && r.cash > 0 && Math.hypot(PL.x - r.pileAt.x, PL.z - r.pileAt.z) < 1.5) {
    const n = Math.min(10, Math.ceil(r.bills));
    for (let i = 0; i < n; i++) setTimeout(() => flyBill(r.pileAt, PL), i * 30);
    SV.money += r.cash; SV.stats.earned += r.cash;
    floatText(PL.x, 2.6, PL.z, '+€' + fmt(r.cash));
    r.cash = 0; r.bills = 0; Sfx.money();
  }
  // ontgrendel-vakken betalen door erop te staan
  // vak al helemaal betaald (bijv. na een prijsverlaging)? Dan meteen ontgrendelen en het teveel terugstorten
  for (const p of E.pads) {
    const paid = SV.paid[p.u.id] || 0;
    if (paid > 0 && paid >= p.u.price - 0.001) { SV.money += paid - p.u.price; unlock(p.u); return; }
  }
  let onPad = null;
  for (const p of E.pads) if (Math.abs(PL.x - p.u.pos.x) <= 1.15 && Math.abs(PL.z - p.u.pos.z) <= 1.15) onPad = p;
  // eerst 1 seconde stilstaan op het vak, dan pas betalen
  if (!onPad || PL.moving > 0.05 || onPad !== PL.padOn) PL.padT = 0;
  PL.padOn = onPad;
  if (onPad && PL.moving <= 0.05) PL.padT = (PL.padT || 0) + dt;
  for (const p of E.pads) {
    if (p !== onPad || PL.padT < 1) continue;
    const left = p.u.price - (SV.paid[p.u.id] || 0);
    if (left <= 0 || SV.money <= 0) continue;
    const amount = Math.min(left, SV.money, Math.max(p.u.price / 1.0, 30) * dt);
    SV.money -= amount; SV.paid[p.u.id] = (SV.paid[p.u.id] || 0) + amount;
    if (Math.random() < dt * 14) Sfx.pay();
    if (SV.paid[p.u.id] >= p.u.price - 0.001) { unlock(p.u); break; }
  }
}
function unlock(u) {
  SV.unlocked[u.id] = 1; delete SV.paid[u.id];
  if (u.kind === 'next') { onLevelDone(); return; }
  spawnUnlock(u, false);
  refreshPads();
  confetti(u.pos.x, u.pos.z);
  Sfx.unlock();
  toast(`${u.emoji} ${u.naam} ontgrendeld!`);
  save();
}

// ----- Leveringen -----
function updateProducers(dt) {
  for (const id in E.producers) {
    const p = E.producers[id];
    if (p.n >= p.max) { p.t = 0; continue; }
    p.t += dt;
    if (p.t >= prodTime(id)) { p.t = 0; p.n++; }
  }
}

let spawnT = 2;

function goShelf(c2) {

}
function queueSlot(reg, i) { return i < 4 ? { x: reg.x, z: reg.z + 1.05 + i * 0.85 } : { x: reg.x - 0.9 - (i - 4) * 0.8, z: reg.z + 1.05 + 3 * 0.85 }; }
function moveAlong(o, sp, dt) {
  if (!o.path.length) return true;
  const t = o.path[0], dx = t.x - o.x, dz = t.z - o.z, d = Math.hypot(dx, dz);
  if (d < 0.08) { o.path.shift(); return !o.path.length; }
  const s = Math.min(d, sp * dt);
  o.x += (dx / d) * s; o.z += (dz / d) * s;
  let da = Math.atan2(dx, dz) - o.ang; da = Math.atan2(Math.sin(da), Math.cos(da)); o.ang += da * Math.min(1, dt * 10);
  return false;
}
function bubbleFor(c2) {

  else if (c2.state === 'queue' || c2.state === 'pay') { key = 'pay'; draw = (g, W2, H2) => { g.fillStyle = '#fff'; rr(g, 30, 4, W2 - 60, H2 - 30, 22); g.fill(); g.font = `50px ${EMOJI_FONT}`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('💳', W2 / 2, 44); }; }
  else { key = 'happy'; draw = (g, W2, H2) => { g.font = `56px ${EMOJI_FONT}`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('😊', W2 / 2, 44); }; }
  if (key !== c2.bkey) { c2.bkey = key; redraw(c2.bubble, draw); }

function updateCustomers(dt) {
  const maxC = 3 + lineIds().length * 2 + E.regs.filter(Boolean).length;
  spawnT -= dt;
  if (spawnT <= 0) { spawnT = Math.max(0.8, 3.2 / (1 + 0.35 * lineIds().length)) * rand(0.7, 1.3); if (E.customers.length < maxC) spawnCustomer(); }
  for (let i = E.customers.length - 1; i >= 0; i--) {
    const c2 = E.customers[i];
    let sp = 0;
    if (c2.state === 'shop') { sp = 2.6; if (moveAlong(c2, sp, dt)) { c2.state = 'take'; c2.t = 0; c2.ang = Math.PI; } }
    else if (c2.state === 'take') {
      const w = c2.wants[0], s = E.shelves[w.id];
      c2.t += dt;
      if (c2.t > 0.25 && s.n > 0) {
        c2.t = 0; s.n--; w.n--; c2.basket.push(w.id); Sfx.take();
        if (w.n <= 0) {
          c2.wants.shift();
          if (c2.wants.length) goShelf(c2);
          else {
            const regs = E.regs.filter(Boolean);
            const reg = regs.reduce((a, b) => (b.queue.length < a.queue.length ? b : a));
            reg.queue.push(c2); c2.reg = reg; c2.state = 'queue'; c2.slot = -1;
          }
        }
      }
    } else if (c2.state === 'queue') {
      const idx = c2.reg.queue.indexOf(c2);
      if (idx !== c2.slot) { c2.slot = idx; const q = queueSlot(c2.reg, idx); c2.path = findPath(c2.x, c2.z, q.x, q.z); }
      sp = 2.6; if (moveAlong(c2, sp, dt)) { c2.ang = Math.PI; c2.ready = idx === 0; }
    } else if (c2.state === 'leave') {
      sp = 2.8;
      if (moveAlong(c2, sp, dt)) { world.remove(c2.g); world.remove(c2.bubble); E.customers.splice(i, 1); continue; }
    }
    c2.g.position.set(c2.x, 0, c2.z); c2.g.rotation.y = c2.ang;
    animChar(c2.g, sp && c2.path.length ? sp : 0, dt, c2.basket.length > 0);
    restack(c2.g, c2.basket.slice(-6));
    bubbleFor(c2);

  }
}
// ----- Kassa's -----
function updateRegisters(dt) {
  for (const r of E.regs) {
    if (!r) continue;
    const manned = r.cashier || Math.hypot(PL.x - r.staff.x, PL.z - r.staff.z) < 1.1;
    r.manned = manned;
    const front = r.queue[0];
    if (!manned || !front || !front.ready) { r.t = 0; continue; }
    r.t += dt;
    if (r.t >= 0.5 / (1 + 0.3 * up('cash'))) {
      r.t = 0;
      const total = front.basket.reduce((a, id) => a + itemPrice(id), 0);
      r.cash += total; r.bills += Math.max(1, front.basket.length / 2);
      SV.stats.served++;
      floatText(r.x, 2.4, r.z, '+€' + fmt(total));
      Sfx.kaching();
      front.state = 'leave'; front.basket = []; front.path = findPath(front.x, front.z, LV.spawn.x + rand(-2, 2), LV.spawn.z + 2);
      r.queue.shift();
      r.queue.forEach((q) => (q.ready = false));
    }
  }
}
// ----- Vakkenvullers -----
function updateStockers(dt) {
  for (const s of E.stockers) {
    let sp = 0;
    if (!s.task) {
      // kies het schap dat het meest leeg is en waar levering voor klaarligt
      const ids = lineIds();
      let best = null, bs = -1;
      for (const id of ids) { const sh = E.shelves[id], p = E.producers[id]; const score = (sh.max - sh.n) * 2 + p.n - (E.stockers.some((o) => o !== s && o.task && o.task.id === id) ? 8 : 0); if (sh.n < sh.max - 1 && score > bs) { bs = score; best = id; } }
      if (best) { s.task = { id: best, phase: 'get' }; const p = E.producers[best]; s.path = findPath(s.x, s.z, p.pick.x + rand(-0.4, 0.4), p.pick.z); s.wait = 0; }
      else { s.wait += dt; }
    } else if (s.task.phase === 'get') {
      sp = staffSpeed();
      if (moveAlong(s, sp, dt)) {
        sp = 0; s.wait += dt;
        const p = E.producers[s.task.id];
        s.t = (s.t || 0) + dt;
        if (s.t > 0.15 && p.n > 0 && s.stack.length < staffCap()) { s.t = 0; p.n--; s.stack.push(s.task.id); }
        if (s.stack.length >= staffCap() || (s.stack.length && p.n === 0 && s.wait > 1) || s.wait > 6) {
          if (!s.stack.length) { s.task = null; continue; }
          s.task.phase = 'put'; const sh = E.shelves[s.task.id]; s.path = findPath(s.x, s.z, sh.x + rand(-0.6, 0.6), sh.front.z + 0.4); s.wait = 0;
        }
      }
    } else if (s.task.phase === 'put') {
      sp = staffSpeed();
      if (moveAlong(s, sp, dt)) {
        sp = 0; const sh = E.shelves[s.task.id];
        s.t = (s.t || 0) + dt; s.wait += dt;
        if (s.t > 0.15 && s.stack.length && sh.n < sh.max) { s.t = 0; s.stack.pop(); sh.n++; }
        if (!s.stack.length || s.wait > 4) { s.stack = []; s.task = null; }
      }
    }
    s.g.position.set(s.x, 0, s.z); s.g.rotation.y = s.ang || 0;
    animChar(s.g, sp, dt, s.stack.length > 0);
    restack(s.g, s.stack);
  }
}

const ADMIN_HASH = '3caffc05c7f0e2906e518b7c96b1a3bab9ae1ed894b83d31ca651e93a0b19a15';
async function sha256(t) { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t)); return [...new Uint8Array(b)].map((x) => x.toString(16).padStart(2, '0')).join(''); }

// ----- Opslaan / laden -----
function save() {
  if (!SV) return;
  for (const id in E.producers) SV.prod[id] = E.producers[id].n;
  for (const id in E.shelves) SV.shelf[id] = E.shelves[id].n;
  SV.regCash = E.regs.map((r) => (r ? r.cash : 0));
  SV.best = Math.max(SV.best || 1, SV.level);
  Arcade.save(SAVE_KEY, SV);
  Arcade.save('best_tycoon', SV.best);
}
function load() {
  const d = Arcade.load(SAVE_KEY, null);
  SV = d && d.v === 2 ? Object.assign(freshSave(), d) : freshSave(1);
}
addEventListener('visibilitychange', () => { if (document.hidden) save(); });
addEventListener('beforeunload', save);

function startLevel() {
  buildLevel();
  (SV.regCash || []).forEach((v, k) => { if (E.regs[k]) { E.regs[k].cash = v; E.regs[k].bills = Math.min(20, Math.ceil(v / Math.max(1, itemPrice(LV.lines[0].id)) / 2)); } });
  makePlayer();
  spawnT = 1.5;
}
function onLevelDone() {
  save();
  const next = levelCfg(SV.level + 1);
  modal(`<h2>🏬 Op naar een grotere winkel!</h2><p>Je hebt <b>${LV.naam}</b> helemaal uitgebouwd. Je gaat nu naar <b>Level ${SV.level + 1}: ${next.naam}</b> met ${next.prods.length} producten${next.regs > 1 ? ` en ${next.regs} kassa's` : ''}.</p><p>Je upgrades (hardlopen, sterke armen…) neem je mee. Alles is daar meer waard!</p>`,
    [{ label: 'Verhuizen! 🚚', pri: true, fn: () => { const keep = { up: SV.up, stats: SV.stats, best: Math.max(SV.best, SV.level + 1), money: 0 }; keep.stats.levels++; SV = freshSave(SV.level + 1, keep); startLevel(); save(); toast(`Welkom in ${LV.naam}!`); } }]);
}

// ----- Start -----
resize();
addEventListener('resize', resize);
ArcadeCore.onChange(() => setTimeout(resize, 0));
load();
startLevel();
if (!Arcade.load(SAVE_KEY, null)) setTimeout(() => modal(`<h2>🖥️ Welkom in je pc-winkel!</h2><p>Jij runt de winkel. Klanten komen muizen, toetsenborden en meer kopen.</p><p>1. <b>Pak dozen</b> bij de levering (de pallet voor de machine)<br>2. <b>Zet ze in het schap</b> door ernaartoe te lopen<br>3. <b>Ga achter de kassa staan</b> om klanten af te rekenen<br>4. <b>Pak het geld</b> op naast de kassa<br>5. <b>Ga op een vak staan</b> om nieuwe producten, personeel en upgrades te kopen</p><p class="muted">${Arcade.touch ? 'Lopen: sleep met je vinger over het scherm.' : 'Lopen: WASD of pijltjes (of klik en sleep).'}</p>`, [{ label: 'Beginnen! 🚀', pri: true }]), 300);
save();

let last = performance.now(), hudT = 0, saveT = 0;
const tmp = new THREE.Vector3();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (!ArcadeCore.isOpen() && $('modal').classList.contains('hide')) {
    updatePlayer(dt); updateProducers(dt); updateCustomers(dt); updateRegisters(dt); updateStockers(dt); checkDesk();
  }
  // effecten
  for (let i = E.flying.length - 1; i >= 0; i--) {
    const f = E.flying[i]; f.t += dt;
    if (f.conf) { const v = f.m.userData.v; v.y -= 18 * dt; f.m.position.addScaledVector(v, dt); f.m.rotation.x += dt * 8; f.m.rotation.z += dt * 6; if (f.t > f.m.userData.life) { world.remove(f.m); E.flying.splice(i, 1); } continue; }
    const k = Math.min(1, f.t / f.dur);
    tmp.set(f.to.x, 1.4, f.to.z);
    f.m.position.lerpVectors(f.from, tmp, k); f.m.position.y += Math.sin(k * Math.PI) * 1.2;
    if (k >= 1) { world.remove(f.m); E.flying.splice(i, 1); }
  }
  for (let i = E.floats.length - 1; i >= 0; i--) { const f = E.floats[i]; f.t += dt; f.s.position.y += dt * 1.2; f.s.material.opacity = 1 - f.t; if (f.t > 1) { world.remove(f.s); f.s.material.map.dispose(); E.floats.splice(i, 1); } }
  for (const p of E.pads) { updatePadTex(p); p.mesh.position.y = 0.03; const w = p === PL.padOn ? (PL.padT < 1 ? 1 + 0.1 * PL.padT : 1.1) : 1; p.mesh.scale.set(w, w, 1); }
  // kassa-lampje: groen als er iemand achter staat
  showStock();
  // camera volgt je
  const tx = PL.x, tz = PL.z;
  camera.position.set(tx + CAM_OFF.x, CAM_OFF.y, tz + CAM_OFF.z);
  camera.lookAt(tx, 0, tz);
  sun.position.set(tx + 8, 20, tz + 6); sun.target.position.set(tx, 0, tz); sun.target.updateMatrixWorld();
  renderer.render(scene, camera);
  hudT += dt; saveT += dt;
  if (hudT > 0.15) { hudT = 0; updateHud(); }
  if (saveT > 4) { saveT = 0; save(); }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
window.__shop = { get SV() { return SV; }, get PL() { return PL; }, E, get LV() { return LV; }, unlock, keys, joy };

  </script>
