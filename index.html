<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Turbo Tijdrit</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: #0b0d14;
      color: #e8ecff;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    main {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 8px;
    }
    .scherm {
      position: relative;
      width: min(100%, calc((100vh - 70px) * 1.6));
      aspect-ratio: 16 / 10;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 12px;
      border: 2px solid #2a3150;
      box-shadow: 0 0 40px rgba(80, 120, 255, 0.2);
      touch-action: none;
    }
    .touch {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 12px;
      display: none;
      justify-content: space-between;
      padding: 0 12px;
      pointer-events: none;
    }
    .touch div { display: flex; gap: 10px; }
    .touch button {
      pointer-events: auto;
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.35);
      background: rgba(20, 24, 45, 0.55);
      color: #fff;
      font-size: 24px;
      font-weight: bold;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    .touch button.actief { background: rgba(255, 255, 255, 0.35); }
    @media (hover: none) and (pointer: coarse) {
      .touch { display: flex; }
    }
    .uitleg {
      margin: 0;
      font-size: 13px;
      opacity: 0.7;
      text-align: center;
    }
  </style>
</head>
<body>
  <main>
    <div class="scherm">
      <canvas id="spel" width="960" height="600" aria-label="Turbo Tijdrit racespel"></canvas>
      <div class="touch">
        <div>
          <button data-key="ArrowLeft">◀</button>
          <button data-key="ArrowRight">▶</button>
        </div>
        <div>
          <button data-key="ArrowDown">▼</button>
          <button data-key="ArrowUp">▲</button>
        </div>
      </div>
    </div>
    <p class="uitleg">
      ↑/W = gas · ↓/S = rem/achteruit · ←→/AD = sturen · Spatie = handrem (driften) · R = herstart · P = pauze · M = geluid
    </p>
  </main>

  <script>
'use strict';

// ================= Basis =================
const canvas = document.getElementById('spel');
const ctx = canvas.getContext('2d');
const W = canvas.width;
const H = canvas.height;

const LAPS = 3;       // aantal rondes
const HW = 70;        // halve breedte van de baan
const RUNOFF = 70;    // gras tussen baan en muur
const CAR_R = 14;     // botsstraal van de auto

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);

function fmt(t) {
  if (t == null) return '--:--.---';
  const m = Math.floor(t / 60);
  const s = t - m * 60;
  return `${m}:${s.toFixed(3).padStart(6, '0')}`;
}

// ================= Baan =================
// Controlepunten van de baan (rondje met bochten, haarspeld en chicane)
const CONTROL = [
  [400, 1900], [400, 1450], [400, 1000],                         // lange rechte stuk (schans 1)
  [500, 600], [800, 400], [1200, 350], [1600, 350],              // bocht + rechte stuk (kicker)
  [1900, 450], [2050, 750], [2300, 850], [2550, 700], [2700, 450], // dal-bocht
  [2950, 350], [3250, 500], [3300, 850], [3300, 1200], [3300, 1550], // bocht + rechte stuk (schans 2)
  [3200, 1900], [2900, 2050], [2500, 2050], [2200, 1850],        // bocht onderin
  [1900, 1500], [1600, 1650], [1400, 2000], [1000, 2150], [650, 2150], [430, 2050], // haarspeld + terug
];

function catmull(p0, p1, p2, p3, t) {
  const t2 = t * t, t3 = t2 * t;
  const f = (a, b, c, d) => 0.5 * (2 * b + (-a + c) * t + (2 * a - 5 * b + 4 * c - d) * t2 + (-a + 3 * b - 3 * c + d) * t3);
  return { x: f(p0[0], p1[0], p2[0], p3[0]), y: f(p0[1], p1[1], p2[1], p3[1]) };
}

const track = [];
const STEPS = 40;
for (let i = 0; i < CONTROL.length; i++) {
  const n = CONTROL.length;
  const p0 = CONTROL[(i - 1 + n) % n], p1 = CONTROL[i], p2 = CONTROL[(i + 1) % n], p3 = CONTROL[(i + 2) % n];
  for (let s = 0; s < STEPS; s++) track.push(catmull(p0, p1, p2, p3, s / STEPS));
}
const N = track.length;
for (let i = 0; i < N; i++) {
  const a = track[(i - 1 + N) % N], b = track[(i + 1) % N];
  const len = Math.hypot(b.x - a.x, b.y - a.y) || 1;
  track[i].tx = (b.x - a.x) / len;
  track[i].ty = (b.y - a.y) / len;
  track[i].nx = -track[i].ty;
  track[i].ny = track[i].tx;
}

const trackPath = new Path2D();
trackPath.moveTo(track[0].x, track[0].y);
for (let i = 1; i < N; i++) trackPath.lineTo(track[i].x, track[i].y);
trackPath.closePath();

const bounds = track.reduce((b, p) => ({
  minX: Math.min(b.minX, p.x), maxX: Math.max(b.maxX, p.x),
  minY: Math.min(b.minY, p.y), maxY: Math.max(b.maxY, p.y),
}), { minX: Infinity, maxX: -Infinity, minY: Infinity, maxY: -Infinity });

function nearest(x, y) {
  let best = 0, bd = Infinity;
  for (let i = 0; i < N; i++) {
    const dx = track[i].x - x, dy = track[i].y - y;
    const d = dx * dx + dy * dy;
    if (d < bd) { bd = d; best = i; }
  }
  return best;
}

// Checkpoints: je moet de hele baan rijden voordat een ronde telt
const CHECKPOINTS = [0.25, 0.5, 0.75].map((f) => Math.floor(f * N));

// ================= Obstakels =================
// [positie op de baan (0-1), zijwaartse plek (-1 links ... 1 rechts), soort]
const OBSTACLE_DEF = [
  [0.105, 0.45, 'kegel'], [0.115, -0.4, 'kegel'],
  [0.25, 0.25, 'olie'],
  [0.29, 0.5, 'kegel'], [0.30, -0.5, 'kegel'], [0.31, 0.5, 'kegel'], [0.32, -0.5, 'kegel'],
  [0.37, 0, 'boost'],
  [0.43, -0.5, 'ton'], [0.445, 0.45, 'ton'],
  [0.535, 0, 'boost'],
  [0.66, 0.1, 'olie'],
  [0.70, -0.5, 'ton'], [0.715, 0.5, 'ton'],
  [0.79, 0.5, 'kegel'], [0.80, -0.5, 'kegel'], [0.81, 0.5, 'kegel'], [0.82, -0.5, 'kegel'],
  [0.88, -0.25, 'olie'],
  [0.93, 0, 'boost'],
];
const OBSTACLE_R = { kegel: 9, ton: 17, olie: 30, boost: 24 };

const obstacles = OBSTACLE_DEF.map(([f, off, type]) => {
  const t = track[Math.floor(f * N) % N];
  return {
    type,
    x: t.x + t.nx * off * HW,
    y: t.y + t.ny * off * HW,
    r: OBSTACLE_R[type],
    angle: Math.atan2(t.ty, t.tx),
  };
});

// ================= Schansen =================
// cp = controlepunt waar de schans begint, L = lengte, H = hoogte, G = lengte van het water erachter (0 = geen water)
const SPEED = { max: 380, accel: 330, rem: 700, gras: 170, boost: 560, achteruit: 140 };
const GRAVITY = 600;
const RAMP_DEF = [
  { cp: 1, L: 60, H: 18, G: 110 },
  { cp: 5, L: 55, H: 22, G: 0 },
  { cp: 15, L: 60, H: 18, G: 120 },
];
const ramps = RAMP_DEF.map((d) => {
  const t = track[d.cp * STEPS];
  const angle = Math.atan2(t.ty, t.tx);
  return { ...d, x: t.x, y: t.y, angle, ca: Math.cos(angle), sa: Math.sin(angle), RW: HW + 12 };
});

function rampInfo(x, y) {
  for (const r of ramps) {
    const dx = x - r.x, dy = y - r.y;
    const u = dx * r.ca + dy * r.sa;
    const w = -dx * r.sa + dy * r.ca;
    if (u >= 0 && u <= r.L && Math.abs(w) <= r.RW) return { h: (u / r.L) * r.H, ramp: r };
    if (r.G && u > r.L && u <= r.L + r.G && Math.abs(w) <= HW + RUNOFF + 5) return { water: true, ramp: r };
  }
  return null;
}

// ================= Opslag beste tijden =================
let best = { lap: null, total: null };
try {
  const saved = JSON.parse(localStorage.getItem('turbotijdrit_best_v2'));
  if (saved) best = { lap: saved.lap ?? null, total: saved.total ?? null };
} catch (e) { /* geen opslag */ }
function saveBest() {
  try { localStorage.setItem('turbotijdrit_best_v2', JSON.stringify(best)); } catch (e) { /* geen opslag */ }
}

// ================= Geluid =================
let audio = null, engineOsc = null, engineGain = null, muted = false;

function initAudio() {
  if (audio) return;
  try {
    audio = new (window.AudioContext || window.webkitAudioContext)();
    engineOsc = audio.createOscillator();
    const filter = audio.createBiquadFilter();
    engineGain = audio.createGain();
    engineOsc.type = 'sawtooth';
    engineOsc.frequency.value = 50;
    filter.type = 'lowpass';
    filter.frequency.value = 700;
    engineGain.gain.value = 0;
    engineOsc.connect(filter);
    filter.connect(engineGain);
    engineGain.connect(audio.destination);
    engineOsc.start();
  } catch (e) { audio = null; }
}

function beep(freq, dur, type = 'square', vol = 0.05, slide = 0) {
  if (muted || !audio) return;
  try {
    const t = audio.currentTime;
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g);
    g.connect(audio.destination);
    o.start(t);
    o.stop(t + dur);
  } catch (e) { /* negeren */ }
}

function updateEngineSound() {
  if (!audio || !engineOsc) return;
  const speed = car ? Math.hypot(car.vx, car.vy) : 0;
  const on = !muted && (state === 'racing' || state === 'countdown' || state === 'finish');
  engineOsc.frequency.setTargetAtTime(45 + speed * 0.28, audio.currentTime, 0.05);
  engineGain.gain.setTargetAtTime(on ? 0.035 : 0, audio.currentTime, 0.1);
}

// ================= Besturing =================
const keys = {};

addEventListener('keydown', (e) => {
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'].includes(e.code)) e.preventDefault();
  initAudio();
  keys[e.code] = true;
  if (e.repeat) return;
  if (e.code === 'Enter' && (state === 'menu' || state === 'finish')) startRace();
  else if (e.code === 'KeyR' && state !== 'menu') startRace();
  else if (e.code === 'KeyP' || e.code === 'Escape') togglePause();
  else if (e.code === 'KeyM') muted = !muted;
});
addEventListener('keyup', (e) => { keys[e.code] = false; });
addEventListener('blur', () => {
  for (const k in keys) keys[k] = false;
  if (state === 'racing' || state === 'countdown') togglePause();
});

canvas.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  initAudio();
  if (state === 'menu' || (state === 'finish' && finishTimer <= 0)) startRace();
  else if (state === 'paused') togglePause();
});

document.querySelectorAll('.touch button').forEach((btn) => {
  const code = btn.dataset.key;
  const down = (e) => { e.preventDefault(); initAudio(); keys[code] = true; btn.classList.add('actief'); };
  const up = () => { keys[code] = false; btn.classList.remove('actief'); };
  btn.addEventListener('pointerdown', down);
  ['pointerup', 'pointerleave', 'pointercancel'].forEach((t) => btn.addEventListener(t, up));
});

function readInput() {
  return {
    gas: keys.ArrowUp || keys.KeyW,
    rem: keys.ArrowDown || keys.KeyS,
    links: keys.ArrowLeft || keys.KeyA,
    rechts: keys.ArrowRight || keys.KeyD,
    handrem: keys.Space,
  };
}
const NO_INPUT = { gas: false, rem: false, links: false, rechts: false, handrem: false };

// ================= Spelstatus =================
let state = 'menu'; // menu | countdown | racing | paused | finish
let pausedFrom = null;
let car, countdown, goTimer, raceTime, lapTime, lap, lapTimes, nextCp, toast, skids, shake, finishTimer;
let newBestTotal = false, newBestLap = false;

function startRace() {
  const t = track[N - 8];
  car = { x: t.x, y: t.y, a: Math.atan2(t.ty, t.tx), vx: 0, vy: 0, z: 0, vz: 0, lastVz: 0, air: false, airTime: 0, boost: 0, offTrack: false, onOil: false, braking: false };
  updateCamera(0, true);
  countdown = 3;
  goTimer = 0;
  raceTime = 0;
  lapTime = 0;
  lap = 1;
  lapTimes = [];
  nextCp = 0;
  toast = null;
  skids = [];
  shake = 0;
  newBestTotal = false;
  newBestLap = false;
  state = 'countdown';
  beep(440, 0.15, 'square', 0.05);
}

function togglePause() {
  if (state === 'racing' || state === 'countdown') { pausedFrom = state; state = 'paused'; }
  else if (state === 'paused') state = pausedFrom;
}

function completeLap() {
  const lt = lapTime;
  lapTimes.push(lt);
  const delta = best.lap != null ? lt - best.lap : null;
  if (best.lap == null || lt < best.lap) { best.lap = lt; newBestLap = true; saveBest(); }
  toast = {
    text: `Ronde ${lap}: ${fmt(lt)}`,
    sub: delta == null ? 'Eerste rondetijd!' : `${delta < 0 ? '−' : '+'}${Math.abs(delta).toFixed(3)} t.o.v. snelste ronde`,
    good: delta == null || delta < 0,
    t: 2.5,
  };
  lap++;
  lapTime = 0;
  nextCp = 0;
  if (lap > LAPS) {
    state = 'finish';
    finishTimer = 1;
    if (best.total == null || raceTime < best.total) { best.total = raceTime; newBestTotal = true; saveBest(); }
    beep(523, 0.15, 'triangle', 0.07);
    setTimeout(() => beep(659, 0.15, 'triangle', 0.07), 150);
    setTimeout(() => beep(784, 0.35, 'triangle', 0.07), 300);
  } else {
    beep(700, 0.2, 'triangle', 0.06, 300);
  }
}

// ================= Auto-fysica =================
function updateCar(dt, inp) {
  const c = car;

  // Ondergrond bepalen
  const idx = nearest(c.x, c.y);
  const t = track[idx];
  c.idx = idx;
  c.offTrack = Math.hypot(c.x - t.x, c.y - t.y) > HW;
  c.onOil = false;
  let onBoost = false;
  if (!c.air) {
    for (const o of obstacles) {
      const od = Math.hypot(c.x - o.x, c.y - o.y);
      if (o.type === 'olie' && od < o.r) c.onOil = true;
      if (o.type === 'boost' && od < o.r) onBoost = true;
    }
  }
  if (onBoost) {
    if (c.boost <= 0.2) beep(300, 0.4, 'sawtooth', 0.04, 600);
    c.boost = 1.1;
  }
  c.boost = Math.max(0, c.boost - dt);

  // Sturen (in de lucht kun je bijna niet sturen)
  const fwdOld = c.vx * Math.cos(c.a) + c.vy * Math.sin(c.a);
  const steer = (inp.rechts ? 1 : 0) - (inp.links ? 1 : 0);
  let turn = steer * 2.6 * Math.min(1, Math.abs(fwdOld) / 110) * (fwdOld >= 0 ? 1 : -1);
  if (c.onOil) turn *= 0.35;
  if (inp.handrem) turn *= 1.35;
  if (c.air) turn *= 0.25;
  c.a += turn * dt;

  // Snelheid opsplitsen in vooruit en zijwaarts
  const fx = Math.cos(c.a), fy = Math.sin(c.a);
  let fwd = c.vx * fx + c.vy * fy;
  let lat = -c.vx * fy + c.vy * fx;

  if (!c.air) {
    const maxF = c.boost > 0 ? SPEED.boost : c.offTrack ? SPEED.gras : SPEED.max;
    if (inp.gas) fwd += (c.offTrack ? SPEED.accel * 0.6 : SPEED.accel) * dt;
    if (inp.rem) fwd -= (fwd > 20 ? SPEED.rem : SPEED.accel * 0.6) * dt;
    if (!inp.gas && !inp.rem) {
      const r = (c.offTrack ? 300 : 120) * dt;
      fwd = Math.abs(fwd) < r ? 0 : fwd - Math.sign(fwd) * r;
    }
    if (c.boost > 0) fwd += 600 * dt;
    if (fwd > maxF) fwd = Math.max(maxF, fwd - (c.offTrack ? 650 : 450) * dt);
    if (fwd < -SPEED.achteruit) fwd = -SPEED.achteruit;
    if (inp.handrem) fwd -= Math.sign(fwd) * Math.min(Math.abs(fwd), 120 * dt);

    // Grip (hoe minder grip, hoe meer de auto glijdt)
    const grip = c.onOil ? 0.8 : inp.handrem ? 1.5 : c.offTrack ? 5 : 9;
    lat *= Math.max(0, 1 - grip * dt);
  }
  c.braking = inp.rem && fwd > 0;

  c.vx = fx * fwd - fy * lat;
  c.vy = fy * fwd + fx * lat;
  c.x += c.vx * dt;
  c.y += c.vy * dt;
  c.fwd = fwd;

  // Hoogte: schansen, springen en water
  const gi = rampInfo(c.x, c.y);
  const ground = gi ? (gi.water ? -30 : gi.h) : 0;
  if (c.air) {
    c.vz -= GRAVITY * dt;
    c.z += c.vz * dt;
    if (c.z <= ground) {
      if (gi && gi.water) { splash(gi.ramp); return; }
      if (c.vz < -120) {
        shake = Math.min(10, -c.vz / 40);
        beep(70, 0.25, 'sawtooth', 0.07, -30);
      }
      c.z = ground;
      c.vz = 0;
      c.air = false;
    }
  } else if (ground < c.z - 1) {
    // De grond valt weg: je vliegt!
    c.air = true;
    c.vz = c.lastVz;
    c.airTime = 0;
    if (c.vz > 40) beep(500, 0.3, 'triangle', 0.05, 400);
  } else {
    c.lastVz = dt > 0 ? (ground - c.z) / dt : 0;
    c.z = ground;
  }
  if (c.air) c.airTime += dt;

  // Remsporen
  if (!c.air && (Math.abs(lat) > 70 || (c.braking && fwd > 200)) && !c.offTrack) {
    for (const side of [-1, 1]) {
      skids.push({ x: c.x - fx * 12 + -fy * side * 8, y: c.y - fy * 12 + fx * side * 8 });
    }
    if (skids.length > 1600) skids.splice(0, skids.length - 1600);
  }

  // Muur langs de baan
  const t2 = track[nearest(c.x, c.y)];
  const dx = c.x - t2.x, dy = c.y - t2.y;
  const d = Math.hypot(dx, dy);
  const limit = HW + RUNOFF - CAR_R;
  if (d > limit) {
    const nx = dx / d, ny = dy / d;
    c.x = t2.x + nx * limit;
    c.y = t2.y + ny * limit;
    bounce(nx, ny);
  }

  // Botsen met kegels en tonnen (niet als je eroverheen vliegt)
  if (c.z < 15) {
    for (const o of obstacles) {
      if (o.type !== 'kegel' && o.type !== 'ton') continue;
      const ox = c.x - o.x, oy = c.y - o.y;
      const od = Math.hypot(ox, oy);
      if (od < o.r + CAR_R && od > 0) {
        const nx = ox / od, ny = oy / od;
        c.x = o.x + nx * (o.r + CAR_R);
        c.y = o.y + ny * (o.r + CAR_R);
        bounce(-nx, -ny);
      }
    }
  }
}

// In het water geland: terug naar vóór de schans
function splash(r) {
  const c = car;
  c.x = r.x - r.ca * 160;
  c.y = r.y - r.sa * 160;
  c.a = r.angle;
  c.vx = c.vy = 0;
  c.z = 0;
  c.vz = 0;
  c.lastVz = 0;
  c.air = false;
  c.boost = 0;
  shake = 8;
  beep(200, 0.5, 'sine', 0.08, -150);
  toast = { text: '💦 Plons!', sub: 'Te langzaam: neem meer aanloop!', good: false, t: 2.2 };
  updateCamera(0, true);
}

// n = richting waarin de auto ergens tegenaan rijdt
function bounce(nx, ny) {
  const c = car;
  const vn = c.vx * nx + c.vy * ny;
  if (vn > 0) {
    c.vx -= nx * vn * 1.5;
    c.vy -= ny * vn * 1.5;
    c.vx *= 0.7;
    c.vy *= 0.7;
    if (vn > 80) {
      shake = Math.min(12, vn / 40);
      beep(90, 0.15, 'sawtooth', 0.06, -40);
    }
  }
}

// ================= Update =================
function update(dt) {
  if (toast) { toast.t -= dt; if (toast.t <= 0) toast = null; }
  shake = Math.max(0, shake - dt * 30);
  goTimer = Math.max(0, goTimer - dt);

  if (state === 'countdown') {
    const before = Math.ceil(countdown);
    countdown -= dt;
    const after = Math.ceil(countdown);
    if (countdown <= 0) {
      state = 'racing';
      goTimer = 0.8;
      beep(880, 0.35, 'square', 0.06);
    } else if (after !== before) {
      beep(440, 0.15, 'square', 0.05);
    }
  }

  if (state === 'racing') {
    raceTime += dt;
    lapTime += dt;
    updateCar(dt, readInput());

    const idx = car.idx;
    if (nextCp < CHECKPOINTS.length && Math.abs(idx - CHECKPOINTS[nextCp]) < 15) nextCp++;
    if (nextCp === CHECKPOINTS.length && idx < 15) completeLap();
  } else if (state === 'finish') {
    finishTimer -= dt;
    updateCar(dt, NO_INPUT);
  }

  if (car && state !== 'paused') updateCamera(dt, false);
}

// ================= 3D-weergave (camera achter de auto) =================
const NEAR = 4;          // dichterbij dan dit wordt afgeknipt
const FAR = 2600;        // verder dan dit tekenen we niet
const HORIZON = H * 0.4; // hoogte van de horizon op het scherm
const WALL_H = 16;       // hoogte van de muur

const cam3 = { x: 0, y: 0, h: 34, yaw: 0, cos: 1, sin: 0, focal: 430, shakeX: 0, shakeY: 0 };

function angleDiff(a, b) {
  let d = a - b;
  while (d > Math.PI) d -= Math.PI * 2;
  while (d < -Math.PI) d += Math.PI * 2;
  return d;
}

function updateCamera(dt, snap) {
  const c = car;
  if (snap) cam3.yaw = c.a;
  else cam3.yaw += angleDiff(c.a, cam3.yaw) * Math.min(1, 5 * dt);
  const dist = 78;
  const tx = c.x - Math.cos(cam3.yaw) * dist;
  const ty = c.y - Math.sin(cam3.yaw) * dist;
  if (snap) { cam3.x = tx; cam3.y = ty; }
  else {
    const k = Math.min(1, 30 * dt);
    cam3.x += (tx - cam3.x) * k;
    cam3.y += (ty - cam3.y) * k;
  }
  const targetH = 34 + c.z * 0.8;
  cam3.h = snap ? targetH : cam3.h + (targetH - cam3.h) * Math.min(1, 8 * dt);
  cam3.cos = Math.cos(cam3.yaw);
  cam3.sin = Math.sin(cam3.yaw);
  // Bij hoge snelheid wordt het beeld iets breder (snelheidsgevoel)
  cam3.focal = 430 - Math.min(120, Math.hypot(c.vx, c.vy) * 0.15);
}

// Wereldpunt (x, y op de grond, h = hoogte) naar camera-ruimte
function toCam(x, y, h) {
  const dx = x - cam3.x, dy = y - cam3.y;
  return { f: dx * cam3.cos + dy * cam3.sin, s: -dx * cam3.sin + dy * cam3.cos, v: h - cam3.h };
}

function proj(p) {
  const k = cam3.focal / p.f;
  return { x: W / 2 + p.s * k + cam3.shakeX, y: HORIZON - p.v * k + cam3.shakeY };
}

function clipNear(pts) {
  const out = [];
  for (let i = 0; i < pts.length; i++) {
    const a = pts[i], b = pts[(i + 1) % pts.length];
    const ina = a.f >= NEAR, inb = b.f >= NEAR;
    if (ina) out.push(a);
    if (ina !== inb) {
      const t = (NEAR - a.f) / (b.f - a.f);
      out.push({ f: NEAR, s: a.s + (b.s - a.s) * t, v: a.v + (b.v - a.v) * t });
    }
  }
  return out;
}

function fillPoly(pts, color) {
  const c = clipNear(pts);
  if (c.length < 3) return;
  ctx.beginPath();
  for (let i = 0; i < c.length; i++) {
    const p = proj(c[i]);
    if (i) ctx.lineTo(p.x, p.y); else ctx.moveTo(p.x, p.y);
  }
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
}

// Punt op de baan: sample i, zijwaarts verschoven met off
function edge(i, off, h = 0) {
  const t = track[i];
  return toCam(t.x + t.nx * off, t.y + t.ny * off, h);
}

// Punt rond een middelpunt met lokale assen (u = vooruit, w = opzij)
function local(ox, oy, a, u, w, h = 0) {
  const ca = Math.cos(a), sa = Math.sin(a);
  return toCam(ox + ca * u - sa * w, oy + sa * u + ca * w, h);
}

function rgb(c, shade = 1) {
  return `rgb(${Math.min(255, c[0] * shade) | 0}, ${Math.min(255, c[1] * shade) | 0}, ${Math.min(255, c[2] * shade) | 0})`;
}

// Bergen aan de horizon (draaien mee als je stuurt)
const MOUNTAINS = Array.from({ length: 72 }, (_, i) => 28 + 38 * Math.abs(Math.sin(i * 1.7)) + 22 * Math.abs(Math.sin(i * 0.53 + 1)));
const HILLS = Array.from({ length: 72 }, (_, i) => 10 + 14 * Math.abs(Math.sin(i * 2.3 + 0.4)));

function drawRidge(profile, color, hz, scale) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(0, hz + 2);
  for (let x = 0; x <= W + 8; x += 8) {
    const ang = cam3.yaw + Math.atan((x - W / 2) / cam3.focal);
    const t = ((((ang / (Math.PI * 2)) * profile.length) % profile.length) + profile.length) % profile.length;
    const i0 = Math.floor(t), fr = t - i0;
    const hgt = profile[i0] * (1 - fr) + profile[(i0 + 1) % profile.length] * fr;
    ctx.lineTo(x, hz - hgt * scale);
  }
  ctx.lineTo(W, hz + 2);
  ctx.closePath();
  ctx.fill();
}

// Een blok (voor de auto) als zichtbare vlakken toevoegen
function addBox(faces, cx, cy, a, u0, w0, len, wid, h0, h1, color) {
  const ca = Math.cos(a), sa = Math.sin(a);
  const P = (u, w, h) => ({ x: cx + ca * (u0 + u) - sa * (w0 + w), y: cy + sa * (u0 + u) + ca * (w0 + w), h });
  const hl = len / 2, hw = wid / 2;
  const pts = [
    P(-hl, -hw, h0), P(hl, -hw, h0), P(hl, hw, h0), P(-hl, hw, h0),
    P(-hl, -hw, h1), P(hl, -hw, h1), P(hl, hw, h1), P(-hl, hw, h1),
  ];
  const defs = [
    [[4, 5, 6, 7], [0, 0, 1], 1.15],     // boven
    [[1, 2, 6, 5], [ca, sa, 0], 0.95],   // voor
    [[3, 0, 4, 7], [-ca, -sa, 0], 0.75], // achter
    [[0, 1, 5, 4], [sa, -ca, 0], 0.85],  // links
    [[2, 3, 7, 6], [-sa, ca, 0], 0.85],  // rechts
  ];
  for (const [idx, n, shade] of defs) {
    const q = idx.map((i) => pts[i]);
    const mx = (q[0].x + q[1].x + q[2].x + q[3].x) / 4;
    const my = (q[0].y + q[1].y + q[2].y + q[3].y) / 4;
    const mh = (q[0].h + q[1].h + q[2].h + q[3].h) / 4;
    if ((mx - cam3.x) * n[0] + (my - cam3.y) * n[1] + (mh - cam3.h) * n[2] >= 0) continue;
    faces.push({ depth: toCam(mx, my, mh).f, pts: q.map((p) => toCam(p.x, p.y, p.h)), color: rgb(color, shade) });
  }
}

function drawCar3D() {
  const c = car;
  const faces = [];
  const box = (u, w, len, wid, h0, h1, col) => addBox(faces, c.x, c.y, c.a, u, w, len, wid, h0 + c.z, h1 + c.z, col);
  const RED = [232, 40, 47], DARK = [22, 22, 26], GLASS = [40, 52, 90];
  // Wielen
  for (const u of [-12, 12]) for (const w of [-11.5, 11.5]) box(u, w, 9, 5, 0, 8, DARK);
  // Carrosserie, cabine, dak, spoiler
  box(0, 0, 40, 22, 3, 11, RED);
  box(-3, 0, 18, 17, 11, 18, GLASS);
  box(-4, 0, 13, 15, 18, 19.5, RED);
  box(-19, 0, 3, 22, 13, 15.5, DARK);
  // Achterlichten
  const light = c.braking ? [255, 40, 50] : [110, 18, 22];
  box(-20.2, -7, 0.6, 5, 7, 10, light);
  box(-20.2, 7, 0.6, 5, 7, 10, light);
  // Boost-vlam
  if (c.boost > 0) box(-24 - rand(0, 4), 0, rand(6, 12), 6, 4, 8, [255, 170, 40]);

  faces.sort((a, b) => b.depth - a.depth);
  for (const f of faces) fillPoly(f.pts, f.color);
}

function drawWorld() {
  const hz = HORIZON + cam3.shakeY;

  // Lucht en bergen
  const sky = ctx.createLinearGradient(0, 0, 0, hz);
  sky.addColorStop(0, '#3d7fd6');
  sky.addColorStop(1, '#cbe6ff');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, hz + 2);
  drawRidge(MOUNTAINS, '#8aa6cc', hz, 1);
  drawRidge(HILLS, '#3f8a46', hz, 1);

  // Gras
  const ground = ctx.createLinearGradient(0, hz, 0, H);
  ground.addColorStop(0, '#4c8f4e');
  ground.addColorStop(0.2, '#2f7a36');
  ground.addColorStop(1, '#286a2e');
  ctx.fillStyle = ground;
  ctx.fillRect(0, hz, W, H - hz);

  if (!car) return;

  // Welke stukken baan zijn in beeld?
  const cf = new Array(N);
  for (let i = 0; i < N; i++) cf[i] = (track[i].x - cam3.x) * cam3.cos + (track[i].y - cam3.y) * cam3.sin;
  const vis = [];
  for (let i = 0; i < N; i++) {
    const j = (i + 1) % N;
    if (Math.max(cf[i], cf[j]) > -(HW + RUNOFF + 20) && Math.min(cf[i], cf[j]) < FAR) vis.push(i);
  }

  const quad = (i, o1, o2, color) => {
    const j = (i + 1) % N;
    fillPoly([edge(i, o1), edge(j, o1), edge(j, o2), edge(i, o2)], color);
  };

  // Laag 1: grasstroken naast de baan (geven snelheidsgevoel)
  for (const i of vis) {
    const col = Math.floor(i / 4) % 2 ? '#2f7a36' : '#38873f';
    quad(i, -(HW + RUNOFF), -(HW + 10), col);
    quad(i, HW + 10, HW + RUNOFF, col);
  }
  // Laag 2: rood-witte randen
  for (const i of vis) {
    const col = Math.floor(i / 2) % 2 ? '#e0333a' : '#f4f4f4';
    quad(i, -(HW + 10), -HW + 1, col);
    quad(i, HW - 1, HW + 10, col);
  }
  // Laag 3: asfalt
  for (const i of vis) quad(i, -HW, HW, Math.floor(i / 4) % 2 ? '#3a3c44' : '#40424b');
  // Laag 4: middenstreep
  for (const i of vis) if (Math.floor(i / 3) % 2 === 0) quad(i, -1.6, 1.6, 'rgba(255,255,255,0.55)');

  // Start/finish-lijn
  const t0 = track[0], a0 = Math.atan2(t0.ty, t0.tx);
  if (cf[0] > -40 && cf[0] < FAR) {
    for (let row = 0; row < 2; row++) {
      let k = 0;
      for (let w = -HW; w < HW; w += 10, k++) {
        const u = row * 10 - 10;
        fillPoly([local(t0.x, t0.y, a0, u, w), local(t0.x, t0.y, a0, u + 10, w), local(t0.x, t0.y, a0, u + 10, w + 10), local(t0.x, t0.y, a0, u, w + 10)],
          (k + row) % 2 === 0 ? '#ffffff' : '#111111');
      }
    }
  }

  // Remsporen
  if (skids) {
    ctx.fillStyle = 'rgba(15, 15, 18, 0.4)';
    for (const s of skids) {
      const p = toCam(s.x, s.y, 0);
      if (p.f < NEAR + 2 || p.f > 900) continue;
      const q = proj(p), sz = Math.max(1, 4 * cam3.focal / p.f);
      ctx.fillRect(q.x - sz / 2, q.y - sz / 6, sz, sz / 3);
    }
  }

  // Platte obstakels: olie en boost
  for (const o of obstacles) {
    const p = toCam(o.x, o.y, 0);
    if (p.f < -60 || p.f > FAR) continue;
    if (o.type === 'olie') {
      const pts = [];
      for (let k = 0; k < 14; k++) {
        const t = (k / 14) * Math.PI * 2;
        pts.push(local(o.x, o.y, o.angle, Math.cos(t) * o.r, Math.sin(t) * o.r * 0.75));
      }
      fillPoly(pts, 'rgba(12, 10, 22, 0.9)');
      const sheen = [];
      for (let k = 0; k < 10; k++) {
        const t = (k / 10) * Math.PI * 2;
        sheen.push(local(o.x, o.y, o.angle, -5 + Math.cos(t) * o.r * 0.4, -4 + Math.sin(t) * o.r * 0.2));
      }
      fillPoly(sheen, 'rgba(140, 90, 220, 0.45)');
    } else if (o.type === 'boost') {
      const r = o.r;
      fillPoly([local(o.x, o.y, o.angle, -r, -r), local(o.x, o.y, o.angle, r, -r), local(o.x, o.y, o.angle, r, r), local(o.x, o.y, o.angle, -r, r)], '#ff8a1f');
      const pulse = (performance.now() / 300) % 1;
      for (let n = 0; n < 2; n++) {
        const u = -10 + n * 12;
        const alpha = 0.55 + 0.45 * Math.sin((pulse + n * 0.5) * Math.PI * 2);
        fillPoly([
          local(o.x, o.y, o.angle, u - 6, -14), local(o.x, o.y, o.angle, u + 6, 0), local(o.x, o.y, o.angle, u - 6, 14),
          local(o.x, o.y, o.angle, u - 1, 14), local(o.x, o.y, o.angle, u + 11, 0), local(o.x, o.y, o.angle, u - 1, -14),
        ], `rgba(255, 230, 80, ${alpha})`);
      }
    }
  }

  // Water achter de schansen
  for (const r of ramps) {
    if (!r.G) continue;
    const p = toCam(r.x, r.y, 0);
    if (p.f < -(r.L + r.G + 200) || p.f > FAR) continue;
    const ww = HW + RUNOFF;
    fillPoly([local(r.x, r.y, r.angle, r.L, -ww), local(r.x, r.y, r.angle, r.L + r.G, -ww),
      local(r.x, r.y, r.angle, r.L + r.G, ww), local(r.x, r.y, r.angle, r.L, ww)], '#2a73c9');
    const wave = (performance.now() / 600) % 1;
    for (let k = 0; k < 4; k++) {
      const u = r.L + ((k + wave) / 4) * r.G;
      fillPoly([local(r.x, r.y, r.angle, u, -ww), local(r.x, r.y, r.angle, u + 4, -ww),
        local(r.x, r.y, r.angle, u + 4, ww), local(r.x, r.y, r.angle, u, ww)], 'rgba(170, 215, 255, 0.45)');
    }
  }

  // Schaduw onder de auto (op de grond, ook als je vliegt)
  const gi = rampInfo(car.x, car.y);
  const gh = gi && !gi.water ? gi.h + 0.5 : 0.5;
  const sc = 1 + Math.max(0, car.z - gh) / 60;
  fillPoly([
    local(car.x, car.y, car.a, -22 * sc, -13 * sc, gh), local(car.x, car.y, car.a, 22 * sc, -13 * sc, gh),
    local(car.x, car.y, car.a, 22 * sc, 13 * sc, gh), local(car.x, car.y, car.a, -22 * sc, 13 * sc, gh),
  ], `rgba(0, 0, 0, ${0.35 / sc})`);

  // Waas bij de horizon
  const fog = ctx.createLinearGradient(0, hz, 0, hz + 45);
  fog.addColorStop(0, 'rgba(203, 230, 255, 0.85)');
  fog.addColorStop(1, 'rgba(203, 230, 255, 0)');
  ctx.fillStyle = fog;
  ctx.fillRect(0, hz - 1, W, 46);

  // Rechtopstaande dingen: van ver naar dichtbij tekenen
  const items = [];

  // Muren
  for (const i of vis) {
    const j = (i + 1) % N;
    if (Math.min(cf[i], cf[j]) > FAR * 0.8) continue;
    const col = Math.floor(i / 3) % 2 ? '#e0333a' : '#e8eaf0';
    for (const side of [-1, 1]) {
      const off = side * (HW + RUNOFF);
      const pts = [edge(i, off, 0), edge(j, off, 0), edge(j, off, WALL_H), edge(i, off, WALL_H)];
      const depth = (pts[0].f + pts[1].f) / 2;
      items.push({ depth, draw: () => fillPoly(pts, col) });
    }
  }

  // Kegels en tonnen
  for (const o of obstacles) {
    if (o.type !== 'kegel' && o.type !== 'ton') continue;
    const p = toCam(o.x, o.y, 0);
    if (p.f < NEAR + 2 || p.f > FAR) continue;
    items.push({ depth: p.f, draw: () => drawPost(o, p) });
  }

  // Schansen
  for (const r of ramps) {
    const corners = [local(r.x, r.y, r.angle, 0, -r.RW), local(r.x, r.y, r.angle, r.L, -r.RW, r.H),
      local(r.x, r.y, r.angle, r.L, r.RW, r.H), local(r.x, r.y, r.angle, 0, r.RW)];
    const fmax = Math.max(...corners.map((p) => p.f));
    if (fmax < NEAR || Math.min(...corners.map((p) => p.f)) > FAR) continue;
    items.push({ depth: fmax, draw: () => drawRamp(r) });
  }

  // Auto
  const cp = toCam(car.x, car.y, 0);
  items.push({ depth: cp.f, draw: drawCar3D });

  items.sort((a, b) => b.depth - a.depth);
  for (const it of items) it.draw();
}

function drawRamp(r) {
  const L = (u, w, hh) => local(r.x, r.y, r.angle, u, w, hh);
  // Zijkanten
  fillPoly([L(0, -r.RW, 0), L(r.L, -r.RW, 0), L(r.L, -r.RW, r.H)], '#7a4a1e');
  fillPoly([L(0, r.RW, 0), L(r.L, r.RW, 0), L(r.L, r.RW, r.H)], '#7a4a1e');
  // Voorkant (zie je alleen van achteren)
  fillPoly([L(r.L, -r.RW, 0), L(r.L, r.RW, 0), L(r.L, r.RW, r.H), L(r.L, -r.RW, r.H)], '#5c3614');
  // Bovenkant in gele en zwarte stroken
  const strips = 6;
  for (let k = 0; k < strips; k++) {
    const u0 = (k / strips) * r.L, u1 = ((k + 1) / strips) * r.L;
    const h0 = (u0 / r.L) * r.H, h1 = (u1 / r.L) * r.H;
    fillPoly([L(u0, -r.RW, h0), L(u1, -r.RW, h1), L(u1, r.RW, h1), L(u0, r.RW, h0)], k % 2 ? '#222' : '#f2c230');
  }
}

// Kegel of ton als staand plaatje
function drawPost(o, p) {
  const k = cam3.focal / p.f;
  const base = proj(p);
  const w = o.r * k;
  if (o.type === 'kegel') {
    const hgt = 26 * k;
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.ellipse(base.x, base.y, w * 1.2, w * 0.35, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ff7a1a';
    ctx.beginPath();
    ctx.moveTo(base.x - w, base.y);
    ctx.lineTo(base.x + w, base.y);
    ctx.lineTo(base.x, base.y - hgt);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.moveTo(base.x - w * 0.62, base.y - hgt * 0.38);
    ctx.lineTo(base.x + w * 0.62, base.y - hgt * 0.38);
    ctx.lineTo(base.x + w * 0.42, base.y - hgt * 0.58);
    ctx.lineTo(base.x - w * 0.42, base.y - hgt * 0.58);
    ctx.closePath();
    ctx.fill();
  } else {
    const hgt = 30 * k;
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.ellipse(base.x, base.y, w * 1.15, w * 0.3, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#c0392b';
    ctx.fillRect(base.x - w, base.y - hgt, w * 2, hgt);
    ctx.fillStyle = '#8e2a20';
    ctx.fillRect(base.x - w, base.y - hgt * 0.35, w * 2, hgt * 0.08);
    ctx.fillRect(base.x - w, base.y - hgt * 0.72, w * 2, hgt * 0.08);
    ctx.fillStyle = 'rgba(255,255,255,0.18)';
    ctx.fillRect(base.x - w * 0.6, base.y - hgt, w * 0.3, hgt);
    ctx.fillStyle = '#d9574a';
    ctx.beginPath();
    ctx.ellipse(base.x, base.y - hgt, w, w * 0.28, 0, 0, Math.PI * 2);
    ctx.fill();
  }
}

function draw() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  cam3.shakeX = shake ? rand(-shake, shake) : 0;
  cam3.shakeY = shake ? rand(-shake, shake) : 0;
  drawWorld();

  if (state === 'menu') { drawMenu(); return; }
  drawHud();
  drawMinimap();
  if (state === 'countdown') drawBigText(String(Math.ceil(countdown)), '#ffd84a');
  if (goTimer > 0) drawBigText('GO!', '#5dff8a');
  if (state === 'paused') drawPanel('PAUZE', ['Druk op P of tik om verder te gaan']);
  if (state === 'finish') drawFinish();
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function panel(x, y, w, h) {
  ctx.fillStyle = 'rgba(8, 10, 24, 0.72)';
  roundRect(x, y, w, h, 10);
  ctx.fill();
}

function drawHud() {
  panel(14, 14, 230, 118);
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.fillStyle = '#9fb0ff';
  ctx.font = 'bold 15px system-ui, sans-serif';
  ctx.fillText(`RONDE ${Math.min(lap, LAPS)}/${LAPS}`, 28, 24);
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 34px ui-monospace, Consolas, monospace';
  ctx.fillText(fmt(raceTime), 28, 44);
  ctx.font = '14px ui-monospace, Consolas, monospace';
  ctx.fillStyle = '#cfd6ff';
  ctx.fillText(`Ronde  ${fmt(state === 'finish' ? lapTimes[lapTimes.length - 1] : lapTime)}`, 28, 86);
  ctx.fillStyle = '#ffd36b';
  ctx.fillText(`Snelst ${fmt(best.lap)}`, 28, 106);

  // Snelheid
  const kmh = Math.round(Math.abs(car.fwd || 0) * 0.45);
  panel(14, H - 74, 150, 60);
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 32px ui-monospace, Consolas, monospace';
  ctx.fillText(String(kmh).padStart(3, ' '), 28, H - 66);
  ctx.font = '14px system-ui, sans-serif';
  ctx.fillStyle = '#9fb0ff';
  ctx.fillText('km/u', 100, H - 52);
  if (car.air) { ctx.fillStyle = '#f2c230'; ctx.fillText('SPRONG!', 100, H - 34); }
  else if (car.offTrack) { ctx.fillStyle = '#7dff8a'; ctx.fillText('GRAS', 100, H - 34); }
  else if (car.onOil) { ctx.fillStyle = '#c59bff'; ctx.fillText('OLIE!', 100, H - 34); }
  else if (car.boost > 0) { ctx.fillStyle = '#ffb02e'; ctx.fillText('BOOST', 100, H - 34); }

  // Melding bij elke ronde
  if (toast) {
    ctx.globalAlpha = Math.min(1, toast.t * 2);
    panel(W / 2 - 160, 20, 320, 66);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 22px system-ui, sans-serif';
    ctx.fillText(toast.text, W / 2, 30);
    ctx.font = '15px system-ui, sans-serif';
    ctx.fillStyle = toast.good ? '#5dff8a' : '#ff6b6b';
    ctx.fillText(toast.sub, W / 2, 60);
    ctx.globalAlpha = 1;
  }
}

function drawMinimap() {
  const mw = 180;
  const s = mw / (bounds.maxX - bounds.minX);
  const mh = (bounds.maxY - bounds.minY) * s;
  const ox = W - mw - 24, oy = 24;
  panel(ox - 10, oy - 10, mw + 20, mh + 20);
  ctx.save();
  ctx.setTransform(s, 0, 0, s, ox - bounds.minX * s, oy - bounds.minY * s);
  ctx.strokeStyle = '#8a92b8';
  ctx.lineWidth = 60;
  ctx.lineJoin = 'round';
  ctx.stroke(trackPath);
  ctx.restore();
  // Start
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(ox + (track[0].x - bounds.minX) * s - 3, oy + (track[0].y - bounds.minY) * s - 3, 6, 6);
  // Schansen (geel) en water (blauw)
  for (const r of ramps) {
    ctx.fillStyle = r.G ? '#4aa3ff' : '#f2c230';
    ctx.fillRect(ox + (r.x - bounds.minX) * s - 3, oy + (r.y - bounds.minY) * s - 3, 6, 6);
  }
  // Auto
  ctx.fillStyle = '#ff3b3b';
  ctx.beginPath();
  ctx.arc(ox + (car.x - bounds.minX) * s, oy + (car.y - bounds.minY) * s, 4.5, 0, Math.PI * 2);
  ctx.fill();
}

function drawBigText(text, color) {
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = 'bold 110px system-ui, sans-serif';
  ctx.lineWidth = 10;
  ctx.strokeStyle = 'rgba(0, 0, 0, 0.6)';
  ctx.strokeText(text, W / 2, H / 2 - 30);
  ctx.fillStyle = color;
  ctx.fillText(text, W / 2, H / 2 - 30);
}

function drawPanel(title, lines) {
  ctx.fillStyle = 'rgba(5, 6, 20, 0.6)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 48px system-ui, sans-serif';
  ctx.fillText(title, W / 2, H / 2 - 40);
  ctx.font = '20px system-ui, sans-serif';
  ctx.fillStyle = '#cfd6ff';
  lines.forEach((l, i) => ctx.fillText(l, W / 2, H / 2 + 10 + i * 30));
}

function drawFinish() {
  ctx.fillStyle = 'rgba(5, 6, 20, 0.65)';
  ctx.fillRect(0, 0, W, H);
  const x = W / 2 - 200, y = 90, w = 400, h = 400;
  panel(x, y, w, h);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 40px system-ui, sans-serif';
  ctx.fillText('🏁 FINISH', W / 2, y + 22);

  ctx.font = 'bold 44px ui-monospace, Consolas, monospace';
  ctx.fillStyle = newBestTotal ? '#5dff8a' : '#ffffff';
  ctx.fillText(fmt(raceTime), W / 2, y + 80);
  ctx.font = '17px system-ui, sans-serif';
  ctx.fillStyle = newBestTotal ? '#5dff8a' : '#ffd36b';
  ctx.fillText(newBestTotal ? '🏆 Nieuw record!' : `Record: ${fmt(best.total)}`, W / 2, y + 135);

  const fastest = Math.min(...lapTimes);
  ctx.font = '18px ui-monospace, Consolas, monospace';
  lapTimes.forEach((t, i) => {
    ctx.fillStyle = t === fastest ? '#ffd36b' : '#cfd6ff';
    ctx.fillText(`Ronde ${i + 1}   ${fmt(t)}${t === fastest ? '  ★' : ''}`, W / 2, y + 180 + i * 30);
  });

  ctx.font = '15px system-ui, sans-serif';
  ctx.fillStyle = '#9fb0ff';
  ctx.fillText(`Snelste ronde ooit: ${fmt(best.lap)}${newBestLap ? '  (nieuw!)' : ''}`, W / 2, y + 290);
  if (finishTimer <= 0) {
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 18px system-ui, sans-serif';
    ctx.fillText('Enter of tik = opnieuw rijden', W / 2, y + 340);
  }
}

function drawMenu() {
  ctx.fillStyle = 'rgba(5, 6, 20, 0.55)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  ctx.save();
  ctx.shadowColor = '#ff3b3b';
  ctx.shadowBlur = 25;
  ctx.fillStyle = '#ff5a4a';
  ctx.font = 'italic bold 64px system-ui, sans-serif';
  ctx.fillText('TURBO TIJDRIT', W / 2, 120);
  ctx.restore();

  ctx.fillStyle = '#e8ecff';
  ctx.font = '19px system-ui, sans-serif';
  ctx.fillText(`Rij ${LAPS} rondes zo snel mogelijk. Alleen jij tegen de klok!`, W / 2, 190);

  ctx.font = '16px system-ui, sans-serif';
  ctx.fillStyle = '#cfd6ff';
  const lines = [
    '🟠 Kegels & 🔴 tonnen: daar bots je op',
    '⚫ Olie: je auto glijdt weg',
    '🟧 Boost-pad: extra snelheid!',
    '🟩 Gras: je rijdt een stuk langzamer',
    '🟨 Schans: spring over het water, neem genoeg aanloop!',
  ];
  lines.forEach((l, i) => ctx.fillText(l, W / 2, 245 + i * 30));

  ctx.fillStyle = '#ffd36b';
  ctx.font = '17px ui-monospace, Consolas, monospace';
  ctx.fillText(`Record: ${fmt(best.total)}   ·   Snelste ronde: ${fmt(best.lap)}`, W / 2, 415);

  if (Math.floor(performance.now() / 500) % 2 === 0) {
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 22px system-ui, sans-serif';
    ctx.fillText('Druk op ENTER of tik om te starten', W / 2, 475);
  }
}

// ================= Game loop =================
// Op de achtergrond van het menu staat de auto al op de startlijn
startRace();
state = 'menu';

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.033, (now - last) / 1000);
  last = now;
  update(dt);
  draw();
  updateEngineSound();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
  </script>
</body>
