<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meteorenregen</title>
  <style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  height: 100%;
  background: #05060f;
  color: #cfd6ff;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}

main {
  min-height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 12px;
}

canvas {
  display: block;
  height: min(80vh, 720px);
  aspect-ratio: 480 / 720;
  max-width: 100%;
  border-radius: 12px;
  border: 2px solid #232a55;
  box-shadow: 0 0 40px rgba(80, 120, 255, 0.25);
  touch-action: none;
  cursor: crosshair;
}

.knoppen {
  display: flex;
  gap: 10px;
}

button {
  background: #151a3a;
  color: #cfd6ff;
  border: 1px solid #2f3870;
  border-radius: 8px;
  padding: 8px 14px;
  font-size: 15px;
  cursor: pointer;
}

button:hover {
  background: #1f2652;
}

.uitleg {
  margin: 0;
  text-align: center;
  font-size: 13px;
  line-height: 1.5;
  opacity: 0.7;
}
</style>
</head>
<body>
  <main>
    <canvas id="game" width="480" height="720" aria-label="Meteorenregen spel"></canvas>
    <div class="knoppen">
      <button id="pauzeKnop" type="button">⏸ Pauze</button>
      <button id="geluidKnop" type="button">🔊 Geluid aan</button>
    </div>
    <p class="uitleg">
      Pijltjes/WASD = bewegen · Spatie = schieten · P = pauze · M = geluid<br>
      Op telefoon: sleep met je vinger, je schip schiet vanzelf.
    </p>
  </main>
  <script>
'use strict';

// ===== Basis =====
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width;
const H = canvas.height;

let state = 'menu'; // menu | playing | paused | over
let player, bullets, meteors, powerups, particles;
let score, lives, level, elapsed, spawnTimer, flash, overTimer, newRecord;

let highscore = 0;
try { highscore = parseInt(localStorage.getItem('meteorenregen_highscore'), 10) || 0; } catch (e) { /* geen opslag */ }

function saveHighscore() {
  try { localStorage.setItem('meteorenregen_highscore', String(highscore)); } catch (e) { /* geen opslag */ }
}

const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
const rand = (min, max) => min + Math.random() * (max - min);
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

// ===== Sterren op de achtergrond =====
const stars = Array.from({ length: 100 }, () => {
  const s = rand(0.3, 2.1);
  return { x: rand(0, W), y: rand(0, H), s, v: s * 45 };
});

// ===== Geluid (simpele piepjes, geen bestanden nodig) =====
let audio = null;
let muted = false;

function beep(freq, dur, type = 'square', vol = 0.05, slide = 0) {
  if (muted) return;
  try {
    if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
    const t = audio.currentTime;
    const osc = audio.createOscillator();
    const gain = audio.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain);
    gain.connect(audio.destination);
    osc.start(t);
    osc.stop(t + dur);
  } catch (e) { /* geluid niet beschikbaar */ }
}

// ===== Besturing =====
const keys = {};
const pointer = { active: false, x: 0, y: 0 };

addEventListener('keydown', (e) => {
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'].includes(e.code)) e.preventDefault();
  keys[e.code] = true;
  if (e.repeat) return;

  if ((e.code === 'Space' || e.code === 'Enter') && canStart()) startGame();
  else if (e.code === 'KeyP' || e.code === 'Escape') togglePause();
  else if (e.code === 'KeyM') toggleMute();
});
addEventListener('keyup', (e) => { keys[e.code] = false; });
addEventListener('blur', () => { if (state === 'playing') togglePause(); });

function toCanvas(e) {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) * (W / r.width), y: (e.clientY - r.top) * (H / r.height) };
}

canvas.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  if (canStart()) { startGame(); return; }
  if (state === 'paused') { togglePause(); return; }
  if (state !== 'playing') return;
  const p = toCanvas(e);
  pointer.active = true;
  pointer.x = p.x;
  pointer.y = p.y;
  try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* niet ondersteund */ }
});
canvas.addEventListener('pointermove', (e) => {
  if (!pointer.active) return;
  const p = toCanvas(e);
  pointer.x = p.x;
  pointer.y = p.y;
});
['pointerup', 'pointercancel'].forEach((t) => canvas.addEventListener(t, () => { pointer.active = false; }));

const pauzeKnop = document.getElementById('pauzeKnop');
const geluidKnop = document.getElementById('geluidKnop');
pauzeKnop.addEventListener('click', () => { togglePause(); pauzeKnop.blur(); });
geluidKnop.addEventListener('click', () => { toggleMute(); geluidKnop.blur(); });

function canStart() {
  return state === 'menu' || (state === 'over' && overTimer <= 0);
}

function togglePause() {
  if (state === 'playing') { state = 'paused'; pointer.active = false; }
  else if (state === 'paused') state = 'playing';
}

function toggleMute() {
  muted = !muted;
  geluidKnop.textContent = muted ? '🔇 Geluid uit' : '🔊 Geluid aan';
}

// ===== Spel starten / stoppen =====
function startGame() {
  player = { x: W / 2, y: H - 90, r: 18, speed: 380, cooldown: 0, shield: 0, triple: 0, invuln: 0 };
  bullets = [];
  meteors = [];
  powerups = [];
  particles = [];
  score = 0;
  lives = 3;
  level = 1;
  elapsed = 0;
  spawnTimer = 0.6;
  flash = 0;
  newRecord = false;
  state = 'playing';
  beep(330, 0.2, 'triangle', 0.06, 500);
}

function gameOver() {
  state = 'over';
  overTimer = 1;
  pointer.active = false;
  if (score > highscore) {
    highscore = score;
    newRecord = true;
    saveHighscore();
  }
  beep(300, 0.6, 'sawtooth', 0.06, -250);
}

// ===== Objecten maken =====
function makeMeteor(x, y, r) {
  const n = 9 + Math.floor(Math.random() * 4);
  const shape = Array.from({ length: n }, () => rand(0.72, 1.08));
  const hp = Math.ceil(r / 14);
  return {
    x, y, r, hp, maxHp: hp, shape,
    vx: rand(-35, 35),
    vy: 70 + level * 14 + rand(0, 60),
    rot: rand(0, Math.PI * 2),
    vr: rand(-1.2, 1.2),
    hit: 0,
    dead: false,
  };
}

function spawnMeteor() {
  const r = rand(16, 46);
  meteors.push(makeMeteor(rand(r, W - r), -r, r));
}

function shoot() {
  const y = player.y - 22;
  if (player.triple > 0) {
    bullets.push({ x: player.x, y, vx: 0, vy: -650 });
    bullets.push({ x: player.x - 8, y: y + 4, vx: -140, vy: -620 });
    bullets.push({ x: player.x + 8, y: y + 4, vx: 140, vy: -620 });
  } else {
    bullets.push({ x: player.x, y, vx: 0, vy: -650 });
  }
  beep(900, 0.05, 'square', 0.025, -400);
}

function explode(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    const a = rand(0, Math.PI * 2);
    const s = rand(40, 260);
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(0.4, 0.9), max: 0.9, color, size: rand(1.5, 3.5) });
  }
}

function destroyMeteor(m) {
  m.dead = true;
  score += Math.round(10 + m.r);
  explode(m.x, m.y, '#ffb36b', Math.round(m.r / 2) + 8);
  beep(160, 0.18, 'sawtooth', 0.05, -100);

  // Grote meteoren breken in twee stukken
  if (m.r > 32) {
    for (const side of [-1, 1]) {
      const piece = makeMeteor(m.x + side * 8, m.y, m.r * 0.55);
      piece.vx = side * rand(60, 110);
      piece.vy = m.vy * 0.9;
      meteors.push(piece);
    }
  }

  // Soms valt er een power-up uit
  if (Math.random() < 0.11) {
    const roll = Math.random();
    const type = roll < 0.4 ? 'shield' : roll < 0.85 ? 'triple' : 'life';
    powerups.push({ x: m.x, y: m.y, type, vy: 110, t: 0 });
  }
}

function applyPowerup(p) {
  if (p.type === 'shield') player.shield = 6;
  if (p.type === 'triple') player.triple = 8;
  if (p.type === 'life') lives = Math.min(5, lives + 1);
  score += 25;
  explode(p.x, p.y, '#ffffff', 14);
  beep(600, 0.25, 'triangle', 0.06, 700);
}

// ===== Update =====
function update(dt) {
  for (const s of stars) {
    s.y += s.v * dt * (state === 'playing' ? 1 + level * 0.08 : 0.4);
    if (s.y > H) { s.y = 0; s.x = rand(0, W); }
  }

  if (state === 'over') overTimer -= dt;
  if (state !== 'playing') {
    updateParticles(dt);
    return;
  }

  elapsed += dt;
  level = 1 + Math.floor(elapsed / 20);

  // Bewegen
  let dx = 0, dy = 0;
  if (keys.ArrowLeft || keys.KeyA) dx -= 1;
  if (keys.ArrowRight || keys.KeyD) dx += 1;
  if (keys.ArrowUp || keys.KeyW) dy -= 1;
  if (keys.ArrowDown || keys.KeyS) dy += 1;

  if (dx || dy) {
    const len = Math.hypot(dx, dy);
    player.x += (dx / len) * player.speed * dt;
    player.y += (dy / len) * player.speed * dt;
  } else if (pointer.active) {
    // Schip volgt je vinger/muis (iets erboven, zodat je vinger het schip niet bedekt)
    const tx = pointer.x;
    const ty = pointer.y - 60;
    const ddx = tx - player.x;
    const ddy = ty - player.y;
    const d = Math.hypot(ddx, ddy);
    const step = Math.min(d, player.speed * 1.7 * dt);
    if (d > 0.5) {
      player.x += (ddx / d) * step;
      player.y += (ddy / d) * step;
    }
  }
  player.x = clamp(player.x, player.r, W - player.r);
  player.y = clamp(player.y, H * 0.45, H - 30);

  // Schieten
  player.cooldown -= dt;
  if ((keys.Space || pointer.active) && player.cooldown <= 0) {
    shoot();
    player.cooldown = 0.17;
  }

  player.shield = Math.max(0, player.shield - dt);
  player.triple = Math.max(0, player.triple - dt);
  player.invuln = Math.max(0, player.invuln - dt);
  flash = Math.max(0, flash - dt);

  // Nieuwe meteoren
  spawnTimer -= dt;
  if (spawnTimer <= 0) {
    spawnMeteor();
    spawnTimer = Math.max(0.25, 1.1 - level * 0.08) * rand(0.6, 1.4);
  }

  // Kogels
  for (const b of bullets) {
    b.x += b.vx * dt;
    b.y += b.vy * dt;
  }
  bullets = bullets.filter((b) => !b.dead && b.y > -20 && b.x > -20 && b.x < W + 20);

  // Meteoren
  for (const m of meteors) {
    m.x += m.vx * dt;
    m.y += m.vy * dt;
    m.rot += m.vr * dt;
    m.hit = Math.max(0, m.hit - dt);
    if (m.x < m.r) { m.x = m.r; m.vx = Math.abs(m.vx); }
    if (m.x > W - m.r) { m.x = W - m.r; m.vx = -Math.abs(m.vx); }
  }

  // Kogel raakt meteoor
  for (const b of bullets) {
    for (const m of meteors) {
      if (b.dead || m.dead) continue;
      if (dist(b, m) < m.r) {
        b.dead = true;
        m.hp -= 1;
        m.hit = 0.08;
        explode(b.x, b.y, '#9fd8ff', 4);
        if (m.hp <= 0) destroyMeteor(m);
      }
    }
  }

  // Meteoor raakt speler
  for (const m of meteors) {
    if (m.dead) continue;
    if (dist(m, player) < m.r * 0.85 + player.r * 0.8) {
      if (player.shield > 0) {
        destroyMeteor(m);
      } else if (player.invuln <= 0) {
        m.dead = true;
        lives -= 1;
        player.invuln = 2;
        flash = 0.3;
        explode(player.x, player.y, '#ff5577', 35);
        beep(120, 0.4, 'sawtooth', 0.08, -60);
        if (lives <= 0) { gameOver(); break; }
      }
    }
  }
  meteors = meteors.filter((m) => !m.dead && m.y < H + m.r + 10);

  // Power-ups
  for (const p of powerups) {
    p.y += p.vy * dt;
    p.t += dt;
    if (!p.dead && dist(p, player) < player.r + 14) {
      p.dead = true;
      applyPowerup(p);
    }
  }
  powerups = powerups.filter((p) => !p.dead && p.y < H + 20);

  updateParticles(dt);
}

function updateParticles(dt) {
  if (!particles) return;
  for (const p of particles) {
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vx *= 0.97;
    p.vy *= 0.97;
    p.life -= dt;
  }
  particles = particles.filter((p) => p.life > 0);
}

// ===== Tekenen =====
function draw() {
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#070a1f');
  bg.addColorStop(1, '#12082a');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  for (const s of stars) {
    ctx.globalAlpha = 0.3 + s.s * 0.3;
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(s.x, s.y, s.s, s.s * 1.6);
  }
  ctx.globalAlpha = 1;

  if (state === 'menu') {
    drawMenu();
    return;
  }

  for (const p of powerups) drawPowerup(p);
  for (const m of meteors) drawMeteor(m);
  drawBullets();
  if (state !== 'over') drawShip();
  drawParticles();

  if (flash > 0) {
    ctx.fillStyle = `rgba(255, 60, 90, ${flash})`;
    ctx.fillRect(0, 0, W, H);
  }

  drawHud();

  if (state === 'paused') drawOverlay('PAUZE', ['Druk op P of tik om verder te gaan']);
  if (state === 'over') {
    const lines = [`Score: ${score}`, newRecord ? '🏆 Nieuw record!' : `Record: ${highscore}`];
    if (overTimer <= 0) lines.push('', 'Spatie of tik = opnieuw spelen');
    drawOverlay('GAME OVER', lines);
  }
}

function drawShip() {
  const { x, y } = player;
  if (player.invuln > 0 && Math.floor(player.invuln * 12) % 2 === 0) return;

  // Vlam
  const flame = rand(10, 20);
  ctx.fillStyle = '#ff9f3a';
  ctx.beginPath();
  ctx.moveTo(x - 7, y + 12);
  ctx.lineTo(x, y + 12 + flame);
  ctx.lineTo(x + 7, y + 12);
  ctx.closePath();
  ctx.fill();

  // Romp
  ctx.save();
  ctx.shadowColor = '#4fd8ff';
  ctx.shadowBlur = 18;
  ctx.fillStyle = '#58d6ff';
  ctx.beginPath();
  ctx.moveTo(x, y - 24);
  ctx.lineTo(x + 19, y + 16);
  ctx.lineTo(x + 6, y + 10);
  ctx.lineTo(x - 6, y + 10);
  ctx.lineTo(x - 19, y + 16);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  // Cockpit
  ctx.fillStyle = '#0b1640';
  ctx.beginPath();
  ctx.ellipse(x, y - 2, 4, 8, 0, 0, Math.PI * 2);
  ctx.fill();

  // Schild
  if (player.shield > 0) {
    const blink = player.shield < 1.5 && Math.floor(player.shield * 8) % 2 === 0;
    if (!blink) {
      ctx.strokeStyle = 'rgba(120, 200, 255, 0.85)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(x, y, 32, 0, Math.PI * 2);
      ctx.stroke();
      ctx.fillStyle = 'rgba(120, 200, 255, 0.12)';
      ctx.fill();
    }
  }
}

function drawBullets() {
  ctx.save();
  ctx.shadowColor = '#bfefff';
  ctx.shadowBlur = 10;
  ctx.fillStyle = '#e6fbff';
  for (const b of bullets) ctx.fillRect(b.x - 2, b.y - 8, 4, 14);
  ctx.restore();
}

function drawMeteor(m) {
  ctx.save();
  ctx.translate(m.x, m.y);
  ctx.rotate(m.rot);
  ctx.beginPath();
  m.shape.forEach((k, i) => {
    const a = (i / m.shape.length) * Math.PI * 2;
    const px = Math.cos(a) * m.r * k;
    const py = Math.sin(a) * m.r * k;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  });
  ctx.closePath();
  ctx.fillStyle = m.hit > 0 ? '#ffffff' : '#7d6a5a';
  ctx.fill();
  ctx.strokeStyle = '#4a3c31';
  ctx.lineWidth = 3;
  ctx.stroke();

  // Kraters
  ctx.fillStyle = 'rgba(0, 0, 0, 0.22)';
  ctx.beginPath();
  ctx.arc(m.r * 0.25, -m.r * 0.2, m.r * 0.2, 0, Math.PI * 2);
  ctx.arc(-m.r * 0.3, m.r * 0.25, m.r * 0.14, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // Levensbalk voor sterke meteoren
  if (m.maxHp > 1 && m.hp < m.maxHp) {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
    ctx.fillRect(m.x - m.r, m.y - m.r - 10, m.r * 2, 4);
    ctx.fillStyle = '#ff7a59';
    ctx.fillRect(m.x - m.r, m.y - m.r - 10, (m.r * 2 * m.hp) / m.maxHp, 4);
  }
}

const POWERUP_STYLE = {
  shield: { color: '#5ab8ff', label: 'S' },
  triple: { color: '#ffae3d', label: '3' },
  life: { color: '#ff5d8f', label: '♥' },
};

function drawPowerup(p) {
  const st = POWERUP_STYLE[p.type];
  const pulse = 1 + Math.sin(p.t * 8) * 0.1;
  ctx.save();
  ctx.shadowColor = st.color;
  ctx.shadowBlur = 16;
  ctx.fillStyle = st.color;
  ctx.beginPath();
  ctx.arc(p.x, p.y, 13 * pulse, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
  ctx.fillStyle = '#0a0f2a';
  ctx.font = 'bold 15px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(st.label, p.x, p.y + 1);
}

function drawParticles() {
  if (!particles) return;
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life / p.max);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, p.size, p.size);
  }
  ctx.globalAlpha = 1;
}

function drawHud() {
  ctx.textBaseline = 'top';
  ctx.font = 'bold 20px system-ui, sans-serif';
  ctx.fillStyle = '#ffffff';
  ctx.textAlign = 'left';
  ctx.fillText(`Score ${score}`, 14, 12);
  ctx.textAlign = 'right';
  ctx.fillStyle = '#ffd36b';
  ctx.fillText(`Record ${Math.max(highscore, score)}`, W - 14, 12);

  ctx.font = '15px system-ui, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillStyle = '#ff5d8f';
  ctx.fillText('♥'.repeat(Math.max(0, lives)), 14, 40);
  ctx.textAlign = 'right';
  ctx.fillStyle = '#9fb0ff';
  ctx.fillText(`Level ${level}`, W - 14, 40);

  // Power-up timers
  let y = 66;
  const bar = (label, time, max, color) => {
    ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
    ctx.fillRect(14, y, 90, 6);
    ctx.fillStyle = color;
    ctx.fillRect(14, y, 90 * (time / max), 6);
    ctx.textAlign = 'left';
    ctx.font = '12px system-ui, sans-serif';
    ctx.fillText(label, 110, y - 4);
    y += 16;
  };
  if (player && player.shield > 0) bar('Schild', player.shield, 6, '#5ab8ff');
  if (player && player.triple > 0) bar('Driedubbel schot', player.triple, 8, '#ffae3d');
}

function drawOverlay(title, lines) {
  ctx.fillStyle = 'rgba(5, 6, 20, 0.7)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 46px system-ui, sans-serif';
  ctx.fillText(title, W / 2, H / 2 - 60);
  ctx.font = '20px system-ui, sans-serif';
  lines.forEach((l, i) => {
    ctx.fillStyle = l.startsWith('🏆') ? '#ffd36b' : '#cfd6ff';
    ctx.fillText(l, W / 2, H / 2 + i * 30);
  });
}

function drawMenu() {
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  ctx.save();
  ctx.shadowColor = '#ff8a3d';
  ctx.shadowBlur = 25;
  ctx.fillStyle = '#ffb36b';
  ctx.font = 'bold 50px system-ui, sans-serif';
  ctx.fillText('METEOREN', W / 2, 170);
  ctx.fillStyle = '#58d6ff';
  ctx.shadowColor = '#4fd8ff';
  ctx.fillText('REGEN', W / 2, 225);
  ctx.restore();

  ctx.fillStyle = '#cfd6ff';
  ctx.font = '17px system-ui, sans-serif';
  const info = [
    'Schiet de meteoren kapot voordat ze je raken.',
    'Grote meteoren breken in stukken!',
    '',
    'Power-ups:',
  ];
  info.forEach((l, i) => ctx.fillText(l, W / 2, 310 + i * 28));

  const items = [['shield', 'Schild (6 sec)'], ['triple', 'Driedubbel schot (8 sec)'], ['life', 'Extra leven']];
  items.forEach(([type, text], i) => {
    const y = 430 + i * 36;
    drawPowerup({ x: W / 2 - 110, y, type, t: performance.now() / 1000 });
    ctx.fillStyle = '#cfd6ff';
    ctx.font = '17px system-ui, sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, W / 2 - 85, y);
    ctx.textAlign = 'center';
  });

  const blink = Math.floor(performance.now() / 500) % 2 === 0;
  if (blink) {
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 20px system-ui, sans-serif';
    ctx.fillText('Druk op SPATIE of tik om te starten', W / 2, 590);
  }
  if (highscore > 0) {
    ctx.fillStyle = '#ffd36b';
    ctx.font = '16px system-ui, sans-serif';
    ctx.fillText(`Jouw record: ${highscore}`, W / 2, 630);
  }
}

// ===== Game loop =====
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.033, (now - last) / 1000);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
