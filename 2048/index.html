  <script>
'use strict';
// ================= Game Arcade: instellingen + muziek (gedeeld door alle pagina's) =================
const ArcadeCore = (() => {
  const KEY = 'arcade_settings';
  const DEF = { music: 0.5, sfx: 0.8, quality: 'normaal', muted: false };
  let S = { ...DEF };
  try { Object.assign(S, JSON.parse(localStorage.getItem(KEY)) || {}); } catch (e) { /* standaard */ }
  const listeners = [];
  const save = () => {
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* */ }
    listeners.forEach((f) => f(S));
  };
  const set = (k, v) => { S[k] = v; save(); };
  const sfx = () => (S.muted ? 0 : S.sfx);
  const musicVol = () => (S.muted ? 0 : S.music);
  // Hoeveel pixels we tekenen: lager = soepeler op trage apparaten
  const dprCap = () => ({ hoog: 2, normaal: 1.5, laag: 1 })[S.quality] || 1.5;

  // ---------- Muziek: kleine sequencer met drums, bas, akkoorden en melodie ----------
  const SCALE = [0, 2, 3, 5, 7, 8, 10]; // mineur
  function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
  // Elke game een eigen nummer
  const SONGS = {
    menu:     { bpm: 92,  root: 57, prog: [[0, 3, 7], [-4, 0, 3], [3, 7, 10], [-2, 2, 5]], kick: 'x.......x.......', snare: '....x.......x...', hat: '..x...x...x...x.', bass: 'x.....x.x.......', arp: true,  lead: 'triangle', seed: 3, density: 0.35, pad: 'triangle' },
    race:     { bpm: 128, root: 52, prog: [[0, 3, 7], [-4, 0, 3], [-2, 2, 5], [-5, -1, 2]], kick: 'x...x...x...x...', snare: '....x.......x...', hat: 'x.x.x.x.x.x.x.xo', bass: 'x.xox.xox.xox.xo', arp: true,  lead: 'sawtooth', seed: 11, density: 0.45, pad: 'sawtooth' },
    meteoren: { bpm: 140, root: 50, prog: [[0, 3, 7], [1, 5, 8], [-2, 2, 5], [0, 3, 7]], kick: 'x..x..x.x..x..x.', snare: '....x.......x..x', hat: 'xxxxxxxxxxxxxxxx', bass: 'xxoxxxoxxxoxxxox', arp: false, lead: 'square', seed: 21, density: 0.55, pad: 'sawtooth' },
    runner:   { bpm: 124, root: 54, prog: [[0, 3, 7], [-4, 0, 3], [3, 7, 10], [-2, 2, 5]], kick: 'x...x...x...x...', snare: '....x.......x...', hat: '..o...o...o...o.', bass: 'x.x.x.x.x.x.x.x.', arp: true,  lead: 'sawtooth', seed: 31, density: 0.4, pad: 'sawtooth' },
    snake:    { bpm: 112, root: 60, prog: [[0, 3, 7], [5, 8, 12], [3, 7, 10], [-2, 2, 5]], kick: 'x.....x.x.......', snare: '....x.......x...', hat: 'x.x.x.x.x.x.x.x.', bass: 'x...o...x...o...', arp: false, lead: 'square', seed: 41, density: 0.6, pad: null },
    2048:     { bpm: 84,  root: 55, prog: [[0, 3, 7, 10], [-4, 0, 3, 7], [3, 7, 10, 14], [-2, 2, 5, 9]], kick: 'x.........x.....', snare: '....x.......x...', hat: '..x...x...x..xx.', bass: 'x.......x..x....', arp: false, lead: 'triangle', seed: 51, density: 0.25, pad: 'triangle' },
    blokken:  { bpm: 120, root: 57, prog: [[0, 3, 7], [-2, 2, 5], [-4, 0, 3], [-5, -1, 2]], kick: 'x...x...x...x...', snare: '....x.......x...', hat: 'x.x.x.x.x.x.x.x.', bass: 'x.o.x.o.x.o.x.o.', arp: false, lead: 'square', seed: 61, density: 0.65, pad: null },
    overval:  { bpm: 132, root: 50, prog: [[0, 3, 7], [0, 3, 7], [1, 5, 8], [-2, 2, 5]], kick: 'x..x..x...x..x..', snare: '....x.......x...', hat: 'x.xxx.xxx.xxx.xx', bass: 'x..x..x.x..x..xo', arp: false, lead: 'sawtooth', seed: 81, density: 0.35, pad: 'sawtooth' },
    td:       { bpm: 108, root: 55, prog: [[0, 3, 7], [-4, 0, 3], [-2, 2, 5], [3, 7, 10]], kick: 'x.......x.x.....', snare: '....x.......x...', hat: 'x.x.x.x.x.x.x.x.', bass: 'x...x.o.x...x.o.', arp: true, lead: 'triangle', seed: 91, density: 0.4, pad: 'triangle' },
    mijnen:   { bpm: 80,  root: 57, prog: [[0, 4, 7], [-3, 0, 4], [-7, -3, 0], [-5, -1, 2]], kick: 'x.........x.....', snare: '................', hat: '........x.......', bass: 'x.......x.......', arp: true,  lead: 'sine', seed: 81, density: 0.25, pad: 'triangle' },
    sudoku:   { bpm: 72,  root: 60, prog: [[0, 4, 7], [5, 9, 12], [-3, 0, 4], [-5, -1, 2]], kick: 'x...............', snare: '................', hat: '................', bass: 'x.......x.......', arp: true,  lead: 'sine', seed: 91, density: 0.2, pad: 'triangle' },
    memory:   { bpm: 88,  root: 62, prog: [[0, 4, 7], [-5, -1, 2], [-3, 0, 4], [-7, -3, 0]], kick: 'x.......x.......', snare: '................', hat: '....x.......x...', bass: 'x...x...x...x...', arp: true,  lead: 'triangle', seed: 101, density: 0.3, pad: 'triangle' },
    vier:     { bpm: 84,  root: 55, prog: [[0, 3, 7], [-4, 0, 3], [-2, 2, 5], [-5, -2, 2]], kick: 'x.......x.......', snare: '............x...', hat: '..x.......x.....', bass: 'x.....x.........', arp: false, lead: 'triangle', seed: 111, density: 0.28, pad: 'triangle' },
    pool:     { bpm: 92,  root: 43, prog: [[0, 4, 7, 10], [5, 9, 12, 15], [2, 5, 9, 12], [7, 11, 14, 17]], kick: 'x.......x.......', snare: '....x.......x...', hat: 'x.x.x.x.x.x.x.x.', bass: 'x...x..xx...x...', arp: false, lead: 'triangle', seed: 31, density: 0.18, pad: 'sine' },
    voetbal:  { bpm: 128, root: 50, prog: [[0, 4, 7], [5, 9, 12], [7, 11, 14], [5, 9, 12]], kick: 'x...x...x...x...', snare: '....x.......x...', hat: '..x...x...x...x.', bass: 'x..x..x.x..x..x.', arp: true,  lead: 'square', seed: 77, density: 0.3, pad: 'sawtooth' },
    escape:   { bpm: 84,  root: 45, prog: [[0, 3, 7], [-4, 0, 3], [-2, 1, 5], [-5, -2, 2]], kick: 'x.......x.......', snare: '........x.......', hat: '....x.......x...', bass: 'x.......x...x...', arp: true,  lead: 'triangle', seed: 171, density: 0.22, pad: 'triangle' },
    moto:     { bpm: 132, root: 50, prog: [[0, 3, 7], [-2, 2, 5], [-4, 0, 3], [-5, -1, 2]], kick: 'x...x...x...x...', snare: '....x.......x...', hat: 'x.xox.xox.xox.xo', bass: 'x.x.xox.x.x.xox.', arp: true,  lead: 'sawtooth', seed: 151, density: 0.42, pad: 'sawtooth' },
    tycoon:   { bpm: 96,  root: 57, prog: [[0, 4, 7], [-3, 0, 4], [5, 9, 12], [-5, -1, 2]], kick: 'x.......x.......', snare: '....x.......x...', hat: '..x...x...x...x.', bass: 'x..x..x.x..x..x.', arp: true,  lead: 'triangle', seed: 131, density: 0.32, pad: 'triangle' },
    patience: { bpm: 70,  root: 58, prog: [[0, 4, 7, 11], [-3, 0, 4, 7], [5, 9, 12, 16], [-5, -1, 2, 5]], kick: 'x...............', snare: '................', hat: '................', bass: 'x.......x.......', arp: true,  lead: 'sine', seed: 121, density: 0.18, pad: 'triangle' },
    stack:    { bpm: 100, root: 59, prog: [[0, 3, 7], [3, 7, 10], [-4, 0, 3], [-2, 2, 5]], kick: 'x.......x.......', snare: '........x.......', hat: 'x...x...x...x...', bass: 'x.....x.........', arp: true,  lead: 'triangle', seed: 71, density: 0.3, pad: 'triangle' },
  };
  // Melodie maken uit de toonladder (altijd hetzelfde per nummer)
  function makeMelody(song) {
    const R = rng(song.seed);
    const motif = [];
    for (let i = 0; i < 32; i++) {
      if (R() > song.density || i % 2 === 1 && R() < 0.5) { motif.push(null); continue; }
      const deg = Math.floor(R() * 7) + (R() < 0.3 ? 7 : 0);
      const len = R() < 0.25 ? 3 : R() < 0.5 ? 2 : 1;
      motif.push({ deg, len });
    }
    const mel = [];
    for (let bar = 0; bar < 8; bar++) {
      for (let i = 0; i < 16; i++) {
        let m = motif[(bar % 2) * 16 + i];
        if (m && bar >= 4 && bar % 2 === 1 && i > 8) m = { deg: m.deg + 2, len: m.len }; // kleine variatie
        mel.push(m);
      }
    }
    return mel;
  }
  for (const k in SONGS) SONGS[k].mel = makeMelody(SONGS[k]);

  let ac = null, master = null, delayIn = null, reverbIn = null, duck = null, noise = null, timer = null;
  let song = null, wanted = null, step = 0, nextT = 0;
  const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);
  // Galm: zelf gemaakte impulsrespons (geen bestanden nodig)
  function makeReverb(sec = 2.2) {
    const len = Math.floor(ac.sampleRate * sec), buf = ac.createBuffer(2, len, ac.sampleRate);
    for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3.2); }
    const cv = ac.createConvolver(); cv.buffer = buf; return cv;
  }
  function initAudio() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    try {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      master = ac.createGain();
      master.gain.value = musicVol() * 0.5;
      const comp = ac.createDynamicsCompressor();
      comp.threshold.value = -16; comp.ratio.value = 3.5; comp.attack.value = 0.004; comp.release.value = 0.2;
      const warm = ac.createBiquadFilter(); warm.type = 'highshelf'; warm.frequency.value = 6000; warm.gain.value = -4;
      master.connect(warm); warm.connect(comp); comp.connect(ac.destination);
      // 'duck' zakt even weg op elke kick (pompend effect zoals in echte dance-muziek)
      duck = ac.createGain(); duck.connect(master);
      // Echo voor melodie
      delayIn = ac.createGain(); delayIn.gain.value = 0.2;
      const d = ac.createDelay(); d.delayTime.value = 0.3;
      const fb = ac.createGain(); fb.gain.value = 0.32;
      const dlp = ac.createBiquadFilter(); dlp.type = 'lowpass'; dlp.frequency.value = 2400;
      delayIn.connect(d); d.connect(dlp); dlp.connect(fb); fb.connect(d); dlp.connect(duck);
      reverbIn = ac.createGain(); reverbIn.gain.value = 0.28;
      const rv = makeReverb(); reverbIn.connect(rv); rv.connect(duck);
      noise = ac.createBuffer(1, Math.floor(ac.sampleRate * 0.5), ac.sampleRate);
      const data = noise.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
    } catch (e) { ac = null; }
  }
  function env(g, t, a, peak, dur) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  }
  function out(node, pan = 0) {
    if (pan && ac.createStereoPanner) { const p = ac.createStereoPanner(); p.pan.value = pan; node.connect(p); return p; }
    return node;
  }
  function kick(t) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(160, t);
    o.frequency.exponentialRampToValueAtTime(45, t + 0.12);
    env(g, t, 0.002, 0.95, 0.28);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.3);
    noiseHit(t, 3000, 0.12, 0.012, 0, master);            // tikje voor de aanslag
    duck.gain.cancelScheduledValues(t);
    duck.gain.setValueAtTime(0.45, t); duck.gain.linearRampToValueAtTime(1, t + 0.22);
  }
  function noiseHit(t, hp, peak, dur, pan = 0, dest = null, type = 'highpass', q = 0.7) {
    const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = noise;
    f.type = type; f.frequency.value = hp; f.Q.value = q;
    env(g, t, 0.002, peak, dur);
    s.connect(f); f.connect(g); out(g, pan).connect(dest || master);
    s.start(t, Math.random() * 0.3); s.stop(t + dur + 0.02);
    return g;
  }
  function snare(t) {
    const g = noiseHit(t, 1800, 0.32, 0.18, 0, master, 'bandpass', 0.6);
    g.connect(reverbIn);
    const o = ac.createOscillator(), g2 = ac.createGain();
    o.type = 'triangle'; o.frequency.setValueAtTime(220, t); o.frequency.exponentialRampToValueAtTime(140, t + 0.08);
    env(g2, t, 0.002, 0.22, 0.1); o.connect(g2); g2.connect(master); o.start(t); o.stop(t + 0.12);
  }
  // Toon met twee licht ontstemde oscillatoren en een filter dat 'opengaat'
  function tone(t, midi, dur, type, vol, cutoff, echo, attack = 0.006, opt = {}) {
    const f = ac.createBiquadFilter(), g = ac.createGain();
    f.type = 'lowpass'; f.Q.value = opt.q || 0.8;
    f.frequency.setValueAtTime(cutoff * (opt.sweep ? 0.25 : 1), t);
    if (opt.sweep) f.frequency.exponentialRampToValueAtTime(cutoff, t + Math.min(dur, 0.08)), f.frequency.exponentialRampToValueAtTime(cutoff * 0.35, t + dur);
    const n = opt.unison ? 2 : 1;
    for (let k = 0; k < n; k++) {
      const o = ac.createOscillator();
      o.type = type; o.frequency.value = mtof(midi); o.detune.value = n > 1 ? (k ? 9 : -9) : 0;
      if (opt.vib) { const l = ac.createOscillator(), lg = ac.createGain(); l.frequency.value = 5.5; lg.gain.value = 7; l.connect(lg); lg.connect(o.detune); l.start(t + 0.12); l.stop(t + dur + 0.05); }
      o.connect(f); o.start(t); o.stop(t + dur + 0.05);
    }
    env(g, t, attack, vol / n, dur);
    f.connect(g);
    const dst = out(g, opt.pan || 0);
    dst.connect(opt.dry ? master : duck);
    if (echo) dst.connect(delayIn);
    if (opt.verb) dst.connect(reverbIn);
  }
  function playStep(s, t) {
    const sp = 60 / song.bpm / 4;
    const i = s % 16, barN = Math.floor(s / 16), bar = barN % 4, chord = song.prog[bar];
    const intro = barN < 2 && song.introDone !== true;
    const fill = barN % 8 === 7 && i >= 12;                       // drumroffel aan het eind van elke 8 maten
    if (!intro) {
      if (song.kick[i] === 'x') kick(t);
      if (song.snare[i] === 'x' || (fill && i % 2 === 0)) snare(t);
      if (song.hat[i] === 'x') noiseHit(t, 8000, 0.06 + (i % 4 === 2 ? 0.03 : 0), 0.03, i % 2 ? 0.25 : -0.25);
      if (song.hat[i] === 'o') noiseHit(t, 7000, 0.08, 0.16, 0.2);
      if (barN % 8 === 0 && i === 0 && song.introDone) noiseHit(t, 5000, 0.12, 1.4, 0, reverbIn);  // bekken
    }
    const b = song.bass[i];
    if (b !== '.') tone(t, song.root - 12 + chord[0] + (b === 'o' ? 12 : 0), sp * 0.9, 'sawtooth', 0.2, 900, false, 0.004, { sweep: true, unison: true, q: 4 });
    if (song.pad && i === 0) for (const n of chord) tone(t, song.root + n, sp * 16 * 0.98, song.pad, 0.045, intro ? 700 : 1500, false, 0.35, { unison: true, verb: true, pan: (n % 3 - 1) * 0.3 });
    if (song.arp && i % 2 === 0) tone(t, song.root + 12 + chord[(i / 2) % chord.length] + (barN % 2 && i >= 8 ? 12 : 0), sp * 0.7, 'square', 0.022, 2400, true, 0.003, { pan: ((i / 2) % 2 ? 0.35 : -0.35) });
    const m = song.mel[s % song.mel.length];
    if (m && !intro) {
      const deg = m.deg;
      const note = song.root + 12 + SCALE[deg % 7] + 12 * Math.floor(deg / 7);
      tone(t, note, sp * m.len * 0.95, song.lead, 0.055, song.lead === 'sawtooth' ? 2600 : 3800, true, 0.008, { vib: m.len > 1, verb: true, unison: song.lead === 'sawtooth' });
    }
  }
  function tick() {
    if (!ac || !song) return;
    const sp = 60 / song.bpm / 4;
    if (nextT < ac.currentTime) nextT = ac.currentTime + 0.05;
    while (nextT < ac.currentTime + 0.15) {
      playStep(step, nextT);
      nextT += sp;
      step++;
      if (step >= 128) { step = 0; song.introDone = true; }
    }
  }
  function startIfWanted() {
    if (!wanted) return;
    initAudio();
    if (!ac) return;
    if (song !== SONGS[wanted]) { song = SONGS[wanted]; step = 0; nextT = ac.currentTime + 0.1; }
    if (!timer) timer = setInterval(tick, 25);
  }
  // Muziek mag pas starten na een klik of toetsaanslag (regel van browsers)
  addEventListener('pointerdown', startIfWanted);
  addEventListener('keydown', startIfWanted);
  document.addEventListener('visibilitychange', () => {
    if (!ac) return;
    if (document.hidden) ac.suspend(); else ac.resume();
  });
  listeners.push(() => { if (master) master.gain.setTargetAtTime(musicVol() * 0.5, ac.currentTime, 0.1); });

  const music = { play(name) { wanted = name; if (ac) startIfWanted(); }, status: () => ({ running: !!timer, song: wanted, step, audio: ac ? ac.state : 'geen' }) };

  // ---------- Instellingenpaneel ----------
  const CSS = `
  .ac-gear { position: fixed; top: 12px; right: 12px; z-index: 50; width: 42px; height: 42px; border-radius: 12px; cursor: pointer;
    background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.22); color: #fff; display: flex; align-items: center; justify-content: center; padding: 0; }
  .ac-gear:hover { background: rgba(255,255,255,0.2); }
  .ac-gear svg { width: 22px; height: 22px; transition: transform 0.4s ease; }
  .ac-gear:hover svg { transform: rotate(60deg); }
  .ac-ov { position: fixed; inset: 0; z-index: 60; background: rgba(5,6,9,0.6); display: none; align-items: center; justify-content: center; padding: 16px;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-user-select: none; user-select: none; }
  .ac-ov.open { display: flex; }
  .ac-card { width: min(380px, 100%); background: #16181d; border: 1px solid rgba(255,255,255,0.14); border-radius: 18px; padding: 20px 22px; color: #fff;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
  .ac-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .ac-head b { font-size: 20px; font-weight: 900; }
  .ac-x { background: rgba(255,255,255,0.1); border: 0; color: #fff; width: 34px; height: 34px; border-radius: 10px; cursor: pointer; font-size: 16px; }

// ================= Gedeeld voor alle games: opslag, geluid, scherm, knoppen =================
const Arcade = (() => {
  const load = (k, d) => { try { const v = localStorage.getItem('arcade_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } };
  const save = (k, v) => { try { localStorage.setItem('arcade_' + k, JSON.stringify(v)); } catch (e) { /* uit */ } };
  let audio = null;

  function initAudio() {
    if (audio) { if (audio.state === 'suspended') audio.resume(); return; }
    try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audio = null; }
  }
  addEventListener('pointerdown', initAudio);
  addEventListener('keydown', initAudio);

  let sfxBus = null, noiseBuf = null;
  function bus() {
    if (sfxBus || !audio) return sfxBus;
    // zachte filter + compressor: effecten klinken voller en minder schel
    const lp = audio.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 5200;
    const comp = audio.createDynamicsCompressor(); comp.threshold.value = -12; comp.ratio.value = 4;
    lp.connect(comp); comp.connect(audio.destination);
    sfxBus = lp;
    noiseBuf = audio.createBuffer(1, audio.sampleRate, audio.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    return sfxBus;
  }
  function beep(freq, dur, type = 'square', vol = 0.05, slide = 0, delay = 0) {
    const level = ArcadeCore.sfx();
    if (!level || !audio) return;
    vol *= level * 1.25 * (type === 'square' || type === 'sawtooth' ? 0.8 : 1.1);
    try {
      const t = audio.currentTime + delay;
      const o = audio.createOscillator(), o2 = audio.createOscillator(), g = audio.createGain();
      o.type = o2.type = type;
      o.frequency.setValueAtTime(freq, t); o2.frequency.setValueAtTime(freq, t); o2.detune.value = 7;
      if (slide) { o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur); o2.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur); }
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + 0.005);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      const g2 = audio.createGain(); g2.gain.value = 0.5;
      o.connect(g); o2.connect(g2); g2.connect(g);
      g.connect(bus());
      o.start(t); o2.start(t);
      o.stop(t + dur + 0.02); o2.stop(t + dur + 0.02);
    } catch (e) { /* negeren */ }
  }
  // Ruisgeluid: knal, plof, zoef, explosie
  function noise(dur = 0.2, vol = 0.1, f0 = 3000, f1 = 300, type = 'lowpass', delay = 0) {
    const level = ArcadeCore.sfx();
    if (!level || !audio) return;
    try {
      const t = audio.currentTime + delay;
      bus();
      const s = audio.createBufferSource(), f = audio.createBiquadFilter(), g = audio.createGain();
      s.buffer = noiseBuf; f.type = type;
      f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(Math.max(40, f1), t + dur);
      g.gain.setValueAtTime(vol * level * 1.4, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      s.connect(f); f.connect(g); g.connect(sfxBus);
      s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.02);
    } catch (e) { /* negeren */ }
  }
  // Effecten: deeltjes, schudden, zwevende tekst (zelfde stijl in elke game)
  function makeFx() {
    const parts = [], texts = [], rings = [];
    let shakeT = 0, shakeA = 0, flashA = 0, flashC = '#fff';
    return {
      burst(x, y, n = 14, color = '#fff', speed = 180, life = 0.6, size = 3, grav = 200) {
        const max = ArcadeCore.settings.quality === 'laag' ? 0.5 : 1;
        for (let i = 0; i < n * max; i++) {
          const a = Math.random() * Math.PI * 2, v = speed * (0.3 + Math.random() * 0.7);
          parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: life * (0.6 + Math.random() * 0.4), max: life, color: Array.isArray(color) ? color[i % color.length] : color, size: size * (0.6 + Math.random() * 0.8), grav });
        }
        if (parts.length > 600) parts.splice(0, parts.length - 600);
      },
      ring(x, y, color = '#fff', r = 40, life = 0.4) { rings.push({ x, y, color, r, life, max: life }); },
      text(x, y, t, color = '#fff', size = 18) { texts.push({ x, y, t, color, size, life: 0.9 }); },
      shake(a = 6, t = 0.25) { shakeA = Math.max(shakeA, a); shakeT = Math.max(shakeT, t); },
      flash(c = '#fff', a = 0.35) { flashC = c; flashA = Math.max(flashA, a); },
      update(dt) {
        for (let i = parts.length - 1; i >= 0; i--) { const p = parts[i]; p.life -= dt; if (p.life <= 0) { parts.splice(i, 1); continue; } p.vy += p.grav * dt; p.vx *= 1 - dt * 1.5; p.x += p.vx * dt; p.y += p.vy * dt; }
        for (let i = texts.length - 1; i >= 0; i--) { const q = texts[i]; q.life -= dt; q.y -= 40 * dt; if (q.life <= 0) texts.splice(i, 1); }
        for (let i = rings.length - 1; i >= 0; i--) { const q = rings[i]; q.life -= dt; if (q.life <= 0) rings.splice(i, 1); }
        shakeT = Math.max(0, shakeT - dt); if (!shakeT) shakeA = 0;
        flashA = Math.max(0, flashA - dt * 2.5);
      },
      // roep aan vóór het tekenen van de wereld (ctx.save gebeurt hier)
      begin(ctx) { ctx.save(); if (shakeT > 0) ctx.translate((Math.random() - 0.5) * shakeA * 2, (Math.random() - 0.5) * shakeA * 2); },
      end(ctx) { ctx.restore(); },
      draw(ctx) {
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        for (const p of parts) { ctx.globalAlpha = Math.max(0, p.life / p.max); ctx.fillStyle = p.color; ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size); }
        ctx.globalCompositeOperation = 'source-over';
        for (const q of rings) { const k = 1 - q.life / q.max; ctx.globalAlpha = 1 - k; ctx.strokeStyle = q.color; ctx.lineWidth = 3 * (1 - k) + 1; ctx.beginPath(); ctx.arc(q.x, q.y, q.r * (0.3 + k), 0, Math.PI * 2); ctx.stroke(); }
        for (const q of texts) { ctx.globalAlpha = Math.min(1, q.life * 2); text(ctx, q.t, q.x, q.y, q.size, q.color, 'center', '900'); }
        ctx.restore();
      },
      drawFlash(ctx, W, H) { if (flashA > 0) { ctx.save(); ctx.globalAlpha = flashA; ctx.fillStyle = flashC; ctx.fillRect(0, 0, W, H); ctx.restore(); } },
      clear() { parts.length = 0; texts.length = 0; rings.length = 0; shakeT = 0; },
      get count() { return parts.length; },
    };
  }

  // Canvas met vaste spelgrootte (W×H) die netjes in het venster past
  function canvas(id, W, H) {
    const c = document.getElementById(id);
    const ctx = c.getContext('2d');
    const view = { W, H, scale: 1 };
    const fit = () => {
      const s = Math.min(innerWidth / W, innerHeight / H);
      const dpr = Math.min(ArcadeCore.dprCap(), devicePixelRatio || 1);
      c.style.width = Math.floor(W * s) + 'px';
      c.style.height = Math.floor(H * s) + 'px';
      c.width = Math.floor(W * s * dpr);
      c.height = Math.floor(H * s * dpr);
      view.scale = s * dpr;
      ctx.setTransform(view.scale, 0, 0, view.scale, 0, 0);
    };
    fit();
    addEventListener('resize', fit);
    ArcadeCore.onChange(fit);
    view.begin = () => ctx.setTransform(view.scale, 0, 0, view.scale, 0, 0);
    view.toGame = (e) => {
      const r = c.getBoundingClientRect();
      return { x: ((e.clientX - r.left) / r.width) * W, y: ((e.clientY - r.top) / r.height) * H };
    };
    return { c, ctx, view };
  }

  // Vegen (swipe) op touchscreens: geeft 'links', 'rechts', 'op' of 'neer'
  function onSwipe(el, fn, onTap) {
    let sx = 0, sy = 0, st = 0, active = false;
    el.addEventListener('pointerdown', (e) => { sx = e.clientX; sy = e.clientY; st = performance.now(); active = true; });
    el.addEventListener('pointerup', (e) => {
      if (!active) return;
      active = false;
      const dx = e.clientX - sx, dy = e.clientY - sy;
      if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) { if (onTap) onTap(e); return; }
      if (Math.abs(dx) > Math.abs(dy)) fn(dx > 0 ? 'rechts' : 'links');
      else fn(dy > 0 ? 'neer' : 'op');
    });
  }

  // Tekenhulpjes in dezelfde stijl
  function rr(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function text(ctx, t, x, y, size, color = '#fff', align = 'center', weight = '700', mono = false) {
    ctx.font = `${weight} ${size}px ${mono ? 'ui-monospace, Consolas, monospace' : 'system-ui, -apple-system, "Segoe UI", sans-serif'}`;
    ctx.fillStyle = color;
    ctx.textAlign = align;
    ctx.textBaseline = 'middle';
    ctx.fillText(t, x, y);
  }
  // Knoppen op het canvas (zelfde stijl overal). btn() elke frame opnieuw tekenen; hit() bij klikken.
  function ui(ctx) {
    let list = [], hover = null;
    return {
      clear() { list = []; },
      btn(label, x, y, w, h, fn, primary = false, active = false, size = 0) {
        const on = hover && hover.x >= x && hover.x <= x + w && hover.y >= y && hover.y <= y + h;
        const g = ctx.createLinearGradient(0, y, 0, y + h);
        if (primary || active) { g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#dfe2e6'); }
        else { g.addColorStop(0, on ? '#30343c' : '#262930'); g.addColorStop(1, on ? '#24272d' : '#1b1d22'); }
        ctx.fillStyle = g; rr(ctx, x, y, w, h, Math.min(10, h / 3)); ctx.fill();
        ctx.strokeStyle = primary || active ? 'rgba(255,255,255,0.6)' : on ? 'rgba(255,255,255,0.3)' : 'rgba(255,255,255,0.1)';
        ctx.lineWidth = 1; ctx.stroke();
        text(ctx, label, x + w / 2, y + h / 2 + 1, size || Math.min(16, h * 0.4), primary || active ? '#111214' : '#ffffff', 'center', '800');
        list.push({ x, y, w, h, fn });
      },
      hit(q) { for (let i = list.length - 1; i >= 0; i--) { const b = list[i]; if (q.x >= b.x && q.x <= b.x + b.w && q.y >= b.y && q.y <= b.y + b.h) { b.fn(); return true; } } return false; },
      hover(q) { hover = q; },
    };
  }
  const fmtTime = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
  // Standaard scherm voor start / pauze / game over
  function overlay(ctx, W, H, title, lines = [], hint = '') {
    const g = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.max(W, H) * 0.7);
    g.addColorStop(0, 'rgba(10, 11, 14, 0.55)'); g.addColorStop(1, 'rgba(4, 5, 7, 0.85)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    const pw = Math.min(W - 40, 400), ph = 130 + lines.length * 30 + (hint ? 40 : 0);
    const x = (W - pw) / 2, y = (H - ph) / 2;
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.6)'; ctx.shadowBlur = 40; ctx.shadowOffsetY = 12;
    const cg = ctx.createLinearGradient(0, y, 0, y + ph);
    cg.addColorStop(0, 'rgba(32, 35, 42, 0.97)'); cg.addColorStop(1, 'rgba(18, 20, 24, 0.97)');
    ctx.fillStyle = cg;
    rr(ctx, x, y, pw, ph, 18);
    ctx.fill();
    ctx.restore();
    ctx.strokeStyle = 'rgba(255,255,255,0.14)';
    ctx.lineWidth = 1.5;
    rr(ctx, x, y, pw, ph, 18);
    ctx.stroke();
    ctx.fillStyle = '#e8282f';
    rr(ctx, W / 2 - 24, y + 78, 48, 3, 1.5); ctx.fill();
    text(ctx, title, W / 2, y + 48, 32, '#fff', 'center', '900');
    lines.forEach((l, i) => {
      const s = typeof l === 'string' ? { t: l } : l;
      text(ctx, s.t, W / 2, y + 108 + i * 30, s.size || 18, s.color || '#c9ced6', 'center', s.weight || '600', s.mono);
    });
    if (hint) { ctx.globalAlpha = 0.55 + 0.45 * Math.abs(Math.sin(performance.now() / 450)); text(ctx, hint, W / 2, y + ph - 30, 15, '#ffffff', 'center', '700'); ctx.globalAlpha = 1; }
  }
  // Achtergrond met diepte: zacht licht in het midden + vignet
  function backdrop(ctx, W, H, top = '#15171c', bottom = '#0a0b0e') {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, top); g.addColorStop(1, bottom);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    const v = ctx.createRadialGradient(W / 2, H * 0.45, Math.min(W, H) * 0.2, W / 2, H / 2, Math.max(W, H) * 0.75);
    v.addColorStop(0, 'rgba(255,255,255,0.035)'); v.addColorStop(1, 'rgba(0,0,0,0.35)');
    ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  }

  return {
    load, save, beep, noise, makeFx, backdrop, ui, fmtTime,
    get muted() { return !ArcadeCore.sfx(); },
    best: (game) => load('best_' + game, 0),
    // Slaat een nieuwe topscore op; geeft true terug als het een record is
    record: (game, score, lowerIsBetter = false) => {
      const b = load('best_' + game, 0);
      if (!b || (lowerIsBetter ? score < b : score > b)) { save('best_' + game, score); return true; }
      return false;
    },
    canvas, onSwipe, rr, text, overlay,
    touch: matchMedia('(hover: none) and (pointer: coarse)').matches,
  };
})();

// ================= 2048 =================
const W = 480, H = 680;
const { c, ctx, view } = Arcade.canvas('c', W, H);
const GAME = '2048';
const SIZE = 4, BX = 30, BY = 200, BS = 420, GAP = 12, TS = (BS - GAP * (SIZE + 1)) / SIZE;
const ANIM = 0.11;

let tiles, score, best, over, won, keepGoing, anim, history, nextId, popups;
best = Arcade.best(GAME);
let buttons = [];

function newGame() {
  tiles = []; score = 0; over = false; won = false; keepGoing = false; anim = 0; history = []; nextId = 1; popups = [];
  addRandom(); addRandom();
  save();
}
function cellXY(r, cc) { return { x: BX + GAP + cc * (TS + GAP), y: BY + GAP + r * (TS + GAP) }; }
function at(r, cc) { return tiles.find((t) => !t.gone && t.r === r && t.c === cc); }
function addRandom() {
  const free = [];
  for (let r = 0; r < SIZE; r++) for (let cc = 0; cc < SIZE; cc++) if (!at(r, cc)) free.push([r, cc]);
  if (!free.length) return;
  const [r, cc] = free[Math.floor(Math.random() * free.length)];
  tiles.push({ id: nextId++, v: Math.random() < 0.9 ? 2 : 4, r, c: cc, pr: r, pc: cc, born: 1, pop: 0 });
}
function snapshot() { return { tiles: tiles.filter((t) => !t.gone).map((t) => ({ ...t })), score }; }
function save() { Arcade.save('2048_state', { tiles: tiles.filter((t) => !t.gone).map((t) => ({ v: t.v, r: t.r, c: t.c })), score, won, keepGoing }); }
function restore() {
  const s = Arcade.load('2048_state', null);
  if (!s || !s.tiles || !s.tiles.length) return false;
  tiles = s.tiles.map((t) => ({ id: nextId++, v: t.v, r: t.r, c: t.c, pr: t.r, pc: t.c, born: 0, pop: 0 }));
  score = s.score; won = s.won; keepGoing = s.keepGoing; over = !canMove();
  return true;
}

function move(dirName) {
  if (over || anim > 0 || (won && !keepGoing)) return;
  const d = { links: [0, -1], rechts: [0, 1], op: [-1, 0], neer: [1, 0] }[dirName];
  if (!d) return;
  const before = snapshot();
  tiles = tiles.filter((t) => !t.gone);
  for (const t of tiles) { t.pr = t.r; t.pc = t.c; t.born = 0; t.pop = 0; }
  let moved = false, gained = 0;
  const range = [...Array(SIZE).keys()];
  for (let line = 0; line < SIZE; line++) {
    // Haal de tegels in deze rij/kolom op, in de schuifrichting
    const order = (d[0] + d[1] > 0) ? [...range].reverse() : range;
    const cells = order.map((k) => (d[0] === 0 ? [line, k] : [k, line]));
    const lineTiles = cells.map(([r, cc]) => at(r, cc)).filter(Boolean);
    let target = 0, lastMergeable = null;
    for (const t of lineTiles) {
      if (lastMergeable && lastMergeable.v === t.v && !lastMergeable.merged) {
        // Samenvoegen
        const [r, cc] = cells[target - 1];
        t.r = r; t.c = cc; t.gone = true; t.mergeInto = lastMergeable;
        lastMergeable.merged = true;
        lastMergeable.v *= 2;
        lastMergeable.pop = 1;
        gained += lastMergeable.v;
        moved = true;
        continue;
      }
      const [r, cc] = cells[target];
      if (t.r !== r || t.c !== cc) moved = true;
      t.r = r; t.c = cc;
      lastMergeable = t;
      target++;
    }
  }
  for (const t of tiles) t.merged = false;
  if (!moved) { tiles = tiles.filter((t) => !t.gone); return; }
  history.push(before);
  if (history.length > 20) history.shift();
  score += gained;
  if (gained) setTimeout(() => { for (const t of tiles) if (t.pop > 0.9 && !t.gone) { const q = cellXY(t.r, t.c); fx.burst(q.x + TS / 2, q.y + TS / 2, t.v >= 128 ? 22 : 10, t.v >= 512 ? ['#ff4d5a', '#ffffff'] : ['#ffffff', '#c9ced6'], 160, 0.45, 3, 0); if (t.v >= 128) fx.ring(q.x + TS / 2, q.y + TS / 2, t.v >= 512 ? '#ff4d5a' : '#ffffff', TS * 0.8, 0.4); } }, ANIM * 1000);
  if (gained) {
    popups.push({ text: '+' + gained, t: 0.8 });
    Arcade.beep(300 + Math.log2(gained) * 60, 0.08, 'triangle', 0.05);
  } else Arcade.beep(220, 0.04, 'triangle', 0.02);
  anim = ANIM;
  setTimeout(() => {
    tiles = tiles.filter((t) => !t.gone);
    addRandom();
    if (!won && tiles.some((t) => t.v >= 2048)) { won = true; Arcade.beep(523, 0.15, 'triangle', 0.07); Arcade.beep(784, 0.3, 'triangle', 0.07, 0, 0.15); }
    if (!canMove()) { over = true; Arcade.beep(200, 0.5, 'sawtooth', 0.05, -100); }
    if (Arcade.record(GAME, score)) best = score;
    save();
  }, ANIM * 1000);
}
function canMove() {
  if (tiles.filter((t) => !t.gone).length < SIZE * SIZE) return true;
  for (let r = 0; r < SIZE; r++) for (let cc = 0; cc < SIZE; cc++) {
    const t = at(r, cc);
    const right = at(r, cc + 1), down = at(r + 1, cc);
    if ((right && right.v === t.v) || (down && down.v === t.v)) return true;
  }
  return false;
}
function undo() {
  if (!history.length || anim > 0) return;
  const s = history.pop();
  tiles = s.tiles.map((t) => ({ ...t, pr: t.r, pc: t.c, born: 0, pop: 0, gone: false }));
  score = s.score;
  over = false;
  if (!tiles.some((t) => t.v >= 2048)) { won = false; keepGoing = false; }
  save();
  Arcade.beep(400, 0.06, 'triangle', 0.03, -100);
}

// ----- Besturing -----
addEventListener('keydown', (e) => {
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'].includes(e.code)) e.preventDefault();
  const map = { ArrowLeft: 'links', KeyA: 'links', ArrowRight: 'rechts', KeyD: 'rechts', ArrowUp: 'op', KeyW: 'op', ArrowDown: 'neer', KeyS: 'neer' };
  if (map[e.code]) move(map[e.code]);
  if (e.code === 'KeyZ' || e.code === 'Backspace') undo();
  if (e.code === 'KeyN') newGame();
  if (e.code === 'Enter' && won && !keepGoing) keepGoing = true;
});
Arcade.onSwipe(c, move, (e) => {
  const q = view.toGame(e);
  for (const b of buttons) if (q.x >= b.x && q.x <= b.x + b.w && q.y >= b.y && q.y <= b.y + b.h) { b.fn(); return; }
});

// ----- Tekenen -----
const COLORS = {
  2: ['#e9ebee', '#2a2d33'], 4: ['#d6d9de', '#2a2d33'], 8: ['#b8bdc5', '#1a1c21'], 16: ['#9aa1ab', '#ffffff'],
  32: ['#7b828c', '#ffffff'], 64: ['#5b616b', '#ffffff'], 128: ['#41454d', '#ffffff'], 256: ['#2f3238', '#ffffff'],
  512: ['#1f2126', '#ffffff'], 1024: ['#a8222a', '#ffffff'], 2048: ['#e8282f', '#ffffff'],
};
const fx = Arcade.makeFx();
function shade(hex, k) {   // kleur lichter (k>0) of donkerder (k<0)
  const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const f = (v) => Math.round(k > 0 ? v + (255 - v) * k : v * (1 + k));
  return `rgb(${f(r)},${f(g)},${f(b)})`;
}
function button(label, x, y, w, h, fn, primary) {
  ctx.fillStyle = primary ? '#ffffff' : 'rgba(255,255,255,0.12)';
  Arcade.rr(ctx, x, y, w, h, 10); ctx.fill();
  Arcade.text(ctx, label, x + w / 2, y + h / 2 + 1, 15, primary ? '#111214' : '#ffffff', 'center', '800');
  buttons.push({ x, y, w, h, fn });
}
function draw(dt) {
  view.begin();
  buttons = [];
  Arcade.backdrop(ctx, W, H);
  fx.update(dt);
  Arcade.text(ctx, '2048', BX, 84, 64, '#ffffff', 'left', '900');
  // Scorevakjes
  const box = (label, val, x) => {
    const bg2 = ctx.createLinearGradient(0, 54, 0, 112); bg2.addColorStop(0, '#24272e'); bg2.addColorStop(1, '#181a1f');
    ctx.fillStyle = bg2; Arcade.rr(ctx, x, 54, 100, 58, 10); ctx.fill(); ctx.strokeStyle = 'rgba(255,255,255,0.08)'; ctx.lineWidth = 1; ctx.stroke();
    Arcade.text(ctx, label, x + 50, 72, 11, '#9aa1ab', 'center', '800');
    Arcade.text(ctx, String(val), x + 50, 95, 22, '#ffffff', 'center', '900', true);
  };
  box('SCORE', score, W - BX - 210);
  box('RECORD', Math.max(best, score), W - BX - 100);
  for (const p of popups) { p.t -= dt; Arcade.text(ctx, p.text, W - BX - 160, 50 - (0.8 - p.t) * 40, 16, `rgba(255,255,255,${Math.max(0, p.t)})`, 'center', '900'); }
  popups = popups.filter((p) => p.t > 0);
  Arcade.text(ctx, 'Combineer gelijke tegels tot je 2048 hebt!', BX, 140, 14, '#9aa1ab', 'left', '500');
  button('Nieuw spel', W - BX - 130, 158, 130, 34, newGame, true);
  button('↶ Terug', W - BX - 240, 158, 100, 34, undo);

  // Bord
  ctx.save(); ctx.shadowColor = 'rgba(0,0,0,0.6)'; ctx.shadowBlur = 30; ctx.shadowOffsetY = 12;
  ctx.fillStyle = '#1a1c21';
  Arcade.rr(ctx, BX, BY, BS, BS, 14); ctx.fill(); ctx.restore();
  ctx.strokeStyle = 'rgba(255,255,255,0.07)'; ctx.lineWidth = 1.5; Arcade.rr(ctx, BX, BY, BS, BS, 14); ctx.stroke();
  for (let r = 0; r < SIZE; r++) for (let cc = 0; cc < SIZE; cc++) { const p = cellXY(r, cc); ctx.fillStyle = '#121418'; Arcade.rr(ctx, p.x, p.y, TS, TS, 9); ctx.fill(); ctx.fillStyle = '#23262c'; Arcade.rr(ctx, p.x, p.y + 2, TS, TS - 2, 9); ctx.fill(); }

  anim = Math.max(0, anim - dt);
  const k = 1 - anim / ANIM;
  const e = k * (2 - k);
  const list = [...tiles].sort((a, b) => (a.gone ? 0 : 1) - (b.gone ? 0 : 1));
  for (const t of list) {
    const a = cellXY(t.pr, t.pc), b = cellXY(t.r, t.c);
    const x = a.x + (b.x - a.x) * e, y = a.y + (b.y - a.y) * e;
    t.born = Math.max(0, t.born - dt * 7);
    t.pop = anim > 0 ? t.pop : Math.max(0, t.pop - dt * 6);
    let s = 1 - t.born;
    if (anim <= 0 && t.pop > 0) s = 1 + Math.sin(t.pop * Math.PI) * 0.12;
    const showV = t.gone || anim <= 0 ? t.v : (t.pop ? t.v / 2 : t.v);
    const [bg, fg] = COLORS[showV] || ['#e8282f', '#ffffff'];
    const sz = TS * s;
    const tx0 = x + (TS - sz) / 2, ty0 = y + (TS - sz) / 2;
    // 3D-tegel: schaduw, donkere onderrand, verloop en glans
    ctx.save();
    if (showV >= 128) { ctx.shadowColor = showV >= 1024 ? 'rgba(232,40,47,0.7)' : 'rgba(255,255,255,0.25)'; ctx.shadowBlur = 18 + Math.sin(performance.now() / 300) * 4; }
    else { ctx.shadowColor = 'rgba(0,0,0,0.45)'; ctx.shadowBlur = 8; ctx.shadowOffsetY = 4; }
    ctx.fillStyle = shade(bg, -0.28);
    Arcade.rr(ctx, tx0, ty0, sz, sz, 9); ctx.fill();
    ctx.restore();
    const tg = ctx.createLinearGradient(0, ty0, 0, ty0 + sz);
    tg.addColorStop(0, shade(bg, 0.12)); tg.addColorStop(1, bg);
    ctx.fillStyle = tg;
    Arcade.rr(ctx, tx0, ty0, sz, sz - 5 * s, 9); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.12)'; Arcade.rr(ctx, tx0 + 6 * s, ty0 + 4 * s, sz - 12 * s, 6 * s, 3); ctx.fill();
    const digits = String(showV).length;
    Arcade.text(ctx, String(showV), x + TS / 2, y + TS / 2 - 1, (digits < 3 ? 44 : digits < 4 ? 36 : 28) * s, fg, 'center', '900');
  }
  fx.draw(ctx);
  Arcade.text(ctx, Arcade.touch ? 'Veeg om te schuiven' : 'Pijltjes = schuiven · Z = terug · N = nieuw spel', W / 2, BY + BS + 32, 13, '#6f7680', 'center', '600');

  if (over) {
    ctx.fillStyle = 'rgba(11,12,16,0.75)'; Arcade.rr(ctx, BX, BY, BS, BS, 14); ctx.fill();
    Arcade.text(ctx, 'Geen zetten meer!', W / 2, BY + BS / 2 - 50, 30, '#ffffff', 'center', '900');
    Arcade.text(ctx, `Score: ${score}`, W / 2, BY + BS / 2 - 10, 18, '#c9ced6', 'center', '700');
    button('Opnieuw', W / 2 - 120, BY + BS / 2 + 20, 110, 42, newGame, true);
    button('↶ Terug', W / 2 + 10, BY + BS / 2 + 20, 110, 42, undo);
  } else if (won && !keepGoing) {
    ctx.fillStyle = 'rgba(232,40,47,0.85)'; Arcade.rr(ctx, BX, BY, BS, BS, 14); ctx.fill();
    Arcade.text(ctx, 'Je hebt 2048! 🎉', W / 2, BY + BS / 2 - 40, 32, '#ffffff', 'center', '900');
    button('Doorgaan', W / 2 - 120, BY + BS / 2 + 10, 110, 42, () => { keepGoing = true; save(); }, true);
    button('Nieuw spel', W / 2 + 10, BY + BS / 2 + 10, 110, 42, newGame);
  }
}

if (!restore()) newGame();
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  draw(dt);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ----- Admin-voordelen -----
ArcadeCore.cheat('✨ Alle tegels verdubbelen', () => { if (anim > 0 || !tiles) return; tiles.filter((t) => !t.gone).forEach((t) => { t.v *= 2; t.pop = 1; }); over = !canMove(); save(); });
ArcadeCore.cheat('🧹 Bord leegmaken (grootste tegel blijft)', () => {
  if (anim > 0 || !tiles) return;
  const big = tiles.filter((t) => !t.gone).sort((a, b) => b.v - a.v)[0];
  tiles = big ? [{ ...big, r: 0, c: 0, pr: 0, pc: 0, born: 0, pop: 1 }] : [];
  addRandom(); over = false; save();
});
ArcadeCore.cheat('➕ 10.000 punten', () => { score += 10000; if (Arcade.record(GAME, score)) best = score; save(); });

  </script>
