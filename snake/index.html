<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Snake 2.0 · Bas Arcade</title>
  <meta name="description" content="Eet appels, word langer en overleef de levels met muren.">
  <meta name="theme-color" content="#0b0c10">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%2316181d%22/%3E%3Cpath%20d%3D%22M14%2046%20H30%20V30%20H46%20V18%22%20fill%3D%22none%22%20stroke%3D%22%23f2f2f2%22%20stroke-width%3D%228%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22/%3E%3Ccircle%20cx%3D%2246%22%20cy%3D%2216%22%20r%3D%223%22%20fill%3D%22%2316181d%22/%3E%3Ccircle%20cx%3D%2220%22%20cy%3D%2220%22%20r%3D%226%22%20fill%3D%22%23e8282f%22/%3E%3Cpath%20d%3D%22M20%2014%20q2%20-4%205%20-4%22%20stroke%3D%22%235fae5a%22%20stroke-width%3D%222%22%20fill%3D%22none%22/%3E%3C/svg%3E">
  <style>
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #0b0c10; color: #fff; overflow: hidden;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-user-select: none; user-select: none; }
body { display: flex; align-items: center; justify-content: center; }
canvas { display: block; touch-action: none; box-shadow: 0 0 0 1px rgba(255,255,255,0.08); }
.terug, .geluid { position: fixed; top: 12px; z-index: 5; color: #fff; text-decoration: none; background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.22); padding: 8px 12px; border-radius: 10px; font: 600 14px system-ui, sans-serif; cursor: pointer; }
.terug { left: 12px; } .geluid { right: 12px; }
.terug:hover, .geluid:hover { background: rgba(255,255,255,0.2); }
</style>
</head>
<body>
  <a class="terug" href="../">← Games</a>
  <button class="geluid" type="button" aria-label="Geluid aan/uit">🔊</button>
  <canvas id="c"></canvas>
  
  <script>
'use strict';
// ================= Gedeeld voor alle games: opslag, geluid, scherm, knoppen =================
const Arcade = (() => {
  const load = (k, d) => { try { const v = localStorage.getItem('arcade_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } };
  const save = (k, v) => { try { localStorage.setItem('arcade_' + k, JSON.stringify(v)); } catch (e) { /* uit */ } };
  let audio = null;
  let muted = load('muted', false);

  function initAudio() {
    if (audio) { if (audio.state === 'suspended') audio.resume(); return; }
    try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audio = null; }
  }
  addEventListener('pointerdown', initAudio);
  addEventListener('keydown', initAudio);

  function beep(freq, dur, type = 'square', vol = 0.05, slide = 0, delay = 0) {
    if (muted || !audio) return;
    try {
      const t = audio.currentTime + delay;
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, t);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g);
      g.connect(audio.destination);
      o.start(t);
      o.stop(t + dur);
    } catch (e) { /* negeren */ }
  }

  // Geluidsknop
  const sndBtn = document.querySelector('.geluid');
  const showSnd = () => { if (sndBtn) sndBtn.textContent = muted ? '🔇' : '🔊'; };
  showSnd();
  if (sndBtn) sndBtn.addEventListener('click', (e) => { e.stopPropagation(); muted = !muted; save('muted', muted); showSnd(); sndBtn.blur(); });
  addEventListener('keydown', (e) => { if (e.code === 'KeyM') { muted = !muted; save('muted', muted); showSnd(); } });

  // Canvas met vaste spelgrootte (W×H) die netjes in het venster past
  function canvas(id, W, H) {
    const c = document.getElementById(id);
    const ctx = c.getContext('2d');
    const view = { W, H, scale: 1 };
    const fit = () => {
      const s = Math.min(innerWidth / W, innerHeight / H);
      const dpr = Math.min(2, devicePixelRatio || 1);
      c.style.width = Math.floor(W * s) + 'px';
      c.style.height = Math.floor(H * s) + 'px';
      c.width = Math.floor(W * s * dpr);
      c.height = Math.floor(H * s * dpr);
      view.scale = s * dpr;
      ctx.setTransform(view.scale, 0, 0, view.scale, 0, 0);
    };
    fit();
    addEventListener('resize', fit);
    view.begin = () => ctx.setTransform(view.scale, 0, 0, view.scale, 0, 0);
    view.toGame = (e) => {
      const r = c.getBoundingClientRect();
      return { x: ((e.clientX - r.left) / r.width) * W, y: ((e.clientY - r.top) / r.height) * H };
    };
    return { c, ctx, view };
  }

  // Vegen (swipe) op touchscreens: geeft 'links', 'rechts', 'op' of 'neer'
  function onSwipe(el, fn, onTap) {
    let sx = 0, sy = 0, st = 0, active = false;
    el.addEventListener('pointerdown', (e) => { sx = e.clientX; sy = e.clientY; st = performance.now(); active = true; });
    el.addEventListener('pointerup', (e) => {
      if (!active) return;
      active = false;
      const dx = e.clientX - sx, dy = e.clientY - sy;
      if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) { if (onTap) onTap(e); return; }
      if (Math.abs(dx) > Math.abs(dy)) fn(dx > 0 ? 'rechts' : 'links');
      else fn(dy > 0 ? 'neer' : 'op');
    });
  }

  // Tekenhulpjes in dezelfde stijl
  function rr(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function text(ctx, t, x, y, size, color = '#fff', align = 'center', weight = '700', mono = false) {
    ctx.font = `${weight} ${size}px ${mono ? 'ui-monospace, Consolas, monospace' : 'system-ui, -apple-system, "Segoe UI", sans-serif'}`;
    ctx.fillStyle = color;
    ctx.textAlign = align;
    ctx.textBaseline = 'middle';
    ctx.fillText(t, x, y);
  }
  // Standaard scherm voor start / pauze / game over
  function overlay(ctx, W, H, title, lines = [], hint = '') {
    ctx.fillStyle = 'rgba(10, 11, 14, 0.72)';
    ctx.fillRect(0, 0, W, H);
    const pw = Math.min(W - 40, 380), ph = 130 + lines.length * 30 + (hint ? 40 : 0);
    const x = (W - pw) / 2, y = (H - ph) / 2;
    ctx.fillStyle = 'rgba(24, 26, 31, 0.95)';
    rr(ctx, x, y, pw, ph, 16);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    text(ctx, title, W / 2, y + 50, 32, '#fff', 'center', '900');
    lines.forEach((l, i) => {
      const s = typeof l === 'string' ? { t: l } : l;
      text(ctx, s.t, W / 2, y + 100 + i * 30, s.size || 18, s.color || '#c9ced6', 'center', s.weight || '600', s.mono);
    });
    if (hint && Math.floor(performance.now() / 500) % 2 === 0) text(ctx, hint, W / 2, y + ph - 34, 15, '#ffffff', 'center', '700');
  }

  return {
    load, save, beep,
    get muted() { return muted; },
    best: (game) => load('best_' + game, 0),
    // Slaat een nieuwe topscore op; geeft true terug als het een record is
    record: (game, score, lowerIsBetter = false) => {
      const b = load('best_' + game, 0);
      if (!b || (lowerIsBetter ? score < b : score > b)) { save('best_' + game, score); return true; }
      return false;
    },
    canvas, onSwipe, rr, text, overlay,
    touch: matchMedia('(hover: none) and (pointer: coarse)').matches,
  };
})();

// ================= SNAKE 2.0 =================
const W = 480, H = 620;
const { c, ctx, view } = Arcade.canvas('c', W, H);
const GAME = 'snake';
const N = 20, CELL = 22, BX = (W - N * CELL) / 2, BY = 110;
const APPLES_PER_LEVEL = 8;

let state = 'menu'; // menu | play | pause | over
let snake, dir, queue, apple, gold, power, walls, score, apples, level, tick, acc, grow, slowT, ghostT, banner, overT, newRecord, parts, shake;
let best = Arcade.best(GAME);
parts = []; shake = 0;

// Muurpatronen per level (daarna willekeurig)
function wallsFor(lv) {
  const w = new Set();
  const add = (x, y) => w.add(x + ',' + y);
  if (lv === 2) { for (let i = 5; i < 15; i++) { add(i, 5); add(i, 14); } }
  else if (lv === 3) { for (let i = 0; i < 20; i++) if (i < 7 || i > 12) { add(i, 9); add(9, i); } }
  else if (lv === 4) { for (let i = 2; i < 18; i++) { add(2, i); add(17, i); } for (let i = 6; i < 14; i++) add(i, 10); }
  else if (lv === 5) { for (let y = 3; y < 17; y += 4) for (let x = 3; x < 17; x++) if ((x + y) % 7) add(x, y); }
  else if (lv >= 6) {
    const r = mulberry(lv * 99);
    for (let k = 0; k < 10 + lv * 2; k++) {
      const x = Math.floor(r() * 18) + 1, y = Math.floor(r() * 18) + 1, horiz = r() < 0.5, len = 2 + Math.floor(r() * 4);
      for (let i = 0; i < len; i++) add(horiz ? x + i : x, horiz ? y : y + i);
    }
  }
  // Startgebied altijd vrij houden
  for (let x = 2; x < 9; x++) w.delete(x + ',10');
  return w;
}
function mulberry(a) { return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

function freeCell() {
  for (let k = 0; k < 500; k++) {
    const x = Math.floor(Math.random() * N), y = Math.floor(Math.random() * N);
    const key = x + ',' + y;
    if (walls.has(key) || snake.some((s) => s.x === x && s.y === y)) continue;
    if (apple && apple.x === x && apple.y === y) continue;
    if (gold && gold.x === x && gold.y === y) continue;
    if (power && power.x === x && power.y === y) continue;
    return { x, y };
  }
  return { x: 0, y: 0 };
}

function setupLevel(lv) {
  level = lv;
  walls = wallsFor(lv);
  const len = snake ? Math.min(snake.length, 6) : 4;
  snake = Array.from({ length: len }, (_, i) => ({ x: 6 - i, y: 10 }));
  dir = { x: 1, y: 0 };
  queue = [];
  apple = null; gold = null; power = null;
  apple = freeCell();
  banner = { text: `LEVEL ${lv}`, t: 1.6 };
  acc = -0.9; // korte pauze aan het begin van een level
}

function start() {
  snake = null;
  score = 0; apples = 0; grow = 0; slowT = 0; ghostT = 0; newRecord = false;
  setupLevel(1);
  state = 'play';
  Arcade.beep(440, 0.15, 'triangle', 0.05, 300);
}

// ----- Besturing -----
const DIRS = { links: { x: -1, y: 0 }, rechts: { x: 1, y: 0 }, op: { x: 0, y: -1 }, neer: { x: 0, y: 1 } };
function turn(name) {
  if (state === 'menu' || (state === 'over' && overT <= 0)) { start(); return; }
  if (state === 'pause') { state = 'play'; return; }
  if (state !== 'play') return;
  const d = DIRS[name];
  if (!d) return;
  const lastDir = queue.length ? queue[queue.length - 1] : dir;
  if (d.x === -lastDir.x && d.y === -lastDir.y) return;
  if (d.x === lastDir.x && d.y === lastDir.y) return;
  if (queue.length < 3) queue.push(d);
}
addEventListener('keydown', (e) => {
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'].includes(e.code)) e.preventDefault();
  if (e.repeat) return;
  const map = { ArrowLeft: 'links', KeyA: 'links', ArrowRight: 'rechts', KeyD: 'rechts', ArrowUp: 'op', KeyW: 'op', ArrowDown: 'neer', KeyS: 'neer' };
  if (e.code === 'KeyP' || e.code === 'Escape') { if (state === 'play') state = 'pause'; else if (state === 'pause') state = 'play'; return; }
  if ((e.code === 'Enter' || e.code === 'Space') && state !== 'play') { turn('start'); return; }
  if (map[e.code]) turn(map[e.code]);
});
addEventListener('blur', () => { if (state === 'play') state = 'pause'; });
Arcade.onSwipe(c, turn, () => { if (state !== 'play') turn('start'); });

// ----- Spel -----
const stepTime = () => {
  const base = Math.max(0.055, 0.15 - apples * 0.0022 - (level - 1) * 0.006);
  return slowT > 0 ? base * 1.8 : base;
};

function die() {
  state = 'over';
  overT = 0.8;
  shake = 10;
  newRecord = Arcade.record(GAME, score);
  best = Arcade.best(GAME);
  for (const s of snake) for (let i = 0; i < 3; i++) parts.push({ x: BX + s.x * CELL + CELL / 2, y: BY + s.y * CELL + CELL / 2, vx: (Math.random() - 0.5) * 300, vy: (Math.random() - 0.5) * 300, life: 0.4 + Math.random() * 0.5, color: i ? '#ffffff' : '#9aa1ab' });
  Arcade.beep(150, 0.5, 'sawtooth', 0.07, -80);
}

function step() {
  if (queue.length) dir = queue.shift();
  const head = snake[0];
  const nx = (head.x + dir.x + N) % N, ny = (head.y + dir.y + N) % N;
  const key = nx + ',' + ny;
  const willGrow = grow > 0;
  const body = willGrow ? snake : snake.slice(0, -1);
  if (walls.has(key) || (ghostT <= 0 && body.some((s) => s.x === nx && s.y === ny))) { die(); return; }
  snake.unshift({ x: nx, y: ny });
  if (grow > 0) grow--; else snake.pop();

  if (apple && nx === apple.x && ny === apple.y) {
    score += 1; apples += 1; grow += 1;
    Arcade.beep(660 + (apples % 8) * 60, 0.08, 'square', 0.04);
    burst(nx, ny, '#e8282f');
    if (apples % APPLES_PER_LEVEL === 0) {
      Arcade.beep(523, 0.12, 'triangle', 0.06); Arcade.beep(784, 0.25, 'triangle', 0.06, 0, 0.12);
      setupLevel(level + 1);
      return;
    }
    apple = freeCell();
    if (!gold && Math.random() < 0.18) gold = { ...freeCell(), t: 6 };
    if (!power && Math.random() < 0.12) power = { ...freeCell(), t: 8, type: Math.random() < 0.5 ? 'traag' : 'spook' };
  }
  if (gold && nx === gold.x && ny === gold.y) {
    score += 5; grow += 3; gold = null;
    burst(nx, ny, '#ffd23f');
    Arcade.beep(990, 0.1, 'triangle', 0.06); Arcade.beep(1320, 0.18, 'triangle', 0.06, 0, 0.08);
  }
  if (power && nx === power.x && ny === power.y) {
    if (power.type === 'traag') slowT = 6; else ghostT = 6;
    burst(nx, ny, power.type === 'traag' ? '#5ab8ff' : '#ffffff');
    power = null;
    Arcade.beep(500, 0.3, 'triangle', 0.06, 500);
  }
}
function burst(x, y, color) {
  for (let i = 0; i < 12; i++) parts.push({ x: BX + x * CELL + CELL / 2, y: BY + y * CELL + CELL / 2, vx: (Math.random() - 0.5) * 220, vy: (Math.random() - 0.5) * 220, life: 0.3 + Math.random() * 0.3, color });
}

function update(dt) {
  for (const q of parts) { q.x += q.vx * dt; q.y += q.vy * dt; q.life -= dt; }
  parts = parts.filter((q) => q.life > 0);
  shake = Math.max(0, shake - dt * 30);
  if (state === 'over') overT -= dt;
  if (state !== 'play') return;
  if (banner) { banner.t -= dt; if (banner.t <= 0) banner = null; }
  slowT = Math.max(0, slowT - dt);
  ghostT = Math.max(0, ghostT - dt);
  if (gold) { gold.t -= dt; if (gold.t <= 0) gold = null; }
  if (power) { power.t -= dt; if (power.t <= 0) power = null; }
  acc += dt;
  let n = 0;
  while (acc >= stepTime() && state === 'play' && n++ < 4) { acc -= stepTime(); step(); }
}

// ----- Tekenen -----
function cellRect(x, y, pad, r, color) {
  ctx.fillStyle = color;
  Arcade.rr(ctx, BX + x * CELL + pad, BY + y * CELL + pad, CELL - pad * 2, CELL - pad * 2, r);
  ctx.fill();
}
function draw() {
  view.begin();
  ctx.fillStyle = '#0b0c10';
  ctx.fillRect(0, 0, W, H);
  ctx.save();
  if (shake) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  // Bord
  ctx.fillStyle = '#14161b';
  Arcade.rr(ctx, BX - 6, BY - 6, N * CELL + 12, N * CELL + 12, 14); ctx.fill();
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) if ((x + y) % 2) { ctx.fillStyle = '#181a20'; ctx.fillRect(BX + x * CELL, BY + y * CELL, CELL, CELL); }

  if (state !== 'menu') {
    for (const k of walls) { const [x, y] = k.split(',').map(Number); cellRect(x, y, 1, 4, '#4a4f58'); cellRect(x, y, 5, 2, '#5b616b'); }
    if (apple) { cellRect(apple.x, apple.y, 3, 10, '#e8282f'); ctx.fillStyle = '#5fae5a'; ctx.fillRect(BX + apple.x * CELL + 10, BY + apple.y * CELL + 1, 3, 5); }
    if (gold && (gold.t > 2 || Math.floor(gold.t * 8) % 2)) { ctx.save(); ctx.shadowColor = '#ffd23f'; ctx.shadowBlur = 12; cellRect(gold.x, gold.y, 3, 10, '#ffd23f'); ctx.restore(); }
    if (power && (power.t > 2 || Math.floor(power.t * 8) % 2)) {
      cellRect(power.x, power.y, 2, 6, power.type === 'traag' ? '#5ab8ff' : '#ffffff');
      Arcade.text(ctx, power.type === 'traag' ? '⏱' : '👻', BX + power.x * CELL + CELL / 2, BY + power.y * CELL + CELL / 2 + 1, 13, '#000', 'center');
    }
    // Slang
    ctx.globalAlpha = ghostT > 0 ? 0.55 : 1;
    snake.forEach((s, i) => {
      const t = i / Math.max(1, snake.length - 1);
      const v = Math.round(245 - t * 110);
      cellRect(s.x, s.y, i === 0 ? 1 : 2, i === 0 ? 7 : 5, `rgb(${v},${v},${v + 4})`);
    });
    ctx.globalAlpha = 1;
    const h = snake[0];
    const cx = BX + h.x * CELL + CELL / 2, cy = BY + h.y * CELL + CELL / 2;
    ctx.fillStyle = '#0b0c10';
    for (const side of [-1, 1]) {
      const ex = cx + dir.x * 4 + (dir.y ? side * 5 : 0), ey = cy + dir.y * 4 + (dir.x ? side * 5 : 0);
      ctx.beginPath(); ctx.arc(ex, ey, 2.4, 0, 6.28); ctx.fill();
    }
  }
  for (const q of parts) { ctx.globalAlpha = Math.max(0, q.life * 2); ctx.fillStyle = q.color; ctx.fillRect(q.x - 2, q.y - 2, 4, 4); }
  ctx.globalAlpha = 1;
  ctx.restore();

  // Bovenbalk
  if (state === 'menu') {
    Arcade.text(ctx, 'SNAKE', W / 2, 50, 46, '#ffffff', 'center', '900');
    Arcade.text(ctx, '2.0', W / 2 + 112, 56, 22, '#e8282f', 'center', '900');
    ctx.fillStyle = 'rgba(11,12,16,0.82)'; Arcade.rr(ctx, BX + 20, BY + 60, N * CELL - 40, 300, 16); ctx.fill();
    const lines = [
      ['🍎', 'Appel: +1 en je wordt langer'],
      ['⭐', 'Gouden appel: +5 (verdwijnt snel!)'],
      ['⏱', 'Klok: alles gaat 6 sec trager'],
      ['👻', 'Spook: 6 sec door jezelf heen'],
      ['🧱', `Na ${APPLES_PER_LEVEL} appels: nieuw level met muren`],
    ];
    lines.forEach(([ic, tx], i) => { Arcade.text(ctx, ic, BX + 54, BY + 105 + i * 40, 18, '#fff', 'center'); Arcade.text(ctx, tx, BX + 78, BY + 105 + i * 40, 15, '#e6e9ee', 'left', '600'); });
    if (best) Arcade.text(ctx, `Record: ${best}`, W / 2, BY + 320, 16, '#ffffff', 'center', '800');
    if (Math.floor(performance.now() / 500) % 2 === 0) Arcade.text(ctx, Arcade.touch ? 'Tik om te starten · veeg om te sturen' : 'Druk op Enter · sturen met pijltjes', W / 2, H - 30, 17, '#ffffff', 'center', '800');
    return;
  }
  Arcade.text(ctx, String(score), BX, 72, 34, '#ffffff', 'left', '900', true);
  Arcade.text(ctx, `Record ${Math.max(best, score)}`, BX, 98, 12, '#9aa1ab', 'left', '700');
  Arcade.text(ctx, `Level ${level}`, BX + N * CELL, 64, 18, '#ffffff', 'right', '800');
  // voortgang naar het volgende level
  const prog = (apples % APPLES_PER_LEVEL) / APPLES_PER_LEVEL;
  ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.fillRect(BX + N * CELL - 120, 84, 120, 6);
  ctx.fillStyle = '#e8282f'; ctx.fillRect(BX + N * CELL - 120, 84, 120 * prog, 6);
  let y = BY + N * CELL + 34;
  if (slowT > 0) { Arcade.text(ctx, `⏱ Trager ${Math.ceil(slowT)}s`, BX, y, 14, '#5ab8ff', 'left', '800'); }
  if (ghostT > 0) { Arcade.text(ctx, `👻 Spook ${Math.ceil(ghostT)}s`, BX + N * CELL, y, 14, '#ffffff', 'right', '800'); }
  if (banner) { ctx.globalAlpha = Math.min(1, banner.t * 2); Arcade.text(ctx, banner.text, W / 2, BY + N * CELL / 2, 44, '#ffffff', 'center', '900'); ctx.globalAlpha = 1; }
  if (state === 'pause') Arcade.overlay(ctx, W, H, 'PAUZE', ['Druk op P of tik om verder te gaan']);
  if (state === 'over') Arcade.overlay(ctx, W, H, 'GAME OVER', [{ t: String(score), size: 34, color: '#fff', weight: '900', mono: true }, newRecord ? { t: '🏆 Nieuw record!', color: '#ffffff' } : `Record: ${best}`, `Level ${level} · lengte ${snake.length}`],
    overT <= 0 ? (Arcade.touch ? 'Tik om opnieuw te spelen' : 'Enter = opnieuw') : '');
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

  </script>
</body>
</html>
