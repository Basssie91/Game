<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Stack Tower · Bas Arcade</title>
  <meta name="description" content="Stapel de blokken precies op elkaar. Hoe hoog kom jij?">
  <meta name="theme-color" content="#0b0c10">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%2316181d%22/%3E%3Cpath%20d%3D%22M32%2046%20L52%2038%20L32%2030%20L12%2038%20Z%22%20fill%3D%22%239aa1ab%22/%3E%3Cpath%20d%3D%22M12%2038%20V43%20L32%2051%20V46%20Z%22%20fill%3D%22%235b616b%22/%3E%3Cpath%20d%3D%22M52%2038%20V43%20L32%2051%20V46%20Z%22%20fill%3D%22%237b828c%22/%3E%3Cpath%20d%3D%22M32%2036%20L50%2029%20L32%2022%20L14%2029%20Z%22%20fill%3D%22%23d6dae0%22/%3E%3Cpath%20d%3D%22M14%2029%20V34%20L32%2041%20V36%20Z%22%20fill%3D%22%238a919b%22/%3E%3Cpath%20d%3D%22M50%2029%20V34%20L32%2041%20V36%20Z%22%20fill%3D%22%23aab0b9%22/%3E%3Cpath%20d%3D%22M34%2025%20L50%2019%20L34%2013%20L18%2019%20Z%22%20fill%3D%22%23e8282f%22/%3E%3Cpath%20d%3D%22M18%2019%20V24%20L34%2030%20V25%20Z%22%20fill%3D%22%23a61d24%22/%3E%3Cpath%20d%3D%22M50%2019%20V24%20L34%2030%20V25%20Z%22%20fill%3D%22%23c4232b%22/%3E%3C/svg%3E">
  <style>
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #0b0c10; color: #fff; overflow: hidden;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-user-select: none; user-select: none; }
body { display: flex; align-items: center; justify-content: center; }
canvas { display: block; touch-action: none; box-shadow: 0 0 0 1px rgba(255,255,255,0.08); }
.terug, .geluid { position: fixed; top: 12px; z-index: 5; color: #fff; text-decoration: none; background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.22); padding: 8px 12px; border-radius: 10px; font: 600 14px system-ui, sans-serif; cursor: pointer; }
.terug { left: 12px; } .geluid { right: 12px; }
.terug:hover, .geluid:hover { background: rgba(255,255,255,0.2); }
</style>
</head>
<body>
  <a class="terug" href="../">← Games</a>
  <button class="geluid" type="button" aria-label="Geluid aan/uit">🔊</button>
  <canvas id="c"></canvas>
  
  <script>
'use strict';
// ================= Gedeeld voor alle games: opslag, geluid, scherm, knoppen =================
const Arcade = (() => {
  const load = (k, d) => { try { const v = localStorage.getItem('arcade_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } };
  const save = (k, v) => { try { localStorage.setItem('arcade_' + k, JSON.stringify(v)); } catch (e) { /* uit */ } };
  let audio = null;
  let muted = load('muted', false);

  function initAudio() {
    if (audio) { if (audio.state === 'suspended') audio.resume(); return; }
    try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audio = null; }
  }
  addEventListener('pointerdown', initAudio);
  addEventListener('keydown', initAudio);

  function beep(freq, dur, type = 'square', vol = 0.05, slide = 0, delay = 0) {
    if (muted || !audio) return;
    try {
      const t = audio.currentTime + delay;
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, t);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g);
      g.connect(audio.destination);
      o.start(t);
      o.stop(t + dur);
    } catch (e) { /* negeren */ }
  }

  // Geluidsknop
  const sndBtn = document.querySelector('.geluid');
  const showSnd = () => { if (sndBtn) sndBtn.textContent = muted ? '🔇' : '🔊'; };
  showSnd();
  if (sndBtn) sndBtn.addEventListener('click', (e) => { e.stopPropagation(); muted = !muted; save('muted', muted); showSnd(); sndBtn.blur(); });
  addEventListener('keydown', (e) => { if (e.code === 'KeyM') { muted = !muted; save('muted', muted); showSnd(); } });

  // Canvas met vaste spelgrootte (W×H) die netjes in het venster past
  function canvas(id, W, H) {
    const c = document.getElementById(id);
    const ctx = c.getContext('2d');
    const view = { W, H, scale: 1 };
    const fit = () => {
      const s = Math.min(innerWidth / W, innerHeight / H);
      const dpr = Math.min(2, devicePixelRatio || 1);
      c.style.width = Math.floor(W * s) + 'px';
      c.style.height = Math.floor(H * s) + 'px';
      c.width = Math.floor(W * s * dpr);
      c.height = Math.floor(H * s * dpr);
      view.scale = s * dpr;
      ctx.setTransform(view.scale, 0, 0, view.scale, 0, 0);
    };
    fit();
    addEventListener('resize', fit);
    view.begin = () => ctx.setTransform(view.scale, 0, 0, view.scale, 0, 0);
    view.toGame = (e) => {
      const r = c.getBoundingClientRect();
      return { x: ((e.clientX - r.left) / r.width) * W, y: ((e.clientY - r.top) / r.height) * H };
    };
    return { c, ctx, view };
  }

  // Vegen (swipe) op touchscreens: geeft 'links', 'rechts', 'op' of 'neer'
  function onSwipe(el, fn, onTap) {
    let sx = 0, sy = 0, st = 0, active = false;
    el.addEventListener('pointerdown', (e) => { sx = e.clientX; sy = e.clientY; st = performance.now(); active = true; });
    el.addEventListener('pointerup', (e) => {
      if (!active) return;
      active = false;
      const dx = e.clientX - sx, dy = e.clientY - sy;
      if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) { if (onTap) onTap(e); return; }
      if (Math.abs(dx) > Math.abs(dy)) fn(dx > 0 ? 'rechts' : 'links');
      else fn(dy > 0 ? 'neer' : 'op');
    });
  }

  // Tekenhulpjes in dezelfde stijl
  function rr(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function text(ctx, t, x, y, size, color = '#fff', align = 'center', weight = '700', mono = false) {
    ctx.font = `${weight} ${size}px ${mono ? 'ui-monospace, Consolas, monospace' : 'system-ui, -apple-system, "Segoe UI", sans-serif'}`;
    ctx.fillStyle = color;
    ctx.textAlign = align;
    ctx.textBaseline = 'middle';
    ctx.fillText(t, x, y);
  }
  // Standaard scherm voor start / pauze / game over
  function overlay(ctx, W, H, title, lines = [], hint = '') {
    ctx.fillStyle = 'rgba(10, 11, 14, 0.72)';
    ctx.fillRect(0, 0, W, H);
    const pw = Math.min(W - 40, 380), ph = 130 + lines.length * 30 + (hint ? 40 : 0);
    const x = (W - pw) / 2, y = (H - ph) / 2;
    ctx.fillStyle = 'rgba(24, 26, 31, 0.95)';
    rr(ctx, x, y, pw, ph, 16);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    text(ctx, title, W / 2, y + 50, 32, '#fff', 'center', '900');
    lines.forEach((l, i) => {
      const s = typeof l === 'string' ? { t: l } : l;
      text(ctx, s.t, W / 2, y + 100 + i * 30, s.size || 18, s.color || '#c9ced6', 'center', s.weight || '600', s.mono);
    });
    if (hint && Math.floor(performance.now() / 500) % 2 === 0) text(ctx, hint, W / 2, y + ph - 34, 15, '#ffffff', 'center', '700');
  }

  return {
    load, save, beep,
    get muted() { return muted; },
    best: (game) => load('best_' + game, 0),
    // Slaat een nieuwe topscore op; geeft true terug als het een record is
    record: (game, score, lowerIsBetter = false) => {
      const b = load('best_' + game, 0);
      if (!b || (lowerIsBetter ? score < b : score > b)) { save('best_' + game, score); return true; }
      return false;
    },
    canvas, onSwipe, rr, text, overlay,
    touch: matchMedia('(hover: none) and (pointer: coarse)').matches,
  };
})();

// ================= STACK TOWER =================
const W = 480, H = 720;
const { c, ctx, view } = Arcade.canvas('c', W, H);
const GAME = 'stack';
const SC = 46;            // pixels per eenheid
const LH = 0.5;           // hoogte van een laag
const CX = W / 2, BASE_Y = 520;
const COS = Math.cos(Math.PI / 6), SIN = Math.sin(Math.PI / 6);

let state = 'menu'; // menu | play | over
let layers, moving, falling, score, combo, camY, overT, newRecord, flash, perfectT, hue;
let best = Arcade.best(GAME);

function iso(x, y, z) { return { x: CX + (x - z) * COS * SC, y: BASE_Y + camY - (x + z) * SIN * SC - y * SC }; }

// Elke laag een eigen tint (blauwgrijs, licht/donker om en om) zodat je diepte ziet
function layerColors(level) {
  const hue = 205 + Math.sin(level * 0.22) * 25;
  const light = 58 + Math.sin(level * 0.5) * 8 + (level % 2 ? -5 : 5);
  return [`hsl(${hue}, 28%, ${light + 12}%)`, `hsl(${hue}, 30%, ${light - 22}%)`, `hsl(${hue}, 28%, ${light - 8}%)`];
}
const MOVING = ['#ff4d55', '#a61d24', '#d42a32'];
const PERFECT = ['#ffffff', '#9aa1ab', '#c9ced6'];
function drawBox(b, level, colors, alpha = 1) {
  const { x, z, w, d } = b, y = b.y;
  const p = (dx, dy, dz) => iso(x + dx, y + dy, z + dz);
  const top = [p(0, LH, 0), p(w, LH, 0), p(w, LH, d), p(0, LH, d)];
  const left = [p(0, 0, d), p(w, 0, d), p(w, LH, d), p(0, LH, d)];
  const right = [p(w, 0, 0), p(w, 0, d), p(w, LH, d), p(w, LH, 0)];
  const cols = colors || layerColors(level);
  ctx.globalAlpha = alpha;
  ctx.lineJoin = 'round';
  const poly = (pts, col) => {
    ctx.fillStyle = col;
    ctx.beginPath(); pts.forEach((q, i) => (i ? ctx.lineTo(q.x, q.y) : ctx.moveTo(q.x, q.y))); ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = 1; ctx.stroke();
  };
  poly(left, cols[1]);
  poly(right, cols[2]);
  poly(top, cols[0]);
  ctx.globalAlpha = 1;
}
// Hulplijn: waar de toren eronder ligt, op de hoogte van het bewegende blok
function drawGuide(top, y, good) {
  const p = (dx, dz) => iso(top.x + dx, y, top.z + dz);
  const pts = [p(0, 0), p(top.w, 0), p(top.w, top.d), p(0, top.d)];
  ctx.save();
  ctx.setLineDash([6, 5]);
  ctx.lineWidth = 2;
  ctx.strokeStyle = good ? '#3ddc84' : 'rgba(255,255,255,0.55)';
  ctx.beginPath(); pts.forEach((q, i) => (i ? ctx.lineTo(q.x, q.y) : ctx.moveTo(q.x, q.y))); ctx.closePath(); ctx.stroke();
  ctx.restore();
}

function start() {
  layers = [{ x: -1.5, z: -1.5, w: 3, d: 3, y: -LH * 6 }];
  // Een paar startlagen als sokkel
  for (let i = 1; i < 6; i++) layers.push({ x: -1.5, z: -1.5, w: 3, d: 3, y: -LH * (6 - i) });
  falling = []; score = 0; combo = 0; camY = 0; flash = 0; perfectT = 0; newRecord = false;
  newMoving();
  state = 'play';
  Arcade.beep(440, 0.15, 'triangle', 0.05, 300);
}
function newMoving() {
  const top = layers[layers.length - 1];
  const axis = score % 2 === 0 ? 'x' : 'z';
  const speed = Math.min(5.5, 2.2 + score * 0.06);
  moving = { ...top, y: top.y + LH, axis, dir: 1, speed, t: 0 };
  if (axis === 'x') moving.x = top.x - 3.4; else moving.z = top.z - 3.4;
}
function drop() {
  if (state === 'menu' || (state === 'over' && overT <= 0)) { start(); return; }
  if (state !== 'play') return;
  const top = layers[layers.length - 1];
  const m = moving;
  const a = m.axis, size = a === 'x' ? 'w' : 'd';
  const delta = m[a] - top[a];
  if (Math.abs(delta) < 0.12) {
    // Perfect!
    m[a] = top[a];
    combo++;
    perfectT = 0.4;
    if (combo >= 3) {
      // Bij een reeks perfecte drops groeit het blok weer een beetje
      const grow = 0.15;
      const s2 = size === 'w' ? 'w' : 'd';
      m[s2] = Math.min(3, m[s2] + grow);
    }
    Arcade.beep(520 + Math.min(combo, 12) * 60, 0.12, 'triangle', 0.06);
  } else {
    const overlap = top[size] - Math.abs(delta);
    if (overlap <= 0) {
      falling.push({ ...m, vy: 0, rot: 0 });
      moving = null;
      gameOver();
      return;
    }
    combo = 0;
    // Afgesneden stuk valt naar beneden
    const cut = { ...m };
    if (delta > 0) { cut[a] = top[a] + top[size]; cut[size] = delta; m[size] = overlap; }
    else { cut[a] = m[a]; cut[size] = -delta; m[a] = top[a]; m[size] = overlap; }
    falling.push({ ...cut, vy: 0, level: layers.length, front: delta > 0 });
    Arcade.beep(300, 0.08, 'square', 0.04, -100);
  }
  const placed = { x: m.x, z: m.z, w: m.w, d: m.d, y: m.y };
  layers.push(placed);
  score++;
  newMoving();
}
function gameOver() {
  state = 'over'; overT = 0.8;
  newRecord = Arcade.record(GAME, score);
  best = Arcade.best(GAME);
  flash = 0.3;
  Arcade.beep(180, 0.5, 'sawtooth', 0.06, -90);
}

addEventListener('keydown', (e) => { if (e.code === 'Space' || e.code === 'Enter' || e.code === 'ArrowDown') { e.preventDefault(); if (!e.repeat) drop(); } });
c.addEventListener('pointerdown', (e) => { e.preventDefault(); drop(); });

function update(dt) {
  flash = Math.max(0, flash - dt);
  perfectT = Math.max(0, perfectT - dt);
  if (state === 'over') overT -= dt;
  if (state === 'play' && moving) {
    const top = layers[layers.length - 1];
    const a = moving.axis;
    moving[a] += moving.dir * moving.speed * dt;
    if (moving[a] > top[a] + 3.4) moving.dir = -1;
    if (moving[a] < top[a] - 3.4) moving.dir = 1;
  }
  for (const f of falling) { f.vy -= 30 * dt; f.y += f.vy * dt; }
  falling = falling.filter((f) => f.y > -40);
  const targetCam = layers ? Math.max(0, (layers[layers.length - 1].y + LH) * SC - 60) : 0;
  camY += (targetCam - camY) * Math.min(1, 5 * dt);
}

function draw() {
  view.begin();
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#20232a'); g.addColorStop(1, '#0b0c10');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  if (state !== 'menu' || layers) {
    if (layers) drawBox({ x: -2.6, z: -2.6, w: 5.2, d: 5.2, y: layers[0].y - LH }, 0, ['#2a2e36', '#16181d', '#1f2228']);
    if (!layers) start(), (state = 'menu');
    // Afgevallen stukken achter de toren eerst, die ervoor pas na de toren
    for (const f of falling) if (!f.front) drawBox(f, f.level || layers.length, null, Math.max(0, Math.min(1, 1 + f.y / 20)));
    layers.forEach((b, i) => drawBox(b, i));
    if (moving && state === 'play') {
      const top = layers[layers.length - 1];
      const good = Math.abs(moving[moving.axis] - top[moving.axis]) < 0.12;
      // Schaduw van het bewegende blok op de toren
      const ox0 = Math.max(moving.x, top.x), ox1 = Math.min(moving.x + moving.w, top.x + top.w);
      const oz0 = Math.max(moving.z, top.z), oz1 = Math.min(moving.z + moving.d, top.z + top.d);
      if (ox1 > ox0 && oz1 > oz0) {
        const q = (x, z) => iso(x, top.y + LH, z);
        const pts = [q(ox0, oz0), q(ox1, oz0), q(ox1, oz1), q(ox0, oz1)];
        ctx.fillStyle = good ? 'rgba(61,220,132,0.35)' : 'rgba(0,0,0,0.25)';
        ctx.beginPath(); pts.forEach((v, i) => (i ? ctx.lineTo(v.x, v.y) : ctx.moveTo(v.x, v.y))); ctx.closePath(); ctx.fill();
      }
      drawBox(moving, layers.length, good ? PERFECT : MOVING);
      drawGuide(top, moving.y + LH, good);
    }
    for (const f of falling) if (f.front) drawBox(f, f.level || layers.length, null, Math.max(0, Math.min(1, 1 + f.y / 20)));
    if (perfectT > 0) {
      const top = layers[layers.length - 1];
      const q = iso(top.x + top.w / 2, top.y + LH, top.z + top.d / 2);
      ctx.strokeStyle = `rgba(255,255,255,${perfectT * 2})`; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.ellipse(q.x, q.y, (top.w + 0.6 + (0.4 - perfectT)) * SC * 0.9, (top.d + 0.6 + (0.4 - perfectT)) * SC * 0.5, 0, 0, 6.28); ctx.stroke();
    }
  }
  if (flash) { ctx.fillStyle = `rgba(232,40,47,${flash})`; ctx.fillRect(0, 0, W, H); }

  if (state === 'menu') {
    Arcade.text(ctx, 'STACK', W / 2, 110, 60, '#ffffff', 'center', '900');
    Arcade.text(ctx, 'TOWER', W / 2, 166, 44, '#e8282f', 'center', '900');
    Arcade.text(ctx, 'Laat het blok vallen als het precies', W / 2, 228, 16, '#c9ced6', 'center', '600');
    Arcade.text(ctx, 'boven de toren hangt. Wat uitsteekt valt eraf!', W / 2, 252, 16, '#c9ced6', 'center', '600');
    Arcade.text(ctx, '3× perfect = je blok wordt weer groter', W / 2, 284, 14, '#ffffff', 'center', '700');
    Arcade.text(ctx, 'Wordt het blok wit met een groene lijn? Nu klikken!', W / 2, 312, 14, '#3ddc84', 'center', '700');
    if (best) Arcade.text(ctx, `Record: ${best}`, W / 2, 640, 17, '#fff', 'center', '800');
    if (Math.floor(performance.now() / 500) % 2 === 0) Arcade.text(ctx, Arcade.touch ? 'Tik om te starten' : 'Spatie = start / laten vallen', W / 2, 680, 18, '#ffffff', 'center', '800');
    return;
  }
  Arcade.text(ctx, String(score), W / 2, 110, 64, '#ffffff', 'center', '900');
  if (combo >= 2 && state === 'play') Arcade.text(ctx, `${combo}× perfect!`, W / 2, 158, 16, '#e8282f', 'center', '800');
  if (state === 'play' && score === 0) Arcade.text(ctx, Arcade.touch ? 'Tik om te laten vallen' : 'Spatie = laten vallen', W / 2, H - 40, 16, '#c9ced6', 'center', '600');
  if (state === 'over') Arcade.overlay(ctx, W, H, 'TOREN STORT IN!', [{ t: String(score), size: 34, color: '#fff', weight: '900', mono: true }, newRecord ? { t: '🏆 Nieuw record!', color: '#ffffff' } : `Record: ${best}`],
    overT <= 0 ? (Arcade.touch ? 'Tik om opnieuw te bouwen' : 'Spatie = opnieuw') : '');
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
start(); state = 'menu';
requestAnimationFrame(loop);

  </script>
</body>
</html>
