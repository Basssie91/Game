(() => {
  try {
    const RAW = Storage.prototype.setItem, RM = Storage.prototype.removeItem, KEY = 'arcade_mtimes';
    const re = /^(arcade_|tt2_)/, skip = /^tt2_ghost|^arcade_settings$|^arcade_mtimes$|^arcade_recent$/;

    Storage.prototype.setItem = function (k, v) {
      if (this !== localStorage) return RAW.call(this, k, v);
      const old = this.getItem(k); RAW.call(this, k, v);
      if (old !== String(v)) touch(k);
    };
    Storage.prototype.removeItem = function (k) { if (this === localStorage && this.getItem(k) != null) touch(k); RM.call(this, k); };
    addEventListener('pagehide', flush);
    // voor auth.js: tijden lezen en (na overnemen uit de cloud) de tijd van de cloud zetten
    window.ArcadeTimes = { all: () => mt, set: (k, t) => { mt[k] = t; flush(); }, merge: (o) => { for (const k in o || {}) if (!(mt[k] >= o[k])) mt[k] = o[k]; flush(); } };

  // Melodie maken uit de toonladder (altijd hetzelfde per nummer)
  function makeMelody(song) {
    const R = rng(song.seed);
    const motif = [];
    for (let i = 0; i < 32; i++) {
      if (R() > song.density || i % 2 === 1 && R() < 0.5) { motif.push(null); continue; }
      const deg = Math.floor(R() * 7) + (R() < 0.3 ? 7 : 0);
      const len = R() < 0.25 ? 3 : R() < 0.5 ? 2 : 1;
      motif.push({ deg, len });
    }
    const mel = [];
    for (let bar = 0; bar < 8; bar++) {
      for (let i = 0; i < 16; i++) {
        let m = motif[(bar % 2) * 16 + i];
        if (m && bar >= 4 && bar % 2 === 1 && i > 8) m = { deg: m.deg + 2, len: m.len }; // kleine variatie
        mel.push(m);
      }
    }
    return mel;

function genMap(m) {

    rooms.push({ x, y, w, h, cx: x + w / 2, cy: y + h / 2 });

    let x = Math.floor(a.cx) - 1, y = Math.floor(a.cy) - 1;
    const tx = Math.floor(b.cx) - 1, ty = Math.floor(b.cy) - 1;
    if (R() < 0.5) { while (x !== tx) { carve(x, y); x += Math.sign(tx - x); } while (y !== ty) { carve(x, y); y += Math.sign(ty - y); } }
    else { while (y !== ty) { carve(x, y); y += Math.sign(ty - y); } while (x !== tx) { carve(x, y); x += Math.sign(tx - x); } }
    carve(x, y);

  // begin in het plein dat het dichtst bij een hoek ligt
  rooms.sort((a, b) => (a.cx + a.cy) - (b.cx + b.cy));
  const linked = [rooms[0]];
  for (let i = 1; i < rooms.length; i++) {
    let best = linked[0], bd = Infinity;
    for (const l of linked) { const d = Math.abs(l.cx - rooms[i].cx) + Math.abs(l.cy - rooms[i].cy); if (d < bd) { bd = d; best = l; } }

  const bmat = (tx, ty) => (hash2(Math.floor(tx / 3), Math.floor(ty / 3), m.seed + 5) > 0.45 ? 'brick' : 'plaster');
  const tint = (tx, ty) => { const k = hash2(Math.floor(tx / 3), Math.floor(ty / 3), m.seed + 6); return bmat(tx, ty) === 'brick' ? [0.85 + k * 0.25, 0.8 + k * 0.2, 0.8 + k * 0.2] : [0.75 + k * 0.3, 0.72 + k * 0.28, 0.66 + k * 0.3]; };
  const face = (tx, ty, dir, ya, yb) => {
    const x0 = tx * T, z0 = ty * T, x1 = x0 + T, z1 = z0 + T;
    const k = bmat(tx, ty), col = tint(tx, ty);
    for (let y = ya; y < yb - 0.01; y += FLOOR) {
      const lit = S.lamps && y > 0 && hash2(tx * 7 + dir, ty * 13 + Math.round(y), m.seed) < (S.lit ? 0.45 : 0.2);
      const mk = k + (lit ? 'Lit' : '');
      const v0 = 0, vh = 1;
      const dk = y === 0 ? 0.62 : 1, c4 = [col.map((v) => v * dk), col.map((v) => v * dk), col, col];   // onderkant donkerder
      if (dir === 0) B(mk).quad([x1, y, z1], [x1, y, z0], [x1, y + FLOOR, z0], [x1, y + FLOOR, z1], [1, 0, 0], 1, vh, 0, v0, c4);
      if (dir === 1) B(mk).quad([x0, y, z0], [x0, y, z1], [x0, y + FLOOR, z1], [x0, y + FLOOR, z0], [-1, 0, 0], 1, vh, 0, v0, c4);
      if (dir === 2) B(mk).quad([x0, y, z1], [x1, y, z1], [x1, y + FLOOR, z1], [x0, y + FLOOR, z1], [0, 0, 1], 1, vh, 0, v0, c4);
      if (dir === 3) B(mk).quad([x1, y, z0], [x0, y, z0], [x0, y + FLOOR, z0], [x1, y + FLOOR, z0], [0, 0, -1], 1, vh, 0, v0, c4);
    }
  };
  for (let ty = 0; ty < rows; ty++) for (let tx = 0; tx < cols; tx++) {
    if (!g[ty][tx]) continue;
    const h = hgt[ty][tx];
    const nb = [[tx + 1, ty], [tx - 1, ty], [tx, ty + 1], [tx, ty - 1]];
    nb.forEach(([nx, ny], dir) => {
      if (nx < 0 || ny < 0 || nx >= cols || ny >= rows) return;
      if (!g[ny][nx]) face(tx, ty, dir, 0, h);
      else if (hgt[ny][nx] < h) face(tx, ty, dir, hgt[ny][nx], h);
    });
    const x0 = tx * T, z0 = ty * T;
    B('roof').quad([x0, h, z0 + T], [x0 + T, h, z0 + T], [x0 + T, h, z0], [x0, h, z0], [0, 1, 0], 1, 1, 0, 0);
  }
  // --- Stoepranden langs de gebouwen in de straten (alleen voor de looks)
  for (let ty = 0; ty < rows; ty++) for (let tx = 0; tx < cols; tx++) {
    if (g[ty][tx] || inRoom(tx, ty)) continue;
    const cx = tx * T + T / 2, cz = ty * T + T / 2;
    if (solidT(tx + 1, ty)) B('concrete').add(G.boxB, M4(tx * T + T - 0.7, 0, cz, 0, 1.4, 0.14, T), [0.9, 0.9, 0.9], 1, 1);
    if (solidT(tx - 1, ty)) B('concrete').add(G.boxB, M4(tx * T + 0.7, 0, cz, 0, 1.4, 0.14, T), [0.9, 0.9, 0.9], 1, 1);
    if (solidT(tx, ty + 1)) B('concrete').add(G.boxB, M4(cx, 0, ty * T + T - 0.7, 0, T, 0.14, 1.4), [0.9, 0.9, 0.9], 1, 1);
    if (solidT(tx, ty - 1)) B('concrete').add(G.boxB, M4(cx, 0, ty * T + 0.7, 0, T, 0.14, 1.4), [0.9, 0.9, 0.9], 1, 1);
  }

  // --- Startplein: vluchtbusje
  const start = MAP.rooms[0];
  const sx = (start.x + 1.2) * T, sz = (start.y + start.h / 2) * T;
  getaway = { x: sx + 1, z: sz, zone: { x: sx + 4.2, z: sz } };
  buildVan(B, getaway.x, getaway.z);
  addProp(getaway.x, getaway.z, 2.1, 5.2, 0, 2.3, 'van');
  startPos = { x: sx + 5, z: sz + 2.5 };

  // --- Kluis: in de muur van het verste plein
  vault = null;
  buildNav();
  const dist0 = navFlood(startPos.x, startPos.z, new Int32Array(NAV.nx * NAV.nz));
  const roomDist = (r) => dist0[Math.floor(r.cy * T) * NAV.nx + Math.floor(r.cx * T)];
  const far = MAP.rooms.slice(1).sort((a, b) => roomDist(b) - roomDist(a));
  MAP.vaultRoom = far[0];
  if (m.vault) {
    const r = far[0];
    const cand = [];
    for (let x = r.x + 1; x < r.x + r.w - 1; x++) { cand.push([x, r.y - 1, 2]); cand.push([x, r.y + r.h, 3]); }
    for (let y = r.y + 1; y < r.y + r.h - 1; y++) { cand.push([r.x - 1, y, 0]); cand.push([r.x + r.w, y, 1]); }
    const ok = cand.filter(([x, y, d]) => {
      if (!solidT(x, y)) return false;
      const side = d >= 2 ? [[x - 1, y], [x + 1, y]] : [[x, y - 1], [x, y + 1]];
      const back = d === 2 ? [x, y - 1] : d === 3 ? [x, y + 1] : d === 0 ? [x - 1, y] : [x + 1, y];
      return side.every(([a, b]) => solidT(a, b)) && solidT(back[0], back[1]);
    });
    const pick = ok[Math.floor(R() * ok.length)] || cand.find(([x, y]) => solidT(x, y));
    if (pick) {
      const [vx, vy, d] = pick;
      // d: richting van de opening vanaf de muurtegel
      const nrm = [[1, 0], [-1, 0], [0, 1], [0, -1]][d];
      const fx = vx * T + T / 2 + nrm[0] * T / 2, fz = vy * T + T / 2 + nrm[1] * T / 2;
      vault = { x: fx, z: fz, nx: nrm[0], nz: nrm[1], group: buildVault(fx, fz, nrm), open: 0 };
      addProp(fx + nrm[0] * 0.45, fz + nrm[1] * 0.45, nrm[0] ? 0.9 : 3.4, nrm[0] ? 3.4 : 0.9, 0, 3.3, 'vault');
    }
  }

  // --- Dekking op de pleinen: kratten, containers, auto's, betonblokken, vaten
  const CON = [0x8c2f24, 0x2c5b8f, 0x3d6b3a, 0xb07a24, 0x6b6f75, 0x7a2f5c];
  const CAR = [0xd9d9d9, 0x1d1f22, 0x7b1e1e, 0x2a3f66, 0x9a9da3, 0x3b4b3a];
  const tryPlace = (cx, cz, sx2, sz2, room) => {
    const m2 = 1.6;
    if (cx - sx2 / 2 < room.x * T + 2.5 || cx + sx2 / 2 > (room.x + room.w) * T - 2.5 || cz - sz2 / 2 < room.y * T + 2.5 || cz + sz2 / 2 > (room.y + room.h) * T - 2.5) return false;
    for (const p of props) if (cx - sx2 / 2 < p.x1 + m2 && cx + sx2 / 2 > p.x0 - m2 && cz - sz2 / 2 < p.z1 + m2 && cz + sz2 / 2 > p.z0 - m2) return false;
    if (Math.hypot(cx - startPos.x, cz - startPos.z) < 5) return false;
    if (vault && Math.hypot(cx - (vault.x + vault.nx * 3), cz - (vault.z + vault.nz * 3)) < 5) return false;
    return true;
  };
  const placed = [];
  MAP.rooms.forEach((room, ri) => {
    const n = Math.floor((room.w * room.h) / 4) + 2;
    for (let k = 0; k < n * 4 && placed.filter((p) => p.room === ri).length < n; k++) {
      const cx = (room.x + R() * room.w) * T, cz = (room.y + R() * room.h) * T, rot = R() < 0.5;
      const r = R();
      const before = props.length;
      let kind, draw;
      if (r < 0.32) {                        // krat-stapel
        kind = 'crates';
        const sx2 = R() < 0.5 ? 2.5 : 1.25, sz2 = 1.25;
        if (!tryPlace(cx, cz, rot ? sz2 : sx2, rot ? sx2 : sz2, room)) continue;
        const pieces = sx2 > 2 ? [[-0.62, 0], [0.62, 0]] : [[0, 0]];
        const ds = [];
        pieces.forEach(([ox, oz], idx) => {
          const px = cx + (rot ? oz : ox), pz = cz + (rot ? ox : oz);
          const yaw = (R() - 0.5) * 0.12, top = idx === 0 && R() < 0.55, yaw2 = (R() - 0.5) * 0.4;
          ds.push(() => { B('wood').add(G.boxB, M4(px, 0, pz, yaw, 1.2, 1.2, 1.2), [1, 1, 1]); if (top) B('wood').add(G.boxB, M4(px, 1.2, pz, yaw2, 1.2, 1.2, 1.2), [0.92, 0.92, 0.92]); });
          addProp(px, pz, 1.22, 1.22, 0, 1.2, 'crate');
          if (top) addProp(px, pz, 1.22, 1.22, 1.2, 2.4, 'crate');
        });
        draw = () => ds.forEach((f) => f());
      } else if (r < 0.48 && room.w >= 5 && room.h >= 5) {   // zeecontainer
        kind = 'container';
        const sx2 = rot ? 2.45 : 6.06, sz2 = rot ? 6.06 : 2.45;
        if (!tryPlace(cx, cz, sx2, sz2, room)) continue;
        const col = hexRGB(CON[Math.floor(R() * CON.length)]);
        draw = () => {
          B('container').add(G.boxB, M4(cx, 0, cz, rot ? Math.PI / 2 : 0, 6.06, 2.6, 2.45), col, 14, 2);
          B('dark').add(G.boxB, M4(cx, 2.6, cz, rot ? Math.PI / 2 : 0, 6.1, 0.06, 2.5), col.map((v) => v * 0.6));
        };
        addProp(cx, cz, sx2, sz2, 0, 2.66, 'container');
      } else if (r < 0.66) {                 // geparkeerde auto
        kind = 'car';
        const sx2 = rot ? 1.85 : 4.4, sz2 = rot ? 4.4 : 1.85;
        if (!tryPlace(cx, cz, sx2, sz2, room)) continue;
        const col = hexRGB(CAR[Math.floor(R() * CAR.length)]);
        draw = () => buildCar(B, cx, cz, rot ? 0 : Math.PI / 2, col);
        addProp(cx, cz, sx2, sz2, 0, 1.0, 'car');
        addProp(cx, cz, rot ? 1.5 : 2.2, rot ? 2.2 : 1.5, 1.0, 1.45, 'car');
      } else if (r < 0.84) {                 // betonnen barrière
        kind = 'barrier';
        const sx2 = rot ? 0.62 : 3.0, sz2 = rot ? 3.0 : 0.62;
        if (!tryPlace(cx, cz, sx2, sz2, room)) continue;
        const ry = rot ? Math.PI / 2 : 0;
        draw = () => {
          B('concrete').add(G.boxB, M4(cx, 0, cz, ry, 3.0, 0.3, 0.62), [0.85, 0.85, 0.85], 3, 0.3);
          B('concrete').add(G.boxB, M4(cx, 0.3, cz, ry, 3.0, 0.55, 0.3), [0.85, 0.85, 0.85], 3, 0.55);
        };
        addProp(cx, cz, sx2, sz2, 0, 0.85, 'barrier');
      } else {                               // vaten (rood = explosief!)
        kind = 'barrels';
        if (!tryPlace(cx, cz, 1.4, 1.4, room)) continue;
        const cnt = 1 + Math.floor(R() * 3);
        for (let b = 0; b < cnt; b++) {
          const px = cx + (b % 2) * 0.68 - 0.34, pz = cz + Math.floor(b / 2) * 0.68 - 0.2;
          const red = R() < 0.6;
          addProp(px, pz, 0.62, 0.62, 0, 0.92, 'barrel', { barrel: red, hp: 22 });
        }
        draw = () => {};
      }
      placed.push({ room: ri, kind, draw });
      // controleer dat alles bereikbaar blijft; anders weer weghalen
      buildNav();
      const d = navFlood(startPos.x, startPos.z, NAV.dist);
      const reach = MAP.rooms.every((rr) => {
        for (let k2 = 0; k2 < 9; k2++) { const xx = Math.floor((rr.x + 1 + (k2 % 3) * (rr.w - 2) / 2) * T), zz = Math.floor((rr.y + 1 + Math.floor(k2 / 3) * (rr.h - 2) / 2) * T); if (d[zz * NAV.nx + xx] >= 0) return true; }
        return false;
      }) && (!vault || d[Math.floor(vault.z + vault.nz * 2) * NAV.nx + Math.floor(vault.x + vault.nx * 2)] >= 0);
      if (!reach) { props.splice(before); placed.pop(); }
    }
  });
  for (const p of placed) p.draw();

  // --- Lantaarnpalen langs straten en pleinen
  lampSpots = [];
  for (let ty = 0; ty < rows; ty++) for (let tx = 0; tx < cols; tx++) {
    if (g[ty][tx] || inRoom(tx, ty)) continue;
    if (hash2(tx, ty, m.seed + 3) > 0.18) continue;
    const dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]].filter(([dx, dy]) => solidT(tx + dx, ty + dy));
    if (!dirs.length) continue;
    const [dx, dy] = dirs[0];
    const lx = tx * T + T / 2 + dx * 1.3, lz = ty * T + T / 2 + dy * 1.3;
    if (lampSpots.some((l) => Math.hypot(l.x - lx, l.z - lz) < 9)) continue;
    lampSpots.push({ x: lx, z: lz, dx: -dx, dz: -dy });
  }
  for (const l of lampSpots) {
    B('steel').add(G.cyl8, M4(l.x, 2.8, l.z, 0, 0.14, 5.6, 0.14), [0.35, 0.36, 0.38]);
    B('steel').add(G.box, M4(l.x + l.dx * 0.6, 5.55, l.z + l.dz * 0.6, 0, l.dx ? 1.3 : 0.1, 0.1, l.dz ? 1.3 : 0.1), [0.35, 0.36, 0.38]);
    l.head = new THREE.Mesh(G.box, MAT.lampHead);
    l.head.position.set(l.x + l.dx * 1.2, 5.45, l.z + l.dz * 1.2); l.head.scale.set(0.55, 0.14, 0.55);
    worldGroup.add(l.head);
    addProp(l.x, l.z, 0.2, 0.2, 0, 5.6, 'pole');
  }
  if (S.lamps) {
    MAT.lampHead.emissiveIntensity = 3;
    // maximaal 6 echte lampen (verdeeld over de kaart), de rest gloeit alleen
    const chosen = [];
    const pool = lampSpots.slice();
    const maxL = quality() === 'laag' ? 2 : quality() === 'hoog' ? 8 : 6;
    while (chosen.length < Math.min(maxL, pool.length)) {
      let best = null, bd = -1;
      for (const l of pool) { if (chosen.includes(l)) continue; const d = chosen.length ? Math.min(...chosen.map((c2) => Math.hypot(c2.x - l.x, c2.z - l.z))) : Math.hypot(l.x - startPos.x, l.z - startPos.z); if (d > bd) { bd = d; best = l; } }
      chosen.push(best);
    }
    for (const l of chosen) {
      const pl2 = new THREE.PointLight(0xffd9a0, S.lit ? 60 : 30, 26, 1.7);
      pl2.position.set(l.head.position.x, 5.1, l.head.position.z);
      scene.add(pl2); lampLights.push(pl2);
    }
  } else MAT.lampHead.emissiveIntensity = 0.2;
  for (const k of ['brickLit', 'plasterLit']) MAT[k].emissiveIntensity = S.lit ? 1.6 : S.lamps ? 0.8 : 0;

  for (const k in gb) worldGroup.add(gb[k].mesh(MAT[k], !['asphalt', 'paving', 'roof'].includes(k)));

  // Vaten zijn losse meshes (ze kunnen ontploffen)
  for (const p of props) if (p.kind === 'barrel') {
    const mesh = new THREE.Group();
    const body = new THREE.Mesh(G.cylB, p.barrel ? MAT.barrelRed : MAT.barrelBlue);
    body.scale.set(0.6, 0.9, 0.6);
    const rim = new THREE.Mesh(G.cyl, MAT.steelPlain);
    rim.scale.set(0.62, 0.04, 0.62); rim.position.y = 0.3;
    const rim2 = rim.clone(); rim2.position.y = 0.62;
    mesh.add(body, rim, rim2);
    mesh.position.set(p.x, 0, p.z); mesh.rotation.y = hash2(Math.round(p.x * 10), Math.round(p.z * 10), 1) * TAU;
    mesh.traverse((o) => { o.castShadow = o.receiveShadow = true; });
    worldGroup.add(mesh);
    p.mesh = mesh;
  }
  if (vault) worldGroup.add(vault.group);
  buildNav();

  // Plekken voor buit: vrije cellen op pleinen (niet het startplein), liefst bij dekking
  bagSpots = [];
  for (let i = 1; i < MAP.rooms.length; i++) {
    const r = MAP.rooms[i];
    for (let k = 0; k < 30; k++) {
      const x = (r.x + 0.8 + R() * (r.w - 1.6)) * T, z = (r.y + 0.8 + R() * (r.h - 1.6)) * T;
      if (!freeCell(x, z) || !freeCell(x + 0.6, z) || !freeCell(x - 0.6, z)) continue;
      bagSpots.push({ x, z, room: i });
      if (bagSpots.filter((b) => b.room === i).length >= 3) break;
    }
  }
}
// ================= Losse modellen voor de wereld =================
function buildCar(B, x, z, ry, col) {
  const m = (ox, oy, oz, sx, sy, sz) => { const v = new THREE.Vector3(ox, oy, oz).applyAxisAngle(new THREE.Vector3(0, 1, 0), ry); return M4(x + v.x, oy, z + v.z, ry, sx, sy, sz); };
  B('paint').add(G.boxB, m(0, 0.32, 0, 1.82, 0.62, 4.35), col);                  // carrosserie
  B('paint').add(G.boxB, m(0, 0.94, -0.15, 1.6, 0.5, 2.2), col);                 // cabine
  B('glass').add(G.boxB, m(0, 0.97, -0.15, 1.64, 0.42, 2.0), [1, 1, 1]);
  B('glass').add(G.boxB, m(0, 0.97, -0.15, 1.5, 0.42, 2.24), [1, 1, 1]);
  B('dark').add(G.boxB, m(0, 0.3, 2.15, 1.7, 0.22, 0.12), [0.12, 0.12, 0.12]);    // bumpers
  B('dark').add(G.boxB, m(0, 0.3, -2.15, 1.7, 0.22, 0.12), [0.12, 0.12, 0.12]);
  B('lights').add(G.boxB, m(0.62, 0.62, -2.18, 0.34, 0.12, 0.04), [1, 1, 1]);     // achterlichten
  B('lights').add(G.boxB, m(-0.62, 0.62, -2.18, 0.34, 0.12, 0.04), [1, 1, 1]);
  B('glass').add(G.boxB, m(0.62, 0.62, 2.18, 0.34, 0.12, 0.04), [3, 3, 3]);
  B('glass').add(G.boxB, m(-0.62, 0.62, 2.18, 0.34, 0.12, 0.04), [3, 3, 3]);
  for (const [wx, wz] of [[0.82, 1.35], [-0.82, 1.35], [0.82, -1.35], [-0.82, -1.35]]) {
    const v = new THREE.Vector3(wx, 0, wz).applyAxisAngle(new THREE.Vector3(0, 1, 0), ry);
    B('rubber').add(G.cyl, M4(x + v.x, 0.34, z + v.z, ry, 0.68, 0.24, 0.68, 0, Math.PI / 2), [1, 1, 1]);
    B('steel').add(G.cyl, M4(x + v.x * 1.02, 0.34, z + v.z, ry, 0.4, 0.26, 0.4, 0, Math.PI / 2), [0.7, 0.7, 0.7]);
  }
}
function buildVan(B, x, z) {
  const col = [0.08, 0.085, 0.09];
  B('paint').add(G.boxB, M4(x, 0.38, z, 0, 2.0, 1.85, 5.0), col);
  B('glass').add(G.boxB, M4(x, 1.3, z + 2.42, 0, 1.84, 0.7, 0.2), [1, 1, 1]);
  B('glass').add(G.boxB, M4(x, 1.35, z + 1.6, 0, 2.04, 0.6, 1.3), [1, 1, 1]);
  B('dark').add(G.boxB, M4(x, 0.3, z + 2.55, 0, 1.9, 0.25, 0.14), [0.1, 0.1, 0.1]);
  B('lights').add(G.boxB, M4(x + 0.75, 1.0, z - 2.52, 0, 0.25, 0.3, 0.04), [1, 1, 1]);
  B('lights').add(G.boxB, M4(x - 0.75, 1.0, z - 2.52, 0, 0.25, 0.3, 0.04), [1, 1, 1]);
  for (const [wx, wz] of [[0.9, 1.6], [-0.9, 1.6], [0.9, -1.6], [-0.9, -1.6]]) {
    B('rubber').add(G.cyl, M4(x + wx, 0.38, z + wz, 0, 0.76, 0.26, 0.76, 0, Math.PI / 2), [1, 1, 1]);
    B('steel').add(G.cyl, M4(x + wx * 1.02, 0.38, z + wz, 0, 0.42, 0.28, 0.42, 0, Math.PI / 2), [0.7, 0.7, 0.7]);
  }
}
function buildVault(x, z, nrm) {
  const grp = new THREE.Group();
  grp.position.set(x, 0, z);
  grp.rotation.y = Math.atan2(nrm[0], nrm[1]);      // lokaal +z wijst het plein in
  const frame = new THREE.Mesh(G.boxB, MAT.steelPlain);
  frame.scale.set(3.4, 3.3, 0.3); frame.position.z = 0.1;
  const hole = new THREE.Mesh(G.cyl, new THREE.MeshStandardMaterial({ color: 0x050505, roughness: 1 }));
  hole.rotation.x = Math.PI / 2; hole.scale.set(2.5, 0.05, 2.5); hole.position.set(0, 1.55, 0.26);
  const gold = new THREE.Group();
  for (let i = 0; i < 9; i++) { const b = new THREE.Mesh(G.boxB, MAT.gold); b.scale.set(0.42, 0.16, 0.22); b.position.set((i % 3) * 0.46 - 0.46, 0.75 + Math.floor(i / 3) * 0.17, 0.38); gold.add(b); }
  const hinge = new THREE.Group();                   // deur draait open om het scharnier
  hinge.position.set(-1.25, 1.55, 0.72);
  const door = new THREE.Group();
  const disc = new THREE.Mesh(G.cyl, MAT.vaultDoor); disc.rotation.x = Math.PI / 2; disc.scale.set(2.4, 0.42, 2.4);
  const ring = new THREE.Mesh(G.cyl, MAT.steelPlain); ring.rotation.x = Math.PI / 2; ring.scale.set(1.5, 0.48, 1.5);
  const hub = new THREE.Mesh(G.cyl, MAT.steelPlain); hub.rotation.x = Math.PI / 2; hub.scale.set(0.3, 0.75, 0.3);

  sg.setAttribute('position', new THREE.Float32BufferAttribute(new Float32Array(NS * 3), 3));
  sg.setAttribute('color', new THREE.Float32BufferAttribute(new Float32Array(NS * 3), 3));
  FX.sparkMesh = new THREE.Points(sg, new THREE.PointsMaterial({ size: 0.07, map: TEX.glow, vertexColors: true, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));

    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: add ? TEX.flash : TEX.smoke, transparent: true, depthWrite: false, blending: add ? THREE.AdditiveBlending : THREE.NormalBlending, color: add ? 0xffffff : 0x8a8a8a }));
    s.visible = false; FX.puffs.push({ s, life: 0, add });

  FX.decals = []; FX.decalI = 0;

  const fxGroup = new THREE.Group();

// ================= Camera, wapen in beeld, tekenen =================
function updateView(dt) {
  const w = WEAPONS[pl.w];
  if (state === 'menu') {
    const cxm = (MAP.cols * T) / 2, czm = (MAP.rows * T) / 2, a = performance.now() / 16000;
    camera.position.set(cxm + Math.cos(a) * MAP.cols * 1.3, 38, czm + Math.sin(a) * MAP.rows * 1.3);
    camera.lookAt(cxm, 0, czm);
    camera.fov = 60; camera.updateProjectionMatrix();
  } else {
    shake = Math.max(0, shake - dt * 1.6);
    const sh = Math.min(shake, 0.4);
    const bobA = Math.min(1, Math.hypot(pl.vx, pl.vz) / 5) * (pl.onGround ? 1 : 0) * (1 - pl.adsK * 0.85);
    camera.position.set(pl.x, pl.y + eyeH() + Math.abs(Math.sin(pl.bob)) * 0.045 * bobA, pl.z);
    camera.rotation.set(pl.pitch + rand(-1, 1) * sh * 0.05, pl.yaw + rand(-1, 1) * sh * 0.05, pl.tilt + Math.sin(pl.bob) * 0.006 * bobA);
    const scoped = w.scope && pl.adsK > 0.9;
    const target = scoped ? w.fov : lerp(78 + (pl.sprint ? 6 : 0), w.scope ? 60 : w.fov, pl.adsK);
    camera.fov = damp(camera.fov, target, scoped ? 30 : 14, dt);
    camera.updateProjectionMatrix();
    // wapen in je handen
    vmModels.forEach((m, i) => (m.g.visible = i === pl.w));
    const m = vmModels[pl.w];
    vmRoot.visible = !scoped && state !== 'dead';
    const VS = 0.78; vmRoot.scale.setScalar(VS);   // wapen iets kleiner in beeld
    const ads = new THREE.Vector3(0, -m.sightY * VS, m.adsZ);
    const p = m.hip.clone().lerp(ads, pl.adsK);
    const bob = (1 - pl.adsK * 0.9) * bobA;
    p.x += Math.sin(pl.bob) * 0.012 * bob; p.y += Math.abs(Math.cos(pl.bob)) * 0.012 * bob;
    pl.swayX = damp(pl.swayX, 0, 8, dt); pl.swayY = damp(pl.swayY, 0, 8, dt);
    p.x -= clamp(pl.swayX, -0.04, 0.04) * (1 - pl.adsK * 0.8); p.y += clamp(pl.swayY, -0.04, 0.04) * (1 - pl.adsK * 0.8);
    pl.kick = damp(pl.kick, 0, 18, dt);
    p.z += pl.kick * (w.id === 'sniper' ? 0.09 : 0.035);
    let rx = pl.kick * (w.id === 'sniper' ? 0.18 : 0.05) * (1 - pl.adsK * 0.6), ry = 0, rz = 0;
    if (pl.sprint) { const s = Math.min(1, Math.hypot(pl.vx, pl.vz) / 6); p.x -= 0.06 * s; p.y -= 0.04 * s; ry += 0.6 * s; rx -= 0.15 * s; rz += 0.1 * s; }
    if (pl.reloadT > 0) { const k = 1 - pl.reloadT / w.reload, dip = Math.sin(k * Math.PI); p.y -= 0.1 * dip; rx += 0.45 * dip; rz += 0.35 * dip; }
    if (pl.switchT > 0) { const k = pl.switchT / 0.38; p.y -= 0.25 * k; rx -= 0.6 * k; }
    if (pl.boltT > 0 && pl.adsK < 0.5) { const k = Math.sin((1 - pl.boltT / 0.85) * Math.PI); rz += 0.25 * k; p.y -= 0.02 * k; }
    vmRoot.position.copy(p);
    vmRoot.rotation.set(rx, ry, rz + pl.tilt * 2);
    vmFlashMesh.position.copy(m.muzzle);
    vmFlashT -= dt;
    if (vmFlashT <= 0) vmFlashMesh.visible = false;
    vmFlash.position.copy(m.muzzle).multiplyScalar(VS).add(vmRoot.position);
  }
  flashLight.intensity = Math.max(0, flashLight.intensity - dt * 600);
  vmFlash.intensity = Math.max(0, vmFlash.intensity - dt * 70);
  boomLight.intensity = Math.max(0, boomLight.intensity - dt * 900);
  // schaduwen volgen de camera
  const sd = skyMat.uniforms.sunD.value;
  camDir(tmpV2);
  const fx = camera.position.x + (state === 'menu' ? 0 : tmpV2.x * 18), fz = camera.position.z + (state === 'menu' ? 0 : tmpV2.z * 18);
  const snap = 0.5;
  sun.target.position.set(Math.round(fx / snap) * snap, 0, Math.round(fz / snap) * snap);
  sun.position.copy(sun.target.position).addScaledVector(sd, 90);
  sun.target.updateMatrixWorld();
  sky.position.copy(camera.position);
}
