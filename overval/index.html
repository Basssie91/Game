  <meta name="theme-color" content="#0b0c10">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%2316181d%22/%3E%3Crect%20x%3D%2222%22%20y%3D%2222%22%20width%3D%2222%22%20height%3D%2222%22%20rx%3D%225%22%20fill%3D%22%238a919b%22/%3E%3Crect%20x%3D%2225%22%20y%3D%2228%22%20width%3D%2216%22%20height%3D%228%22%20fill%3D%22%2316181d%22/%3E%3Ccircle%20cx%3D%2237%22%20cy%3D%2232%22%20r%3D%222.5%22%20fill%3D%22%23ff3b45%22/%3E%3Crect%20x%3D%2240%22%20y%3D%2230%22%20width%3D%2216%22%20height%3D%224%22%20fill%3D%22%232a2d33%22/%3E%3Ccircle%20cx%3D%2216%22%20cy%3D%2248%22%20r%3D%229%22%20fill%3D%22%23f2f2f2%22/%3E%3Crect%20x%3D%2213%22%20y%3D%2239%22%20width%3D%225%22%20height%3D%2218%22%20fill%3D%22%23e8282f%22/%3E%3Cpath%20d%3D%22M26%2044%20L44%2033%22%20stroke%3D%22%23fff6c4%22%20stroke-width%3D%222.5%22%20stroke-linecap%3D%22round%22/%3E%3Ctext%20x%3D%2250%22%20y%3D%2256%22%20font-family%3D%22system-ui%2Csans-serif%22%20font-weight%3D%22900%22%20font-size%3D%2214%22%20text-anchor%3D%22middle%22%20fill%3D%22%23ffd23f%22%3E%E2%82%AC%3C/text%3E%3C/svg%3E">
  <style>
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #0b0c10; color: #fff; overflow: hidden;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-user-select: none; user-select: none; }
body { display: flex; align-items: center; justify-content: center; }
canvas { display: block; touch-action: none; box-shadow: 0 0 0 1px rgba(255,255,255,0.08); }
.terug, .geluid { position: fixed; top: 12px; z-index: 5; color: #fff; text-decoration: none; background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.22); padding: 8px 12px; border-radius: 10px; font: 600 14px system-ui, sans-serif; cursor: pointer; }
.terug { left: 12px; } .geluid { right: 12px; }
.terug:hover, .geluid:hover { background: rgba(255,255,255,0.2); }
</style>
</head>
<body>
  <a class="terug" href="../">← Games</a>
  <canvas id="c"></canvas>
  
  <script>
'use strict';
// ================= Bas Arcade: instellingen + muziek (gedeeld door alle pagina's) =================
const ArcadeCore = (() => {
  const KEY = 'arcade_settings';
  const DEF = { music: 0.5, sfx: 0.8, quality: 'normaal', muted: false };
  let S = { ...DEF };
  try { Object.assign(S, JSON.parse(localStorage.getItem(KEY)) || {}); } catch (e) { /* standaard */ }
  const listeners = [];
  const save = () => {
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* */ }
    listeners.forEach((f) => f(S));
  };
  const set = (k, v) => { S[k] = v; save(); };
  const sfx = () => (S.muted ? 0 : S.sfx);
  const musicVol = () => (S.muted ? 0 : S.music);
  // Hoeveel pixels we tekenen: lager = soepeler op trage apparaten
  const dprCap = () => ({ hoog: 2, normaal: 1.5, laag: 1 })[S.quality] || 1.5;

  // ---------- Muziek: kleine sequencer met drums, bas, akkoorden en melodie ----------
  const SCALE = [0, 2, 3, 5, 7, 8, 10]; // mineur
  function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
  // Elke game een eigen nummer
  const SONGS = {
    menu:     { bpm: 92,  root: 57, prog: [[0, 3, 7], [-4, 0, 3], [3, 7, 10], [-2, 2, 5]], kick: 'x.......x.......', snare: '....x.......x...', hat: '..x...x...x...x.', bass: 'x.....x.x.......', arp: true,  lead: 'triangle', seed: 3, density: 0.35, pad: 'triangle' },
    race:     { bpm: 128, root: 52, prog: [[0, 3, 7], [-4, 0, 3], [-2, 2, 5], [-5, -1, 2]], kick: 'x...x...x...x...', snare: '....x.......x...', hat: 'x.x.x.x.x.x.x.xo', bass: 'x.xox.xox.xox.xo', arp: true,  lead: 'sawtooth', seed: 11, density: 0.45, pad: 'sawtooth' },
    meteoren: { bpm: 140, root: 50, prog: [[0, 3, 7], [1, 5, 8], [-2, 2, 5], [0, 3, 7]], kick: 'x..x..x.x..x..x.', snare: '....x.......x..x', hat: 'xxxxxxxxxxxxxxxx', bass: 'xxoxxxoxxxoxxxox', arp: false, lead: 'square', seed: 21, density: 0.55, pad: 'sawtooth' },
    runner:   { bpm: 124, root: 54, prog: [[0, 3, 7], [-4, 0, 3], [3, 7, 10], [-2, 2, 5]], kick: 'x...x...x...x...', snare: '....x.......x...', hat: '..o...o...o...o.', bass: 'x.x.x.x.x.x.x.x.', arp: true,  lead: 'sawtooth', seed: 31, density: 0.4, pad: 'sawtooth' },
    snake:    { bpm: 112, root: 60, prog: [[0, 3, 7], [5, 8, 12], [3, 7, 10], [-2, 2, 5]], kick: 'x.....x.x.......', snare: '....x.......x...', hat: 'x.x.x.x.x.x.x.x.', bass: 'x...o...x...o...', arp: false, lead: 'square', seed: 41, density: 0.6, pad: null },
    2048:     { bpm: 84,  root: 55, prog: [[0, 3, 7, 10], [-4, 0, 3, 7], [3, 7, 10, 14], [-2, 2, 5, 9]], kick: 'x.........x.....', snare: '....x.......x...', hat: '..x...x...x..xx.', bass: 'x.......x..x....', arp: false, lead: 'triangle', seed: 51, density: 0.25, pad: 'triangle' },
    blokken:  { bpm: 120, root: 57, prog: [[0, 3, 7], [-2, 2, 5], [-4, 0, 3], [-5, -1, 2]], kick: 'x...x...x...x...', snare: '....x.......x...', hat: 'x.x.x.x.x.x.x.x.', bass: 'x.o.x.o.x.o.x.o.', arp: false, lead: 'square', seed: 61, density: 0.65, pad: null },
    overval:  { bpm: 132, root: 50, prog: [[0, 3, 7], [0, 3, 7], [1, 5, 8], [-2, 2, 5]], kick: 'x..x..x...x..x..', snare: '....x.......x...', hat: 'x.xxx.xxx.xxx.xx', bass: 'x..x..x.x..x..xo', arp: false, lead: 'sawtooth', seed: 81, density: 0.35, pad: 'sawtooth' },
    td:       { bpm: 108, root: 55, prog: [[0, 3, 7], [-4, 0, 3], [-2, 2, 5], [3, 7, 10]], kick: 'x.......x.x.....', snare: '....x.......x...', hat: 'x.x.x.x.x.x.x.x.', bass: 'x...x.o.x...x.o.', arp: true, lead: 'triangle', seed: 91, density: 0.4, pad: 'triangle' },
    stack:    { bpm: 100, root: 59, prog: [[0, 3, 7], [3, 7, 10], [-4, 0, 3], [-2, 2, 5]], kick: 'x.......x.......', snare: '........x.......', hat: 'x...x...x...x...', bass: 'x.....x.........', arp: true,  lead: 'triangle', seed: 71, density: 0.3, pad: 'triangle' },
  };
  // Melodie maken uit de toonladder (altijd hetzelfde per nummer)
  function makeMelody(song) {
    const R = rng(song.seed);
    const motif = [];
    for (let i = 0; i < 32; i++) {
      if (R() > song.density || i % 2 === 1 && R() < 0.5) { motif.push(null); continue; }
      const deg = Math.floor(R() * 7) + (R() < 0.3 ? 7 : 0);
      const len = R() < 0.25 ? 3 : R() < 0.5 ? 2 : 1;
      motif.push({ deg, len });
    }
    const mel = [];
    for (let bar = 0; bar < 8; bar++) {
      for (let i = 0; i < 16; i++) {
        let m = motif[(bar % 2) * 16 + i];
        if (m && bar >= 4 && bar % 2 === 1 && i > 8) m = { deg: m.deg + 2, len: m.len }; // kleine variatie
        mel.push(m);
      }
    }
    return mel;
  }
  for (const k in SONGS) SONGS[k].mel = makeMelody(SONGS[k]);

  let ac = null, master = null, delayIn = null, noise = null, timer = null;
  let song = null, wanted = null, step = 0, nextT = 0;
  const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);
  function initAudio() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    try {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      master = ac.createGain();
      master.gain.value = musicVol() * 0.5;
      const comp = ac.createDynamicsCompressor();
      master.connect(comp);
      comp.connect(ac.destination);
      // Echo voor melodie
      delayIn = ac.createGain(); delayIn.gain.value = 0.22;
      const d = ac.createDelay(); d.delayTime.value = 0.3;
      const fb = ac.createGain(); fb.gain.value = 0.3;
      delayIn.connect(d); d.connect(fb); fb.connect(d); d.connect(master);
      noise = ac.createBuffer(1, Math.floor(ac.sampleRate * 0.5), ac.sampleRate);
      const data = noise.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
    } catch (e) { ac = null; }
  }
  function env(g, t, a, peak, dur) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  }
  function kick(t) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(150, t);
    o.frequency.exponentialRampToValueAtTime(42, t + 0.13);
    env(g, t, 0.003, 0.9, 0.22);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.25);
  }
  function noiseHit(t, hp, peak, dur) {
    const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = noise;
    f.type = 'highpass'; f.frequency.value = hp;
    env(g, t, 0.002, peak, dur);
    s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + dur + 0.02);
  }
  function tone(t, midi, dur, type, vol, cutoff, echo, attack = 0.006) {
    const o = ac.createOscillator(), f = ac.createBiquadFilter(), g = ac.createGain();
    o.type = type;
    o.frequency.value = mtof(midi);
    f.type = 'lowpass'; f.frequency.value = cutoff;
    env(g, t, attack, vol, dur);
    o.connect(f); f.connect(g); g.connect(master);
    if (echo) g.connect(delayIn);
    o.start(t); o.stop(t + dur + 0.05);
  }
  function playStep(s, t) {
    const sp = 60 / song.bpm / 4;
    const i = s % 16, bar = Math.floor(s / 16) % 4, chord = song.prog[bar];
    const intro = Math.floor(s / 16) < 2 && song.introDone !== true;
    if (!intro) {
      if (song.kick[i] === 'x') kick(t);
      if (song.snare[i] === 'x') { noiseHit(t, 1500, 0.3, 0.15); tone(t, 50, 0.08, 'triangle', 0.18, 2000, false, 0.002); }
      if (song.hat[i] === 'x') noiseHit(t, 7000, 0.08, 0.035);
      if (song.hat[i] === 'o') noiseHit(t, 6500, 0.09, 0.14);
    }
    const b = song.bass[i];
    if (b !== '.') tone(t, song.root - 12 + chord[0] + (b === 'o' ? 12 : 0), sp * 0.9, 'sawtooth', 0.16, 650, false);
    if (song.pad && i === 0) for (const n of chord) tone(t, song.root + n, sp * 16 * 0.98, song.pad, 0.035, 1400, false, 0.25);
    if (song.arp && i % 2 === 0) tone(t, song.root + 12 + chord[(i / 2) % chord.length], sp * 0.8, 'square', 0.025, 2600, true);
    const m = song.mel[s % song.mel.length];
    if (m && !intro) {
      const deg = m.deg;
      const note = song.root + 12 + SCALE[deg % 7] + 12 * Math.floor(deg / 7);
      tone(t, note, sp * m.len * 0.95, song.lead, 0.05, song.lead === 'sawtooth' ? 2200 : 3500, true);
    }
  }
  function tick() {
    if (!ac || !song) return;
    const sp = 60 / song.bpm / 4;
    if (nextT < ac.currentTime) nextT = ac.currentTime + 0.05;
    while (nextT < ac.currentTime + 0.15) {
      playStep(step, nextT);
      nextT += sp;
      step++;
      if (step >= 128) { step = 0; song.introDone = true; }
    }
  }
  function startIfWanted() {
    if (!wanted) return;
    initAudio();
    if (!ac) return;
    if (song !== SONGS[wanted]) { song = SONGS[wanted]; step = 0; nextT = ac.currentTime + 0.1; }
    if (!timer) timer = setInterval(tick, 25);
  }
  // Muziek mag pas starten na een klik of toetsaanslag (regel van browsers)
  addEventListener('pointerdown', startIfWanted);
  addEventListener('keydown', startIfWanted);
  document.addEventListener('visibilitychange', () => {
    if (!ac) return;
    if (document.hidden) ac.suspend(); else ac.resume();
  });
  listeners.push(() => { if (master) master.gain.setTargetAtTime(musicVol() * 0.5, ac.currentTime, 0.1); });

  const music = { play(name) { wanted = name; if (ac) startIfWanted(); }, status: () => ({ running: !!timer, song: wanted, step, audio: ac ? ac.state : 'geen' }) };

  // ---------- Instellingenpaneel ----------
  const CSS = `
  .ac-gear { position: fixed; top: 12px; right: 12px; z-index: 50; width: 42px; height: 42px; border-radius: 12px; cursor: pointer;
    background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.22); color: #fff; display: flex; align-items: center; justify-content: center; padding: 0; }
  .ac-gear:hover { background: rgba(255,255,255,0.2); }
  .ac-gear svg { width: 22px; height: 22px; transition: transform 0.4s ease; }
  .ac-gear:hover svg { transform: rotate(60deg); }
  .ac-ov { position: fixed; inset: 0; z-index: 60; background: rgba(5,6,9,0.6); display: none; align-items: center; justify-content: center; padding: 16px;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-user-select: none; user-select: none; }
  .ac-ov.open { display: flex; }
  .ac-card { width: min(380px, 100%); background: #16181d; border: 1px solid rgba(255,255,255,0.14); border-radius: 18px; padding: 20px 22px; color: #fff;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
  .ac-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .ac-head b { font-size: 20px; font-weight: 900; }
  .ac-x { background: rgba(255,255,255,0.1); border: 0; color: #fff; width: 34px; height: 34px; border-radius: 10px; cursor: pointer; font-size: 16px; }
  .ac-row { margin: 14px 0; }
  .ac-lab { display: flex; justify-content: space-between; font-size: 14px; font-weight: 700; margin-bottom: 8px; color: #e6e9ee; }
  .ac-lab span { color: #9aa1ab; font-family: ui-monospace, Consolas, monospace; }
  .ac-card input[type=range] { width: 100%; accent-color: #e8282f; height: 22px; }
  .ac-seg { display: flex; gap: 6px; background: #0e0f13; padding: 4px; border-radius: 12px; }
  .ac-seg button { flex: 1; border: 0; background: transparent; color: #c9ced6; padding: 9px 0; border-radius: 9px; font-weight: 800; font-size: 13px; cursor: pointer; }
  .ac-seg button.on { background: #fff; color: #111214; }
  .ac-hint { font-size: 12px; color: #7d848e; margin-top: 6px; }
  .ac-check { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 700; color: #e6e9ee; cursor: pointer; }
  .ac-check input { width: 18px; height: 18px; accent-color: #e8282f; }
  .ac-danger { width: 100%; margin-top: 8px; padding: 11px; border-radius: 12px; border: 1px solid rgba(232,40,47,0.6); background: rgba(232,40,47,0.12);
    color: #ff6b72; font-weight: 800; font-size: 14px; cursor: pointer; }
  .ac-danger:hover { background: rgba(232,40,47,0.25); }`;
  const GEAR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>';
  let ov = null;
  function buildPanel() {
    const st = document.createElement('style');
    st.textContent = CSS;
    document.head.appendChild(st);
    const gear = document.createElement('button');
    gear.className = 'ac-gear';
    gear.type = 'button';
    gear.title = 'Instellingen';
    gear.setAttribute('aria-label', 'Instellingen');
    gear.innerHTML = GEAR;
    document.body.appendChild(gear);
    ov = document.createElement('div');
    ov.className = 'ac-ov';
    ov.innerHTML = `
      <div class="ac-card" role="dialog" aria-label="Instellingen">
        <div class="ac-head"><b>⚙ Instellingen</b><button class="ac-x" type="button" aria-label="Sluiten">✕</button></div>
        <div class="ac-row"><div class="ac-lab">🎵 Muziek <span id="acMv"></span></div><input type="range" min="0" max="100" id="acM"></div>
        <div class="ac-row"><div class="ac-lab">🔊 Geluidseffecten <span id="acSv"></span></div><input type="range" min="0" max="100" id="acS"></div>
        <div class="ac-row"><label class="ac-check"><input type="checkbox" id="acMute"> Alles dempen (sneltoets M)</label></div>
        <div class="ac-row"><div class="ac-lab">🖥 Beeldkwaliteit</div>
          <div class="ac-seg"><button type="button" data-q="laag">Laag</button><button type="button" data-q="normaal">Normaal</button><button type="button" data-q="hoog">Hoog</button></div>
          <div class="ac-hint">Laag = soepeler op oudere laptops en telefoons. Hoog = scherper beeld.</div></div>
        <button class="ac-danger" type="button">🗑 Alle records wissen</button>
      </div>`;
    document.body.appendChild(ov);
    const $ = (id) => ov.querySelector('#' + id);
    const refresh = () => {
      $('acM').value = Math.round(S.music * 100); $('acMv').textContent = Math.round(S.music * 100) + '%';
      $('acS').value = Math.round(S.sfx * 100); $('acSv').textContent = Math.round(S.sfx * 100) + '%';
      $('acMute').checked = !!S.muted;
      ov.querySelectorAll('[data-q]').forEach((b) => b.classList.toggle('on', b.dataset.q === S.quality));
    };
    refresh();
    listeners.push(refresh);
    $('acM').addEventListener('input', (e) => { set('music', e.target.value / 100); startIfWanted(); });
    $('acS').addEventListener('input', (e) => set('sfx', e.target.value / 100));
    $('acS').addEventListener('change', () => { if (window.Arcade) Arcade.beep(660, 0.08, 'triangle', 0.06); });
    $('acMute').addEventListener('change', (e) => set('muted', e.target.checked));
    ov.querySelectorAll('[data-q]').forEach((b) => b.addEventListener('click', () => set('quality', b.dataset.q)));
    ov.querySelector('.ac-danger').addEventListener('click', () => {
      if (!confirm('Weet je zeker dat je ALLE records, medailles en spookauto\'s wilt wissen? Dit kan niet ongedaan worden.')) return;
      const kill = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (/^arcade_(best_|2048_state)|^tt2_(bests|ghost)/.test(k)) kill.push(k);
      }
      kill.forEach((k) => localStorage.removeItem(k));
      location.reload();
    });
    const close = () => ov.classList.remove('open');
    ov.querySelector('.ac-x').addEventListener('click', close);
    ov.addEventListener('pointerdown', (e) => { if (e.target === ov) close(); });
    // Toetsen in het paneel niet doorgeven aan de game
    ov.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); e.stopPropagation(); });
    gear.addEventListener('click', (e) => {
      e.stopPropagation();
      ov.classList.add('open');
      // Games pauzeren als het venster de focus verliest: dat doen we hier ook
      window.dispatchEvent(new Event('blur'));
      gear.blur();
    });
    gear.addEventListener('pointerdown', (e) => e.stopPropagation());
  }
  addEventListener('keydown', (e) => {
    if (e.code === 'KeyM' && !(ov && ov.classList.contains('open'))) set('muted', !S.muted);
  });
  if (document.body) buildPanel(); else document.addEventListener('DOMContentLoaded', buildPanel);

  return {
    get settings() { return S; },
    set, sfx, musicVol, dprCap, music,
    onChange: (f) => listeners.push(f),
    isOpen: () => !!(ov && ov.classList.contains('open')),
  };
})();

// ================= Gedeeld voor alle games: opslag, geluid, scherm, knoppen =================
const Arcade = (() => {
  const load = (k, d) => { try { const v = localStorage.getItem('arcade_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } };
  const save = (k, v) => { try { localStorage.setItem('arcade_' + k, JSON.stringify(v)); } catch (e) { /* uit */ } };
  let audio = null;

  function initAudio() {
    if (audio) { if (audio.state === 'suspended') audio.resume(); return; }
    try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audio = null; }
  }
  addEventListener('pointerdown', initAudio);
  addEventListener('keydown', initAudio);

  function beep(freq, dur, type = 'square', vol = 0.05, slide = 0, delay = 0) {
    const level = ArcadeCore.sfx();
    if (!level || !audio) return;
    vol *= level * 1.25;
    try {
      const t = audio.currentTime + delay;
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, t);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g);
      g.connect(audio.destination);
      o.start(t);
      o.stop(t + dur);
    } catch (e) { /* negeren */ }
  }

  // Canvas met vaste spelgrootte (W×H) die netjes in het venster past
  function canvas(id, W, H) {
    const c = document.getElementById(id);
    const ctx = c.getContext('2d');
    const view = { W, H, scale: 1 };
    const fit = () => {
      const s = Math.min(innerWidth / W, innerHeight / H);
      const dpr = Math.min(ArcadeCore.dprCap(), devicePixelRatio || 1);
      c.style.width = Math.floor(W * s) + 'px';
      c.style.height = Math.floor(H * s) + 'px';
      c.width = Math.floor(W * s * dpr);
      c.height = Math.floor(H * s * dpr);
      view.scale = s * dpr;
      ctx.setTransform(view.scale, 0, 0, view.scale, 0, 0);
    };
    fit();
    addEventListener('resize', fit);
    ArcadeCore.onChange(fit);
    view.begin = () => ctx.setTransform(view.scale, 0, 0, view.scale, 0, 0);
    view.toGame = (e) => {
      const r = c.getBoundingClientRect();
      return { x: ((e.clientX - r.left) / r.width) * W, y: ((e.clientY - r.top) / r.height) * H };
    };
    return { c, ctx, view };
  }

  // Vegen (swipe) op touchscreens: geeft 'links', 'rechts', 'op' of 'neer'
  function onSwipe(el, fn, onTap) {
    let sx = 0, sy = 0, st = 0, active = false;
    el.addEventListener('pointerdown', (e) => { sx = e.clientX; sy = e.clientY; st = performance.now(); active = true; });
    el.addEventListener('pointerup', (e) => {
      if (!active) return;
      active = false;
      const dx = e.clientX - sx, dy = e.clientY - sy;
      if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) { if (onTap) onTap(e); return; }
      if (Math.abs(dx) > Math.abs(dy)) fn(dx > 0 ? 'rechts' : 'links');
      else fn(dy > 0 ? 'neer' : 'op');
    });
  }

  // Tekenhulpjes in dezelfde stijl
  function rr(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function text(ctx, t, x, y, size, color = '#fff', align = 'center', weight = '700', mono = false) {
    ctx.font = `${weight} ${size}px ${mono ? 'ui-monospace, Consolas, monospace' : 'system-ui, -apple-system, "Segoe UI", sans-serif'}`;
    ctx.fillStyle = color;
    ctx.textAlign = align;
    ctx.textBaseline = 'middle';
    ctx.fillText(t, x, y);
  }
  // Standaard scherm voor start / pauze / game over
  function overlay(ctx, W, H, title, lines = [], hint = '') {
    ctx.fillStyle = 'rgba(10, 11, 14, 0.72)';
    ctx.fillRect(0, 0, W, H);
    const pw = Math.min(W - 40, 380), ph = 130 + lines.length * 30 + (hint ? 40 : 0);
    const x = (W - pw) / 2, y = (H - ph) / 2;
    ctx.fillStyle = 'rgba(24, 26, 31, 0.95)';
    rr(ctx, x, y, pw, ph, 16);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    text(ctx, title, W / 2, y + 50, 32, '#fff', 'center', '900');
    lines.forEach((l, i) => {
      const s = typeof l === 'string' ? { t: l } : l;
      text(ctx, s.t, W / 2, y + 100 + i * 30, s.size || 18, s.color || '#c9ced6', 'center', s.weight || '600', s.mono);
    });
    if (hint && Math.floor(performance.now() / 500) % 2 === 0) text(ctx, hint, W / 2, y + ph - 34, 15, '#ffffff', 'center', '700');
  }

  return {
    load, save, beep,
    get muted() { return !ArcadeCore.sfx(); },
    best: (game) => load('best_' + game, 0),
    // Slaat een nieuwe topscore op; geeft true terug als het een record is
    record: (game, score, lowerIsBetter = false) => {
      const b = load('best_' + game, 0);
      if (!b || (lowerIsBetter ? score < b : score > b)) { save('best_' + game, score); return true; }
      return false;
    },
    canvas, onSwipe, rr, text, overlay,
    touch: matchMedia('(hover: none) and (pointer: coarse)').matches,
  };
})();

ArcadeCore.music.play('overval');

// ================= ROBO OVERVAL =================
const W = 960, H = 600;
const { c, ctx, view } = Arcade.canvas('c', W, H);
const GAME = 'overval';
const T = 40; // tegelgrootte
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const TAU = Math.PI * 2;
function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

const MISSIONS = [
  { naam: 'Tankstation', seed: 101, cols: 34, rows: 22, rooms: 6, bags: 3, need: 3, guards: 4, drones: 0, heavies: 0, vault: false, rein: 0 },
  { naam: 'Juwelier', seed: 207, cols: 38, rows: 24, rooms: 8, bags: 5, need: 4, guards: 5, drones: 3, heavies: 0, vault: false, rein: 15 },
  { naam: 'Bank', seed: 303, cols: 42, rows: 26, rooms: 9, bags: 5, need: 3, guards: 6, drones: 3, heavies: 1, vault: true, rein: 12 },
  { naam: 'Casino', seed: 414, cols: 46, rows: 28, rooms: 11, bags: 7, need: 5, guards: 8, drones: 5, heavies: 2, vault: true, rein: 10 },
  { naam: 'Robotfabriek', seed: 523, cols: 50, rows: 30, rooms: 13, bags: 8, need: 6, guards: 10, drones: 6, heavies: 4, vault: true, rein: 8 },
];

let state = 'menu'; // menu | brief | play | pause | dead | done
let mi = 0, M, grid, rooms, mapCanvas, startRoom, vaultRoom, exitZone, vaultBox;
let pl, bots, bullets, ebullets, pickups, bags, parts, flowDist, flowT;
let alarm, reinT, t, kills, loot, vaultOpen, drill, shake, flash, msg, endT, result;
let bests = Arcade.load('overval_bests', {});

// ---------- Kaart maken ----------
function genMap(m) {
  const R = rng(m.seed);
  grid = Array.from({ length: m.rows }, () => Array(m.cols).fill(1));
  rooms = [];
  for (let k = 0; k < 800 && rooms.length < m.rooms; k++) {
    const w = 6 + Math.floor(R() * 6), h = 5 + Math.floor(R() * 4);
    const x = 1 + Math.floor(R() * (m.cols - w - 2)), y = 1 + Math.floor(R() * (m.rows - h - 2));
    if (rooms.some((r) => x < r.x + r.w + 2 && x + w + 2 > r.x && y < r.y + r.h + 2 && y + h + 2 > r.y)) continue;
    rooms.push({ x, y, w, h, cx: x + Math.floor(w / 2), cy: y + Math.floor(h / 2) });
  }
  for (const r of rooms) for (let yy = r.y; yy < r.y + r.h; yy++) for (let xx = r.x; xx < r.x + r.w; xx++) grid[yy][xx] = 0;
  // Gangen: elke kamer verbinden met de dichtstbijzijnde al verbonden kamer
  const carve = (x, y) => { for (let dy = 0; dy < 2; dy++) for (let dx = 0; dx < 2; dx++) if (grid[y + dy] && grid[y + dy][x + dx] !== undefined && y + dy < m.rows - 1 && x + dx < m.cols - 1) grid[y + dy][x + dx] = 0; };
  const corridor = (a, b) => {
    let x = a.cx, y = a.cy;
    const horizFirst = R() < 0.5;
    const stepX = () => { while (x !== b.cx) { carve(x, y); x += Math.sign(b.cx - x); } };
    const stepY = () => { while (y !== b.cy) { carve(x, y); y += Math.sign(b.cy - y); } };
    if (horizFirst) { stepX(); stepY(); } else { stepY(); stepX(); }
    carve(x, y);
  };
  rooms.sort((a, b) => (a.cx + a.cy) - (b.cx + b.cy));
  const linked = [rooms[0]];
  for (let i = 1; i < rooms.length; i++) {
    const r = rooms[i];
    let best = linked[0], bd = Infinity;
    for (const l of linked) { const d = Math.abs(l.cx - r.cx) + Math.abs(l.cy - r.cy); if (d < bd) { bd = d; best = l; } }
    corridor(best, r);
    linked.push(r);
  }
  for (let k = 0; k < Math.floor(rooms.length / 3); k++) corridor(rooms[Math.floor(R() * rooms.length)], rooms[Math.floor(R() * rooms.length)]);
  startRoom = rooms[0];
  // Kluis in de verste kamer
  const dist = bfs(startRoom.cx, startRoom.cy);
  vaultRoom = rooms.slice(1).reduce((a, b) => (dist[b.cy][b.cx] > dist[a.cy][a.cx] ? b : a), rooms[1]);
  vaultBox = null;
  if (m.vault) {
    vaultBox = { tx: vaultRoom.cx - 1, ty: vaultRoom.y, w: 2, h: 2 };
    for (let yy = 0; yy < 2; yy++) for (let xx = 0; xx < 2; xx++) grid[vaultBox.ty + yy][vaultBox.tx + xx] = 2;
  }
  exitZone = { x: startRoom.x * T + 10, y: startRoom.y * T + 10, w: 3 * T - 20, h: 2 * T - 20 };
  return R;
}
function bfs(sx, sy) {
  const d = Array.from({ length: M.rows }, () => Array(M.cols).fill(Infinity));
  if (!walk(sx, sy)) return d;
  const q = [[sx, sy]]; d[sy][sx] = 0;
  for (let i = 0; i < q.length; i++) {
    const [x, y] = q[i];
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nx = x + dx, ny = y + dy;
      if (walk(nx, ny) && d[ny][nx] === Infinity) { d[ny][nx] = d[y][x] + 1; q.push([nx, ny]); }
    }
  }
  return d;
}
const walk = (tx, ty) => ty >= 0 && ty < M.rows && tx >= 0 && tx < M.cols && grid[ty][tx] === 0;
const solidAt = (x, y) => !walk(Math.floor(x / T), Math.floor(y / T));
function hits(x, y, r) {
  for (let a = 0; a < 8; a++) if (solidAt(x + Math.cos((a / 8) * TAU) * r, y + Math.sin((a / 8) * TAU) * r)) return true;
  return solidAt(x, y);
}
function moveEnt(e, dx, dy) {
  if (!hits(e.x + dx, e.y, e.r)) e.x += dx;
  if (!hits(e.x, e.y + dy, e.r)) e.y += dy;
}
function los(ax, ay, bx, by) {
  const d = Math.hypot(bx - ax, by - ay), n = Math.ceil(d / 10);
  for (let i = 1; i < n; i++) if (solidAt(ax + ((bx - ax) * i) / n, ay + ((by - ay) * i) / n)) return false;
  return true;
}
function randomFloorIn(r, R = Math.random) {
  for (let k = 0; k < 50; k++) {
    const tx = r.x + 1 + Math.floor(R() * (r.w - 2)), ty = r.y + 1 + Math.floor(R() * (r.h - 2));
    if (walk(tx, ty)) return { x: tx * T + T / 2, y: ty * T + T / 2 };
  }
  return { x: r.cx * T + T / 2, y: r.cy * T + T / 2 };
}

// Kaart één keer tekenen op een los canvas
function renderMap() {
  mapCanvas = document.createElement('canvas');
  mapCanvas.width = M.cols * T; mapCanvas.height = M.rows * T;
  const g = mapCanvas.getContext('2d');
  g.fillStyle = '#0b0c10'; g.fillRect(0, 0, mapCanvas.width, mapCanvas.height);
  for (let y = 0; y < M.rows; y++) for (let x = 0; x < M.cols; x++) {
    const v = grid[y][x] === 0 ? 0 : 1;
    if (v === 0) {
      g.fillStyle = (x + y) % 2 ? '#3a3e47' : '#373b44';
      g.fillRect(x * T, y * T, T, T);
      g.fillStyle = 'rgba(0,0,0,0.12)'; g.fillRect(x * T, y * T + T - 1, T, 1); g.fillRect(x * T + T - 1, y * T, 1, T);
    } else {
      // Muur: donker, met een lichte rand waar hij aan de vloer grenst
      g.fillStyle = '#121317'; g.fillRect(x * T, y * T, T, T);
      g.fillStyle = '#6f7680';
      if (walk(x, y + 1)) g.fillRect(x * T, y * T + T - 5, T, 5);
      if (walk(x, y - 1)) g.fillRect(x * T, y * T, T, 3);
      if (walk(x + 1, y)) g.fillRect(x * T + T - 3, y * T, 3, T);
      if (walk(x - 1, y)) g.fillRect(x * T, y * T, 3, T);
    }
  }
  // Kamers krijgen een vloerkleed-accent
  for (const r of rooms) {
    g.strokeStyle = 'rgba(255,255,255,0.06)'; g.lineWidth = 2;
    g.strokeRect(r.x * T + 8, r.y * T + 8, r.w * T - 16, r.h * T - 16);
  }
  // Vluchtauto-plek
  g.fillStyle = 'rgba(61,220,132,0.12)'; g.fillRect(exitZone.x, exitZone.y, exitZone.w, exitZone.h);
  g.setLineDash([8, 6]); g.strokeStyle = '#3ddc84'; g.lineWidth = 2; g.strokeRect(exitZone.x, exitZone.y, exitZone.w, exitZone.h); g.setLineDash([]);
}

// ---------- Missie starten ----------
function startMission(i) {
  mi = i; M = MISSIONS[i];
  const R = genMap(M);
  renderMap();
  const s = { x: exitZone.x + exitZone.w / 2, y: exitZone.y + exitZone.h + 30 };
  if (hits(s.x, s.y, 14)) Object.assign(s, randomFloorIn(startRoom));
  pl = { x: s.x, y: s.y, r: 14, hp: 100, aim: 0, mag: 30, ammo: 150, reload: 0, cool: 0, dash: 0, dashCd: 0, inv: 0, dx: 0, dy: 0 };
  bots = []; bullets = []; ebullets = []; pickups = []; parts = []; bags = [];
  alarm = false; reinT = M.rein || 999; t = 0; kills = 0; loot = 0; vaultOpen = !M.vault; drill = 0; shake = 0; flash = 0; msg = null; result = null;
  const others = rooms.filter((r) => r !== startRoom);
  for (let k = 0; k < M.bags; k++) { const p = randomFloorIn(others[k % others.length], R); bags.push({ ...p, got: false }); }
  const spawnIn = (type, room) => { const p = randomFloorIn(room, R); bots.push(makeBot(type, p.x, p.y, room)); };
  for (let k = 0; k < M.guards; k++) spawnIn('guard', others[(k * 3 + 1) % others.length]);
  for (let k = 0; k < M.drones; k++) spawnIn('drone', others[(k * 5 + 2) % others.length]);
  for (let k = 0; k < M.heavies; k++) spawnIn('heavy', vaultRoom);
  for (let k = 0; k < 3; k++) { const p = randomFloorIn(others[(k * 4) % others.length], R); pickups.push({ ...p, type: k % 2 ? 'hp' : 'ammo' }); }
  flowDist = bfs(Math.floor(pl.x / T), Math.floor(pl.y / T)); flowT = 0;
  state = 'brief';
}
function makeBot(type, x, y, room) {
  const lvl = 1 + mi * 0.12;
  const base = { guard: { hp: 60, r: 14, sp: 95, col: '#8a919b' }, drone: { hp: 25, r: 10, sp: 175, col: '#b8bdc5' }, heavy: { hp: 240, r: 20, sp: 62, col: '#5b616b' } }[type];
  return { type, x, y, r: base.r, hp: base.hp * lvl, maxHp: base.hp * lvl, sp: base.sp, col: base.col, room, alert: false, dir: rand(0, TAU), cool: rand(0.5, 1.5), burst: 0, target: null, stuck: 0, hit: 0, zap: 0 };
}

// ---------- Besturing ----------
const keys = {};
const mouse = { x: W / 2, y: H / 2, down: false };
const stickL = { id: null, ox: 0, oy: 0, x: 0, y: 0 }, stickR = { id: null, ox: 0, oy: 0, x: 0, y: 0 };
let uiButtons = [];
addEventListener('keydown', (e) => {
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  keys[e.code] = true;
  if (e.repeat) return;
  if (state === 'menu' && /^Digit[1-5]$/.test(e.code)) { const i = +e.code.slice(5) - 1; if (unlocked(i)) startMission(i); }
  else if (state === 'brief' && (e.code === 'Enter' || e.code === 'Space')) state = 'play';
  else if ((state === 'dead') && (e.code === 'Enter' || e.code === 'KeyR')) startMission(mi);
  else if (state === 'done' && e.code === 'Enter') { if (mi < MISSIONS.length - 1) startMission(mi + 1); else state = 'menu'; }
  else if (e.code === 'Escape' || e.code === 'KeyP') { if (state === 'play') state = 'pause'; else if (state === 'pause') state = 'play'; }
  else if (state === 'play' && e.code === 'KeyR') startReload();
});
addEventListener('keyup', (e) => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; mouse.down = false; if (state === 'play') state = 'pause'; });
c.addEventListener('contextmenu', (e) => e.preventDefault());
c.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  const q = view.toGame(e);
  for (const b of uiButtons) if (q.x >= b.x && q.x <= b.x + b.w && q.y >= b.y && q.y <= b.y + b.h) { b.fn(); return; }
  if (state === 'brief') { state = 'play'; return; }
  if (state === 'pause') { state = 'play'; return; }
  if (state !== 'play') return;
  if (e.pointerType === 'mouse') { mouse.down = true; mouse.x = q.x; mouse.y = q.y; return; }
  try { c.setPointerCapture(e.pointerId); } catch (err) { /* */ }
  const s = q.x < W / 2 ? stickL : stickR;
  if (s.id === null) { s.id = e.pointerId; s.ox = q.x; s.oy = q.y; s.x = 0; s.y = 0; }
});
c.addEventListener('pointermove', (e) => {
  const q = view.toGame(e);
  if (e.pointerType === 'mouse') { mouse.x = q.x; mouse.y = q.y; return; }
  for (const s of [stickL, stickR]) if (s.id === e.pointerId) {
    let dx = q.x - s.ox, dy = q.y - s.oy; const d = Math.hypot(dx, dy), max = 60;
    if (d > max) { dx = (dx / d) * max; dy = (dy / d) * max; }
    s.x = dx / max; s.y = dy / max;
  }
});
const endPointer = (e) => {
  if (e.pointerType === 'mouse') { mouse.down = false; return; }
  for (const s of [stickL, stickR]) if (s.id === e.pointerId) { s.id = null; s.x = 0; s.y = 0; }
};
c.addEventListener('pointerup', endPointer);
c.addEventListener('pointercancel', endPointer);

function unlocked(i) { return i === 0 || bests[i - 1] != null; }
function startReload() {
  if (pl.reload > 0 || pl.mag === 30 || pl.ammo <= 0) return;
  pl.reload = 1.3;
  Arcade.beep(300, 0.08, 'square', 0.03, 200);
}
function raiseAlarm() {
  if (alarm) return;
  alarm = true;
  for (const b of bots) b.alert = true;
  msg = { text: '🚨 ALARM! Er komen versterkingen', t: 2.5 };
  Arcade.beep(880, 0.25, 'square', 0.05); Arcade.beep(660, 0.25, 'square', 0.05, 0, 0.25); Arcade.beep(880, 0.25, 'square', 0.05, 0, 0.5);
}

// ---------- Update ----------
function update(dt) {
  shake = Math.max(0, shake - dt * 25);
  flash = Math.max(0, flash - dt);
  if (msg) { msg.t -= dt; if (msg.t <= 0) msg = null; }
  for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.9; p.vy *= 0.9; p.life -= dt; }
  parts = parts ? parts.filter((p) => p.life > 0) : [];
  if (state !== 'play') return;
  t += dt;

  // --- Speler bewegen ---
  let mx = 0, my = 0;
  if (keys.KeyA || keys.ArrowLeft) mx--; if (keys.KeyD || keys.ArrowRight) mx++;
  if (keys.KeyW || keys.ArrowUp) my--; if (keys.KeyS || keys.ArrowDown) my++;
  if (stickL.id !== null) { mx = stickL.x; my = stickL.y; }
  const ml = Math.hypot(mx, my);
  if (ml > 1) { mx /= ml; my /= ml; }
  pl.dashCd = Math.max(0, pl.dashCd - dt);
  if ((keys.ShiftLeft || keys.ShiftRight || keys.Space) && pl.dashCd <= 0 && ml > 0.1) { pl.dash = 0.18; pl.dashCd = 1.4; pl.inv = 0.25; Arcade.beep(500, 0.1, 'triangle', 0.04, -200); }
  pl.dash = Math.max(0, pl.dash - dt);
  pl.inv = Math.max(0, pl.inv - dt);
  const sp = pl.dash > 0 ? 620 : 210;
  moveEnt(pl, mx * sp * dt, my * sp * dt);
  if (pl.dash > 0) parts.push({ x: pl.x, y: pl.y, vx: 0, vy: 0, life: 0.2, max: 0.2, col: 'rgba(255,255,255,0.4)', s: 10 });

  // Camera
  const cam = camPos();
  // Richten
  let firing = false;
  if (stickR.id !== null) {
    if (Math.hypot(stickR.x, stickR.y) > 0.2) { pl.aim = Math.atan2(stickR.y, stickR.x); firing = true; }
  } else {
    pl.aim = Math.atan2(mouse.y + cam.y - pl.y, mouse.x + cam.x - pl.x);
    firing = mouse.down;
  }
  // Schieten
  pl.cool -= dt;
  if (pl.reload > 0) { pl.reload -= dt; if (pl.reload <= 0) { const n = Math.min(30 - pl.mag, pl.ammo); pl.mag += n; pl.ammo -= n; } }
  if (firing && pl.reload <= 0 && pl.cool <= 0) {
    if (pl.mag > 0) {
      pl.mag--; pl.cool = 0.1;

  ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(mx0 + (pl.x / T) * ms, my0 + (pl.y / T) * ms, 3, 0, TAU); ctx.fill();
  // Leven
  ctx.fillStyle = 'rgba(14,15,18,0.75)'; Arcade.rr(ctx, 12, H - 56, 230, 44, 12); ctx.fill();
  Arcade.text(ctx, '❤', 30, H - 34, 16, '#ff4d55', 'center', '900');
  ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.fillRect(46, H - 40, 180, 12);
  ctx.fillStyle = pl.hp > 35 ? '#ffffff' : '#ff4d55'; ctx.fillRect(46, H - 40, 180 * (pl.hp / 100), 12);
  // Munitie
  ctx.fillStyle = 'rgba(14,15,18,0.75)'; Arcade.rr(ctx, W - 192, H - 56, 180, 44, 12); ctx.fill();
  Arcade.text(ctx, pl.reload > 0 ? 'HERLADEN…' : `${pl.mag}`, W - 150, H - 34, pl.reload > 0 ? 14 : 24, pl.mag <= 5 ? '#ff4d55' : '#ffffff', 'center', '900', true);
  Arcade.text(ctx, `/ ${pl.ammo}`, W - 70, H - 32, 14, '#9aa1ab', 'center', '700', true);
  if (pl.dashCd > 0) { ctx.fillStyle = 'rgba(255,255,255,0.2)'; ctx.fillRect(12, H - 62, 230 * (1 - pl.dashCd / 1.4), 3); }
  if (msg) { ctx.globalAlpha = Math.min(1, msg.t * 2); Arcade.text(ctx, msg.text, W / 2, H * 0.3, 22, '#ffffff', 'center', '900'); ctx.globalAlpha = 1; }
  // Kluis-hint
  if (vaultBox && !vaultOpen && state === 'play') {
    const vx = (vaultBox.tx + 1) * T, vy = (vaultBox.ty + 1) * T;
    if (Math.hypot(pl.x - vx, pl.y - vy) < 95) {
      Arcade.text(ctx, Arcade.touch ? 'Blijf bij de kluis staan om te boren' : 'Houd E vast om te boren', W / 2, H - 90, 16, '#ffd23f', 'center', '900');
      ctx.fillStyle = 'rgba(255,255,255,0.15)'; ctx.fillRect(W / 2 - 100, H - 74, 200, 8);
      ctx.fillStyle = '#ffd23f'; ctx.fillRect(W / 2 - 100, H - 74, 200 * drill, 8);
    }
  }
  // Touch: joysticks en knoppen
  if (Arcade.touch && state === 'play') {
    for (const s of [stickL, stickR]) if (s.id !== null) {
      ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(s.ox, s.oy, 60, 0, TAU); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.beginPath(); ctx.arc(s.ox + s.x * 60, s.oy + s.y * 60, 24, 0, TAU); ctx.fill();
    }
    button('↻', W - 262, H - 56, 60, 44, startReload);
    if (!stickL.id && !stickR.id && t < 6) Arcade.text(ctx, 'Links slepen = lopen · Rechts slepen = richten en schieten', W / 2, H - 100, 14, '#ffffff', 'center', '700');
  }
  if (state === 'brief') {
    const lines = [`Pak minstens ${M.need} tassen buit`];
    if (M.vault) lines.push('Kraak de kluis (houd E vast)');
    lines.push('Ontsnap daarna naar de vluchtauto');
    if (M.rein) lines.push({ t: 'Let op: bij alarm komen er versterkingen!', color: '#ff4d55' });
    Arcade.overlay(ctx, W, H, `${mi + 1}. ${M.naam}`, lines, Arcade.touch ? 'Tik om te beginnen' : 'Enter = beginnen');
  }
  if (state === 'pause') Arcade.overlay(ctx, W, H, 'PAUZE', ['Druk op Esc of tik om verder te gaan']);
  if (state === 'dead') {
    Arcade.overlay(ctx, W, H, 'GEPAKT!', ['De robots hebben je uitgeschakeld.', `Buit: €${loot}`], '');
    button('↻ Opnieuw', W / 2 - 150, H / 2 + 50, 140, 46, () => startMission(mi), true);
    button('☰ Missies', W / 2 + 10, H / 2 + 50, 140, 46, () => { state = 'menu'; });
  }
  if (state === 'done') {
    const r = result;
    Arcade.overlay(ctx, W, H, 'GELUKT! 🚗💨', [
      { t: `€${r.score}`, size: 34, color: '#ffd23f', weight: '900', mono: true },
      `Buit €${r.loot} + tijdbonus €${r.timeBonus}`,
      `${r.kills} robots uitgeschakeld · ${Math.floor(r.t)} sec`,
      r.record ? { t: '🏆 Nieuw record!', color: '#3ddc84' } : `Record: €${r.prev}`,
    ], '');
    if (mi < MISSIONS.length - 1) button('Volgende ▶', W / 2 + 10, H / 2 + 100, 140, 46, () => startMission(mi + 1), true);
    button('↻ Opnieuw', W / 2 - 150, H / 2 + 100, 140, 46, () => startMission(mi), mi === MISSIONS.length - 1);
  }
}
function drawMenu() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#1b1d23'); g.addColorStop(1, '#0b0c10');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  Arcade.text(ctx, 'ROBO', W / 2 - 128, 92, 64, '#ffffff', 'right', '900');
  Arcade.text(ctx, 'OVERVAL', W / 2 - 110, 92, 64, '#e8282f', 'left', '900');
  Arcade.text(ctx, 'Pak de buit, kraak de kluis en ontsnap voordat de beveiligingsrobots je pakken.', W / 2, 140, 15, '#c9ced6', 'center', '600');
  MISSIONS.forEach((m, i) => {
    const x = W / 2 - 300, y = 175 + i * 66, w = 600, h = 56;
    const open = unlocked(i);
    ctx.fillStyle = open ? 'rgba(255,255,255,0.08)' : 'rgba(255,255,255,0.03)';
    Arcade.rr(ctx, x, y, w, h, 12); ctx.fill();
    Arcade.text(ctx, String(i + 1), x + 30, y + h / 2, 26, open ? '#ffffff' : '#4a4f58', 'center', '900');
    Arcade.text(ctx, m.naam, x + 62, y + 20, 18, open ? '#ffffff' : '#4a4f58', 'left', '800');
    const extra = [`${m.need} buit`, m.vault ? 'kluis' : null, m.heavies ? 'zware robots' : null, m.drones ? 'drones' : null].filter(Boolean).join(' · ');
    Arcade.text(ctx, open ? extra : '🔒 haal eerst missie ' + i, x + 62, y + 40, 12, '#9aa1ab', 'left', '600');
    if (bests[i] != null) Arcade.text(ctx, `€${bests[i]}`, x + w - 20, y + h / 2, 18, '#ffd23f', 'right', '900', true);
    if (open) uiButtons.push({ x, y, w, h, fn: () => startMission(i) });
  });
  Arcade.text(ctx, Arcade.touch ? 'Tik op een missie' : 'WASD = lopen · muis = richten · klik = schieten · R = herladen · Shift/Spatie = duiken · E = kluis boren', W / 2, H - 28, 13, '#6f7680', 'center', '600');
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.033, (now - last) / 1000);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
parts = [];
requestAnimationFrame(loop);

  </script>
</body>
</html>
