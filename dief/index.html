(() => {
  try {
    const RAW = Storage.prototype.setItem, RM = Storage.prototype.removeItem, KEY = 'arcade_mtimes';
    const re = /^(arcade_|tt2_)/, skip = /^tt2_ghost|^arcade_settings$|^arcade_mtimes$|^arcade_recent$/;
    let mt; try { mt = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { mt = {}; }
    let tm = 0;
    const flush = () => { if (tm) clearTimeout(tm); tm = 0; try { RAW.call(localStorage, KEY, JSON.stringify(mt)); } catch (e) { /* vol */ } };
    const touch = (k, t) => { if (!re.test(k) || skip.test(k)) return; mt[k] = t || Date.now(); if (!tm) tm = setTimeout(flush, 250); };
    Storage.prototype.setItem = function (k, v) {
      if (this !== localStorage) return RAW.call(this, k, v);
      const old = this.getItem(k); RAW.call(this, k, v);
      if (old !== String(v)) touch(k);
    };
    Storage.prototype.removeItem = function (k) { if (this === localStorage && this.getItem(k) != null) touch(k); RM.call(this, k); };
    addEventListener('pagehide', flush);
    // voor auth.js: tijden lezen en (na overnemen uit de cloud) de tijd van de cloud zetten
    window.ArcadeTimes = { all: () => mt, set: (k, t) => { mt[k] = t; flush(); }, merge: (o) => { for (const k in o || {}) if (!(mt[k] >= o[k])) mt[k] = o[k]; flush(); } };
  } catch (e) { /* oude browser: dan gewoon zonder tijden */ }

  };
  // Melodie maken uit de toonladder (altijd hetzelfde per nummer)
  function makeMelody(song) {
    const R = rng(song.seed);
    const motif = [];
    for (let i = 0; i < 32; i++) {
      if (R() > song.density || i % 2 === 1 && R() < 0.5) { motif.push(null); continue; }
      const deg = Math.floor(R() * 7) + (R() < 0.3 ? 7 : 0);
      const len = R() < 0.25 ? 3 : R() < 0.5 ? 2 : 1;
      motif.push({ deg, len });
    }
    const mel = [];
    for (let bar = 0; bar < 8; bar++) {
      for (let i = 0; i < 16; i++) {
        let m = motif[(bar % 2) * 16 + i];
        if (m && bar >= 4 && bar % 2 === 1 && i > 8) m = { deg: m.deg + 2, len: m.len }; // kleine variatie
        mel.push(m);
      }
    }
    return mel;
  }
  for (const k in SONGS) SONGS[k].mel = makeMelody(SONGS[k]);

  let ac = null, master = null, delayIn = null, reverbIn = null, duck = null, noise = null, timer = null;
  let song = null, wanted = null, step = 0, nextT = 0;
  const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);
  // Galm: zelf gemaakte impulsrespons (geen bestanden nodig)

    const len = Math.floor(ac.sampleRate * sec), buf = ac.createBuffer(2, len, ac.sampleRate);

    const cv = ac.createConvolver(); cv.buffer = buf; return cv;
  }

      const dlp = ac.createBiquadFilter(); dlp.type = 'lowpass'; dlp.frequency.value = 2400;

  }

    o.type = 'sine';
    o.frequency.setValueAtTime(160, t);
    o.frequency.exponentialRampToValueAtTime(45, t + 0.12);

  }

    g.connect(reverbIn);

    env(g2, t, 0.002, 0.22, 0.1); o.connect(g2); g2.connect(master); o.start(t); o.stop(t + 0.12);
  }

    if (opt.sweep) f.frequency.exponentialRampToValueAtTime(cutoff, t + Math.min(dur, 0.08)), f.frequency.exponentialRampToValueAtTime(cutoff * 0.35, t + dur);
    const n = opt.unison ? 2 : 1;
    for (let k = 0; k < n; k++) {
      const o = ac.createOscillator();
      o.type = type; o.frequency.value = mtof(midi); o.detune.value = n > 1 ? (k ? 9 : -9) : 0;
      if (opt.vib) { const l = ac.createOscillator(), lg = ac.createGain(); l.frequency.value = 5.5; lg.gain.value = 7; l.connect(lg); lg.connect(o.detune); l.start(t + 0.12); l.stop(t + dur + 0.05); }
      o.connect(f); o.start(t); o.stop(t + dur + 0.05);

    const i = s % 16, barN = Math.floor(s / 16), bar = barN % 4, chord = song.prog[bar];
    const intro = barN < 2 && song.introDone !== true;

    if (m && !intro) {

  function tick() {
    if (!ac || !song) return;

  // Effecten: deeltjes, schudden, zwevende tekst (zelfde stijl in elke game)
  function makeFx() {

    return {
      burst(x, y, n = 14, color = '#fff', speed = 180, life = 0.6, size = 3, grav = 200) {

        for (let i = 0; i < n * max; i++) {
          const a = Math.random() * Math.PI * 2, v = speed * (0.3 + Math.random() * 0.7);

        }

      ring(x, y, color = '#fff', r = 40, life = 0.4) { rings.push({ x, y, color, r, life, max: life }); },
      text(x, y, t, color = '#fff', size = 18) { texts.push({ x, y, t, color, size, life: 0.9 }); },
      shake(a = 6, t = 0.25) { shakeA = Math.max(shakeA, a); shakeT = Math.max(shakeT, t); },

  // Canvas met vaste spelgrootte (W×H) die netjes in het venster past
  function canvas(id, W, H) {
    const c = document.getElementById(id);

      c.style.height = Math.floor(H * s) + 'px';
      c.width = Math.floor(W * s * dpr);
      c.height = Math.floor(H * s * dpr);
      view.scale = s * dpr;
      ctx.setTransform(view.scale, 0, 0, view.scale, 0, 0);

    ArcadeCore.onChange(fit);

      const r = c.getBoundingClientRect();

  function backdrop(ctx, W, H, top = '#15171c', bottom = '#0a0b0e') {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, top); g.addColorStop(1, bottom);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    const v = ctx.createRadialGradient(W / 2, H * 0.45, Math.min(W, H) * 0.2, W / 2, H / 2, Math.max(W, H) * 0.75);
    v.addColorStop(0, 'rgba(255,255,255,0.035)'); v.addColorStop(1, 'rgba(0,0,0,0.35)');
    ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  }

  return {
    load, save, beep, noise, makeFx, backdrop, ui, fmtTime,
    get muted() { return !ArcadeCore.sfx(); },
    best: (game) => load('best_' + game, 0),
    // Slaat een nieuwe topscore op; geeft true terug als het een record is
    record: (game, score, lowerIsBetter = false) => {
      const b = load('best_' + game, 0);
      if (!b || (lowerIsBetter ? score < b : score > b)) { save('best_' + game, score); return true; }

    },
    canvas, onSwipe, rr, text, overlay,
    touch: matchMedia('(hover: none) and (pointer: coarse)').matches,
  };

let darks = [], fuseCd = {}, laserOff = 0, t = 0, clock = 0, camX = 0, camY = 0, crack = null, failWhy = '', winInfo = null, tipT = 0, exitMsgT = 0;

const tileAt = (tx, ty) => (ty >= 0 && ty < MH && tx >= 0 && tx < MW ? M[ty][tx] : '#');
const key = (tx, ty) => tx + ',' + ty;
function solidT(tx, ty) {
  const ch = tileAt(tx, ty);
  if (ch === '#' || ch === 'o') return true;
  if ((ch === 'D' || ch === 'R' || ch === 'B') && !open[key(tx, ty)]) return true;
  return false;
}
const solidP = (x, y) => solidT(Math.floor(x / TS), Math.floor(y / TS));
const ladderP = (x, y) => tileAt(Math.floor(x / TS), Math.floor(y / TS)) === 'H';
function darkT(tx, ty) { const k = key(tx, ty); return darks.some((d) => d.t > 0 && d.set.has(k)); }

// ---------- level laden ----------
function load(i) {
  li = i; lv = LEVELS[i];
  M = lv.map.map((r) => r.split('')); MH = M.length; MW = M[0].length;
  floorRow = M.map((r) => r.filter((ch) => ch === '#').length > MW * 0.5);
  guards = []; cams = []; lasers = []; open = {}; got = {}; cards = {}; cash = 0; cashTotal = 0; loot = 0; lootTotal = 0;
  darks = []; fuseCd = {}; laserOff = 0; t = 0; crack = null; tipT = 6; exitMsgT = 0;
  for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) {

    if (ch === '$') cashTotal++;

  }

  ArcadeCore.music.play('dief');
}
const mapOffY = () => Math.min(0, -(H - 70 - MH * TS) / 2 - 10);

// verdieping-gebied voor de stoppenkast (wordt donker)
function region(tx, ty) {
  const set = new Set(), st = [[tx, ty]];
  while (st.length && set.size < 900) {
    const [x, y] = st.pop(); const k = key(x, y);
    if (set.has(k) || x < 0 || y < 0 || x >= MW || y >= MH) continue;
    if (floorRow[y] || solidT(x, y)) continue;
    set.add(k);
    st.push([x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]);
  }
  return set;
}

// ---------- zicht ----------
function los(x0, y0, x1, y1) {
  const d = Math.hypot(x1 - x0, y1 - y0), n = Math.ceil(d / 8);
  for (let i = 1; i < n; i++) { const k = i / n; if (solidP(x0 + (x1 - x0) * k, y0 + (y1 - y0) * k)) return false; }
  return true;
}
function rayLen(x0, y0, a, R) {
  const dx = Math.cos(a), dy = Math.sin(a);
  for (let d = 8; d < R; d += 8) if (solidP(x0 + dx * d, y0 + dy * d)) return d;
  return R;
}
function hiddenSpot() {
  const tx = Math.floor(P.x / TS), ty = Math.floor((P.y - 20) / TS), ch = tileAt(tx, ty);
  return ch === 's' || ch === 'p' || darkT(tx, ty);
}
const still = () => Math.abs(P.vx) < 10 && Math.abs(P.vy) < 10;
// kan bron (ex, ey) met kegel (a, half, R) de speler zien?
function sees(ex, ey, a, half, R) {
  if (cheatInvis) return 0;
  const pts = [[P.x, P.y - 32], [P.x, P.y - 12]];
  for (const [px, py] of pts) {
    const dx = px - ex, dy = py - ey, d = Math.hypot(dx, dy);
    if (d > R) continue;
    let da = Math.atan2(dy, dx) - a; while (da > Math.PI) da -= 2 * Math.PI; while (da < -Math.PI) da += 2 * Math.PI;
    if (Math.abs(da) > half) continue;
    if (!los(ex, ey, px, py)) continue;
    if (P.hidden) continue;
    if (hiddenSpot() && d > 70) continue; // bewegen in de schaduw: alleen van heel dichtbij
    return 1 - d / R;
  }
  return 0;
}

function refreshTouch() { touch.left = touch.right = touch.up = touch.down = false; for (const id of ptrs.values()) if (id && id in touch && id !== 'sneak') touch[id] = true; }

  ctx.fillStyle = '#0a0a0b'; ctx.fillRect(0, 0, W, H);
  // achtergrond: nachtelijke skyline
  ctx.fillStyle = '#111318'; for (let i = 0; i < 16; i++) { const bw = 70, bh = 120 + ((i * 53) % 170); ctx.fillRect(i * 62 - 10, H - bh, bw, bh); }
  ctx.fillStyle = 'rgba(255,217,138,0.5)'; for (let i = 0; i < 70; i++) { const x = (i * 97) % W, y = H - 40 - ((i * 37) % 220); if (((i * 7) % 5) < 2) ctx.fillRect(x, y, 5, 7); }
  ctx.fillStyle = 'rgba(10,10,11,0.75)'; ctx.fillRect(0, 0, W, H);
  T(ctx, 'NACHTDIEF', W / 2, 62, 50, '#fff', 'center', '900');
  T(ctx, 'Sluip, kraak en ontsnap. Schaduw + stilstaan = onzichtbaar.', W / 2, 100, 15, '#bdbdbd', 'center', '600');
  const cw = 200, ch = 112, gap = 14, gx = W / 2 - (cw * 4 + gap * 3) / 2;
  LEVELS.forEach((L, i) => {
    const x = gx + (i % 4) * (cw + gap), y = 130 + Math.floor(i / 4) * (ch + gap), un = unlocked(i), st = starsS[i] || 0;
    ctx.fillStyle = un ? 'rgba(255,255,255,0.05)' : 'rgba(255,255,255,0.02)'; RR(ctx, x, y, cw, ch, 14); ctx.fill();
    ctx.strokeStyle = un ? 'rgba(255,255,255,0.16)' : 'rgba(255,255,255,0.06)'; ctx.lineWidth = 1; ctx.stroke();
    T(ctx, String(i + 1).padStart(2, '0'), x + 16, y + 22, 12, '#8c8c8c', 'left', '800');
    T(ctx, un ? L.name : '🔒 Op slot', x + 16, y + 48, 17, un ? '#fff' : '#6f6f6f', 'left', '900');
    if (un) {
      T(ctx, '★'.repeat(st) + '☆'.repeat(3 - st), x + 16, y + 76, 16, st ? '#ffd23f' : '#555', 'left', '700');
      T(ctx, bests[i] != null ? 'Beste: ' + fmt(bests[i]) : 'Nog niet gehaald', x + 16, y + 98, 12, '#9a9a9a', 'left', '700');
      ui.btn('', x, y, cw, ch, () => load(i));
    }
  });
  T(ctx, `Pijltjes/WASD lopen · Spatie springen · ▲▼ klimmen · Shift sluipen (stil) · E actie · R opnieuw`, W / 2, H - 28, 13, '#8c8c8c', 'center', '700');
  T(ctx, `★ uitgespeeld · ★ onder de tijd · ★ al het geld`, W / 2, H - 50, 12, '#6f6f6f', 'center', '700');
}
function drawEnd() {
  if (state === 'win') {
    const w = winInfo, lines = [`Tijd: ${fmt(w.time)}${w.rec && w.prev != null ? '  (nieuw record!)' : ''}`, `Geld: ${cash}/${cashTotal}`, { t: '★'.repeat(w.st) + '☆'.repeat(3 - w.st), color: '#ffd23f' }];
    Arcade.overlay(ctx, W, H, '💎 Ontsnapt!', lines, '');
    const by = H / 2 + 95;
    ui.btn('Menu', W / 2 - 290, by, 180, 50, () => { state = 'menu'; });
    ui.btn('Opnieuw', W / 2 - 90, by, 180, 50, () => load(li));
    if (li + 1 < LEVELS.length) ui.btn('Volgende →', W / 2 + 110, by, 180, 50, next, true);
  } else if (state === 'fail') {
    Arcade.overlay(ctx, W, H, '🚨 Betrapt!', [failWhy, 'Probeer het nog een keer (R)'], '');
    const by = H / 2 + 80;
    ui.btn('Menu', W / 2 - 200, by, 180, 50, () => { state = 'menu'; });
    ui.btn('Opnieuw', W / 2 + 20, by, 180, 50, () => load(li), true);
  } else if (state === 'pause') {
    Arcade.overlay(ctx, W, H, 'Pauze', ['Esc = verder'], '');
    const by = H / 2 + 60;
    ui.btn('Menu', W / 2 - 290, by, 180, 50, () => { state = 'menu'; });
    ui.btn('Opnieuw', W / 2 - 90, by, 180, 50, () => load(li));
    ui.btn('Verder', W / 2 + 110, by, 180, 50, () => { state = prevState; }, true);
  }
}

// ---------- lus ----------
let last = performance.now();
function update(dt) {
  clock += dt; toastT -= dt; fx.update(dt);
  if (state === 'crack') {
    crack.a += crack.sp * dt; if (crack.shake > 0) crack.shake -= dt;
    t += dt; laserOff = Math.max(0, laserOff - dt);
    P.vx = 0; P.hidden = hiddenSpot();
    for (const d of darks) d.t -= dt; for (const k in fuseCd) fuseCd[k] -= dt;
    updateGuards(dt);
    return;
  }
  if (state !== 'play') return;
  t += dt; tipT -= dt; exitMsgT -= dt;
  laserOff = Math.max(0, laserOff - dt);
  for (const d of darks) d.t -= dt; for (const k in fuseCd) fuseCd[k] -= dt;
  updatePlayer(dt);
  P.hidden = hiddenSpot() && still();
  if (actQ) { actQ = false; interact(); }
  pickups();
  if (state !== 'play') return;
  updateGuards(dt);
  checkLasers();
  // camera
  const tx = Math.max(0, Math.min(MW * TS - W, P.x - W / 2 + P.dir * 60));
  camX += (tx - camX) * Math.min(1, dt * 4);
  const ty = MH * TS + 80 <= H ? mapOffY() : Math.max(-60, Math.min(MH * TS - H + 70, P.y - H / 2 - 10));
  camY += (ty - camY) * Math.min(1, dt * 4);
}
function loop(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  if (!document.hidden) update(dt);
  view.begin(); ui.clear();
  if (state === 'menu') drawMenu();
  else {
    fx.begin(ctx); drawWorld(); fx.end(ctx);
    drawHUD();
    if (state === 'crack') drawCrack();
    fx.drawFlash(ctx, W, H);
    drawEnd();
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
ArcadeCore.music.play('dief');

// ---------- admin-voordelen ----------
ArcadeCore.cheat('💎 Level meteen uitspelen', () => { if (lv && (state === 'play' || state === 'crack' || state === 'pause')) { state = 'play'; loot = lootTotal; cash = cashTotal; win(); } });
ArcadeCore.cheat('🔓 Alle levels vrijspelen', () => { unlockAll = true; Arcade.save('dief_unlockall', true); });
ArcadeCore.cheat('🗝️ Beide sleutelkaarten', () => { cards.r = cards.b = true; say('🔴🔵 Sleutelkaarten!'); });
ArcadeCore.toggle('👻 Onzichtbaar', () => cheatInvis, (v) => { cheatInvis = v; });
ArcadeCore.toggle('⚡ Lasers altijd uit', () => cheatLaser, (v) => { cheatLaser = v; });
ArcadeCore.cheat('⏱️ Tijd op 0', () => { t = 0; });

window.__dief = { get P() { return P; }, get state() { return state; }, load, get guards() { return guards; }, get cams() { return cams; }, interact, keys, win, get t() { return t; }, get loot() { return loot; }, LEVELS, setState: (s) => { state = s; }, crackPress, get crack() { return crack; } };

  </script>
