(() => {
  try {
    const RAW = Storage.prototype.setItem, RM = Storage.prototype.removeItem, KEY = 'arcade_mtimes';
    const re = /^(arcade_|tt2_)/, skip = /^tt2_ghost|^arcade_settings$|^arcade_mtimes$|^arcade_recent$/;
    let mt; try { mt = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { mt = {}; }
    let tm = 0;
    const flush = () => { if (tm) clearTimeout(tm); tm = 0; try { RAW.call(localStorage, KEY, JSON.stringify(mt)); } catch (e) { /* vol */ } };
    const touch = (k, t) => { if (!re.test(k) || skip.test(k)) return; mt[k] = t || Date.now(); if (!tm) tm = setTimeout(flush, 250); };
    Storage.prototype.setItem = function (k, v) {
      if (this !== localStorage) return RAW.call(this, k, v);
      const old = this.getItem(k); RAW.call(this, k, v);
      if (old !== String(v)) touch(k);
    };
    Storage.prototype.removeItem = function (k) { if (this === localStorage && this.getItem(k) != null) touch(k); RM.call(this, k); };
    addEventListener('pagehide', flush);
    // voor auth.js: tijden lezen en (na overnemen uit de cloud) de tijd van de cloud zetten
    window.ArcadeTimes = { all: () => mt, set: (k, t) => { mt[k] = t; flush(); }, merge: (o) => { for (const k in o || {}) if (!(mt[k] >= o[k])) mt[k] = o[k]; flush(); } };
  } catch (e) { /* oude browser: dan gewoon zonder tijden */ }

  };
  // Melodie maken uit de toonladder (altijd hetzelfde per nummer)
  function makeMelody(song) {
    const R = rng(song.seed);
    const motif = [];
    for (let i = 0; i < 32; i++) {
      if (R() > song.density || i % 2 === 1 && R() < 0.5) { motif.push(null); continue; }
      const deg = Math.floor(R() * 7) + (R() < 0.3 ? 7 : 0);
      const len = R() < 0.25 ? 3 : R() < 0.5 ? 2 : 1;
      motif.push({ deg, len });
    }
    const mel = [];
    for (let bar = 0; bar < 8; bar++) {
      for (let i = 0; i < 16; i++) {
        let m = motif[(bar % 2) * 16 + i];
        if (m && bar >= 4 && bar % 2 === 1 && i > 8) m = { deg: m.deg + 2, len: m.len }; // kleine variatie
        mel.push(m);
      }
    }
    return mel;
  }

      burst(x, y, n = 14, color = '#fff', speed = 180, life = 0.6, size = 3, grav = 200) {

    T(ctx, `${score[0]} - ${score[1]}`, W / 2, 32, 24, '#fff', 'center', '900');
    T(ctx, sudden ? 'Wie scoort, wint!' : `Eerst tot ${toWin} · ${fmtT(timeLeft)}${mode === 'tour' ? ` · ronde ${round() + 1}/8` : ''}`, W / 2, 54, 11, '#9aa1ab', 'center', '700');
    if (mode === 'vriend' && clock < 99999) {
      T(ctx, 'Speler 1: A D · W springen · S schieten · L-Shift dunk', 20, H - 16, 12, '#8fc6ff', 'left', '700');

  }
  ui.btn('II', W - 58, 14, 40, 40, () => { if (state === 'play') { prevState = 'play'; state = 'pause'; } }, false, false, 16);
  if (toastT > 0) {
    ctx.save(); ctx.globalAlpha = Math.min(1, toastT * 2); ctx.shadowColor = 'rgba(0,0,0,0.6)'; ctx.shadowBlur = 14;

function card(x, y, w, h) { ctx.fillStyle = 'rgba(12,14,20,0.8)'; RR(ctx, x, y, w, h, 14); ctx.fill(); ctx.strokeStyle = 'rgba(255,255,255,0.14)'; ctx.lineWidth = 1; ctx.stroke(); }
function drawMenu() {

// ---------- lus ----------
let last = performance.now();
function update(dt) {
  clock += dt; toastT -= dt; fx.update(dt);
  netSway = netSway.map((s) => Math.max(0, s - dt * 1.2));
  if (state !== 'play') return;
  if (mode === 'race') raceUpdate(dt); else matchUpdate(dt);
}
function loop(now) {

    fx.begin(ctx);
    drawArena();
    HOOPS.forEach((h, i) => drawHoop(h, i, false));
    for (const p of P) drawPlayer(p);

requestAnimationFrame(loop);
ArcadeCore.music.play('basket');
