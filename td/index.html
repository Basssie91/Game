(() => {

    const RAW = Storage.prototype.setItem, RM = Storage.prototype.removeItem, KEY = 'arcade_mtimes';
    const re = /^(arcade_|tt2_)/, skip = /^tt2_ghost|^arcade_settings$|^arcade_mtimes$|^arcade_recent$/;

      if (this !== localStorage) return RAW.call(this, k, v);
      const old = this.getItem(k); RAW.call(this, k, v);
      if (old !== String(v)) touch(k);
    };
    Storage.prototype.removeItem = function (k) { if (this === localStorage && this.getItem(k) != null) touch(k); RM.call(this, k); };

    // voor auth.js: tijden lezen en (na overnemen uit de cloud) de tijd van de cloud zetten

  function makeMelody(song) {
    const R = rng(song.seed);

    for (let i = 0; i < 32; i++) {

      for (let i = 0; i < 16; i++) {
        let m = motif[(bar % 2) * 16 + i];

        mel.push(m);
      }

      burst(x, y, n = 14, color = '#fff', speed = 180, life = 0.6, size = 3, grav = 200) {

        for (let k = 0; k < 16; k++) parts.push({ x: sh.x, y: sh.y, vx: rand(-180, 180), vy: rand(-180, 180), life: 0.45, col: k % 2 ? '#ffb347' : '#ffe0a0' });
      }
      continue;
    }
    const tx = sh.kind === 'bom' ? sh.tx : sh.target.x, ty = sh.kind === 'bom' ? sh.ty : sh.target.y;
    const dx = tx - sh.x, dy = ty - sh.y, d = Math.hypot(dx, dy);
    if (sh.kind === 'bom' && !sh.target.done && sh.target.hp > 0) { sh.tx = sh.target.x; sh.ty = sh.target.y; }
    if (d < sh.sp * dt + 4) {
      sh.done = true;
      if (sh.kind === 'bom') {
        booms.push({ x: tx, y: ty, r: sh.splash, life: 0.35, max: 0.35, col: '255,140,60' });
        for (const e of enemies) if (Math.hypot(e.x - tx, e.y - ty) <= sh.splash) damage(e, sh.dmg);
        Arcade.beep(90, 0.18, 'sawtooth', 0.03, -40); Arcade.noise(0.3, 0.07, 1400, 100);
        for (let k = 0; k < 10; k++) parts.push({ x: tx, y: ty, vx: rand(-120, 120), vy: rand(-120, 120), life: 0.35, col: k % 2 ? '#ffb347' : '#ffe0a0' });
      } else if (sh.target.hp > 0) damage(sh.target, sh.dmg);
    } else { sh.x += (dx / d) * sh.sp * dt; sh.y += (dy / d) * sh.sp * dt; }
  }
  shots = shots.filter((s) => !s.done && (s.kind === 'bom' || s.kind === 'raket' || (!s.target.done && s.target.hp > 0)));
  for (const b of bolts) b.life -= dt;
  bolts = bolts.filter((b) => b.life > 0);
  for (const b of booms) b.life -= dt;
  booms = booms.filter((b) => b.life > 0);
  enemies = enemies.filter((e) => !e.done && e.hp > 0);
  // Golf klaar?
  if (waveOn && !spawnList.length && !enemies.length) {
    waveOn = false;
    const bonus = 20 + wave * 5;
    money += bonus;
    msg = { text: `Golf ${wave} gehaald! +€${bonus}`, t: 2 };
    if (wave >= WAVES) gameOver(true);
  }
}
function damage(e, amount, continuous) {
  const real = continuous ? amount : Math.max(1, amount - e.armor);
  e.hp -= real;
  if (!continuous) e.hit = 0.06;
  if (e.hp <= 0 && !e.dead) {
    e.dead = true;
    money += e.reward; score += e.reward * 10; kills++;
    for (let k = 0; k < (e.type === 'boss' ? 40 : 10); k++) parts.push({ x: e.x, y: e.y, vx: rand(-160, 160), vy: rand(-160, 160), life: 0.4, col: k % 3 ? '#8a919b' : '#ff4d55' });
    if (e.type === 'boss') Arcade.beep(80, 0.5, 'sawtooth', 0.06, -30);
    if (e.type === 'splitter') {
      for (let k = 0; k < 3; k++) { const hp = ENEMIES.scout.hp * Math.pow(1.15, wave - 1) * (MAP.hp || 1) * 0.7; enemies.push({ type: 'scout', d: Math.max(0, e.d - k * 14), hp, maxHp: hp, sp: ENEMIES.scout.sp, r: 7, col: '#d9a6ff', armor: 0, reward: 2, slow: 0, hit: 0, x: e.x, y: e.y, a: e.a }); }
      Arcade.beep(520, 0.1, 'square', 0.04, -200);
    }
  }
}
function gameOver(won) {
  state = won ? 'win' : 'over';
  overT = 0.8;
  const total = score + lives * 100 + (won ? 2000 : 0);
  score = total;
  if (won && (bests[mi] == null || total > bests[mi])) { bests[mi] = total; Arcade.save('td_bests', bests); }
  else if (!won && bests['g' + mi] == null) { /* niets */ }
  Arcade.record(GAME, total);
  if (won) { Arcade.beep(523, 0.15, 'triangle', 0.07); Arcade.beep(659, 0.15, 'triangle', 0.07, 0, 0.15); Arcade.beep(784, 0.4, 'triangle', 0.07, 0, 0.3); }
  else Arcade.beep(200, 0.6, 'sawtooth', 0.06, -150);
}

    ctx.fillStyle = '#1c1e23'; ctx.fillRect(mx, my, COLS * s, ROWS * s);
    ctx.strokeStyle = open ? '#9aa1ab' : '#3a3e47'; ctx.lineWidth = 3; ctx.lineJoin = 'round';
    ctx.beginPath(); m.path.forEach(([px, py], k) => { const X = mx + Math.max(0, Math.min(COLS, px + 0.5)) * s, Y = my + (py + 0.5) * s; if (k) ctx.lineTo(X, Y); else ctx.moveTo(X, Y); }); ctx.stroke();
    const tx = mx + COLS * s + 14;
    Arcade.text(ctx, `${i + 1}. ${m.naam}`, tx, y + 28, 16, open ? '#ffffff' : '#4a4f58', 'left', '900');
    Arcade.text(ctx, open ? `€${m.money} · ${m.waves || 20} golven` : `🔒 win eerst kaart ${i}`, tx, y + 52, 12, '#9aa1ab', 'left', '600');
    if (open && i >= 3) Arcade.text(ctx, ['Nieuw: snelle sprinters', '+ robots met schild', '+ splitsende robots', 'Alles, nog sterker', 'Alles, nog sterker', 'Eindbaas: 30 golven!'][i - 3], tx, y + 74, 11, '#c06bff', 'left', '700');
    if (won) Arcade.text(ctx, `🏆 ${bests[i]}`, tx, y + 102, 13, '#ffd23f', 'left', '800', true);
    if (open) buttons.push({ x, y, w, h, fn: () => start(i) });
  });
  Arcade.text(ctx, Arcade.touch ? 'Tik op een kaart om te beginnen' : '1-7 = toren kiezen · Spatie = golf starten · U = upgrade · S = verkopen · F = sneller', W / 2, H - 14, 12, '#6f7680', 'center', '600');
}

let last = performance.now();
// Ook op de achtergrond doorspelen: verstreken tijd in kleine stapjes inhalen (max. 30 minuten)
function catchUp(sec) {
  sec = Math.min(sec, 1800);
  while (sec > 0) { const d = Math.min(0.05, sec); update(d); sec -= d; if (state !== 'play') break; }
}
function loop(now) {
  const el = (now - last) / 1000;
  last = now;
  if (el > 0.25 && state === 'play') catchUp(el); else update(Math.min(0.05, el));
  draw();
  requestAnimationFrame(loop);
}
setInterval(() => { if (!document.hidden) return; const now = performance.now(); catchUp((now - last) / 1000); last = now; }, 1000);
parts = [];
requestAnimationFrame(loop);

// ----- Admin-voordelen -----
function tdOpen(i) { return i === 0 || bests[i - 1] != null || Arcade.load('td_unlockall', false); }
ArcadeCore.cheat('💶 +€1.000', () => { if (state === 'play') money += 1000; });
ArcadeCore.cheat('❤️ +20 levens', () => { if (state === 'play') lives += 20; });
ArcadeCore.cheat('⬆️ Alle torens naar max level', () => { if (towers) towers.forEach((t) => (t.lvl = 3)); });
ArcadeCore.cheat('🔓 Alle maps ontgrendelen', () => Arcade.save('td_unlockall', true));

  </script>
